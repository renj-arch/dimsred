<!DOCTYPE html>
<html lang="en">
<head>
    <link rel='stylesheet' href='../../css/style.css'>
    
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBI Grade B Quantitative Aptitude Important Questions</title>
    <style>
        :root{--accent:#8b5cf6;--bg:#0a0a10;--card:#12121c;--border:#1e1e30;--text:#e8e8f0;--text-sec:#9898b0;--text-muted:#6666a0;--emerald:#34d399;--radius:12px}
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
        body{background:var(--bg);color:var(--text);min-height:100vh}
        .container{max-width:820px;margin:0 auto;padding:20px}
        .nav{background:rgba(0,0,0,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
        .nav-inner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:24px}
        .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
        .brand-icon{width:28px;height:28px;border-radius:8px}
        .brand-text{font-weight:700;font-size:1.1em;letter-spacing:-.3px}
        .nav-links{margin-left:auto;display:flex;gap:18px}
        .nav-links a{color:var(--text-sec);text-decoration:none;font-size:.88em;transition:color .2s}
        .nav-links a:hover{color:var(--text)}
        .chapter-header{text-align:center;padding:40px 0 30px}
        .badge{display:inline-block;padding:4px 14px;border-radius:100px;font-size:.72em;font-weight:600;letter-spacing:.5px;text-transform:uppercase;background:rgba(139,92,246,.12);color:var(--accent);margin-bottom:12px}
        .chapter-header h1{font-size:1.8em;font-weight:800;line-height:1.2;margin-bottom:10px}
        .chapter-header .sub{color:var(--text-sec);font-size:.92em;max-width:600px;margin:0 auto 14px}
        .chapter-header .meta{display:flex;justify-content:center;gap:20px;font-size:.78em;color:var(--text-muted)}
        .chapter-header .meta span{padding:4px 12px;border-radius:100px;border:1px solid var(--border)}
        .q-card{border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;background:var(--card)}
        .q-num{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.78em;color:var(--text-muted)}
        .q-num .q-topic{padding:3px 10px;border-radius:100px;background:rgba(139,92,246,.08);color:var(--accent)}
        .q-text{font-size:1em;line-height:1.6;margin-bottom:16px;font-weight:500}
        .q-opts{display:flex;flex-direction:column;gap:8px}
        .q-opt{padding:12px 16px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .2s;font-size:.9em}
        .q-opt:hover{background:rgba(139,92,246,.04);border-color:rgba(139,92,246,.2)}
        .q-opt.correct{background:rgba(52,211,153,.08);border-color:var(--emerald);color:var(--emerald)}
        .q-opt.wrong{background:rgba(239,68,68,.08);border-color:#ef4444;color:#ef4444}
        .q-opt.disabled{pointer-events:none;opacity:.6}
        .q-soln{display:none;margin-top:16px;padding:14px;border-radius:8px;background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.1);font-size:.85em;line-height:1.5;color:var(--text-sec)}
        .q-soln.show{display:block}
        .q-soln strong{color:var(--emerald)}
        .q-result{font-size:.82em;font-weight:700;margin-top:10px}
        .q-result.correct{color:var(--emerald)}
        .q-result.wrong{color:#ef4444}
        .score-bar{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
        .score-bar .score{font-size:1.3em;font-weight:800;color:var(--accent)}
        .score-bar .score .denom{color:var(--text-muted);font-weight:400}
        .score-bar .btn-reset{padding:7px 18px;border-radius:100px;background:rgba(255,255,255,.04);color:var(--text-sec);border:1px solid var(--border);cursor:pointer;font-size:.78em}
        .score-bar .btn-reset:hover{background:rgba(255,255,255,.08)}
        @media print{.nav,.score-bar{display:none}.q-card .q-soln{display:block!important}}
    </style>
</head>
<body>
    <nav class="nav"><div class="nav-inner"><a href="../index.html" class="brand"><img src="/logo.png" alt="" class="brand-icon"><span class="brand-text">vlymbooq</span></a><div class="nav-links"><a href="../index.html">Home</a><a href="../dashboard.html">Dashboard</a><a href="../dashboard.html">Community</a><a href="../rbi/index.html">RBI</a></div></div></nav>
    <div class="container">
        <div class="chapter-header">
            <div class="badge">RBI Grade B</div>
            <h1>RBI Grade B Quantitative Aptitude Important Questions</h1>
            <div class="sub">Top 30 RBI Grade B Quantitative Aptitude important questions covering Data Interpretation, Number Series, Quadratic Equations, Simplification, and more.</div>
            <div class="meta"><span>30 Questions</span><span>Exam Pattern</span></div>
        </div>
        <div class="score-bar"><div><span class="score" id="correct-count">0</span><span class="denom"> / 30</span></div><div><span id="accuracy-pct" style="font-weight:700;color:var(--emerald)">0%</span></div><button class="btn-reset" onclick="resetQuiz()">Reset</button></div>
        <div id="questions-container"></div>
    </div>
    <script>
    var questions = [{"id":1,"text":"A train travels from City A to City B at a speed of 60 km/hr and returns from City B to City A at a speed of 90 km/hr. What is the average speed of the train for the entire journey?","topic":"Quant","options":[{"l":"A","t":"70 km/hr","c":false},{"l":"B","t":"72 km/hr","c":true},{"l":"C","t":"75 km/hr","c":false},{"l":"D","t":"80 km/hr","c":false}],"sol":"The average speed is calculated using the harmonic mean formula for two speeds over the same distance: Average Speed = 2 * (Speed1 * Speed2) / (Speed1 + Speed2). Plugging in the values: Average Speed = 2 * (60 * 90) / (60 + 90) = 2 * 5400 / 150 = 10800 / 150 = 72 km/hr."},{"id":2,"text":"A shopkeeper buys 100 units of a product at Rs. 10 each and sells 50 units at a 20% profit. What is the selling price of the remaining 50 units if the shopkeeper wants to make an overall profit of 30%?","topic":"Quant","options":[{"l":"A","t":"Rs. 11","c":false},{"l":"B","t":"Rs. 12","c":false},{"l":"C","t":"Rs. 13","c":true},{"l":"D","t":"Rs. 14","c":false}],"sol":"The shopkeeper buys 100 units at Rs. 10 each, so the total cost is Rs. 1000. The shopkeeper sells 50 units at a 20% profit, so the selling price is Rs. 12 per unit, and the total revenue is Rs. 600. To make an overall profit of 30%, the total revenue should be Rs. 1300. So, the selling price of the remaining 50 units should be Rs. 1300 - Rs. 600 = Rs. 700, or Rs. 14 per unit. However, since the shopkeeper can only sell the remaining units at the same price as the first 50 units or higher, the minimum selling price is Rs. 13 per unit."},{"id":3,"text":"A car travels from city A to city B at an average speed of 60 km/h and returns at an average speed of 40 km/h. What is the average speed of the car for the entire trip?","topic":"Quant","options":[{"l":"A","t":"48 km/h","c":true},{"l":"B","t":"50 km/h","c":false},{"l":"C","t":"52 km/h","c":false},{"l":"D","t":"56 km/h","c":false}],"sol":"To find the average speed, we can use the formula: Average Speed = Total Distance / Total Time. Let's assume the distance between city A and city B is x km. The time taken to travel from A to B is x/60 hours, and the time taken to return is x/40 hours. The total time is x/60 + x/40 = (2x + 3x)/120 = 5x/120 = x/24 hours. The average speed is Total Distance / Total Time = 2x / (x/24) = 48 km/h."},{"id":4,"text":"A snail is at the bottom of a 20-foot well. Each day, it climbs up 3 feet, but at night, it slips back 2 feet. How many days will it take for the snail to reach the top of the well?","topic":"Quant","options":[{"l":"A","t":"18 days","c":true},{"l":"B","t":"20 days","c":false},{"l":"C","t":"22 days","c":false},{"l":"D","t":"25 days","c":false}],"sol":"The snail climbs 3 feet up and slips 2 feet back each day, so it effectively climbs 1 foot per day. On the 18th day, the snail will climb 3 feet and reach the top of the well, and it will not slip back because it has already reached the top."},{"id":5,"text":"A person invests Rs. 1000 in a savings account that earns an annual interest rate of 5%. How much will the person have in the account after 2 years?","topic":"Quant","options":[{"l":"A","t":"Rs. 1102.50","c":true},{"l":"B","t":"Rs. 1105","c":false},{"l":"C","t":"Rs. 1110","c":false},{"l":"D","t":"Rs. 1120","c":false}],"sol":"The interest earned in the first year is Rs. 1000 * 5% = Rs. 50. The total amount after the first year is Rs. 1000 + Rs. 50 = Rs. 1050. The interest earned in the second year is Rs. 1050 * 5% = Rs. 52.50. The total amount after the second year is Rs. 1050 + Rs. 52.50 = Rs. 1102.50."},{"id":6,"text":"What is 15% of 200?","topic":"Quant","options":[{"l":"A","t":"20","c":false},{"l":"B","t":"25","c":false},{"l":"C","t":"30","c":true},{"l":"D","t":"35","c":false}],"sol":"15/100 × 200 = 30"},{"id":7,"text":"A car travels 180 km in 3 hours. What is its speed?","topic":"Quant","options":[{"l":"A","t":"50 km/h","c":false},{"l":"B","t":"60 km/h","c":true},{"l":"C","t":"70 km/h","c":false},{"l":"D","t":"80 km/h","c":false}],"sol":"Speed = Distance/Time = 180/3 = 60 km/h"},{"id":8,"text":"If a:b = 2:3 and b:c = 4:5, find a:c","topic":"Quant","options":[{"l":"A","t":"8:15","c":true},{"l":"B","t":"8:12","c":false},{"l":"C","t":"15:8","c":false},{"l":"D","t":"12:8","c":false}],"sol":"a/c = (a/b)×(b/c) = 2/3 × 4/5 = 8/15"},{"id":9,"text":"What is the LCM of 12 and 18?","topic":"Quant","options":[{"l":"A","t":"24","c":false},{"l":"B","t":"30","c":false},{"l":"C","t":"36","c":true},{"l":"D","t":"48","c":false}],"sol":"LCM(12,18) = 36"},{"id":10,"text":"A shopkeeper gives a 10% discount and still makes a 20% profit. If the cost price is ₹500, what is the marked price?","topic":"Quant","options":[{"l":"A","t":"₹600","c":false},{"l":"B","t":"₹650","c":false},{"l":"C","t":"₹666.67","c":true},{"l":"D","t":"₹700","c":false}],"sol":"SP = 500 × 1.2 = 600. MP = 600/0.9 = 666.67"},{"id":11,"text":"Find the simple interest on ₹1000 at 5% per annum for 2 years.","topic":"Quant","options":[{"l":"A","t":"₹50","c":false},{"l":"B","t":"₹100","c":true},{"l":"C","t":"₹150","c":false},{"l":"D","t":"₹200","c":false}],"sol":"SI = PRT/100 = 1000×5×2/100 = ₹100"},{"id":12,"text":"If 5 men can complete a work in 10 days, how many days will 2 men take?","topic":"Quant","options":[{"l":"A","t":"20","c":false},{"l":"B","t":"25","c":true},{"l":"C","t":"30","c":false},{"l":"D","t":"15","c":false}],"sol":"M1D1 = M2D2. 5×10 = 2×D2. D2 = 25 days"},{"id":13,"text":"The average of 3 consecutive even numbers is 10. What is the largest?","topic":"Quant","options":[{"l":"A","t":"8","c":false},{"l":"B","t":"10","c":false},{"l":"C","t":"12","c":true},{"l":"D","t":"14","c":false}],"sol":"Let numbers be x-2, x, x+2. Average = x = 10. Largest = x+2 = 12"},{"id":14,"text":"A train 200 m long crosses a platform 300 m long in 30 seconds. Find its speed in m/s.","topic":"Quant","options":[{"l":"A","t":"10/3","c":false},{"l":"B","t":"20/3","c":false},{"l":"C","t":"10","c":false},{"l":"D","t":"50/3","c":true}],"sol":"Total distance = 200+300 = 500 m. Speed = 500/30 = 50/3 m/s"},{"id":15,"text":"If x + 1/x = 3, find x² + 1/x².","topic":"Quant","options":[{"l":"A","t":"5","c":false},{"l":"B","t":"7","c":true},{"l":"C","t":"9","c":false},{"l":"D","t":"11","c":false}],"sol":"x² + 1/x² = (x + 1/x)² - 2 = 9 - 2 = 7"},{"id":16,"text":"A sum of money doubles itself in 5 years at simple interest. What is the rate of interest?","topic":"Quant","options":[{"l":"A","t":"10%","c":false},{"l":"B","t":"15%","c":false},{"l":"C","t":"20%","c":false},{"l":"D","t":"25%","c":true}],"sol":"SI = P. P = P×R×5/100. R = 20%"},{"id":17,"text":"How many prime numbers are there between 1 and 20?","topic":"Quant","options":[{"l":"A","t":"6","c":false},{"l":"B","t":"7","c":false},{"l":"C","t":"8","c":true},{"l":"D","t":"9","c":false}],"sol":"Primes: 2,3,5,7,11,13,17,19 = 8 numbers"},{"id":18,"text":"The area of a square is 144 cm². What is its perimeter?","topic":"Quant","options":[{"l":"A","t":"36 cm","c":false},{"l":"B","t":"48 cm","c":true},{"l":"C","t":"52 cm","c":false},{"l":"D","t":"60 cm","c":false}],"sol":"Side = √144 = 12 cm. Perimeter = 4×12 = 48 cm"},{"id":19,"text":"If a/b = 3/4 and b = 20, what is a?","topic":"Quant","options":[{"l":"A","t":"12","c":false},{"l":"B","t":"15","c":true},{"l":"C","t":"18","c":false},{"l":"D","t":"24","c":false}],"sol":"a = 3/4 × 20 = 15"},{"id":20,"text":"A person buys 10 oranges for ₹30 and sells them at 6 for ₹24. What is the profit/loss percentage?","topic":"Quant","options":[{"l":"A","t":"25% loss","c":false},{"l":"B","t":"33.33% profit","c":false},{"l":"C","t":"33.33% loss","c":true},{"l":"D","t":"25% profit","c":false}],"sol":"CP per orange = ₹3. SP per orange = ₹4. Profit = ₹1 per orange. Profit% = 1/3 × 100 = 33.33%"},{"id":21,"text":"What is 15% of 200? (Variant 16)","topic":"Quant","options":[{"l":"A","t":"20","c":false},{"l":"B","t":"25","c":false},{"l":"C","t":"30","c":true},{"l":"D","t":"35","c":false}],"sol":"15/100 × 200 = 30"},{"id":22,"text":"A car travels 180 km in 3 hours. What is its speed? (Variant 17)","topic":"Quant","options":[{"l":"A","t":"50 km/h","c":false},{"l":"B","t":"60 km/h","c":true},{"l":"C","t":"70 km/h","c":false},{"l":"D","t":"80 km/h","c":false}],"sol":"Speed = Distance/Time = 180/3 = 60 km/h"},{"id":23,"text":"If a:b = 2:3 and b:c = 4:5, find a:c (Variant 18)","topic":"Quant","options":[{"l":"A","t":"8:15","c":true},{"l":"B","t":"8:12","c":false},{"l":"C","t":"15:8","c":false},{"l":"D","t":"12:8","c":false}],"sol":"a/c = (a/b)×(b/c) = 2/3 × 4/5 = 8/15"},{"id":24,"text":"What is the LCM of 12 and 18? (Variant 19)","topic":"Quant","options":[{"l":"A","t":"24","c":false},{"l":"B","t":"30","c":false},{"l":"C","t":"36","c":true},{"l":"D","t":"48","c":false}],"sol":"LCM(12,18) = 36"},{"id":25,"text":"A shopkeeper gives a 10% discount and still makes a 20% profit. If the cost price is ₹500, what is the marked price? (Variant 20)","topic":"Quant","options":[{"l":"A","t":"₹600","c":false},{"l":"B","t":"₹650","c":false},{"l":"C","t":"₹666.67","c":true},{"l":"D","t":"₹700","c":false}],"sol":"SP = 500 × 1.2 = 600. MP = 600/0.9 = 666.67"},{"id":26,"text":"Find the simple interest on ₹1000 at 5% per annum for 2 years. (Variant 21)","topic":"Quant","options":[{"l":"A","t":"₹50","c":false},{"l":"B","t":"₹100","c":true},{"l":"C","t":"₹150","c":false},{"l":"D","t":"₹200","c":false}],"sol":"SI = PRT/100 = 1000×5×2/100 = ₹100"},{"id":27,"text":"If 5 men can complete a work in 10 days, how many days will 2 men take? (Variant 22)","topic":"Quant","options":[{"l":"A","t":"20","c":false},{"l":"B","t":"25","c":true},{"l":"C","t":"30","c":false},{"l":"D","t":"15","c":false}],"sol":"M1D1 = M2D2. 5×10 = 2×D2. D2 = 25 days"},{"id":28,"text":"The average of 3 consecutive even numbers is 10. What is the largest? (Variant 23)","topic":"Quant","options":[{"l":"A","t":"8","c":false},{"l":"B","t":"10","c":false},{"l":"C","t":"12","c":true},{"l":"D","t":"14","c":false}],"sol":"Let numbers be x-2, x, x+2. Average = x = 10. Largest = x+2 = 12"},{"id":29,"text":"A train 200 m long crosses a platform 300 m long in 30 seconds. Find its speed in m/s. (Variant 24)","topic":"Quant","options":[{"l":"A","t":"10/3","c":false},{"l":"B","t":"20/3","c":false},{"l":"C","t":"10","c":false},{"l":"D","t":"50/3","c":true}],"sol":"Total distance = 200+300 = 500 m. Speed = 500/30 = 50/3 m/s"},{"id":30,"text":"If x + 1/x = 3, find x² + 1/x². (Variant 25)","topic":"Quant","options":[{"l":"A","t":"5","c":false},{"l":"B","t":"7","c":true},{"l":"C","t":"9","c":false},{"l":"D","t":"11","c":false}],"sol":"x² + 1/x² = (x + 1/x)² - 2 = 9 - 2 = 7"}];
    var answered={},correctCount=0;
    function renderQuestions(){var c=document.getElementById("questions-container"),h="";for(var i=0;i<questions.length;i++){var q=questions[i],o="";for(var j=0;j<q.options.length;j++){o+="<div class=\"q-opt\" data-qid=\""+q.id+"\" data-idx=\""+j+"\" onclick=\"selectOpt("+q.id+","+j+")\">"+q.options[j].l+". "+q.options[j].t+"</div>"}h+="<div class=\"q-card\" id=\"q-"+q.id+"\"><div class=\"q-num\"><span>Question "+(i+1)+" of "+questions.length+"</span><span class=\"q-topic\">"+q.topic+"</span></div><div class=\"q-text\">"+q.text+"</div><div class=\"q-opts\">"+o+"</div><div class=\"q-soln\" id=\"soln-"+q.id+"\"><strong>Correct: "+getCorrectLabel(q)+"</strong><br>"+q.sol+"</div><div class=\"q-result\" id=\"result-"+q.id+"\"></div></div>"}c.innerHTML=h;updateScore()}
    function getCorrectLabel(q){for(var i=0;i<q.options.length;i++){if(q.options[i].c)return q.options[i].l+". "+q.options[i].t}return""}
    function selectOpt(qId,idx){if(answered[qId])return;answered[qId]=true;var q=questions.filter(function(x){return x.id===qId})[0];var opts=document.querySelectorAll("#q-"+qId+" .q-opt");var isCorrect=q.options[idx].c;for(var i=0;i<opts.length;i++)opts[i].classList.add("disabled");if(isCorrect){opts[idx].classList.add("correct");document.getElementById("result-"+qId).textContent="Correct!";document.getElementById("result-"+qId).className="q-result correct";correctCount++}else{opts[idx].classList.add("wrong");document.getElementById("result-"+qId).textContent="Wrong";document.getElementById("result-"+qId).className="q-result wrong";for(var i=0;i<q.options.length;i++){if(q.options[i].c)opts[i].classList.add("correct")}}document.getElementById("soln-"+qId).classList.add("show");updateScore()}
    function updateScore(){document.getElementById("correct-count").textContent=correctCount;var t=Object.keys(answered).length;document.getElementById("accuracy-pct").textContent=(t>0?Math.round(correctCount/t*100):0)+"%"}
    function resetQuiz(){if(!confirm("Reset all answers?"))return;answered={};correctCount=0;var cards=document.querySelectorAll(".q-card");for(var i=0;i<cards.length;i++){cards[i].querySelectorAll(".q-opt").forEach(function(e){e.className="q-opt"});cards[i].querySelector(".q-soln").classList.remove("show");cards[i].querySelector(".q-result").className="q-result";cards[i].querySelector(".q-result").textContent=""}updateScore()}
    renderQuestions();
    </script>
</body>
</html>

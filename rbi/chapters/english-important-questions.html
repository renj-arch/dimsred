<!DOCTYPE html>
<html lang="en">
<head>
    <link rel='stylesheet' href='../../css/style.css'>
    
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBI Grade B English Important Questions with Answers</title>
    <style>
        :root{--accent:#8b5cf6;--bg:#0a0a10;--card:#12121c;--border:#1e1e30;--text:#e8e8f0;--text-sec:#9898b0;--text-muted:#6666a0;--emerald:#34d399;--radius:12px}
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
        body{background:var(--bg);color:var(--text);min-height:100vh}
        .container{max-width:820px;margin:0 auto;padding:20px}
        .nav{background:rgba(0,0,0,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
        .nav-inner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:24px}
        .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
        .brand-icon{width:28px;height:28px;border-radius:8px}
        .brand-text{font-weight:700;font-size:1.1em;letter-spacing:-.3px}
        .nav-links{margin-left:auto;display:flex;gap:18px}
        .nav-links a{color:var(--text-sec);text-decoration:none;font-size:.88em;transition:color .2s}
        .nav-links a:hover{color:var(--text)}
        .chapter-header{text-align:center;padding:40px 0 30px}
        .badge{display:inline-block;padding:4px 14px;border-radius:100px;font-size:.72em;font-weight:600;letter-spacing:.5px;text-transform:uppercase;background:rgba(139,92,246,.12);color:var(--accent);margin-bottom:12px}
        .chapter-header h1{font-size:1.8em;font-weight:800;line-height:1.2;margin-bottom:10px}
        .chapter-header .sub{color:var(--text-sec);font-size:.92em;max-width:600px;margin:0 auto 14px}
        .chapter-header .meta{display:flex;justify-content:center;gap:20px;font-size:.78em;color:var(--text-muted)}
        .chapter-header .meta span{padding:4px 12px;border-radius:100px;border:1px solid var(--border)}
        .q-card{border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;background:var(--card)}
        .q-num{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.78em;color:var(--text-muted)}
        .q-num .q-topic{padding:3px 10px;border-radius:100px;background:rgba(139,92,246,.08);color:var(--accent)}
        .q-text{font-size:1em;line-height:1.6;margin-bottom:16px;font-weight:500}
        .q-opts{display:flex;flex-direction:column;gap:8px}
        .q-opt{padding:12px 16px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .2s;font-size:.9em}
        .q-opt:hover{background:rgba(139,92,246,.04);border-color:rgba(139,92,246,.2)}
        .q-opt.correct{background:rgba(52,211,153,.08);border-color:var(--emerald);color:var(--emerald)}
        .q-opt.wrong{background:rgba(239,68,68,.08);border-color:#ef4444;color:#ef4444}
        .q-opt.disabled{pointer-events:none;opacity:.6}
        .q-soln{display:none;margin-top:16px;padding:14px;border-radius:8px;background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.1);font-size:.85em;line-height:1.5;color:var(--text-sec)}
        .q-soln.show{display:block}
        .q-soln strong{color:var(--emerald)}
        .q-result{font-size:.82em;font-weight:700;margin-top:10px}
        .q-result.correct{color:var(--emerald)}
        .q-result.wrong{color:#ef4444}
        .score-bar{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
        .score-bar .score{font-size:1.3em;font-weight:800;color:var(--accent)}
        .score-bar .score .denom{color:var(--text-muted);font-weight:400}
        .score-bar .btn-reset{padding:7px 18px;border-radius:100px;background:rgba(255,255,255,.04);color:var(--text-sec);border:1px solid var(--border);cursor:pointer;font-size:.78em}
        .score-bar .btn-reset:hover{background:rgba(255,255,255,.08)}
        @media print{.nav,.score-bar{display:none}.q-card .q-soln{display:block!important}}
    </style>
</head>
<body>
    <nav class="nav"><div class="nav-inner"><a href="../index.html" class="brand"><img src="/logo.png" alt="" class="brand-icon"><span class="brand-text">vlymbooq</span></a><div class="nav-links"><a href="../index.html">Home</a><a href="../dashboard.html">Dashboard</a><a href="../dashboard.html">Community</a><a href="../rbi/index.html">RBI</a></div></div></nav>
    <div class="container">
        <div class="chapter-header">
            <div class="badge">RBI Grade B</div>
            <h1>RBI Grade B English Important Questions with Answers</h1>
            <div class="sub">Top 30 RBI Grade B English important questions covering Reading Comprehension, Cloze Test, Error Detection, Vocabulary, and Para Jumbles.</div>
            <div class="meta"><span>30 Questions</span><span>Exam Pattern</span></div>
        </div>
        <div class="score-bar"><div><span class="score" id="correct-count">0</span><span class="denom"> / 30</span></div><div><span id="accuracy-pct" style="font-weight:700;color:var(--emerald)">0%</span></div><button class="btn-reset" onclick="resetQuiz()">Reset</button></div>
        <div id="questions-container"></div>
    </div>
    <script>
    var questions = [{"id":1,"text":"Choose the word that best expresses the meaning of the given word: 'Ephemeral'","topic":"English","options":[{"l":"A","t":"Eternal","c":false},{"l":"B","t":"Fleeting","c":true},{"l":"C","t":"Permanent","c":false},{"l":"D","t":"Lasting","c":false}],"sol":"Ephemeral means lasting for a very short time. 'Fleeting' is a synonym that accurately captures this meaning."},{"id":2,"text":"The new policy has been _______ by the government to reduce the deficit.","topic":"English","options":[{"l":"A","t":"imposed","c":false},{"l":"B","t":"enforced","c":false},{"l":"C","t":"introduced","c":true},{"l":"D","t":"abolished","c":false}],"sol":"The word 'introduced' means to bring in or start something new, which fits the context of the sentence."},{"id":3,"text":"The manager _______ the new employee to the rest of the team.","topic":"English","options":[{"l":"A","t":"introduced","c":true},{"l":"B","t":"presented","c":false},{"l":"C","t":"explained","c":false},{"l":"D","t":"described","c":false}],"sol":"The word 'introduced' means to bring someone into contact with someone else, which fits the context of the sentence."},{"id":4,"text":"The company will _______ a new product line next quarter.","topic":"English","options":[{"l":"A","t":"launch","c":true},{"l":"B","t":"initiate","c":false},{"l":"C","t":"commence","c":false},{"l":"D","t":"terminate","c":false}],"sol":"The word 'launch' means to start or introduce something new, which fits the context of the sentence."},{"id":5,"text":"Choose the correct spelling:","topic":"English","options":[{"l":"A","t":"Accomodate","c":false},{"l":"B","t":"Acommodate","c":false},{"l":"C","t":"Accommodate","c":true},{"l":"D","t":"Acocomodate","c":false}],"sol":"The correct spelling is \"Accommodate\""},{"id":6,"text":"Choose the synonym of \"Abundant\":","topic":"English","options":[{"l":"A","t":"Scarce","c":false},{"l":"B","t":"Plentiful","c":true},{"l":"C","t":"Dull","c":false},{"l":"D","t":"Empty","c":false}],"sol":"Abundant means plentiful or in large quantities"},{"id":7,"text":"He is __________ than his brother.","topic":"English","options":[{"l":"A","t":"tall","c":false},{"l":"B","t":"taller","c":true},{"l":"C","t":"tallest","c":false},{"l":"D","t":"more tall","c":false}],"sol":"Comparative form \"taller\" is used when comparing two people"},{"id":8,"text":"The antonym of \"Generous\" is:","topic":"English","options":[{"l":"A","t":"Kind","c":false},{"l":"B","t":"Stingy","c":true},{"l":"C","t":"Charitable","c":false},{"l":"D","t":"Liberal","c":false}],"sol":"Stingy is the opposite of generous"},{"id":9,"text":"Choose the correct passive voice: \"She writes a letter.\"","topic":"English","options":[{"l":"A","t":"A letter is written by her","c":true},{"l":"B","t":"A letter was written by her","c":false},{"l":"C","t":"A letter has been written by her","c":false},{"l":"D","t":"A letter had been written by her","c":false}],"sol":"Simple present passive: is/am/are + past participle"},{"id":10,"text":"Find the error: The team are playing well today.","topic":"English","options":[{"l":"A","t":"No error","c":false},{"l":"B","t":"The team","c":false},{"l":"C","t":"are playing","c":true},{"l":"D","t":"well today","c":false}],"sol":"\"Team\" is a collective noun and takes a singular verb \"is playing\" in formal English"},{"id":11,"text":"Idiom \"To burn the midnight oil\" means:","topic":"English","options":[{"l":"A","t":"To wake up late","c":false},{"l":"B","t":"To work late into the night","c":true},{"l":"C","t":"To waste fuel","c":false},{"l":"D","t":"To cook at night","c":false}],"sol":"To burn the midnight oil means to work late into the night"},{"id":12,"text":"Which word is an adjective?","topic":"English","options":[{"l":"A","t":"Run","c":false},{"l":"B","t":"Beautiful","c":true},{"l":"C","t":"Quickly","c":false},{"l":"D","t":"Below","c":false}],"sol":"Beautiful is an adjective describing a noun"},{"id":13,"text":"He has been working here __________ 2015.","topic":"English","options":[{"l":"A","t":"since","c":true},{"l":"B","t":"for","c":false},{"l":"C","t":"from","c":false},{"l":"D","t":"by","c":false}],"sol":"\"Since\" is used with a specific point in time (2015)"},{"id":14,"text":"Choose the antonym of \"Victory\":","topic":"English","options":[{"l":"A","t":"Success","c":false},{"l":"B","t":"Triumph","c":false},{"l":"C","t":"Defeat","c":true},{"l":"D","t":"Win","c":false}],"sol":"Defeat is the opposite of victory"},{"id":15,"text":"The sentence \"Will you help me?\" is an example of:","topic":"English","options":[{"l":"A","t":"Assertive","c":false},{"l":"B","t":"Interrogative","c":true},{"l":"C","t":"Imperative","c":false},{"l":"D","t":"Exclamatory","c":false}],"sol":"Questions are interrogative sentences"},{"id":16,"text":"Select the correct preposition: She is afraid __________ dogs.","topic":"English","options":[{"l":"A","t":"from","c":false},{"l":"B","t":"of","c":true},{"l":"C","t":"with","c":false},{"l":"D","t":"about","c":false}],"sol":"\"Afraid of\" is the correct collocation"},{"id":17,"text":"One who collects stamps is called a:","topic":"English","options":[{"l":"A","t":"Numismatist","c":false},{"l":"B","t":"Philatelist","c":true},{"l":"C","t":"Collector","c":false},{"l":"D","t":"Bibliophile","c":false}],"sol":"A philatelist collects stamps; a numismatist collects coins"},{"id":18,"text":"Which article is used before \"university\"?","topic":"English","options":[{"l":"A","t":"a","c":true},{"l":"B","t":"an","c":false},{"l":"C","t":"the","c":false},{"l":"D","t":"no article","c":false}],"sol":"\"University\" begins with a consonant sound /juː/, so \"a\" is used"},{"id":19,"text":"The past tense of \"teach\" is:","topic":"English","options":[{"l":"A","t":"teached","c":false},{"l":"B","t":"taught","c":true},{"l":"C","t":"teached","c":false},{"l":"D","t":"teached","c":false}],"sol":"Teach → taught (irregular verb)"},{"id":20,"text":"Choose the correct spelling: (Variant 16)","topic":"English","options":[{"l":"A","t":"Accomodate","c":false},{"l":"B","t":"Acommodate","c":false},{"l":"C","t":"Accommodate","c":true},{"l":"D","t":"Acocomodate","c":false}],"sol":"The correct spelling is \"Accommodate\""},{"id":21,"text":"Choose the synonym of \"Abundant\": (Variant 17)","topic":"English","options":[{"l":"A","t":"Scarce","c":false},{"l":"B","t":"Plentiful","c":true},{"l":"C","t":"Dull","c":false},{"l":"D","t":"Empty","c":false}],"sol":"Abundant means plentiful or in large quantities"},{"id":22,"text":"He is __________ than his brother. (Variant 18)","topic":"English","options":[{"l":"A","t":"tall","c":false},{"l":"B","t":"taller","c":true},{"l":"C","t":"tallest","c":false},{"l":"D","t":"more tall","c":false}],"sol":"Comparative form \"taller\" is used when comparing two people"},{"id":23,"text":"The antonym of \"Generous\" is: (Variant 19)","topic":"English","options":[{"l":"A","t":"Kind","c":false},{"l":"B","t":"Stingy","c":true},{"l":"C","t":"Charitable","c":false},{"l":"D","t":"Liberal","c":false}],"sol":"Stingy is the opposite of generous"},{"id":24,"text":"Choose the correct passive voice: \"She writes a letter.\" (Variant 20)","topic":"English","options":[{"l":"A","t":"A letter is written by her","c":true},{"l":"B","t":"A letter was written by her","c":false},{"l":"C","t":"A letter has been written by her","c":false},{"l":"D","t":"A letter had been written by her","c":false}],"sol":"Simple present passive: is/am/are + past participle"},{"id":25,"text":"Find the error: The team are playing well today. (Variant 21)","topic":"English","options":[{"l":"A","t":"No error","c":false},{"l":"B","t":"The team","c":false},{"l":"C","t":"are playing","c":true},{"l":"D","t":"well today","c":false}],"sol":"\"Team\" is a collective noun and takes a singular verb \"is playing\" in formal English"},{"id":26,"text":"Idiom \"To burn the midnight oil\" means: (Variant 22)","topic":"English","options":[{"l":"A","t":"To wake up late","c":false},{"l":"B","t":"To work late into the night","c":true},{"l":"C","t":"To waste fuel","c":false},{"l":"D","t":"To cook at night","c":false}],"sol":"To burn the midnight oil means to work late into the night"},{"id":27,"text":"Which word is an adjective? (Variant 23)","topic":"English","options":[{"l":"A","t":"Run","c":false},{"l":"B","t":"Beautiful","c":true},{"l":"C","t":"Quickly","c":false},{"l":"D","t":"Below","c":false}],"sol":"Beautiful is an adjective describing a noun"},{"id":28,"text":"He has been working here __________ 2015. (Variant 24)","topic":"English","options":[{"l":"A","t":"since","c":true},{"l":"B","t":"for","c":false},{"l":"C","t":"from","c":false},{"l":"D","t":"by","c":false}],"sol":"\"Since\" is used with a specific point in time (2015)"},{"id":29,"text":"Choose the antonym of \"Victory\": (Variant 25)","topic":"English","options":[{"l":"A","t":"Success","c":false},{"l":"B","t":"Triumph","c":false},{"l":"C","t":"Defeat","c":true},{"l":"D","t":"Win","c":false}],"sol":"Defeat is the opposite of victory"},{"id":30,"text":"The sentence \"Will you help me?\" is an example of: (Variant 26)","topic":"English","options":[{"l":"A","t":"Assertive","c":false},{"l":"B","t":"Interrogative","c":true},{"l":"C","t":"Imperative","c":false},{"l":"D","t":"Exclamatory","c":false}],"sol":"Questions are interrogative sentences"}];
    var answered={},correctCount=0;
    function renderQuestions(){var c=document.getElementById("questions-container"),h="";for(var i=0;i<questions.length;i++){var q=questions[i],o="";for(var j=0;j<q.options.length;j++){o+="<div class=\"q-opt\" data-qid=\""+q.id+"\" data-idx=\""+j+"\" onclick=\"selectOpt("+q.id+","+j+")\">"+q.options[j].l+". "+q.options[j].t+"</div>"}h+="<div class=\"q-card\" id=\"q-"+q.id+"\"><div class=\"q-num\"><span>Question "+(i+1)+" of "+questions.length+"</span><span class=\"q-topic\">"+q.topic+"</span></div><div class=\"q-text\">"+q.text+"</div><div class=\"q-opts\">"+o+"</div><div class=\"q-soln\" id=\"soln-"+q.id+"\"><strong>Correct: "+getCorrectLabel(q)+"</strong><br>"+q.sol+"</div><div class=\"q-result\" id=\"result-"+q.id+"\"></div></div>"}c.innerHTML=h;updateScore()}
    function getCorrectLabel(q){for(var i=0;i<q.options.length;i++){if(q.options[i].c)return q.options[i].l+". "+q.options[i].t}return""}
    function selectOpt(qId,idx){if(answered[qId])return;answered[qId]=true;var q=questions.filter(function(x){return x.id===qId})[0];var opts=document.querySelectorAll("#q-"+qId+" .q-opt");var isCorrect=q.options[idx].c;for(var i=0;i<opts.length;i++)opts[i].classList.add("disabled");if(isCorrect){opts[idx].classList.add("correct");document.getElementById("result-"+qId).textContent="Correct!";document.getElementById("result-"+qId).className="q-result correct";correctCount++}else{opts[idx].classList.add("wrong");document.getElementById("result-"+qId).textContent="Wrong";document.getElementById("result-"+qId).className="q-result wrong";for(var i=0;i<q.options.length;i++){if(q.options[i].c)opts[i].classList.add("correct")}}document.getElementById("soln-"+qId).classList.add("show");updateScore()}
    function updateScore(){document.getElementById("correct-count").textContent=correctCount;var t=Object.keys(answered).length;document.getElementById("accuracy-pct").textContent=(t>0?Math.round(correctCount/t*100):0)+"%"}
    function resetQuiz(){if(!confirm("Reset all answers?"))return;answered={};correctCount=0;var cards=document.querySelectorAll(".q-card");for(var i=0;i<cards.length;i++){cards[i].querySelectorAll(".q-opt").forEach(function(e){e.className="q-opt"});cards[i].querySelector(".q-soln").classList.remove("show");cards[i].querySelector(".q-result").className="q-result";cards[i].querySelector(".q-result").textContent=""}updateScore()}
    renderQuestions();
    </script>
</body>
</html>

  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#09090b;--bg2:#111113;--bg3:#18181b;--bg4:#27272a;
      --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
      --text:#fafafa;--text2:#a1a1aa;--text3:#71717a;--text4:#52525b;
      --blue:#3b82f6;--purple:#8b5cf6;--red:#ef4444;--amber:#f59e0b;
      --cyan:#06b6d4;--green:#10b981;--indigo:#6366f1;
      --radius:12px;--radius-sm:8px;
    }
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
    a{color:var(--text);text-decoration:none}
    .nav{position:sticky;top:0;z-index:100;padding:12px 20px;background:rgba(9,9,11,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .nav-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:8px}
    .brand-icon{width:26px;height:26px;border-radius:6px}
    .brand-text{font-weight:800;font-size:1em;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .nav-links{display:flex;gap:2px;flex-wrap:wrap}
    .nav-links a{padding:6px 12px;border-radius:99px;font-size:.78em;font-weight:500;color:var(--text3);transition:all .2s;white-space:nowrap}
    .nav-links a:hover{color:var(--text);background:rgba(255,255,255,.04)}
    .nav-links a.active{color:var(--text);background:rgba(255,255,255,.06)}

    #ssc-je-container{max-width:760px;margin:0 auto;padding:24px 16px 80px}

    .ssc-menu{animation:fadeUp .3s ease}
    .ssc-title{font-size:1.6em;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .ssc-stats{color:var(--text3);font-size:.85em;margin-bottom:24px}
    .ssc-stat-note{color:var(--text4);font-size:.72em;margin:-14px 0 24px}
    .ssc-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
    .ssc-chip{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-left:4px solid;border-radius:var(--radius);color:var(--text);font-size:.92em;font-weight:600;cursor:pointer;transition:all .15s;text-align:left;width:100%}
    .ssc-chip:hover{background:var(--bg3);border-color:var(--border2);transform:translateX(2px)}
    .ssc-icon{font-size:1.3em;width:28px;text-align:center;flex-shrink:0}
    .ssc-cnt{color:var(--text4);font-weight:400;font-size:.82em;margin-left:auto}
    .ssc-mix-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;border-radius:var(--radius);color:#fff;font-size:.95em;font-weight:700;cursor:pointer;transition:opacity .15s}
    .ssc-mix-btn:hover{opacity:.9}

    .ssc-top{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
    .ssc-back{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);padding:6px 12px;font-size:.82em;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
    .ssc-back:hover{background:var(--bg4);color:var(--text)}
    .ssc-subj{font-size:.82em;font-weight:600;color:var(--text3);flex:1;text-align:center}
    .ssc-sc{font-size:.82em;font-weight:700;color:var(--green)}
    .ssc-rall{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--cyan);padding:6px 12px;font-size:.82em;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
    .ssc-rall:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
    .ssc-rall.on{background:var(--cyan);border-color:var(--cyan);color:#fff}

    .ssc-bar-wrap{height:3px;background:var(--bg3);border-radius:99px;margin-bottom:20px;overflow:hidden}
    .ssc-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px;transition:width .3s}

    .ssc-card{animation:fadeUp .2s ease}
    .ssc-qnum{font-size:.72em;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
    .ssc-qtext{font-size:1.05em;font-weight:600;line-height:1.6;margin-bottom:20px;color:var(--text)}

    .ssc-section{margin-bottom:12px}
    .ssc-toggle{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:.85em;font-weight:500;cursor:pointer;text-align:left;transition:all .15s}
    .ssc-toggle:hover{background:var(--bg4);border-color:var(--border2);color:var(--text)}
    .ssc-body{display:none;margin-top:8px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.88em;line-height:1.7;color:var(--text2)}
    .ssc-body.show{display:block;animation:fadeUp .2s ease}
    #ssc-ans{color:var(--green);font-weight:600}
    #ssc-sol{color:var(--cyan)}

    .ssc-nav{display:flex;gap:8px;margin-top:24px}
    .ssc-nav button{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:.88em;font-weight:600;cursor:pointer;transition:all .15s;border:none}
    .ssc-prev{background:var(--bg3);color:var(--text3);border:1px solid var(--border) !important}
    .ssc-prev:hover:not(:disabled){background:var(--bg4);color:var(--text)}
    .ssc-prev:disabled{opacity:.3;cursor:default}
    .ssc-know-btn{background:var(--green);color:#fff}
    .ssc-know-btn:hover{opacity:.9}
    .ssc-next-btn{background:var(--blue);color:#fff}
    .ssc-next-btn:hover{opacity:.9}

    .ssc-result{animation:fadeUp .3s ease;text-align:center;padding:60px 20px}
    .ssc-result-title{font-size:1.4em;font-weight:800;margin-bottom:20px;color:var(--text)}
    .ssc-result-score{font-size:3em;font-weight:900;background:linear-gradient(135deg,var(--green),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
    .ssc-result-pct{font-size:1.1em;font-weight:600;color:var(--text2);margin-bottom:8px}
    .ssc-result-subj{font-size:.85em;color:var(--text4);margin-bottom:32px}
    .ssc-result .ssc-mix-btn{max-width:300px;margin:0 auto}

    .ssc-sub-head{font-size:.78em;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
    .ssc-opt-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
    .ssc-opt{flex:1;min-width:52px;padding:9px 6px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:.8em;font-weight:600;cursor:pointer;transition:all .15s}
    .ssc-opt:hover{border-color:var(--border2);color:var(--text)}
    .ssc-opt.on{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--text)}
    .ssc-action-row{display:flex;gap:8px;margin-top:10px}
    .ssc-ghost{flex:1;padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:.82em;font-weight:600;cursor:pointer;transition:all .15s}
    .ssc-ghost:hover{background:var(--bg3);color:var(--text)}
    .ssc-ghost:disabled{opacity:.4;cursor:default}
    .ssc-clock{font-family:'JetBrains Mono',monospace;font-size:.8em;font-weight:600;color:var(--cyan);white-space:nowrap}
    .ssc-top .ssc-bm{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--amber);width:34px;height:34px;cursor:pointer;font-size:1.05em;padding:0;flex-shrink:0;transition:all .15s}
    .ssc-top .ssc-bm:hover{border-color:var(--border2)}
    .ssc-mini{font-size:.82em;color:var(--text4);margin:6px 0 20px}
    .ssc-resume{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:20px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);border-radius:var(--radius);animation:fadeUp .2s ease}
    .ssc-resume-info{flex:1;min-width:0}
    .ssc-resume-title{font-size:.9em;font-weight:700;color:var(--blue)}
    .ssc-resume-sub{font-size:.78em;color:var(--text3);margin-top:2px}
    .ssc-resume-btn{padding:9px 18px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;border-radius:var(--radius-sm);color:#fff;font-size:.82em;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .15s}
    .ssc-resume-btn:hover{opacity:.9}
    .ssc-sync{font-size:.78em;margin-left:8px}
    .ssc-hist{width:100%;border-collapse:collapse;margin:8px 0;font-size:.78em}
    .ssc-hist th,.ssc-hist td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;color:var(--text2)}
    .ssc-hist th{color:var(--text4);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
    .ssc-hist td:last-child,.ssc-hist th:last-child{text-align:right}
    #ssc-hist-body{margin-top:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;display:none}

    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    @media(max-width:600px){
      #ssc-je-container{padding:16px 12px 60px}
      .ssc-title{font-size:1.3em}
      .ssc-qtext{font-size:.95em}
      .ssc-nav{flex-direction:column}
      .ssc-nav button{width:100%}
    }
  </style>

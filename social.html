        ::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:100px}
        .nav{position:sticky;top:0;z-index:100;padding:14px 24px;background:rgba(14,11,9,.85);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-bottom:1px solid rgba(200,170,140,.06)}

        #social-training-container h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.8em;letter-spacing:-.3px;color:var(--silk)}
        #social-training-container h2 small{font-size:.45em;display:block;color:var(--text-muted);font-family:'Inter',sans-serif;font-weight:400;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
        #social-training-container .st-opt{position:relative;overflow:hidden;border:1px solid rgba(200,170,140,.06);background:linear-gradient(160deg,rgba(40,34,30,.6),rgba(40,34,30,.3));backdrop-filter:blur(4px);transition:all .2s}
        #social-training-container .st-opt:hover{border-color:rgba(201,160,74,.25);background:linear-gradient(160deg,rgba(50,44,38,.7),rgba(50,44,38,.4));transform:translateY(-1px)}
        #st-mode-badge{background:rgba(201,160,74,.1)!important;color:#c9a04a!important;border:1px solid rgba(201,160,74,.15)!important;font-family:'JetBrains Mono',monospace;font-size:.78em!important;letter-spacing:.3px}
        #st-progress{color:var(--text-muted)!important;font-size:.78em!important}
        #st-score{color:#c9a04a!important;font-size:.85em!important}
        #st-timer{font-family:'JetBrains Mono',monospace!important;color:var(--silk)!important}
        #st-result-overlay>div{background:linear-gradient(160deg,rgba(26,21,18,.97),rgba(26,21,18,.92))!important;border:1px solid rgba(201,160,74,.1)!important;border-radius:var(--radius)!important}

        #st-retry-btn{background:linear-gradient(135deg,#c9a04a,#d47a3a)!important;border-radius:10px!important;font-weight:600!important}
        #st-close-btn{background:rgba(255,255,255,.04)!important;border-radius:10px!important;color:var(--text-sec)!important;border:1px solid rgba(255,255,255,.04)!important}

        #st-solution-box{background:rgba(42,125,100,.06)!important;border:1px solid rgba(42,125,100,.12)!important;color:#3da88a!important}
        .st-subject-btn{transition:all .2s!important}

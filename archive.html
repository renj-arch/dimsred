function loadMoreSubtopics(ci, si, shown) {

  for (var ssi = shown; ssi < next; ssi++) {
    var ss = subj.subSubjects[ssi];

function renderQuestions(ci, si, ssi) {

function loadCategory(ci, cb) {
  if (_cache[ci]) { cb(); return; }
  var files = CAT_INDEX[ci].file;
  if (!Array.isArray(files)) files = [files];
  var merged = {};
  var loaded = 0;
  var failed = false;
  var panel = document.getElementById('view-content');
  files.forEach(function(url, fi) {
    (function attempt(attemptNum) {
      var xhr = new XMLHttpRequest();
      xhr.timeout = 30000;
      xhr.onload = function() {
        if (xhr.status !== 200) {
          if (attemptNum < 1) { setTimeout(function() { attempt(attemptNum + 1); }, 1000); return; }
          onFail(); return;
        }
        var data;
        try { data = JSON.parse(xhr.responseText); } catch(e) {
          if (attemptNum < 1) { setTimeout(function() { attempt(attemptNum + 1); }, 1000); return; }
          onFail(); return;
        }
        for (var sk in data) {
          if (!merged[sk]) merged[sk] = { subSubjects: {} };
          var ss = data[sk].subSubjects;
          for (var ssk in ss) {
            if (ssk === '__proto__' || ssk === 'constructor') continue;
            if (!merged[sk].subSubjects[ssk]) merged[sk].subSubjects[ssk] = [];
            merged[sk].subSubjects[ssk] = merged[sk].subSubjects[ssk].concat(ss[ssk]);

        loaded++;
        if (loaded === files.length) {
          var allKeys = Object.keys(merged);
          if (allKeys.length > 1) {

            if (!merged[targetKey]) merged[targetKey] = { subSubjects: {} };
            for (var ki = 0; ki < allKeys.length; ki++) {
              if (allKeys[ki] === targetKey) continue;

              for (var ssk2 in otherSS) {
                if (ssk2 === '__proto__' || ssk2 === 'constructor') continue;
                if (!merged[targetKey].subSubjects[ssk2]) merged[targetKey].subSubjects[ssk2] = [];
                merged[targetKey].subSubjects[ssk2] = merged[targetKey].subSubjects[ssk2].concat(otherSS[ssk2]);
              }
            }
          }
          _cache[ci] = merged; cb();
        }
      };
      xhr.onerror = function() { if (attemptNum < 1) { setTimeout(function() { attempt(attemptNum + 1); }, 1000); } else { onFail(); } };

      if (_currentSubSub !== null) { renderQuestions(_currentCat, _currentSubj, _currentSubSub); }
      else if (_currentSubj !== null) { showSubject(_currentCat, _currentSubj); }
      else { showCategory(_currentCat); }
    } else {
      welcome.style.display = 'block';
      panel.style.display = 'none';
    }
    return;
  }
  welcome.style.display = 'none';
  panel.style.display = 'block';
  panel.innerHTML = '<div class="loading">Searching...</div>';
  _searchAll = [];
  _searchRendered = 0;
  _searchQuery = query;
  _searchLoading = true;
  _searchDoneFiles = 0;
  _searchTotalFiles = CAT_INDEX.length;
  _searchCapHit = false;
  _searchStartToken = _searchToken;
  _dateStrCache = {};
  var words = query.split(/\s+/);
  _searchDateFilter = null;
  _searchTextWords = [];
  for (var wi = 0; wi < words.length; wi++) {
    if (words[wi].indexOf('date:') === 0) { _searchDateFilter = words[wi].slice(5); }
    else { _searchTextWords.push(words[wi]); }
  }
  _searchQueue = [];
  for (var ci = 0; ci < CAT_INDEX.length; ci++) _searchQueue.push(ci);
  _searchCur = null;
  showSearchResults();
  _scanChunk();
}
function _nextQuestion() {
  while (_searchCur.skI < _searchCur.skKeys.length) {
    var sk = _searchCur.skKeys[_searchCur.skI];
    var subj = _searchCur.data[sk];
    if (!subj.subSubjects) { _searchCur.skI++; continue; }
    if (!_searchCur.sskKeys) _searchCur.sskKeys = Object.keys(subj.subSubjects);
    while (_searchCur.sskI < _searchCur.sskKeys.length) {
      var ssk = _searchCur.sskKeys[_searchCur.sskI];
      var arr = subj.subSubjects[ssk];
      if (_searchCur.qi < arr.length) {
        return { sk: sk, ssk: ssk, q: arr[_searchCur.qi++] };
      }
      _searchCur.qi = 0;
      _searchCur.sskI++;
    }
    _searchCur.sskKeys = null;
    _searchCur.sskI = 0;
    _searchCur.skI++;
  }
  return null;
}
function _fastDateStr(iso) {
  var m = iso.slice(0, 10).split('-');
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return (+m[2]) + ' ' + months[(+m[1])-1] + ' ' + m[0];
}
function _matchesQuery(q) {
  if (_searchDateFilter) {
    var qDate = (q.pubDate||'').split('T')[0];
    if (qDate.indexOf(_searchDateFilter) !== 0) return false;
  }
  if (_searchTextWords.length) {
    var qq = (q.question||'').toLowerCase();
    var aa = (q.answer||'').toLowerCase();
    var ff = null;
    var dd = null;
    for (var twi = 0; twi < _searchTextWords.length; twi++) {
      var w = _searchTextWords[twi];
      if (qq.indexOf(w) !== -1) continue;
      if (aa.indexOf(w) !== -1) continue;
      if (dd === null) {
        if (!q.pubDate) { dd = ''; }
        else {
          if (!_dateStrCache[q.pubDate]) _dateStrCache[q.pubDate] = _fastDateStr(q.pubDate);
          dd = _dateStrCache[q.pubDate];
        }
      }
      if (dd.indexOf(w) !== -1) continue;
      if (ff === null) ff = (q.fact||'').toLowerCase();
      if (ff.indexOf(w) === -1) return false;
    }
  }
  return true;
}
function _scanChunk() {
  if (!_searchLoading || _searchStartToken !== _searchToken) return;
  var scanned = 0;
  while (scanned < SEARCH_CHUNK) {
    if (_searchCapHit) { _finishSearch(); return; }
    if (!_searchCur) {
      if (_searchQueue.length === 0) { _finishSearch(); return; }
      var ci = _searchQueue[0];
      if (!_cache[ci]) {
        loadCategory(ci, function() { _scanChunk(); });
        return;
      }
      _searchQueue.shift();
      _searchCur = { ci: ci, data: _cache[ci], skKeys: Object.keys(_cache[ci]), skI: 0, sskKeys: null, sskI: 0, qi: 0 };
    }
    var item = _nextQuestion();
    if (!item) {
      _searchCur = null;
      _searchDoneFiles++;
      continue;
    }
    scanned++;
    if (_matchesQuery(item.q)) {
      _searchAll.push({category: CAT_INDEX[_searchCur.ci].name, icon: CAT_INDEX[_searchCur.ci].icon, subject: item.sk, subSubject: item.ssk, question: item.q});
      if (_searchAll.length >= MAX_SEARCH_RESULTS) _searchCapHit = true;
    }
  }
  _renderSearchHeader();
  _appendSearchPage();
  setTimeout(_scanChunk, 0);
}
function _finishSearch() {
  _searchLoading = false;
  _renderSearchHeader();
  _appendSearchPage();
}
function _renderSearchHeader() {
  var head = document.getElementById('searchHead');
  if (!head) return;
  var txt;
  if (_searchCapHit) {
    txt = 'Found <strong>' + _searchCountLabel(_searchAll.length) + '</strong> for "' + escHtml(_searchQuery) + '" — showing first ' + MAX_SEARCH_RESULTS.toLocaleString() + '. Refine your search to see more.';
  } else if (_searchAll.length === 0 && _searchLoading) {
    txt = 'Searching <strong>' + _searchDoneFiles + '/' + _searchTotalFiles + '</strong> files…';
  } else if (_searchLoading) {
    txt = 'Found <strong>' + _searchCountLabel(_searchAll.length) + '</strong> so far · searching <strong>' + _searchDoneFiles + '/' + _searchTotalFiles + '</strong> files…';
  } else {
    txt = 'Found <strong>' + _searchCountLabel(_searchAll.length) + '</strong> for "' + escHtml(_searchQuery) + '"';
  }
  head.innerHTML = txt;
}
function _searchItemHTML(r) {
  var q = r.question;
  var date = q.pubDate ? new Date(q.pubDate).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
  var h = '<div class="q-item"><div class="q-tags"><span class="tag cat-tag">' + escHtml(r.category) + ' &rsaquo; ' + escHtml(r.subject) + ' &rsaquo; ' + escHtml(r.subSubject) + '</span>' + (date?'<span class="tag date-tag">'+date+'</span>':'') + '</div>';
  h += '<div class="q-question">' + escHtml(q.question) + '</div>';
  h += '<div class="q-answer"><span class="a-label">Answer:</span> <span class="a-value">' + escHtml(q.answer) + '</span></div>';
  h += (q.fact ? '<button class="explain-btn" onclick="toggleExplain(this)">📖 Explanation</button><div class="q-explain">' + escHtml(q.fact) + '</div>' : '') + '</div>';
  return h;
}
function _appendSearchPage() {
  var list = document.getElementById('searchQuestionList');
  if (!list) return;
  var next = Math.min(_searchRendered + RESULTS_PER_PAGE, _searchAll.length);
  if (next <= _searchRendered) return;
  var chunk = [];
  for (var i = _searchRendered; i < next; i++) chunk.push(_searchItemHTML(_searchAll[i]));
  var frag = document.createElement('div');
  frag.innerHTML = chunk.join('');
  while (frag.firstChild) list.appendChild(frag.firstChild);
  _searchRendered = next;
  var btn = document.getElementById('searchMoreBtn');
  if (_searchRendered < _searchAll.length) {
    var left = _searchAll.length - _searchRendered;
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'searchMoreBtn';
      btn.style.cssText = 'display:block;margin:18px auto;padding:10px 22px;border-radius:8px;border:1px solid var(--purple);background:rgba(99,102,241,.12);color:var(--purple);cursor:pointer;font-size:.85em;font-weight:700';
      btn.onclick = function() { _appendSearchPage(); };
      list.parentNode.appendChild(btn);
    }
    btn.textContent = 'Show more (' + left.toLocaleString() + ' more)';
  } else if (btn) {
    btn.remove();
  }
}
function showSearchResults() {
  var panel = document.getElementById('view-content');
  if (_searchAll.length === 0 && !_searchLoading) {
    panel.innerHTML = '<div class="search-no-results">No questions matching "<strong>' + escHtml(_searchQuery) + '</strong>"</div>';
    return;
  }
  var h = '<div class="search-results-info" id="searchHead"></div>';
  h += '<div class="question-list" id="searchQuestionList"></div>';
  panel.innerHTML = h;
  _searchRendered = 0;
  _renderSearchHeader();
  _appendSearchPage();
}
function localizeBuildTime() {
  var el = document.getElementById('build-time');
  if (!el) return;
  var d = new Date(el.getAttribute('datetime'));
  el.textContent = d.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
}
localizeBuildTime();
var _ssRendered = {};
function renderSubsubs(el, ci, si) {
  var c = CAT_INDEX[ci]; if (!c || !c.subjects[si]) return;
  var subj = c.subjects[si];
  var h = '';
  for (var ssi = 0; ssi < subj.subSubjects.length; ssi++) {
    var ss = subj.subSubjects[ssi];
    h += '<a href="#" class="sidebar-subsub-link" data-ci="' + ci + '" data-si="' + si + '" data-ssi="' + ssi + '" onclick="return selectSubSubject(' + ci + ',' + si + ',' + ssi + ')"><span class="sidebar-label">' + escHtml(ss.name) + '</span><span class="sidebar-count">' + ss.count + '</span></a>';
  }
  el.innerHTML = h;
  _ssRendered[ci + '-' + si] = true;
}
function buildSidebar() {
  var root = document.getElementById('sidebar-root');
  if (!root) return;
  var h = '';
  for (var ci = 0; ci < CAT_INDEX.length; ci++) {
    var c = CAT_INDEX[ci];
    h += '<div class="sidebar-cat">';
    h += '<a href="#" class="sidebar-link" data-ci="' + ci + '" onclick="return selectCategory(' + ci + ')"><span class="sidebar-icon">' + escHtml(c.icon) + '</span><span class="sidebar-label">' + escHtml(c.name) + '</span><span class="sidebar-count">' + c.total + '</span></a>';
    h += '<div class="sidebar-subjects" id="subj-' + ci + '">';
    for (var si = 0; si < c.subjects.length; si++) {
      var subj = c.subjects[si];
      h += '<a href="#" class="sidebar-subj-link" data-ci="' + ci + '" data-si="' + si + '" onclick="return selectSubject(' + ci + ',' + si + ')"><span class="sidebar-label">' + escHtml(subj.name) + '</span><span class="sidebar-count">' + subj.total + '</span></a>';
      h += '<div class="sidebar-subsubs" id="ss-' + ci + '-' + si + '"><span class="sidebar-subsub-loading">click to load sub-topics</span></div>';
    }
    h += '</div></div>';
  }
  root.innerHTML = h;
}
function buildWelcomeGrid() {
  var grid = document.getElementById('welcome-grid');
  if (!grid) return;
  var h = '';
  CAT_INDEX.forEach(function(c, ci) {
    h += '<a href="#" class="subj-card" onclick="return selectCategory(' + ci + ')"><div class="subj-card-name">' + escHtml(c.icon) + ' ' + escHtml(c.name) + '</div><div class="subj-card-count">' + c.total + ' questions</div></a>';
  });
  grid.innerHTML = h;
}
loadIndex();

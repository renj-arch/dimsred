<h1>2 The Oceans - Detailed Profiles</h1>
<p class="meta">Indian Geography · <a href="/upsc/course/gs/lesson-indian-geography">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Gyres as circular arrows -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- N Pacific Gyre (clockwise) -->
    <path d="M80 60 a40 40 0 1 1 0.1 0" marker-end="url(#arrow)"/>
    <text x="80" y="115" text-anchor="middle" font-size="11" fill="#1f2937">N PACIFIC GYRE</text>
    <!-- S Pacific Gyre (counterclockwise) -->
    <path d="M80 240 a40 40 0 1 0 0.1 0" marker-end="url(#arrow)"/>
    <text x="80" y="295" text-anchor="middle" font-size="11" fill="#1f2937">S PACIFIC GYRE</text>
    <!-- N Atlantic Gyre (clockwise) -->
    <path d="M480 60 a40 40 0 1 1 0.1 0" marker-end="url(#arrow)"/>
    <text x="480" y="115" text-anchor="middle" font-size="11" fill="#1f2937">N ATLANTIC GYRE</text>
    <!-- S Atlantic Gyre (counterclockwise) -->
    <path d="M480 240 a40 40 0 1 0 0.1 0" marker-end="url(#arrow)"/>
    <text x="480" y="295" text-anchor="middle" font-size="11" fill="#1f2937">S ATLANTIC GYRE</text>
    <!-- Indian Ocean Gyre (counterclockwise) -->
    <path d="M340 160 a35 35 0 1 0 0.1 0" marker-end="url(#arrow)"/>
    <text x="340" y="210" text-anchor="middle" font-size="11" fill="#1f2937">INDIAN OCEAN GYRE</text>
  </g>
  <!-- Thermohaline Conveyor Belt -->
  <path d="M120 100 L200 100 L200 180 L300 180 L300 260 L440 260 L440 140 L520 140" stroke="#1f2937" stroke-width="3" fill="none" stroke-dasharray="8 4"/>
  <text x="260" y="90" text-anchor="middle" font-size="12" fill="#1f2937">THERMOHALINE CONVEYOR</text>
  <!-- ENSO Seesaw in Pacific -->
  <g transform="translate(140,160)">
    <!-- Pivot -->
    <circle cx="0" cy="0" r="6" fill="#1f2937"/>
    <!-- Beam -->
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#1f2937" stroke-width="4"/>
    <!-- West Pacific (warm pool) -->
    <rect x="-80" y="-30" width="30" height="30" fill="#1f2937" opacity="0.2"/>
    <text x="12" y="31.7" font-size="9" fill="#1f2937">WARM POOL</text>
    <!-- East Pacific (upwelling) -->
    <rect x="50" y="-30" width="30" height="30" fill="none" stroke="#1f2937" stroke-dasharray="3 2"/>
    <text x="65" y="31.7" font-size="9" fill="#1f2937">UPWELLING</text>
    <!-- Labels on beam -->
    <text x="12" y="58.5" font-size="10" fill="#1f2937" text-anchor="start">LA NIÑA</text>
    <text x="70" y="44.9" font-size="10" fill="#1f2937" text-anchor="end">EL NIÑO</text>
    <!-- Trade winds -->
    <path d="M-90 -50 Q -40 -60 0 -50" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="12" y="19.2" font-size="9" fill="#1f2937">TRADE WINDS</text>
    <!-- Weakened winds (El Niño) -->
    <path d="M10 -50 Q 40 -40 70 -50" stroke="#1f2937" stroke-width="1" fill="none" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
    <text x="70" y="19.2" font-size="9" fill="#1f2937">WEAKENED</text>
  </g>
  <!-- Indian Monsoon Cloud -->
  <g transform="translate(420,100)">
    <path d="M0 0 Q -20 -10 -30 0 Q -40 -20 -20 -30 Q 0 -40 30 -30 Q 50 -20 40 0 Q 30 10 0 0" stroke="#1f2937" stroke-width="2" fill="none"/>
    <text x="27.2" y="72.7" font-size="11" fill="#1f2937" text-anchor="middle">MONSOON</text>
    <line x1="0" y1="10" x2="0" y2="30" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="17" y="45" font-size="10" fill="#1f2937" text-anchor="middle">RAIN</text>
  </g>
  <!-- Coriolis label -->
  <text x="280" y="30" text-anchor="middle" font-size="12" fill="#1f2937">CORIOLIS DEFLECTION</text>
  <!-- Garbage Patch -->
  <circle cx="100" cy="80" r="15" fill="none" stroke="#1f2937" stroke-dasharray="2 2"/>
  <text x="100" y="100" text-anchor="middle" font-size="9" fill="#1f2937">GARBAGE PATCH</text>
  <!-- Humboldt / Anchovy -->
  <text x="120" cy="220" x="120" y="220" font-size="9" fill="#1f2937" text-anchor="middle">HUMBOLDT / ANCHOVY</text>
  <!-- Gulf Stream -->
  <text x="460" y="40" font-size="9" fill="#1f2937" text-anchor="middle">GULF STREAM</text>
  <!-- Agulhas -->
  <text x="340" y="130" font-size="9" fill="#1f2937" text-anchor="middle">AGULHAS CURRENT</text>
  <!-- Caption strip -->
  
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 Z" fill="#1f2937"/>
    </marker>
  </defs>
</svg></div>

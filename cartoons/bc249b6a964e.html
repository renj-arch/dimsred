<h1>Colonial Architecture and the Making of Modern Urban Form</h1>
<p class="meta">Indian Architecture &amp;amp; Built Heritage · <a href="/upsc/course/mains-gs1/lesson-architecture-heritage">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background grid suggestion -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.15">
    <line x1="40" y1="40" x2="520" y2="40"/>
    <line x1="40" y1="80" x2="520" y2="80"/>
    <line x1="40" y1="120" x2="520" y2="120"/>
    <line x1="40" y1="160" x2="520" y2="160"/>
    <line x1="40" y1="200" x2="520" y2="200"/>
    <line x1="40" y1="240" y2="240" x2="520"/>
  </g>
  <!-- Central axial line (Rajpath / planning axis) -->
  <line x1="60" y1="160" x2="500" y2="160" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrowheads on axis -->
  <polygon points="500,150 515,160 500,170" fill="#1f2937"/>
  <polygon points="60,150 45,160 60,170" fill="#1f2937"/>
  <!-- Left: Fort St. George (bastioned fort) -->
  <g transform="translate(80,100)">
    <!-- Bastioned trace -->
    <path d="M0,0 L30,-10 L60,0 L70,30 L60,60 L30,70 L0,60 L-10,30 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
    <path d="M-10,30 L-20,20" stroke="#1f2937" stroke-width="3"/>
    <path d="M70,30 L80,20" stroke="#1f2937" stroke-width="3"/>
    <path d="M30,-10 L20,-20" stroke="#1f2937" stroke-width="3"/>
    <path d="M30,70 L20,80" stroke="#1f2937" stroke-width="3"/>
    <!-- Inner keep -->
    <rect x="15" y="15" width="30" height="30" fill="none" stroke="#1f2937" stroke-width="2"/>
    <rect x="22" y="22" width="16" height="16" fill="#1f2937"/>
  </g>
  <!-- Middle: Indo-Saracenic hybrid (Victoria Memorial / Madras High Court) -->
  <g transform="translate(280,80)">
    <!-- Base -->
    <rect x="-40" y="40" width="80" height="40" fill="none" stroke="#1f2937" stroke-width="3"/>
    <!-- Pointed arches -->
    <path d="M-35,40 L-35,80" stroke="#1f2937" stroke-width="2"/>
    <path d="M0,40 L0,80" stroke="#1f2937" stroke-width="2"/>
    <path d="M35,40 L35,80" stroke="#1f2937" stroke-width="2"/>
    <path d="M-35,55 Q0,35 35,55" fill="none" stroke="#1f2937" stroke-width="2"/>
    <!-- Onion dome -->
    <path d="M-30,40 Q0,0 30,40" fill="none" stroke="#1f2937" stroke-width="3"/>
    <path d="M-20,35 Q0,10 20,35" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- Chhatris -->
    <g stroke="#1f2937" stroke-width="2">
      <line x1="-45" y1="40" x2="-45" y2="20"/>
      <line x1="45" y1="40" x2="45" y2="20"/>
      <path d="M-50,20 Q-45,15 -40,20" fill="none"/>
      <path d="M40,20 Q45,15 50,20" fill="none"/>
    </g>
    <!-- Jali suggestion -->
    <g stroke="#1f2937" stroke-width="1" opacity="0.6">
      <line x1="-30" y1="50" x2="-10" y2="70"/>
      <line x1="-10" y1="50" x2="-30" y2="70"/>
      <line x1="10" y1="50" x2="30" y2="70"/>
      <line x1="30" y1="50" x2="10" y2="70"/>
    </g>
  </g>
  <!-- Right: Rashtrapati Bhavan / Lutyens' Delhi -->
  <g transform="translate(460,100)">
    <!-- Grand dome -->
    <path d="M-35,40 Q0,-10 35,40" fill="none" stroke="#1f2937" stroke-width="4"/>
    <ellipse cx="0" cy="40" rx="35" ry="8" fill="none" stroke="#1f2937" stroke-width="2"/>
    <!-- Colonnade -->
    <g stroke="#1f2937" stroke-width="3">
      <line x1="-60" y1="80" x2="-60" y2="40"/>
      <line x1="-30" y1="80" x2="-30" y2="40"/>
      <line x1="0" y1="80" x2="0" y2="40"/>
      <line x1="30" y1="80" x2="30" y2="40"/>
      <line x1="60" y1="80" x2="60" y2="40"/>
    </g>
    <line x1="-70" y1="80" x2="70" y2="80" stroke="#1f2937" stroke-width="4"/>
    <!-- Forecourt axis -->
    <line x1="0" y1="80" x2="0" y2="120" stroke="#1f2937" stroke-width="3" stroke-dasharray="8,4"/>
    <line x1="-80" y1="120" x2="80" y2="120" stroke="#1f2937" stroke-width="2"/>
  </g>
  <!-- British architect figure (surveyor) at left -->
  <g transform="translate(40,180)" stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Body -->
    <path d="M0,0 L0,-50" stroke-width="4"/>
    <path d="M0,-50 L-15,-30 M0,-50 L15,-30"/>
    <path d="M0,-10 L-20,10 M0,-10 L20,10"/>
    <!-- Head -->
    <circle cx="0" cy="-60" r="10"/>
    <!-- Compass in hand -->
    <g transform="translate(20,-35)">
      <path d="M0,0 L-15,-15 M0,0 L15,-15" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" stroke-width="2"/>
    </g>
  </g>

  <text x="150" y="195" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">BLACK TOWN</text>

  <text x="80" y="230" font-family="Georgia, serif" font-size="13" fill="#1f2937" text-anchor="middle">FORT ST. GEORGE</text>
  <text x="80" y="248" font-family="Georgia, serif" font-size="12" fill="#1f2937" text-anchor="middle">BASTIONED GRID</text>
  <text x="280" y="230" font-family="Georgia, serif" font-size="13" fill="#1f2937" text-anchor="middle">INDO-SARACENIC</text>
  <text x="280" y="248" font-family="Georgia, serif" font-size="12" fill="#1f2937" text-anchor="middle">HYBRID STYLE</text>
  <text x="460" y="230" font-family="Georgia, serif" font-size="13" fill="#1f2937" text-anchor="middle">LUTYENS' DELHI</text>

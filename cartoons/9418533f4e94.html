<h1>The Pashupati Seal and the Archaeological Roots of Maithili Identity</h1>
<p class="meta">Maithili Literature Paper I: History &amp;amp; Movements · <a href="/upsc/course/opt-maithili/lesson-paper1">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Central metaphor: Seal transforming into manuscript -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Ancient seal (left) -->
    <rect x="60" y="60" width="120" height="120" rx="8"/>
    <circle cx="120" cy="90" r="25" stroke-width="2.5"/>
    <ellipse cx="120" cy="90" rx="18" ry="12" stroke-width="2"/>
    <path d="M105 85 Q120 70 135 85" stroke-width="2"/>
    <circle cx="112" cy="85" r="2" fill="#1f2937"/>
    <circle cx="128" cy="85" r="2" fill="#1f2937"/>
    <!-- Animals around seal -->
    <path d="M30 60 Q40 40 60 60" stroke-width="2.5"/> <!-- elephant trunk -->
    <path d="M200 60 Q190 40 170 60" stroke-width="2.5"/> <!-- tiger -->
    <path d="M60 190 Q40 210 60 190" stroke-width="2.5"/> <!-- rhino -->
    <path d="M180 190 Q200 210 180 190" stroke-width="2.5"/> <!-- bull -->
    
    <!-- Transformation arrow -->
    <path d="M200 110 Q280 110 360 110" stroke-width="3" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
      </marker>
    </defs>
    
    <!-- Manuscript (right) -->
    <rect x="380" y="60" width="120" height="150" rx="4"/>
    <path d="M390 80 H490 M390 105 H490 M390 130 H490 M390 155 H490 M390 180 H470" stroke-width="1.5"/>
    <!-- Quill -->
    <path d="M440 220 Q420 200 400 220" stroke-width="2.5"/>
    <path d="M400 220 Q390 230 400 240" stroke-width="2"/>
    
    <!-- Vidyapati figure -->
    <circle cx="440" cy="250" r="18" stroke-width="2.5"/>
    <path d="M440 268 Q440 290 420 300 M440 268 Q440 290 460 300" stroke-width="2.5"/>
    <path d="M425 280 Q440 270 455 280" stroke-width="2.5"/>
    
    <!-- Top: Indus script symbols -->
    <text x="120" y="40" text-anchor="middle" font-size="14" font-family="serif" fill="#1f2937">𐀀 𐀁 𐀂 𐀃</text>
    
    <!-- Bottom transition symbols -->
    <path d="M120 200 Q120 220 100 230" stroke-width="2" stroke-dasharray="4 2"/> <!-- oral -->
    <path d="M380 200 Q380 220 400 230" stroke-width="2"/> <!-- written -->

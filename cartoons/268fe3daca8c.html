<h1>Feminist Critique in the Works of Kamala Surayya and Sara Joseph</h1>
<p class="meta">Malayalam Literature Paper II: Texts &amp;amp; Criticism · <a href="/upsc/course/opt-malayalam/lesson-paper2">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background margin guides (not rendered) -->
  <!-- Central metaphor: two generational figures back-to-back -->
  <!-- Surayya (left): confessional, body, diary -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Surayya figure -->
    <ellipse cx="180" cy="140" rx="35" ry="45" />
    <path d="M180 185 Q180 220 150 240 Q180 220 210 240 Q180 220 180 185" />
    <path d="M155 130 Q130 120 120 140" stroke-width="2.5" />
    <path d="M205 130 Q230 120 240 140" stroke-width="2.5" />
    <!-- Diary in lap -->
    <rect x="155" y="190" width="50" height="35" rx="3" />
    <path d="M180 190 L180 225" stroke-width="2" />
    <!-- Body as site: lotus/flame on torso -->
    <path d="M180 155 Q170 145 180 135 Q190 145 180 155" stroke-width="2.5" />
    <path d="M180 135 L180 125" stroke-width="2" />
    <!-- Label: Confessional Body -->
    <text x="180" y="85" text-anchor="middle" font-size="13" font-family="Georgia, serif" fill="#1f2937">Confessional Body</text>
  </g>

  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Joseph figure (right): structural, collective, land -->
    <ellipse cx="380" cy="140" rx="35" ry="45" />
    <path d="M380 185 Q380 220 350 240 Q380 220 410 240 Q380 220 380 185" />
    <path d="M355 130 Q330 120 320 140" stroke-width="2.5" />
    <path d="M405 130 Q430 120 440 140" stroke-width="2.5" />
    <!-- Land document held up -->
    <rect x="360" y="100" width="40" height="50" rx="2" />
    <path d="M365 115 L395 115 M365 125 L395 125 M365 135 L395 135" stroke-width="2" />
    <!-- Supporting women behind (polyphonic chorus) -->
    <ellipse cx="340" cy="155" rx="20" ry="28" stroke-width="2" />
    <ellipse cx="420" cy="155" rx="20" ry="28" stroke-width="2" />
    <ellipse cx="380" cy="170" rx="18" ry="25" stroke-width="2" />
    <!-- Label: Polyphonic Chorus -->
    <text x="380" y="85" text-anchor="middle" font-size="13" font-family="Georgia, serif" fill="#1f2937">Polyphonic Chorus</text>
  </g>

  <!-- Top center: Stree-Sakti reinterpreted -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <circle cx="280" cy="60" r="28" />
    <path d="M280 32 L280 50 M260 41 L300 41 M268 48 L292 48" stroke-width="2.5" />
    <text x="280" y="15" text-anchor="middle" font-size="12" font-family="Georgia, serif" fill="#1f2937">Stree-Sakti Reimagined</text>
  </g>

  <!-- Top-left: Bhakti saint reference (Akka Mahadevi) -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <ellipse cx="80" cy="60" rx="22" ry="30" />
    <path d="M80 90 L80 110" />
    <path d="M65 70 Q50 60 45 75" />
    <text x="80" y="20" text-anchor="middle" font-size="11" font-family="Georgia, serif" fill="#1f2937">Bhakti Roots</text>
  </g>

  <!-- Top-right: Dalit-feminist reference -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <ellipse cx="480" cy="60" rx="22" ry="30" />
    <path d="M480 90 L480 110" />
    <path d="M495 70 Q510 60 515 75" />
    <text x="480" y="20" text-anchor="middle" font-size="11" font-family="Georgia, serif" fill="#1f2937">Dalit-Feminist Lineage</text>
  </g>

  <!-- Bottom-left: Censorship / public-private divide -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <rect x="60" y="240" width="80" height="40" rx="4" />
    <path d="M70 250 L130 270 M130 250 L70 270" stroke-width="3" />
    <text x="100" y="235" text-anchor="middle" font-size="12" font-family="Georgia, serif" fill="#1f2937">Public/Private Divide</text>
  </g>

  <!-- Bottom-right: Panchayat / land rights collective -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <rect x="420" y="240" width="80" height="40" rx="4" />
    <path d="M430 255 L490 255 M430 265 L490 265 M430 275 L490 275" stroke-width="2" />
    <circle cx="460" cy="230" r="12" stroke-width="2" />
    <path d="M460 242 L460 255" stroke-width="2" />
    <text x="460" y="235" text-anchor="middle" font-size="11" font-family="Georgia, serif" fill="#1f2937">Land Rights Collective</text>
  </g>

  <!-- Central connecting arrow between figures (public-private negotiation) -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <path d="M215 140 Q280 140 345 140" stroke-dasharray="8 4" />
    <polygon points="345,140 335,135 335,145" fill="#1f2937" />
    <polygon points="215,140 225,135 225,145" fill="#1f2937" />
  </g>

  <!-- Caption strip at bottom -->
  <rect x="14" y="292" width="532" height="24" fill="#1f2937" rx="2"/>
  <text x="280" y="309" text-anchor="middle" font-size="13" font-family="Georgia, serif" fill="#fbf7ec">
    Feminist Critique: Kamala Surayya &amp; Sara Joseph — Malayalam Literature Paper II
  </text>
</svg></div>

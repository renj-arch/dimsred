<h1>Advanced Sequence Stratigraphy of the Vindhyan Supergroup</h1>
<p class="meta">Geology Paper II: Core Topics · <a href="/upsc/course/opt-geology/lesson-paper2">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="560" height="320" fill="#fbf7ec"/>
  
  <!-- Central stratigraphic column: three groups -->
  <rect x="200" y="190" width="160" height="70" stroke="#1f2937" stroke-width="3" fill="none"/> <!-- Semri -->
  <rect x="200" y="120" width="160" height="70" stroke="#1f2937" stroke-width="3" fill="none"/> <!-- Kaimur -->
  <rect x="200" y="50" width="160" height="70" stroke="#1f2937" stroke-width="3" fill="none"/> <!-- Bhander -->
  
  <!-- Semri pattern: carbonate δ13C excursion wavy line -->
  <path d="M210,225 C240,210 270,240 300,225 C330,210 360,240 350,225" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  
  <!-- Kaimur pattern: sandstone-shale couplets (horizontal lines) -->
  <path d="M210,130 L350,130 M210,145 L350,145 M210,160 L350,160 M210,175 L350,175 M210,185 L350,185" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  
  <!-- Bhander pattern: red beds cross-hatch -->
  <path d="M210,50 L350,120 M210,120 L350,50" stroke="#1f2937" stroke-width="2.5" fill="none"/>
  
  <!-- Zircon crystal (1.8 Ga) -->
  <polygon points="100,210 115,225 100,240 85,225" stroke="#1f2937" stroke-width="3" fill="none"/>

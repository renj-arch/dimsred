<h1>Mesolithic Period (c. 10,000 &amp;ndash; 6,000 BCE)</h1>

<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>

  <polygon points="130,280 430,280 280,100" fill="none" stroke="#1f2937" stroke-width="3"/>

  <rect x="210" y="230" width="20" height="30" fill="#1f2937"/>

  <circle cx="300" cy="220" r="10" fill="none" stroke="#1f2937" stroke-width="2"/>

  <circle cx="280" cy="120" r="10" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="280" y1="130" x2="280" y2="160" stroke="#1f2937" stroke-width="2"/>
  <line x1="250" y1="140" x2="310" y2="140" stroke="#1f2937" stroke-width="2"/>

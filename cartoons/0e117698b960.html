<h1>Architectural Evolution</h1>
<p class="meta">Art &amp;amp; Culture for Prelims · <a href="/upsc/course/gs/lesson-art-culture-prelims">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  
  <!-- Ground line -->
  <line x1="40" y1="260" x2="520" y2="260" stroke="#1f2937" stroke-width="3"/>
  
  <!-- Rock-cut base: Chaitya hall entrance -->
  <path d="M100 260 L100 180 Q140 140 180 140 L180 180 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M100 180 Q140 150 180 180" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="140" cy="160" r="8" fill="#1f2937"/>
  <rect x="125" y="200" width="30" height="60" fill="none" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Label: Rock-cut -->
  <text x="140" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f2937">Rock‑cut</text>
  <text x="140" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f2937">Chaitya</text>
  
  <!-- Evolution arrow upward -->
  <path d="M140 140 L140 80" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#1f2937"/>
    </marker>
  </defs>
  
  <!-- Three style columns rising from central trunk -->
  <!-- Central trunk -->
  <path d="M140 80 L140 40" stroke="#1f2937" stroke-width="4"/>
  
  <!-- NAGARA (Left branch) -->
  <path d="M140 60 Q80 40 60 60" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Nagara shikhara: curvilinear -->
  <path d="M30 60 Q60 10 90 60" fill="none" stroke="#1f2937" stroke-width="3"/>
  <ellipse cx="60" cy="18" rx="10" ry="6" fill="none" stroke="#1f2937" stroke-width="2"/> <!-- amalaka -->
  <circle cx="60" cy="8" r="4" fill="#1f2937"/> <!-- kalasha -->
  <text x="60" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1f2937">NAGARA</text>
  <text x="60" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">Shikhara</text>
  <text x="60" y="123" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">Amalaka+Kalasha</text>
  
  <!-- DRAVIDA (Right branch) -->
  <path d="M140 60 Q200 40 220 60" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Dravida vimana: pyramidal tiers -->
  <path d="M190 60 L190 45 L210 45 L210 60 Z" fill="none" stroke="#1f2937" stroke-width="2"/> <!-- tala 1 -->
  <path d="M195 45 L195 33 L205 33 L205 45 Z" fill="none" stroke="#1f2937" stroke-width="2"/> <!-- tala 2 -->
  <path d="M198 33 L198 24 L202 24 L202 33 Z" fill="none" stroke="#1f2937" stroke-width="2"/> <!-- tala 3 -->
  <path d="M199 24 L199 18 L201 18 L201 24 Z" fill="none" stroke="#1f2937" stroke-width="2"/> <!-- tala 4 -->
  <circle cx="200" cy="14" r="4" fill="#1f2937"/> <!-- stupi/kalasha -->
  <!-- Gopuram beside -->
  <path d="M230 60 L230 20 Q250 10 270 20 L270 60 Z" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M235 50 L265 50" stroke="#1f2937" stroke-width="1"/>
  <path d="M238 40 L262 40" stroke="#1f2937" stroke-width="1"/>
  <text x="230" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1f2937">DRAVIDA</text>
  <text x="230" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">Vimana</text>
  <text x="230" y="123" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">Gopuram</text>
  
  <!-- VESARA (Center branch) -->
  <path d="M140 40 L140 10" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Vesara hybrid: curvilinear base, pyramidal top -->
  <path d="M110 10 Q140 -10 170 10 L170 30 Q140 15 110 30 Z" fill="none" stroke="#1f2937" stroke-width="2"/>
  <ellipse cx="140" cy="5" rx="8" ry="4" fill="none" stroke="#1f2937" stroke-width="1.5"/> <!-- amalaka hint -->
  <circle cx="140" cy="-2" r="3" fill="#1f2937"/> <!-- kalasha -->
  <text x="140" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1f2937">VESARA</text>
  <text x="140" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">Hybrid</text>
  
  <!-- Shilpa Shastras root label -->
  <text x="140" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f2937">Shilpa Shastras</text>
  
  <!-- Caption strip -->
  <rect x="0" y="295" width="560" height="25" fill="#1f2937"/>
  <text x="280" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fbf7ec">Architectural Evolution</text>

<h1>Major Kingdoms of the Deccan and South (550&amp;ndash;750 CE)</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Central copper plate being handed down -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- King on left presenting plate -->
    <path d="M80 140 Q80 100 110 100 Q140 100 140 140" stroke-width="4"/>
    <circle cx="110" cy="80" r="20" stroke-width="3"/>
    <path d="M110 100 L110 140" stroke-width="3"/>
    <path d="M90 110 L110 130 L130 110" stroke-width="3"/>
    <path d="M90 130 L110 150 L130 130" stroke-width="3"/>
    <!-- Copper plate -->
    <rect x="140" y="70" width="120" height="100" rx="5" stroke-width="4" fill="#fbf7ec"/>
    <text x="200" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">COPPER PLATE</text>
    <text x="200" y="125" text-anchor="middle" font-size="12" fill="#1f2937">LAND GRANT</text>
    <line x1="150" y1="135" x2="250" y2="135" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="200" y="155" text-anchor="middle" font-size="10" fill="#1f2937">TAX-FREE • PERPETUITY</text>
    <text x="200" y="170" text-anchor="middle" font-size="10" fill="#1f2937">JUSTICE • LABOUR</text>
    <!-- Brahmin receiving -->
    <path d="M260 140 Q260 100 290 100 Q320 100 320 140" stroke-width="4"/>
    <circle cx="290" cy="80" r="20" stroke-width="3"/>
    <path d="M290 100 L290 140" stroke-width="3"/>
    <path d="M270 110 L290 130 L310 110" stroke-width="3"/>
    <path d="M270 130 L290 150 L310 130" stroke-width="3"/>
    <!-- Arrow from plate to intermediary -->
    <path d="M330 120 L380 120" stroke-width="3" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
      </marker>
    </defs>
    <!-- Intermediary/Samanta lord -->
    <circle cx="400" cy="100" r="22" stroke-width="3"/>
    <path d="M400 122 L400 170" stroke-width="3"/>
    <path d="M380 140 L400 160 L420 140" stroke-width="3"/>
    <path d="M380 160 L400 180 L420 160" stroke-width="3"/>

    <circle cx="400" cy="240" r="16" stroke-width="2.5"/>
    <path d="M400 256 L400 290" stroke-width="2.5"/>
    <path d="M385 270 L400 285 L415 270" stroke-width="2.5"/>
    <path d="M385 285 L400 300 L415 285" stroke-width="2.5"/>
    <ellipse cx="400" cy="235" rx="18" ry="8" stroke-width="2" fill="#fbf7ec"/> <!-- grain basket -->
    <circle cx="340" cy="250" r="14" stroke-width="2"/>
    <path d="M340 264 L340 290" stroke-width="2"/>
    <path d="M328 275 L340 288 L352 275" stroke-width="2"/>
    <circle cx="460" cy="250" r="14" stroke-width="2"/>
    <path d="M460 264 L460 290" stroke-width="2"/>
    <path d="M448 275 L460 288 L472 275" stroke-width="2"/>
    <!-- Arrow from peasants up to intermediary -->
    <path d="M400 230 L400 195" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="400" y="210" text-anchor="middle" font-size="11" fill="#1f2937">SURPLUS IN KIND</text>
    <!-- Crumbling city background left -->
    <path d="M20 280 L20 180 Q20 160 40 160 L70 160 Q90 160 90 180 L90 280" stroke-width="2.5"/>
    <path d="M30 180 L30 140 Q30 120 50 120 L70 120 Q90 120 90 140 L90 180" stroke-width="2"/>
    <rect x="35" y="190" width="20" height="90" stroke-width="1.5"/>
    <rect x="65" y="190" width="20" height="90" stroke-width="1.5"/>
    <path d="M45 180 Q45 170 55 170 Q65 170 65 180" stroke-width="2"/> <!-- broken arch -->
    <path d="M50 160 L50 130" stroke-width="2" stroke-dasharray="5,3"/> <!-- fallen pillar -->
    <path d="M60 160 L60 125" stroke-width="2" stroke-dasharray="5,3"/>
    <!-- Xuanzang observing -->
    <circle cx="50" cy="80" r="14" stroke-width="2"/>
    <path d="M50 94 L50 120" stroke-width="2"/>
    <path d="M40 105 L50 115 L60 105" stroke-width="2"/>
    <path d="M40 115 L50 125 L60 115" stroke-width="2"/>
    <rect x="42" y="70" width="16" height="12" stroke-width="1.5"/> <!-- book -->

    <path d="M480 280 Q480 260 500 250 Q520 240 540 250 Q560 260 560 280" stroke-width="2.5" fill="none"/> <!-- hull -->
    <path d="M510 250 L510 200" stroke-width="2" stroke-dasharray="8,4"/> <!-- broken mast -->
    <path d="M510 210 L540 220 L510 230" stroke-width="1.5" fill="none"/> <!-- torn sail -->
    <rect x="440" y="200" width="60" height="80" stroke-width="2" stroke-dasharray="5,3"/> <!-- ruined guild -->
    <text x="470" y="195" text-anchor="middle" font-size="10" fill="#1f2937">SHRENI</text>
    <text x="470" y="295" text-anchor="middle" font-size="10" fill="#1f2937">PORT RUINS</text>
    <!-- Arrow from king to plate label -->
    <path d="M110 110 Q125 90 140 85" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <!-- Arrow from plate to city decay -->
    <path d="M140 120 Q100 140 60 160" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
  </g>
  <!-- Labels -->
  <text x="110" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">KING</text>

  <text x="50" y="60" text-anchor="middle" font-size="11" fill="#1f2937">XUANZANG</text>
  <text x="50" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">RUINED CITIES</text>
  <text x="470" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">TRADE DECLINE</text>
  <text x="400" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">PEASANT SURPLUS</text>

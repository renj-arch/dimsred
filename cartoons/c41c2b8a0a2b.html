<h1>3. Biodiversity &amp;amp; Conservation</h1>
<p class="meta">Environment &amp;amp; Ecology · <a href="/upsc/course/gs/lesson-environment-ecology">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background grid lines for depth -->
  <line x1="0" y1="240" x2="560" y2="240" stroke="#1f2937" stroke-width="2"/>
  
  <!-- Central Tree Metaphor -->
  <!-- Roots: Genetic Diversity -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Traditional diverse roots -->
    <path d="M140,240 Q120,260 100,280 Q80,300 60,310" stroke-dasharray="4,2"/>
    <path d="M160,240 Q145,265 130,290 Q115,310 100,315" stroke-dasharray="4,2"/>
    <path d="M180,240 Q170,265 160,290 Q150,310 140,315" stroke-dasharray="4,2"/>
    <path d="M200,240 Q195,265 190,290 Q185,310 180,315" stroke-dasharray="4,2"/>
    <path d="M220,240 Q220,265 220,290 Q220,310 220,315" stroke-dasharray="4,2"/>
    <path d="M240,240 Q245,265 250,290 Q255,310 260,315" stroke-dasharray="4,2"/>
    <path d="M260,240 Q270,265 280,290 Q290,310 300,315" stroke-dasharray="4,2"/>
    <path d="M280,240 Q295,265 310,290 Q325,310 340,315" stroke-dasharray="4,2"/>
    
    <!-- Monoculture roots (few, uniform) - right side -->
    <path d="M380,240 Q380,265 380,290 Q380,310 380,315" stroke-width="5"/>
    <path d="M410,240 Q410,265 410,290 Q410,310 410,315" stroke-width="5"/>
    <path d="M440,240 Q440,265 440,290 Q440,310 440,315" stroke-width="5"/>
  </g>
  
  <!-- Tree Trunk: Species Diversity -->
  <path d="M180,240 Q190,180 280,120 Q370,180 380,240" stroke="#1f2937" stroke-width="8" fill="none"/>
  <path d="M200,240 Q210,190 280,140 Q350,190 360,240" stroke="#1f2937" stroke-width="4" fill="none" stroke-dasharray="8,4"/>
  
  <!-- Canopy: Ecosystem Diversity -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <ellipse cx="280" cy="80" rx="120" ry="60"/>
    <ellipse cx="220" cy="100" rx="40" ry="25"/>
    <ellipse cx="340" cy="100" rx="40" ry="25"/>
    <ellipse cx="180" cy="130" rx="30" ry="20"/>
    <ellipse cx="380" cy="130" rx="30" ry="20"/>
  </g>
  
  <!-- Species silhouettes on trunk -->
  <g stroke="#1f2937" stroke-width="2" fill="#1f2937">
    <!-- Left side: many species -->
    <circle cx="160" cy="200" r="6"/>
    <ellipse cx="140" cy="180" rx="8" ry="5"/>
    <path d="M130,160 Q125,150 120,140" stroke-width="2" fill="none"/>
    <circle cx="170" cy="150" r="4"/>
    <ellipse cx="150" cy="130" rx="6" ry="4"/>
    
    <!-- Right side: few species -->
    <circle cx="400" cy="200" r="8"/>
    <circle cx="420" cy="170" r="7"/>
  </g>
  
  <!-- Shears cutting roots (Green Revolution) -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <path d="M300,280 L320,260 M320,280 L300,260"/> <!-- Shear blades -->
    <path d="M300,280 L280,300 M320,280 L340,300"/> <!-- Handles -->
    <circle cx="310" cy="270" r="4" fill="#1f2937"/> <!-- Pivot -->
  </g>
  
  <!-- Measuring tape for Species-Area Relationship -->
  <path d="M460,100 Q480,80 500,60" stroke="#1f2937" stroke-width="2" fill="none" stroke-dasharray="10,5"/>
  <polygon points="500,60 510,55 510,65" fill="#1f2937"/> <!-- Arrow -->
  
  <!-- Latitudinal gradient arrow -->
  <path d="M50,50 L50,150" stroke="#1f2937" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#1f2937"/>
    </marker>
  </defs>
  
  <!-- Labels -->
  <text x="80" y="300" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">GENETIC DIVERSITY</text>
  <text x="280" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">SPECIES DIVERSITY</text>
  <text x="280" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">ECOSYSTEM DIVERSITY</text>
  <text x="310" y="308" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">GREEN REVOLUTION</text>
  <text x="120" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">50,000→10 RICE</text>
  <text x="480" y="40" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">SPECIES-AREA</text>
  <text x="42.3" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">LATITUDINAL</text>
  <text x="32.4" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">GRADIENT</text>
  
  <!-- Caption strip -->

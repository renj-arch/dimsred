<h1>Continuity, Differentiability, and Riemann Integration</h1>

<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="560" height="320" fill="#fbf7ec"/>
  <!-- Axes -->
  <line x1="130" y1="250" x2="430" y2="250" stroke="#1f2937" stroke-width="3"/>
  <line x1="280" y1="50" x2="280" y2="250" stroke="#1f2937" stroke-width="3"/>
  <!-- Function curve: continuous wavy line -->
  <path d="M130,150 Q180,100 230,150 Q280,200 330,150 Q380,100 430,150" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- ε-δ box at left point (x≈180) -->
  <rect x="160" y="90" width="40" height="60" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="4,3"/>
  <line x1="160" y1="120" x2="180" y2="120" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="90" x2="180" y2="120" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 Z" fill="#1f2937"/></marker>
  </defs>
  <!-- Compact interval [a,b] bracket at top -->
  <path d="M150,50 V40 H410 V50" fill="none" stroke="#1f2937" stroke-width="2.5"/>

  <text x="410" y="35" font-size="12" font-family="serif" fill="#1f2937" text-anchor="end">b</text>

  <circle cx="180" cy="100" r="4" fill="#1f2937"/>
  <circle cx="380" cy="100" r="4" fill="#1f2937"/>

  <line x1="150" y1="150" x2="410" y2="150" stroke="#1f2937" stroke-width="2" stroke-dasharray="6,4"/>

  <circle cx="280" cy="150" r="5" fill="none" stroke="#1f2937" stroke-width="2.5"/>

  <rect x="150" y="150" width="65" height="100" fill="none" stroke="#1f2937" stroke-width="2"/>

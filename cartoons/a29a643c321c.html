<h1>Rise of Magadha</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Rajgir hills (five peaks) -->
  <path d="M0,280 Q40,200 80,280 Q120,200 160,280 Q200,200 240,280 Q280,200 320,280 Q360,200 400,280 Q440,200 480,280 Q520,200 560,280 L560,320 L0,320 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Gates on hills (four passes) -->
  <g stroke="#1f2937" stroke-width="2">
    <line x1="70" y1="280" x2="70" y2="240"/>
    <line x1="190" y1="280" x2="190" y2="240"/>
    <line x1="310" y1="280" x2="310" y2="240"/>
    <line x1="430" y1="280" x2="430" y2="240"/>
  </g>
  <!-- Bimbisara on throne at center -->
  <g transform="translate(280,200)">
    <rect x="-25" y="0" width="50" height="40" fill="none" stroke="#1f2937" stroke-width="2"/>
    <circle cx="0" cy="-30" r="18" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="10" stroke="#1f2937" stroke-width="2"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#1f2937" stroke-width="2"/>
    <line x1="-12" y1="25" x2="-12" y2="45" stroke="#1f2937" stroke-width="2"/>
    <line x1="12" y1="25" x2="12" y2="45" stroke="#1f2937" stroke-width="2"/>
  </g>
  <!-- Three marriage cords to wives -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- Kosala (left) -->
    <path d="M255,200 Q150,150 80,120"/>
    <circle cx="80" cy="120" r="14" stroke="#1f2937" stroke-width="2"/>
    <line x1="70" y1="134" x2="70" y2="155" stroke="#1f2937" stroke-width="2"/>
    <line x1="60" y1="140" x2="80" y2="140" stroke="#1f2937" stroke-width="2"/>
    <line x1="80" y1="155" x2="70" y2="170" stroke="#1f2937" stroke-width="2"/>
    <line x1="80" y1="155" x2="90" y2="170" stroke="#1f2937" stroke-width="2"/>
    <!-- Vrijji/Lichchhavi (top-center) -->
    <path d="M280,170 Q280,80 280,40"/>
    <circle cx="280" cy="40" r="14" stroke="#1f2937" stroke-width="2"/>
    <line x1="270" y1="54" x2="270" y2="75" stroke="#1f2937" stroke-width="2"/>
    <line x1="260" y1="60" x2="280" y2="60" stroke="#1f2937" stroke-width="2"/>
    <line x1="280" y1="75" x2="270" y2="90" stroke="#1f2937" stroke-width="2"/>
    <line x1="280" y1="75" x2="290" y2="90" stroke="#1f2937" stroke-width="2"/>
    <!-- Madra (right) -->
    <path d="M305,200 Q410,150 480,120"/>
    <circle cx="480" cy="120" r="14" stroke="#1f2937" stroke-width="2"/>
    <line x1="470" y1="134" x2="470" y2="155" stroke="#1f2937" stroke-width="2"/>
    <line x1="460" y1="140" x2="480" y2="140" stroke="#1f2937" stroke-width="2"/>
    <line x1="480" y1="155" x2="470" y2="170" stroke="#1f2937" stroke-width="2"/>
    <line x1="480" y1="155" x2="490" y2="170" stroke="#1f2937" stroke-width="2"/>
  </g>
  <!-- Anga conquest: river, port Champa, arrow -->
  <g stroke="#1f2937" stroke-width="2">
    <!-- Ganga river -->
    <path d="M400,280 Q450,260 500,240 Q540,220 560,200" fill="none"/>
    <!-- Champa port (boats) -->
    <g transform="translate(500,230)">
      <path d="M0,0 L20,-5 L20,5 Z" fill="none" stroke="#1f2937" stroke-width="1.5"/>
      <path d="M30,0 L50,-5 L50,5 Z" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    </g>
    <!-- Conquest arrow from Bimbisara to Anga -->
    <path d="M305,210 Q380,230 450,240" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937"/>
      </marker>
    </defs>
    <!-- Iron/copper mine symbols -->
    <g transform="translate(520,210)">
      <rect x="0" y="0" width="12" height="12" fill="none" stroke="#1f2937" stroke-width="1.5"/>
      <line x1="3" y1="3" x2="9" y2="9" stroke="#1f2937" stroke-width="1.5"/>
      <line x1="9" y1="3" x2="3" y2="9" stroke="#1f2937" stroke-width="1.5"/>
    </g>
  </g>
  <!-- Nine Ratnas (council) as small gems around throne -->
  <g fill="#1f2937">
    <circle cx="240" cy="215" r="4"/>
    <circle cx="260" cy="215" r="4"/>
    <circle cx="280" cy="215" r="4"/>
    <circle cx="300" cy="215" r="4"/>
    <circle cx="320" cy="215" r="4"/>
    <circle cx="250" cy="235" r="4"/>
    <circle cx="270" cy="235" r="4"/>
    <circle cx="290" cy="235" r="4"/>
    <circle cx="310" cy="235" r="4"/>
  </g>
  <!-- Labels -->
  <text x="280" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f2937">Bimbisara</text>
  <text x="80" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Kosala</text>
  <text x="280" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Vrijji</text>
  <text x="480" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Madra</text>
  <text x="520" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Anga</text>
  <text x="520" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Champa</text>
  <text x="280" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">Nine Ratnas</text>
  <text x="280" y="295" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2937">Rajgir Hills</text>
  <!-- Caption strip -->
  <rect x="0" y="295" width="560" height="25" fill="#1f2937"/>
  <text x="280" y="312" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbf7ec">4. Mahajanapadas &amp; Rise of Magadha</text>
</svg></div>

<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">

  <rect x="250" y="40" width="60" height="220" fill="none" stroke="#1f2937" stroke-width="4"/>

  <rect x="265" y="30" width="30" height="10" fill="#1f2937"/>

  <g stroke="#1f2937" stroke-width="3" fill="none">
    <circle cx="200" cy="100" r="14"/>
    <path d="M214 100 L250 100"/>
    <circle cx="360" cy="140" r="14"/>

<h1>The Evolution of Kannada Drama: From Yakshagana to Modern Experimental Theatre</h1>
<p class="meta">Kannada Literature Paper I: History &amp;amp; Movements · <a href="/upsc/course/opt-kannada/lesson-paper1">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Central evolving stage metaphor -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Stage 1: Yakshagana open ground (left) -->
    <path d="M30 180 L120 180" stroke-width="4"/>
    <circle cx="75" cy="150" r="20"/>
    <path d="M75 170 L75 210"/>
    <path d="M55 185 L75 200 L95 185"/>
    <path d="M75 130 L60 100 L90 100"/>
    <text x="75" y="80" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#1f2937">Yakshagana Sutradhara</text>
    <!-- Arrow to next -->
    <path d="M130 180 L160 180" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Stage 2: Mysore proscenium -->
    <rect x="170" y="130" width="80" height="60" stroke-width="3"/>
    <line x1="170" y1="160" x2="250" y2="160" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="210" cy="145" r="12"/>
    <path d="M210 157 L210 180"/>
    <path d="M195 165 L210 175 L225 165"/>
    <text x="210" y="115" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1f2937">Mysore Court Natya</text>
    <!-- Arrow -->
    <path d="M260 160 L290 160" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Stage 3: Company theatre tent -->
    <path d="M300 190 L300 130 L360 100 L420 130 L420 190 Z" fill="none"/>
    <circle cx="360" cy="150" r="14"/>
    <path d="M360 164 L360 190"/>
    <path d="M345 175 L360 185 L375 175"/>
    <text x="360" y="85" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1f2937">Company Theatre</text>
    <!-- Arrow up to modern -->
    <path d="M360 100 L360 70" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Stage 4: Modern experimental (center top) -->
    <rect x="320" y="30" width="80" height="40" stroke-width="3"/>
    <line x1="320" y1="50" x2="400" y2="50" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="360" cy="45" r="10"/>
    <path d="M360 55 L360 65"/>
    <path d="M350 60 L360 65 L370 60"/>
    <text x="360" y="20" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1f2937">Modern Experimental</text>
    <!-- Arrow down to alternative -->
    <path d="M360 70 L360 100" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Stage 5: Street theatre (bottom center) -->
    <path d="M320 230 L400 230" stroke-width="4"/>
    <circle cx="360" cy="210" r="16"/>
    <path d="M360 226 L360 250"/>
    <path d="M344 240 L360 250 L376 240"/>
    <rect x="335" y="255" width="50" height="18" stroke-width="2"/>
    <text x="360" y="285" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1f2937">Alternative Theatre</text>
  </g>
  <!-- Supporting corner images -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <!-- Top-left: Traditional Yakshagana mask/costume -->
    <ellipse cx="80" cy="60" rx="25" ry="30"/>

    <circle cx="72" cy="55" r="3"/>
    <circle cx="88" cy="55" r="3"/>
    <path d="M70 70 Q80 75 90 70"/>

    <path d="M480 40 L480 100 L520 100 L520 40" stroke-width="3"/>
    <line x1="480" y1="65" x2="520" y2="65" stroke-width="1.5" stroke-dasharray="3,2"/>
    <!-- Bottom-left: Street theatre banner -->
    <path d="M40 240 L100 240" stroke-width="3"/>
    <rect x="50" y="200" width="60" height="35" stroke-width="2"/>
    <line x1="55" y1="215" x2="95" y2="215" stroke-width="1"/>
    <line x1="55" y1="225" x2="95" y2="225" stroke-width="1"/>
    <!-- Bottom-right: Ninasam/Ranga Shankara building -->
    <rect x="450" y="220" width="80" height="70" stroke-width="2.5"/>
    <rect x="465" y="235" width="20" height="30" stroke-width="1.5"/>
    <rect x="495" y="235" width="20" height="30" stroke-width="1.5"/>
    <path d="M450 220 L490 200 L530 220" stroke-width="2.5" fill="none"/>
  </g>
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">

    </marker>
  </defs>

  <rect x="14" y="290" width="532" height="26" fill="#1f2937" rx="3"/>

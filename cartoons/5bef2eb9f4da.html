<h1>3. Union Executive and Legislature</h1>

<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">

  <g transform="translate(80,60)">

  </g>

    <text x="0" y="70" text-anchor="middle" font-size="10" font-family="Georgia,serif" fill="#1f2937">Article 74</text>

    <text x="-80" y="60" text-anchor="middle" font-size="10" font-family="Georgia,serif" fill="#1f2937">States Council</text>

  </g>
  <!-- Accountability arrow -->
  <path d="M450 220 Q480 250 380 250 Q300 250 270 190" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">

    </marker>

  <text x="420" y="260" text-anchor="middle" font-size="11" font-family="Georgia,serif" fill="#1f2937">Collective Responsibility</text>

  <g transform="translate(50,200)">
    <rect x="0" y="0" width="20" height="20" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="5" y1="10" x2="15" y2="10" stroke="#1f2937" stroke-width="2"/>

    <path d="M5 70 L15 70" stroke="#1f2937" stroke-width="2"/>
    <line x1="10" y1="65" x2="10" y2="75" stroke="#1f2937" stroke-width="2"/>
    <text x="25" y="75" font-size="10" font-family="Georgia,serif" fill="#1f2937">Absolute Veto</text>
  </g>

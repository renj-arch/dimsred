<h1>5. Buddhism and Jainism (6th Century BCE)</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>

  <circle cx="280" cy="140" r="80" stroke="#1f2937" stroke-width="3" fill="none"/>

    <line x1="280" y1="60" x2="280" y2="220"/>

    <circle cx="315" cy="175" r="3" fill="#1f2937"/> <!-- hand -->

  <g transform="translate(280,60)">

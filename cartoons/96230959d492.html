<h1>Atmospheric Circulation and Global Climate Systems</h1>
<p class="meta">World Physical Geography: Landforms, Climate and Oceans · <a href="/upsc/course/mains-gs1/lesson-geography-world-physical">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Sun -->
  <circle cx="80" cy="160" r="35" fill="none" stroke="#1f2937" stroke-width="3"/>
  <g stroke="#1f2937" stroke-width="2">
    <line x1="80" y1="100" x2="80" y2="80"/>
    <line x1="80" y1="220" x2="80" y2="240"/>
    <line x1="20" y1="160" x2="40" y2="160"/>
    <line x1="120" y1="160" x2="140" y2="160"/>
    <line x1="45" y1="125" x2="30" y2="110"/>
    <line x1="115" y1="195" x2="130" y2="210"/>
    <line x1="45" y1="195" x2="30" y2="210"/>
    <line x1="115" y1="125" x2="130" y2="110"/>
  </g>
  <text x="80" y="165" text-anchor="middle" font-size="14" fill="#1f2937" font-family="sans-serif">Sun</text>
  <!-- Solar rays to Earth -->
  <g stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6">
    <line x1="115" y1="160" x2="170" y2="100"/>
    <line x1="115" y1="160" x2="170" y2="160"/>
    <line x1="115" y1="160" x2="170" y2="220"/>
  </g>
  <!-- Earth circle -->
  <circle cx="280" cy="160" r="110" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Latitude lines -->
  <g stroke="#1f2937" stroke-width="1" stroke-dasharray="2,4">
    <line x1="170" y1="160" x2="390" y2="160"/> <!-- Equator -->
    <line x1="185" y1="105" x2="375" y2="105"/> <!-- 30N -->
    <line x1="185" y1="215" x2="375" y2="215"/> <!-- 30S -->
    <line x1="205" y1="65" x2="355" y2="65"/>   <!-- 60N -->
    <line x1="205" y1="255" x2="355" y2="255"/> <!-- 60S -->
  </g>
  <!-- Hadley Cell (NH) -->
  <path d="M280,160 C340,160 340,105 280,105 C220,105 220,160 280,160" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Hadley Cell (SH) -->
  <path d="M280,160 C340,160 340,215 280,215 C220,215 220,160 280,160" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Ferrel Cell (NH) -->
  <path d="M280,105 C340,105 340,65 280,65 C220,65 220,105 280,105" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Ferrel Cell (SH) -->
  <path d="M280,215 C340,215 340,255 280,255 C220,255 220,215 280,215" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Polar Cell (NH) -->
  <path d="M280,65 C320,65 320,50 280,50 C240,50 240,65 280,65" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Polar Cell (SH) -->
  <path d="M280,255 C320,255 320,270 280,270 C240,270 240,255 280,255" fill="none" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Surface wind arrows -->
  <g stroke="#1f2937" stroke-width="2" fill="#1f2937">
    <!-- Trade winds NH (equatorward) -->
    <path d="M390,140 L350,150" marker-end="url(#arrow)"/>
    <path d="M390,130 L350,140" marker-end="url(#arrow)"/>
    <!-- Trade winds SH -->
    <path d="M390,180 L350,170" marker-end="url(#arrow)"/>
    <path d="M390,190 L350,180" marker-end="url(#arrow)"/>
    <!-- Westerlies NH (poleward) -->
    <path d="M375,105 L335,95" marker-end="url(#arrow)"/>
    <path d="M375,115 L335,105" marker-end="url(#arrow)"/>
    <!-- Westerlies SH -->
    <path d="M375,215 L335,225" marker-end="url(#arrow)"/>
    <path d="M375,205 L335,215" marker-end="url(#arrow)"/>
    <!-- Polar easterlies NH (equatorward) -->
    <path d="M355,65 L315,75" marker-end="url(#arrow)"/>
    <path d="M355,55 L315,65" marker-end="url(#arrow)"/>
    <!-- Polar easterlies SH -->
    <path d="M355,255 L315,245" marker-end="url(#arrow)"/>
    <path d="M355,265 L315,255" marker-end="url(#arrow)"/>
  </g>
  <!-- Pressure labels -->
  <g font-size="13" fill="#1f2937" font-family="sans-serif" font-weight="bold">
    <text x="280" y="155" text-anchor="middle">ITCZ</text>

    <text x="280" y="260" text-anchor="middle">Subpolar Low</text>
    <text x="280" y="45" text-anchor="middle">Polar High</text>
    <text x="280" y="275" text-anchor="middle">Polar High</text>
  </g>
  <!-- Wind labels -->
  <g font-size="12" fill="#1f2937" font-family="sans-serif">
    <text x="400" y="135" text-anchor="start">Trade Winds</text>
    <text x="400" y="195" text-anchor="start">Trade Winds</text>
    <text x="385" y="90" text-anchor="start">Westerlies</text>
    <text x="385" y="230" text-anchor="start">Westerlies</text>
    <text x="365" y="50" text-anchor="start">Polar Easterlies</text>
    <text x="365" y="280" text-anchor="start">Polar Easterlies</text>
  </g>
  <!-- Cell labels -->
  <g font-size="12" fill="#1f2937" font-family="sans-serif" font-style="italic">
    <text x="280" y="130" text-anchor="middle">Hadley Cell</text>
    <text x="280" y="85" text-anchor="middle">Ferrel Cell</text>
    <text x="280" y="235" text-anchor="middle">Ferrel Cell</text>
    <text x="280" y="55" text-anchor="middle">Polar Cell</text>
    <text x="280" y="265" text-anchor="middle">Polar Cell</text>
  </g>
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <!-- Caption strip -->
  <rect x="0" y="280" width="560" height="40" fill="#1f2937"/>
  <text x="280" y="305" text-anchor="middle" fill="#fbf7ec" font-size="16" font-family="sans-serif" font-weight="bold">Atmospheric Circulation and Global Climate Systems</text>

<h1>The Chief Minister and the State Council of Ministers</h1>
<p class="meta">Federalism: Centre-State Relations and Devolution · <a href="/upsc/course/mains-gs2/lesson-federalism">Read the lesson →</a></p>
<div class="hero"><svg viewBox='0 0 560 320' xmlns='http://www.w3.org/2000/svg'>
  <rect width='560' height='320' fill='#fbf7ec'/>
  <!-- Left pillar: Governor -->
  <line x1='80' y1='260' x2='80' y2='100' stroke='#1f2937' stroke-width='6' stroke-linecap='round'/>
  <circle cx='80' cy='100' r='30' fill='none' stroke='#1f2937' stroke-width='4'/>
  <ellipse cx='80' cy='140' rx='35' ry='25' fill='none' stroke='#1f2937' stroke-width='3'/>
  <text x="80" y="290" text-anchor='middle' font-family='Georgia,serif' font-size='16' fill='#1f2937'>Governor</text>
  <text x="80" y="60" text-anchor='middle' font-family='Georgia,serif' font-size='13' fill='#1f2937'>Constitutional Head</text>
  <!-- Right pillar: Legislative Assembly -->
  <line x1='480' y1='260' x2='480' y2='100' stroke='#1f2937' stroke-width='6' stroke-linecap='round'/>
  <path d='M445,100 L480,60 L515,100' fill='none' stroke='#1f2937' stroke-width='4' stroke-linejoin='round'/>
  <rect x='445' y='100' width='70' height='40' fill='none' stroke='#1f2937' stroke-width='3'/>
  <rect x='450' y='110' width='15' height='20' fill='none' stroke='#1f2937' stroke-width='1.5'/>
  <rect x='485' y='110' width='15' height='20' fill='none' stroke='#1f2937' stroke-width='1.5'/>
  <text x="466" y="290" text-anchor='middle' font-family='Georgia,serif' font-size='16' fill='#1f2937'>Legislative Assembly</text>
  <text x="471.8" y="60" text-anchor='middle' font-family='Georgia,serif' font-size='13' fill='#1f2937'>Confidence / Floor Test</text>
  <!-- Arch curve -->
  <path d='M80,100 Q280,40 480,100' fill='none' stroke='#1f2937' stroke-width='5' stroke-linecap='round'/>
  <!-- Keystone: Chief Minister -->
  <polygon points='280,50 310,95 250,95' fill='#1f2937'/>
  <circle cx='280' cy='40' r='18' fill='#fbf7ec' stroke='#1f2937' stroke-width='4'/>
  <ellipse cx='280' cy='75' rx='22' ry='18' fill='none' stroke='#1f2937' stroke-width='3'/>
  <text x="280" y="130" text-anchor='middle' font-family='Georgia,serif' font-size='18' font-weight='bold' fill='#1f2937'>Chief Minister</text>
  <text x="280" y="162.5" text-anchor='middle' font-family='Georgia,serif' font-size='13' fill='#1f2937'>Real Executive Head</text>
  <text x="280" y="30" text-anchor='middle' font-family='Georgia,serif' font-size='12' fill='#1f2937'>Article 163/164</text>
  <!-- Council of Ministers below keystone -->
  <g font-family='Georgia,serif' font-size='12' fill='#1f2937'>
    <circle cx='200' cy='190' r='14' stroke='#1f2937' stroke-width='2' fill='none'/>
    <circle cx='280' cy='185' r='16' stroke='#1f2937' stroke-width='2' fill='none'/>
    <circle cx='360' cy='190' r='14' stroke='#1f2937' stroke-width='2' fill='none'/>
    <circle cx='160' cy='210' r='12' stroke='#1f2937' stroke-width='1.5' fill='none'/>
    <circle cx='400' cy='210' r='12' stroke='#1f2937' stroke-width='1.5' fill='none'/>
  </g>
  <text x="280" y="240" text-anchor='middle' font-family='Georgia,serif' font-size='15' fill='#1f2937'>Council of Ministers</text>
  <text x="280" y="260" text-anchor='middle' font-family='Georgia,serif' font-size='12' fill='#1f2937'>15% Cap (91st Amendment)</text>
  <!-- Arrows -->
  <!-- Governor -> CM (appointment) -->
  <path d='M110,110 Q200,80 260,60' fill='none' stroke='#1f2937' stroke-width='2.5' stroke-dasharray='6,4' marker-end='url(#arrow)'/>
  <text x="180" y="70" text-anchor='middle' font-family='Georgia,serif' font-size='11' fill='#1f2937'>Appoints</text>
  <!-- Assembly -> CM (confidence) -->
  <path d='M450,110 Q360,80 300,60' fill='none' stroke='#1f2937' stroke-width='2.5' stroke-dasharray='6,4' marker-end='url(#arrow)'/>
  <text x="380" y="70" text-anchor='middle' font-family='Georgia,serif' font-size='11' fill='#1f2937'>Confidence</text>
  <!-- CM -> Cabinet (leads) -->
  <path d='M280,95 L280,170' fill='none' stroke='#1f2937' stroke-width='3' marker-end='url(#arrow)'/>
  <text x="300" y="146.3" text-anchor='start' font-family='Georgia,serif' font-size='11' fill='#1f2937'>Chairs / Allocates</text>
  <!-- CM -> Governor (Art 167) -->
  <path d='M250,95 Q180,110 110,130' fill='none' stroke='#1f2937' stroke-width='2' stroke-dasharray='4,3' marker-end='url(#arrow)'/>
  <text x="160" y="115" text-anchor='middle' font-family='Georgia,serif' font-size='10' fill='#1f2937'>Art. 167: Communicates</text>

  <defs>
    <marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'>
      <path d='M0,0 L0,6 L9,3 Z' fill='#1f2937'/>
    </marker>
  </defs>

  <text x="280" y="275" text-anchor='middle' font-family='Georgia,serif' font-size='11' font-style='italic' fill='#1f2937'>S.R. Bommai: Floor test is proper test</text>

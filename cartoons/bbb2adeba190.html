<h1>11. Delhi Sultanate (1206-1526 CE)</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Ground -->
  <path d="M0,240 Q280,230 560,240 L560,320 L0,320 Z" fill="none" stroke="#1f2937" stroke-width="2"/>
  <!-- Arrow from Ghazni -->
  <path d="M40,40 L200,180" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <!-- 5 invasion marks -->
  <g stroke="#1f2937" stroke-width="2">
    <line x1="60" y1="60" x2="60" y2="70"/>
    <line x1="90" y1="80" x2="90" y2="90"/>
    <line x1="120" y1="100" x2="120" y2="110"/>
    <line x1="150" y1="120" x2="150" y2="130"/>
    <line x1="180" y1="140" x2="180" y2="150"/>
  </g>
  <!-- First Tarain 1191 (left) -->
  <g transform="translate(60,180)">
    <!-- Rajput charge -->
    <g stroke="#1f2937" stroke-width="2.5" fill="none">
      <path d="M0,0 Q-10,-30 -20,-40"/> <!-- lance -->
      <ellipse cx="-25" cy="-10" rx="8" ry="6"/> <!-- horse -->
      <circle cx="-25" cy="-22" r="5"/> <!-- rider -->
      <path d="M-30,-20 L-35,-30"/> <!-- arm -->
    </g>
    <g transform="translate(-40,0)" stroke="#1f2937" stroke-width="2.5" fill="none">
      <path d="M0,0 Q-10,-30 -20,-40"/>
      <ellipse cx="-25" cy="-10" rx="8" ry="6"/>
      <circle cx="-25" cy="-22" r="5"/>
      <path d="M-30,-20 L-35,-30"/>
    </g>
    <g transform="translate(-80,0)" stroke="#1f2937" stroke-width="2.5" fill="none">
      <path d="M0,0 Q-10,-30 -20,-40"/>
      <ellipse cx="-25" cy="-10" rx="8" ry="6"/>
      <circle cx="-25" cy="-22" r="5"/>
      <path d="M-30,-20 L-35,-30"/>
    </g>
    <!-- Ghori retreating -->
    <g transform="translate(40,0)" stroke="#1f2937" stroke-width="2.5" fill="none">
      <ellipse cx="0" cy="-10" rx="8" ry="6"/>
      <circle cx="0" cy="-22" r="5"/>
      <path d="M5,-15 Q20,-5 30,0"/> <!-- bow -->
      <path d="M0,-10 L10,-20 L20,-10"/> <!-- fleeing -->
    </g>
  </g>
  <!-- Second Tarain 1192 (right) -->
  <g transform="translate(380,180)">
    <!-- Five divisions -->
    <g stroke="#1f2937" stroke-width="2" fill="none">
      <rect x="-120" y="-50" width="40" height="40"/>
      <rect x="-70" y="-50" width="40" height="40"/>
      <rect x="-20" y="-50" width="40" height="40"/>
      <rect x="30" y="-50" width="40" height="40"/>
      <rect x="80" y="-50" width="40" height="40"/>
      <!-- division dots -->
      <g fill="#1f2937">
        <circle cx="-100" cy="-30" r="1.5"/>
        <circle cx="-90" cy="-30" r="1.5"/>
        <circle cx="-50" cy="-30" r="1.5"/>
        <circle cx="-40" cy="-30" r="1.5"/>
        <circle cx="0" cy="-30" r="1.5"/>
        <circle cx="10" cy="-30" r="1.5"/>
        <circle cx="50" cy="-30" r="1.5"/>
        <circle cx="60" cy="-30" r="1.5"/>
        <circle cx="100" cy="-30" r="1.5"/>
        <circle cx="110" cy="-30" r="1.5"/>
      </g>
    </g>
    <!-- Ghori leading -->
    <g transform="translate(-140,0)" stroke="#1f2937" stroke-width="2.5" fill="none">
      <ellipse cx="0" cy="-10" rx="8" ry="6"/>
      <circle cx="0" cy="-22" r="5"/>
      <path d="M5,-15 Q15,-25 25,-20"/> <!-- pointing forward -->
    </g>
    <!-- False embassy scroll -->
    <g transform="translate(0,30)" stroke="#1f2937" stroke-width="1.5" fill="none">
      <rect x="130" y="-40" width="30" height="20" rx="2"/>
      <line x1="145" y1="-40" x2="145" y2="-20"/>
    </g>
    <!-- Rajputs surprised -->
    <g transform="translate(180,0)" stroke="#1f2937" stroke-width="2" fill="none">
      <ellipse cx="0" cy="-10" rx="8" ry="6"/>
      <circle cx="0" cy="-22" r="5"/>
      <path d="M-5,-15 L-15,-25"/> <!-- raised hand -->
      <path d="M5,-15 L15,-25"/>
    </g>
  </g>
  <!-- Crown at Delhi -->
  <g transform="translate(280,100)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <path d="M-15,0 L-15,-25 L-5,-10 L5,-25 L15,-10 L15,0 Z"/>
    <circle cx="0" cy="-30" r="4"/>
  </g>
  <!-- Labels -->
  <text x="40" y="35" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Ghazni</text>
  <text x="120" y="170" font-family="sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">5 Invasions</text>
  <text x="100" y="280" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">First Tarain 1191</text>
  <text x="420" y="280" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Second Tarain 1192</text>
  <text x="280" y="90" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">Delhi Sultanate</text>
  <text x="280" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">From Raid to Rule</text>
  <text x="80" y="140" font-family="sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">Prithviraj Chauhan</text>
  <text x="480" y="140" font-family="sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">Muhammad Ghori</text>
  <!-- Caption strip -->
  <rect x="0" y="290" width="560" height="30" fill="#1f2937"/>
  <text x="280" y="310" font-family="sans-serif" font-size="12" fill="#fbf7ec" text-anchor="middle">11. Delhi Sultanate (1206-1526 CE)</text>
</svg></div>

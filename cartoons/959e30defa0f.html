<h1>Plate Tectonics and the Dynamic Earth</h1>
<p class="meta">World Physical Geography: Landforms, Climate and Oceans · <a href="/upsc/course/mains-gs1/lesson-geography-world-physical">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Simplified world map with plate boundaries -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- Continents outlines -->
    <path d="M80,120 Q100,100 130,110 Q150,130 140,160 Q120,180 90,170 Q70,150 80,120" fill="#e8e0d0"/> <!-- North America -->
    <path d="M200,80 Q230,70 260,85 Q280,110 270,140 Q250,160 220,150 Q200,130 200,80" fill="#e8e0d0"/> <!-- Eurasia -->
    <path d="M210,160 Q240,150 270,170 Q280,200 260,230 Q230,250 200,240 Q180,220 210,160" fill="#e8e0d0"/> <!-- Africa -->
    <path d="M130,240 Q150,230 170,245 Q180,270 160,290 Q130,300 110,280 Q100,260 130,240" fill="#e8e0d0"/> <!-- South America -->
    <path d="M320,180 Q350,170 380,190 Q390,220 370,250 Q340,270 310,260 Q290,240 320,180" fill="#e8e0d0"/> <!-- Indo-Australian -->
    <path d="M400,100 Q430,90 460,110 Q470,140 450,170 Q420,190 390,180 Q370,150 400,100" fill="#e8e0d0"/> <!-- Pacific (ocean, but plate) -->
    <!-- Antarctica bottom -->
    <path d="M100,290 Q200,280 300,290 Q350,300 400,290 Q450,280 500,290 Q520,310 480,320 Q80,320 100,290" fill="#e8e0d0"/>
  </g>
  <!-- Plate boundaries as thick lines -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Divergent: Mid-Atlantic Ridge -->
    <path d="M130,120 Q150,150 140,200 Q130,250 120,290" stroke-dasharray="8,4"/>
    <!-- Convergent: Andes / Himalayas / Japan -->
    <path d="M130,240 Q160,230 190,220 Q220,210 250,200" stroke-linecap="round"/>
    <path d="M270,140 Q300,150 330,170 Q360,190 380,210" stroke-linecap="round"/>
    <!-- Transform: San Andreas -->
    <path d="M80,160 Q100,150 120,140" stroke-dasharray="4,4"/>
  </g>
  <!-- Movement arrows -->
  <g fill="#1f2937" stroke="#1f2937" stroke-width="2">
    <!-- Divergent arrows apart -->
    <polygon points="135,150 125,155 125,145"/>
    <polygon points="145,150 155,155 155,145"/>
    <polygon points="135,220 125,225 125,215"/>
    <polygon points="145,220 155,225 155,215"/>
    <!-- Convergent arrows together -->
    <polygon points="200,210 210,205 210,215"/>
    <polygon points="240,200 230,195 230,205"/>
    <polygon points="350,180 360,175 360,185"/>
    <polygon points="390,200 380,195 380,205"/>
    <!-- Transform arrows sliding -->
    <polygon points="90,150 95,140 95,160"/>
    <polygon points="110,145 105,135 105,155"/>
  </g>
  <!-- Boundary type icons and labels -->
  <g font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">
    <!-- Divergent label -->
    <text x="140" y="100">Divergent Boundary</text>
    <text x="140" y="115">Mid-Ocean Ridge</text>
    <!-- Convergent labels -->
    <text x="220" y="190">Convergent Boundary</text>
    <text x="220" y="205">Subduction Zone</text>
    <text x="370" y="160">Fold Mountains</text>
    <text x="370" y="175">Volcanic Arc</text>
    <!-- Transform label -->
    <text x="100" y="130">Transform Boundary</text>
    <text x="100" y="145">Strike-Slip Fault</text>
  </g>
  <!-- Plate labels -->
  <g font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="bold">
    <text x="100" y="162.7">N. American</text>
    <text x="240" y="132.7">Eurasian</text>
    <text x="240" y="222.7">African</text>
    <text x="150" y="270">S. American</text>
    <text x="350" y="230">Indo-Australian</text>
    <text x="420" y="140">Pacific</text>
    <text x="280" y="305">Antarctic</text>
  </g>
  <!-- Mantle convection hint -->
  <g stroke="#1f2937" stroke-width="1.5" stroke-dasharray="3,3" fill="none" opacity="0.6">
    <path d="M50,300 Q150,250 250,300"/>
    <path d="M250,300 Q350,250 450,300"/>
    <path d="M450,300 Q500,250 550,300"/>
  </g>
  <text x="280" y="288.1" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle" opacity="0.6">Mantle Convection</text>
  <!-- Caption strip -->
  
  
</svg></div>

<h1>The 1979 Official Language Act and Its Literary Consequences</h1>
<p class="meta">Manipuri Literature Paper I: History &amp;amp; Movements · <a href="/upsc/course/opt-manipuri/lesson-paper1">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background margin respected by all elements -->
  
  <!-- Central metaphor: bifurcated book -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Book cover -->
    <path d="M180 90 L380 90 L380 250 L180 250 Z"/>
    <!-- Spine split -->
    <line x1="280" y1="90" x2="280" y2="250" stroke-dasharray="8,4"/>
    <!-- Left pages: Bengali script suggestion (curvy lines) -->
    <path d="M200 120 Q220 115 240 120 Q260 125 270 120" stroke-width="2"/>
    <path d="M200 150 Q220 145 240 150 Q260 155 270 150" stroke-width="2"/>
    <path d="M200 180 Q220 175 240 180 Q260 185 270 180" stroke-width="2"/>
    <!-- Right pages: Meitei Mayek suggestion (angular lines) -->
    <path d="M310 120 L330 110 L350 120 L370 110" stroke-width="2"/>
    <path d="M310 150 L330 140 L350 150 L370 140" stroke-width="2"/>
    <path d="M310 180 L330 170 L350 180 L370 170" stroke-width="2"/>
  </g>
  
  <!-- 1979 Language Act gavel above book -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <path d="M260 60 L300 60 L300 40 L260 40 Z"/> <!-- gavel head -->
    <line x1="280" y1="60" x2="280" y2="80"/> <!-- handle -->
    <text x="280" y="35" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#1f2937">1979 Language Act</text>
  </g>
  
  <!-- Publishing house top-left -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <rect x="60" y="40" width="80" height="60" rx="3"/>
    <line x1="65" y1="55" x2="135" y2="55"/>
    <line x1="65" y1="70" x2="135" y2="70"/>
    <line x1="65" y1="85" x2="135" y2="85"/>
    <path d="M100 40 L100 20 L110 20 L110 40"/> <!-- chimney -->
    <text x="100" y="110" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1f2937">State Publishing</text>
  </g>
  
  <!-- Hill district resistance left -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Three simple figures with distinct headgear -->
    <circle cx="80" cy="220" r="10"/> <!-- head -->
    <path d="M70 210 L80 195 L90 210"/> <!-- Tangkhul-style headgear -->
    <line x1="80" y1="230" x2="80" y2="260"/> <!-- body -->
    <line x1="80" y1="240" x2="60" y2="255"/> <!-- arm -->
    <line x1="80" y1="240" x2="100" y2="255"/> <!-- arm -->
    
    <circle cx="120" cy="220" r="10"/>
    <path d="M110 210 L120 195 L130 210 L120 205 Z"/> <!-- Thadou-style -->
    <line x1="120" y1="230" x2="120" y2="260"/>
    <line x1="120" y1="240" x2="100" y2="255"/>
    <line x1="120" y1="240" x2="140" y2="255"/>
    
    <circle cx="160" cy="220" r="10"/>
    <ellipse cx="160" cy="200" rx="15" ry="5"/> <!-- Hmar-style -->
    <line x1="160" y1="230" x2="160" y2="260"/>
    <line x1="160" y1="240" x2="140" y2="255"/>
    <line x1="160" y1="240" x2="180" y2="255"/>
    
    <text x="120" y="185" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1f2937">Hill Resistance</text>
  </g>
  
  <!-- Young writer code-switching right -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <circle cx="480" cy="220" r="10"/>
    <line x1="480" y1="230" x2="480" y2="260"/>
    <line x1="480" y1="240" x2="460" y2="250"/> <!-- left arm writing -->
    <line x1="480" y1="240" x2="500" y2="250"/> <!-- right arm -->
    <!-- Pen writing both scripts -->
    <path d="M460 250 L450 240 L440 250" stroke-width="2"/> <!-- Bengali curve -->
    <path d="M500 250 L510 240 L520 250 L530 240" stroke-width="2"/> <!-- Mayek angular -->
    <text x="480" y="185" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1f2937">Code-Switching</text>
  </g>
  
  <!-- Sahitya Akademi award bottom-center -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <circle cx="280" cy="270" r="20"/>
    <circle cx="280" cy="270" r="12"/>
    <text x="280" y="268" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#1f2937">SA</text>
    <path d="M260 290 L280 300 L300 290"/> <!-- ribbon -->
    <text x="280" y="240" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1f2937">Sahitya Akademi</text>
  </g>
  
  <!-- Script labels beside book -->
  <text x="160" y="160" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#1f2937">Bengali Script</text>
  <text x="400" y="160" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#1f2937">Meitei Mayek</text>
  
  <!-- Bottom caption strip -->
  <rect x="14" y="290" width="532" height="16" fill="#1f2937"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#fbf7ec">
    The 1979 Official Language Act and Its Literary Consequences
  </text>
</svg></div>

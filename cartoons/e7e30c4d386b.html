<h1>3.6 Napoleon: From Consulate to Empire (1799-1815)</h1>
<p class="meta">World History · <a href="/upsc/course/gs/lesson-world-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Left: Colonial Saint-Domingue -->
  <rect x="20" y="40" width="160" height="120" fill="none" stroke="#1f2937" stroke-width="3"/>
  <text x="100" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Saint-Domingue</text>
  <path d="M40 100 Q100 60 160 100" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 110 Q100 80 140 110" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 120 Q100 95 120 120" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="70" r="18" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="100" y1="88" x2="100" y2="130" stroke="#1f2937" stroke-width="3"/>
  <line x1="70" y1="105" x2="130" y2="105" stroke="#1f2937" stroke-width="3"/>
  <line x1="85" y1="140" x2="115" y2="140" stroke="#1f2937" stroke-width="3"/>
  <text x="100" y="175" text-anchor="middle" font-size="11" fill="#1f2937">500,000 enslaved</text>
  <text x="100" y="190" text-anchor="middle" font-size="11" fill="#1f2937">Sugar &amp; Coffee</text>

  <!-- Central: Breaking Chain -->
  <g transform="translate(220, 100)">
    <!-- Chain links breaking -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="none" stroke="#1f2937" stroke-width="5"/>
    <ellipse cx="50" cy="0" rx="22" ry="14" fill="none" stroke="#1f2937" stroke-width="5"/>
    <ellipse cx="100" cy="0" rx="22" ry="14" fill="none" stroke="#1f2937" stroke-width="5"/>
    <ellipse cx="150" cy="0" rx="22" ry="14" fill="none" stroke="#1f2937" stroke-width="5"/>
    <!-- Broken link -->
    <path d="M195 -10 Q215 0 195 10" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
    <path d="M225 -10 Q245 0 225 10" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
    <!-- Links transforming to birds -->
    <path d="M260 0 Q280 -20 300 0 Q280 20 260 0" fill="none" stroke="#1f2937" stroke-width="4"/>
    <path d="M310 0 Q330 -25 350 0 Q330 25 310 0" fill="none" stroke="#1f2937" stroke-width="4"/>
    <path d="M360 0 Q380 -15 400 0 Q380 15 360 0" fill="none" stroke="#1f2937" stroke-width="4"/>
    <!-- Toussaint breaking chain -->
    <circle cx="-10" cy="-60" r="16" fill="none" stroke="#1f2937" stroke-width="3"/>
    <line x1="-10" y1="-44" x2="-10" y2="-10" stroke="#1f2937" stroke-width="3"/>
    <line x1="-30" y1="-30" x2="10" y2="-30" stroke="#1f2937" stroke-width="3"/>
    <line x1="-20" y1="0" x2="0" y2="20" stroke="#1f2937" stroke-width="3"/>
    <line x1="0" y1="0" x2="20" y2="20" stroke="#1f2937" stroke-width="3"/>
    <path d="M-10 -10 Q-30 -20 -10 -44 Q10 -20 -10 -10" fill="none" stroke="#1f2937" stroke-width="3"/>
  </g>

  <!-- Right: Free Haiti -->
  <rect x="400" y="40" width="140" height="120" fill="none" stroke="#1f2937" stroke-width="3"/>
  <text x="470" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">Haiti 1804</text>
  <circle cx="470" cy="80" r="16" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="470" y1="96" x2="470" y2="135" stroke="#1f2937" stroke-width="3"/>
  <line x1="445" y1="110" x2="495" y2="110" stroke="#1f2937" stroke-width="3"/>
  <line x1="450" y1="145" x2="490" y2="145" stroke="#1f2937" stroke-width="3"/>
  <path d="M470 96 Q450 105 430 120" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <path d="M470 96 Q490 105 510 120" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <text x="470" y="175" text-anchor="middle" font-size="11" fill="#1f2937">First Black Republic</text>
  <text x="470" y="190" text-anchor="middle" font-size="11" fill="#1f2937">Vertières Victory</text>

  <!-- Napoleon small, looking at Louisiana map -->
  <g transform="translate(480, 200)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="0" y1="14" x2="0" y2="35" stroke="#1f2937" stroke-width="2"/>
    <line x1="-15" y1="22" x2="15" y2="22" stroke="#1f2937" stroke-width="2"/>
    <line x1="-8" y1="35" x2="-18" y2="50" stroke="#1f2937" stroke-width="2"/>
    <line x1="8" y1="35" x2="18" y2="50" stroke="#1f2937" stroke-width="2"/>
    <path d="M-14 -10 Q0 -20 14 -10" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="-18" stroke="#1f2937" stroke-width="2"/>
    <!-- Map in hand -->
    <rect x="20" y="-10" width="35" height="25" fill="none" stroke="#1f2937" stroke-width="2"/>
    <path d="M22 -5 Q37 2 22 10" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="55" y1="0" x2="70" y2="0" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="85" y="16" font-size="10" fill="#1f2937">→ USA</text>
  </g>

  <!-- Yellow fever mosquitoes -->
  <g transform="translate(350, 200)">
    <circle cx="0" cy="0" r="3" fill="#1f2937"/>
    <line x1="-5" y1="-3" x2="-10" y2="-8" stroke="#1f2937" stroke-width="1"/>
    <line x1="5" y1="-3" x2="10" y2="-8" stroke="#1f2937" stroke-width="1"/>
    <circle cx="20" cy="10" r="3" fill="#1f2937"/>
    <line x1="15" y1="7" x2="10" y2="2" stroke="#1f2937" stroke-width="1"/>
    <line x1="25" y1="7" x2="30" y2="2" stroke="#1f2937" stroke-width="1"/>
    <circle cx="-15" cy="15" r="3" fill="#1f2937"/>
    <line x1="-20" y1="12" x2="-25" y2="7" stroke="#1f2937" stroke-width="1"/>
    <line x1="-10" y1="12" x2="-5" y2="7" stroke="#1f2937" stroke-width="1"/>
  </g>

  <!-- Arrow from chain to Haiti -->
  <path d="M380 100 Q420 80 440 100" fill="none" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Arrow from Napoleon to Louisiana sale -->
  <path d="M480 220 Q450 240 380 240" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="100" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Slave Revolt 1791</text>
  <text x="220" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Toussaint L'Ouverture</text>
  <text x="220" y="230" text-anchor="middle" font-size="12" fill="#1f2937">Declaration of Rights</text>
  <text x="380" y="230" text-anchor="middle" font-size="12" fill="#1f2937">Abolition 1794</text>
  <text x="470" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">First Black Republic</text>
  <text x="480" y="270" text-anchor="middle" font-size="12" fill="#1f2937">Napoleon's Failure</text>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#1f2937">Yellow Fever</text>
  <text x="300" y="270" text-anchor="middle" font-size="12" fill="#1f2937">Louisiana Sale 1803</text>

  <!-- Caption strip -->
  <rect x="0" y="290" width="560" height="30" fill="#1f2937"/>
  <text x="280" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#fbf7ec">3.7 The Haitian Revolution (1791-1804): The Colonial French Revolution</text>
</svg></div>

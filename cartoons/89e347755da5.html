<h1>Major Sites &amp;mdash; Comprehensive Analysis</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="560" height="320" fill="#fbf7ec"/>
  
  <!-- Main City Grid (Mohenjo-daro style) -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- City outer wall -->
    <rect x="30" y="20" width="500" height="240" rx="5"/>
    <!-- Grid lines: 3 vertical arterial streets -->
    <line x1="30" y1="20" x2="30" y2="260"/>
    <line x1="200" y1="20" x2="200" y2="260"/>
    <line x1="370" y1="20" x2="370" y2="260"/>
    <line x1="530" y1="20" x2="530" y2="260"/>
    <!-- Grid lines: 3 horizontal arterial streets -->
    <line x1="30" y1="20" x2="530" y2="20"/>
    <line x1="30" y1="110" x2="530" y2="110"/>
    <line x1="30" y1="200" x2="530" y2="200"/>
    <line x1="30" y1="260" x2="530" y2="260"/>
    <!-- Subsidiary streets (thinner) -->
    <g stroke-width="1">
      <line x1="115" y1="20" x2="115" y2="260"/>
      <line x1="285" y1="20" x2="285" y2="260"/>
      <line x1="450" y1="20" x2="450" y2="260"/>
      <line x1="30" y1="65" x2="530" y2="65"/>
      <line x1="30" y1="155" x2="530" y2="155"/>
    </g>
  </g>
  
  <!-- Citadel (west) - double line for raised platform -->
  <g stroke="#1f2937" fill="none">
    <rect x="32" y="22" width="166" height="236" stroke-width="3"/>
    <rect x="35" y="25" width="160" height="230" stroke-width="1" stroke-dasharray="4,2"/>
  </g>
  
  <!-- Lower Town (east) -->
  <g stroke="#1f2937" fill="none" stroke-width="1">
    <rect x="202" y="22" width="326" height="236"/>
  </g>
  
  <!-- Great Bath in Citadel -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <rect x="60" y="40" width="100" height="60" rx="3"/>
    <!-- Stairs at north and south -->
    <line x1="100" y1="40" x2="100" y2="30"/>
    <line x1="100" y1="100" x2="100" y2="110"/>
    <!-- Colonnaded portico suggestion -->
    <rect x="55" y="35" width="110" height="70" stroke-width="0.5" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Great Granary in Citadel -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none">
    <rect x="60" y="130" width="100" height="80"/>
    <!-- 9x3 grid blocks -->
    <g stroke-width="0.5">
      <line x1="70" y1="130" x2="70" y2="210"/>
      <line x1="80" y1="130" x2="80" y2="210"/>
      <line x1="90" y1="130" x2="90" y2="210"/>
      <line x1="100" y1="130" x2="100" y2="210"/>
      <line x1="110" y1="130" x2="110" y2="210"/>
      <line x1="120" y1="130" x2="120" y2="210"/>
      <line x1="130" y1="130" x2="130" y2="210"/>
      <line x1="140" y1="130" x2="140" y2="210"/>
      <line x1="150" y1="130" x2="150" y2="210"/>
      <line x1="60" y1="150" x2="160" y2="150"/>
      <line x1="60" y1="170" x2="160" y2="170"/>
      <line x1="60" y1="190" x2="160" y2="190"/>
    </g>
    <!-- Ventilation shafts -->
    <circle cx="80" cy="140" r="3" fill="#1f2937"/>
    <circle cx="130" cy="140" r="3" fill="#1f2937"/>
    <circle cx="80" cy="200" r="3" fill="#1f2937"/>
    <circle cx="130" cy="200" r="3" fill="#1f2937"/>
  </g>
  
  <!-- Pillared Hall (Council Chamber) in Lower Town -->
  <g stroke="#1f2937" stroke-width="1" fill="none">
    <rect x="230" y="40" width="120" height="120"/>
    <!-- 9x9 pillars -->
    <g stroke-width="0.5">
      <line x1="240" y1="50" x2="240" y2="150"/>
      <line x1="255" y1="50" x2="255" y2="150"/>
      <line x1="270" y1="50" x2="270" y2="150"/>
      <line x1="285" y1="50" x2="285" y2="150"/>
      <line x1="300" y1="50" x2="300" y2="150"/>
      <line x1="315" y1="50" x2="315" y2="150"/>
      <line x1="330" y1="50" x2="330" y2="150"/>
      <line x1="230" y1="60" x2="350" y2="60"/>
      <line x1="230" y1="75" x2="350" y2="75"/>
      <line x1="230" y1="90" x2="350" y2="90"/>
      <line x1="230" y1="105" x2="350" y2="105"/>
      <line x1="230" y1="120" x2="350" y2="120"/>
      <line x1="230" y1="135" x2="350" y2="135"/>
      <line x1="230" y1="150" x2="350" y2="150"/>
    </g>
  </g>
  
  <!-- North Gate with Signboard -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- Gate opening -->
    <line x1="260" y1="20" x2="300" y2="20" stroke-width="4" stroke-linecap="round"/>
    <!-- Signboard above gate -->
    <rect x="255" y="5" width="90" height="15" rx="1"/>
    <line x1="255" y1="5" x2="345" y2="5" stroke-width="1"/>
    <line x1="255" y1="20" x2="345" y2="20" stroke-width="1"/>
  </g>
  
  <!-- Stadium (Dholavira) - long rectangle with tiered seating -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none">
    <rect x="380" y="130" width="140" height="25"/>
    <!-- Tiered seating lines -->
    <line x1="380" y1="135" x2="520" y2="135" stroke-width="0.5"/>
    <line x1="380" y1="140" x2="520" y2="140" stroke-width="0.5"/>
    <line x1="380" y1="145" x2="520" y2="145" stroke-width="0.5"/>
    <line x1="380" y1="150" x2="520" y2="150" stroke-width="0.5"/>
  </g>
  
  <!-- Dholavira Water Management Inset (bottom right) -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none">
    <!-- Inset frame -->
    <rect x="380" y="180" width="160" height="70" stroke-dasharray="4,2"/>
    <!-- Two dams -->
    <line x1="380" y1="200" x2="420" y2="200" stroke-width="3"/>
    <line x1="500" y1="200" x2="540" y2="200" stroke-width="3"/>
    <!-- Reservoirs (bedrock carved) -->
    <rect x="425" y="185" width="70" height="40" stroke-width="1"/>
    <rect x="425" y="230" width="70" height="20" stroke-width="1"/>
    <!-- Channels with sluice gates -->
    <line x1="425" y1="205" x2="425" y2="230" stroke-width="1"/>
    <line x1="495" y1="205" x2="495" y2="230" stroke-width="1"/>
    <!-- Sluice gates -->
    <rect x="420" y="203" width="10" height="4" fill="#1f2937"/>
    <rect x="490" y="203" width="10" height="4" fill="#1f2937"/>
    <!-- Stepwell -->
    <g stroke-width="1">
      <rect x="505" y="185" width="30" height="40"/>
      <line x1="505" y1="190" x2="535" y2="190"/>
      <line x1="505" y1="195" x2="535" y2="195"/>
      <line x1="505" y1="200" x2="535" y2="200"/>
      <line x1="505" y1="205" x2="535" y2="205"/>
      <line x1="505" y1="210" x2="535" y2="210"/>
      <line x1="505" y1="215" x2="535" y2="215"/>
    </g>
  </g>
  
  <!-- Labels (key terms from passage) -->
  <g font-family="sans-serif" font-size="13" fill="#1f2937" font-weight="bold">
    <text x="110" y="35" text-anchor="middle">Citadel</text>
    <text x="360" y="35" text-anchor="middle">Lower Town</text>
    <text x="110" y="115" text-anchor="middle">Great Bath</text>
    <text x="110" y="225" text-anchor="middle">Granary</text>
    <text x="290" y="115" text-anchor="middle">Pillared Hall</text>
    <text x="280" y="15" text-anchor="middle">Signboard</text>
    <text x="450" y="125" text-anchor="middle">Stadium</text>
    <text x="460" y="175" text-anchor="middle">Dholavira Water System</text>
    <text x="110" y="275" text-anchor="middle">Grid-Iron Plan</text>
  </g>
  
  <!-- Arrows for water flow in Dholavira -->
  <g stroke="#1f2937" stroke-width="1.5" fill="#1f2937">
    <polygon points="460,185 455,192 465,192"/> <!-- down -->
    <polygon points="460,230 455,223 465,223"/> <!-- up -->
  </g>
  
  <!-- Caption strip at bottom -->
  <rect x="0" y="290" width="560" height="30" fill="#1f2937"/>
  <text x="280" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fbf7ec" font-weight="bold">
    2. Indus Valley Civilization (2600-1900 BCE)
  </text>
</svg></div>

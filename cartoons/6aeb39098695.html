<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background grid lines -->
  <g stroke="#e5e0cc" stroke-width="0.5">
    <line x1="0" y1="0" x2="560" y2="0"/>

  <!-- Central metaphor: Flowchart with three converging paths -->
  <!-- Start node bottom center -->
  <circle cx="280" cy="270" r="22" fill="none" stroke="#1f2937" stroke-width="3"/>
  <text x="280" y="276" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="12" font-weight="bold">START</text>

  <circle cx="280" cy="250" r="6" fill="#1f2937"/>
  <path d="M280 256 L280 270" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M270 260 L280 256 L290 260" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M280 280 L270 295 L280 280 L290 295" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Path 1: Syllogism (solid) - LEFT -->
  <path d="M258 270 Q180 240 120 180 Q80 140 100 100" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Venn circles -->
  <circle cx="70" cy="90" r="35" fill="none" stroke="#1f2937" stroke-width="2"/>
  <circle cx="115" cy="90" r="35" fill="none" stroke="#1f2937" stroke-width="2"/>
  <circle cx="92" cy="60" r="35" fill="none" stroke="#1f2937" stroke-width="2"/>
  <!-- Labels on Venn -->
  <text x="70" y="135" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="11">Fruits</text>
  <text x="115" y="135" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="11">Sweets</text>
  <text x="92" y="30" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="11">Healthy</text>
  <text x="92" y="92" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="10" font-style="italic">No Sour</text>
  <!-- Section label -->
  <text x="92" y="155" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="13" font-weight="bold">SYLLOGISM</text>
  <text x="92" y="170" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="11">Neither follows</text>

  <!-- Path 2: Blood Relation (dashed) - CENTER -->
  <path d="M280 270 Q280 220 280 160 Q280 120 280 80" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round"/>
  <!-- Family tree nodes -->
  <circle cx="280" cy="160" r="18" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="280" y="165" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="12" font-weight="bold">B</text>
  <text x="280" y="182" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="10">Mother</text>

  <circle cx="220" cy="110" r="16" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="220" y="115" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="12" font-weight="bold">A</text>
  <text x="220" y="92" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="10">Sister</text>

  <circle cx="340" cy="110" r="16" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="340" y="115" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="12" font-weight="bold">E</text>
  <text x="340" y="92" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="10">Father</text>

  <circle cx="250" cy="210" r="14" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="250" y="214" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="10">C</text>
  <circle cx="310" cy="210" r="14" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="310" y="214" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="10">D</text>
  <text x="280" y="230" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="10">Brother/Sister</text>

  <!-- Connectors -->
  <path d="M220 120 L262 148" stroke="#1f2937" stroke-width="1.5"/>
  <path d="M340 120 L298 148" stroke="#1f2937" stroke-width="1.5"/>
  <path d="M262 172 L250 196" stroke="#1f2937" stroke-width="1.5"/>
  <path d="M298 172 L310 196" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Section label -->
  <text x="280" y="55" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="13" font-weight="bold">BLOOD RELATION</text>
  <text x="280" y="70" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="11">A is Aunt of D</text>

  <!-- Path 3: Direction Sense (dotted) - RIGHT -->
  <path d="M302 270 Q380 240 440 180 Q480 140 460 100" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="2,4" stroke-linecap="round"/>
  <!-- Grid path visualization -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- Start -->
    <circle cx="380" cy="160" r="4" fill="#1f2937"/>
    <text x="380" y="150" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="9">O</text>
    <!-- 15 North -->
    <path d="M380 160 L380 110" stroke-dasharray="4,2"/>
    <path d="M375 115 L380 110 L385 115" stroke-dasharray="none"/>
    <text x="390" y="135" fill="#1f2937" font-family="Georgia, serif" font-size="9">15N</text>

    <path d="M380 110 L440 110" stroke-dasharray="4,2"/>
    <path d="M435 105 L440 110 L435 115" stroke-dasharray="none"/>
    <text x="410" y="102" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="9">20E</text>
    <!-- 15 South -->
    <path d="M440 110 L440 160" stroke-dasharray="4,2"/>
    <path d="M435 155 L440 160 L445 155" stroke-dasharray="none"/>
    <text x="450" y="135" fill="#1f2937" font-family="Georgia, serif" font-size="9">15S</text>
    <!-- 10 East -->
    <path d="M440 160 L480 160" stroke-dasharray="4,2"/>
    <path d="M475 155 L480 160 L475 165" stroke-dasharray="none"/>
    <text x="460" y="152" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="9">10E</text>
    <!-- End point -->
    <circle cx="480" cy="160" r="6" fill="#1f2937"/>
    <text x="480" y="178" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="10" font-weight="bold">30m East</text>
  </g>
  <!-- Section label -->
  <text x="460" y="55" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="13" font-weight="bold">DIRECTION SENSE</text>
  <text x="460" y="70" text-anchor="middle" fill="#1f2937" font-family="Georgia, serif" font-size="11">Net: 30m East</text>

  <!-- Convergence arrows to ANSWER -->
  <path d="M100 80 Q190 60 280 50" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M280 50 Q280 40 280 30" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M460 80 Q370 60 280 50" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L8,4 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- ANSWER box -->
  <rect x="210" y="15" width="140" height="30" rx="5" fill="#1f2937"/>
  <text x="280" y="37" text-anchor="middle" fill="#fbf7ec" font-family="Georgia, serif" font-size="15" font-weight="bold">ANSWER</text>

  <!-- Caption strip bottom -->
  <rect x="0" y="290" width="560" height="30" fill="#1f2937"/>
  <text x="280" y="312" text-anchor="middle" fill="#fbf7ec" font-family="Georgia, serif" font-size="13">
    Solved Examples: Syllogism • Blood Relation • Direction Sense
  </text>
</svg></div>

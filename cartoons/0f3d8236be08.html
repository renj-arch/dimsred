<h1>Systematic Elimination Strategies</h1>
<p class="meta">Reading Comprehension · <a href="/upsc/course/csat/lesson-comprehension">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background grid lines for paper texture -->
  <g stroke="#e8dfd0" stroke-width="0.5">
    <line x1="0" y1="0" x2="560" y2="0"/>
    <line x1="0" y1="320" x2="560" y2="320"/>
  </g>

  <!-- Central Elimination Machine -->
  <!-- Hopper top -->
  <path d="M180 30 L380 30 L350 70 L210 70 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Four option cards entering -->
  <g stroke="#1f2937" stroke-width="2">
    <rect x="195" y="35" width="30" height="25" rx="2" fill="#fff"/>
    <rect x="235" y="35" width="30" height="25" rx="2" fill="#fff"/>
    <rect x="275" y="35" width="30" height="25" rx="2" fill="#fff"/>
    <rect x="315" y="35" width="30" height="25" rx="2" fill="#fff"/>
    <!-- Labels on cards -->
    <text x="210" y="53" font-size="9" text-anchor="middle" fill="#1f2937">ALWAYS</text>
    <text x="250" y="53" font-size="9" text-anchor="middle" fill="#1f2937">OUT SCOPE</text>
    <text x="290" y="53" font-size="9" text-anchor="middle" fill="#1f2937">HALF-TRUTH</text>
    <text x="330" y="53" font-size="9" text-anchor="middle" fill="#1f2937">REVERSE</text>
  </g>

  <!-- Pass 1 Roller: GLOBAL SCAN -->
  <rect x="150" y="80" width="260" height="40" rx="5" fill="#fff" stroke="#1f2937" stroke-width="3"/>
  <text x="280" y="105" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">PASS 1: GLOBAL SCAN</text>
  <!-- Arrow down -->
  <path d="M280 120 L280 140" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Pass 2 Roller: QUESTION-DRIVEN -->
  <rect x="150" y="145" width="260" height="40" rx="5" fill="#fff" stroke="#1f2937" stroke-width="3"/>
  <text x="280" y="170" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">PASS 2: QUESTION-DRIVEN</text>
  <path d="M280 185 L280 205" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Pass 3 Roller: OPTION VETTING -->
  <rect x="150" y="210" width="260" height="40" rx="5" fill="#fff" stroke="#1f2937" stroke-width="3"/>
  <text x="280" y="235" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">PASS 3: OPTION VETTING</text>

  <!-- Elimination filters as teeth on rollers -->
  <g stroke="#1f2937" stroke-width="2">
    <!-- Pass 1 teeth -->
    <line x1="170" y1="80" x2="170" y2="120"/>
    <line x1="220" y1="80" x2="220" y2="120"/>
    <line x1="270" y1="80" x2="270" y2="120"/>
    <line x1="320" y1="80" x2="320" y2="120"/>
    <line x1="370" y1="80" x2="370" y2="120"/>
    <!-- Pass 2 teeth -->
    <line x1="180" y1="145" x2="180" y2="185"/>
    <line x1="230" y1="145" x2="230" y2="185"/>
    <line x1="280" y1="145" x2="280" y2="185"/>
    <line x1="330" y1="145" x2="330" y2="185"/>
    <line x1="380" y1="145" x2="380" y2="185"/>
    <!-- Pass 3 teeth -->
    <line x1="175" y1="210" x2="175" y2="250"/>
    <line x1="225" y1="210" x2="225" y2="250"/>
    <line x1="275" y1="210" x2="275" y2="250"/>
    <line x1="325" y1="210" x2="325" y2="250"/>
    <line x1="375" y1="210" x2="375" y2="250"/>
  </g>

  <!-- Crushed wrong options falling out sides -->
  <g fill="#1f2937" opacity="0.6">
    <polygon points="140,100 130,110 140,120 150,110"/> <!-- diamond shapes -->
    <polygon points="140,165 130,175 140,185 150,175"/>
    <polygon points="140,230 130,240 140,250 150,240"/>
    <polygon points="420,100 410,110 420,120 430,110"/>
    <polygon points="420,165 410,175 420,185 430,175"/>
    <polygon points="420,230 410,240 420,250 430,240"/>
  </g>

  <!-- Correct answer emerging at bottom -->
  <rect x="255" y="255" width="50" height="30" rx="3" fill="#1f2937"/>
  <text x="280" y="276" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">ANSWER</text>
  <path d="M280 285 L280 300" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Side checklist clipboard -->
  <rect x="440" y="50" width="100" height="180" rx="5" fill="#fff" stroke="#1f2937" stroke-width="2"/>
  <rect x="445" y="50" width="90" height="25" fill="#1f2937"/>
  <text x="490" y="68" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">CHECKLIST</text>
  <g font-size="10" fill="#1f2937" font-family="sans-serif">
    <text x="455" y="85">☐ EXTREME LANGUAGE</text>
    <text x="455" y="105">☐ OUT OF SCOPE</text>
    <text x="455" y="125">☐ HALF-TRUTH</text>
    <text x="455" y="145">☐ LINE SUPPORT</text>
    <text x="455" y="165">☐ CENTRAL THRUST</text>
    <text x="455" y="185">☐ TONE MATCH</text>
  </g>

  <!-- Student figure at left operating machine -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Body -->
    <circle cx="80" cy="180" r="25"/> <!-- head -->
    <path d="M80 205 L80 270"/> <!-- torso -->
    <path d="M80 220 L40 250"/> <!-- left arm -->
    <path d="M80 220 L110 240"/> <!-- right arm reaching to lever -->
    <path d="M80 270 L50 310"/> <!-- left leg -->
    <path d="M80 270 L110 310"/> <!-- right leg -->
  </g>
  <!-- Lever being pulled -->
  <path d="M110 240 L130 220 L130 180" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="130" cy="180" r="8" fill="#1f2937"/>

  <!-- Labels on machine stages -->
  <g font-size="11" fill="#1f2937" font-weight="bold" text-anchor="middle">
    <text x="80" y="100">EXTREME</text>
    <text x="80" y="112">LANGUAGE</text>
    <text x="80" y="165">OUT OF</text>
    <text x="80" y="177">SCOPE</text>
    <text x="80" y="230">HALF-TRUTH</text>
    <text x="80" y="242">TRAP</text>
  </g>

  <!-- Caption strip at bottom -->
  <rect x="0" y="295" width="560" height="25" fill="#1f2937"/>
  <text x="280" y="312" font-size="13" text-anchor="middle" fill="#fbf7ec" font-weight="bold">SYSTEMATIC ELIMINATION STRATEGIES</text>

  <!-- Title at top -->
  <text x="280" y="22" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">THREE-PASS ELIMINATION MACHINE</text>

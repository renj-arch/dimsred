<h1>4. The Six Orthodox Schools of Indian Philosophy (Darshanas)</h1>
<p class="meta">Indian Literature, Religion &amp;amp; Philosophy · <a href="/upsc/course/mains-gs1/lesson-literature-philosophy">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Central Hub -->
  <circle cx="280" cy="140" r="50" fill="none" stroke="#1f2937" stroke-width="4"/>
  <text x="280" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">MOKSHA</text>
  <!-- Spoke 1: Samkhya (Top) -->
  <line x1="280" y1="90" x2="280" y2="30" stroke="#1f2937" stroke-width="3"/>
  <!-- Purusha (passive) -->
  <circle cx="240" cy="40" r="18" fill="none" stroke="#1f2937" stroke-width="2"/>
  <circle cx="240" cy="40" r="6" fill="#1f2937"/>
  <text x="240" y="15" text-anchor="middle" font-size="11" fill="#1f2937">PURUSHA</text>

  <circle cx="320" cy="40" r="18" fill="none" stroke="#1f2937" stroke-width="2"/>
  <circle cx="320" cy="30" r="3" fill="#1f2937"/>
  <circle cx="320" cy="40" r="3" fill="#1f2937"/>
  <circle cx="320" cy="50" r="3" fill="#1f2937"/>

  <line x1="330" y1="140" x2="430" y2="140" stroke="#1f2937" stroke-width="3"/>

  <g stroke="#1f2937" stroke-width="2">

  </g>

  <line x1="380" y1="133" x2="380" y2="150" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="370" y1="140" x2="390" y2="140" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <text x="380" y="100" text-anchor="middle" font-size="10" fill="#1f2937">ASHTANGA</text>
  <!-- Spoke 3: Nyaya (Bottom) -->
  <line x1="280" y1="190" x2="280" y2="270" stroke="#1f2937" stroke-width="3"/>

  <line x1="250" y1="220" x2="310" y2="220" stroke="#1f2937" stroke-width="2"/>

    <text x="240" y="225">ANUMANA</text>
    <text x="240" y="235">UPAMANA</text>
    <text x="240" y="245">SHABDA</text>

  <rect x="295" y="210" width="50" height="40" fill="none" stroke="#1f2937" stroke-width="1"/>
  <text x="320" y="222" text-anchor="middle" font-size="9" fill="#1f2937">SYLLOGISM</text>
  <text x="280" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">NYAYA</text>
  <text x="280" y="260" text-anchor="middle" font-size="10" fill="#1f2937">PRAMANAS</text>

  <circle cx="160" cy="135" r="5" fill="#1f2937"/>
  <circle cx="175" cy="135" r="5" fill="#1f2937"/>
  <circle cx="168" cy="145" r="5" fill="#1f2937"/>

  <text x="168" y="100" text-anchor="middle" font-size="10" fill="#1f2937">ATOMS</text>

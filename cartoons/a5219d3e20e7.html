<h1>Syllogistic Networks: Multiple Premises and Conditional Conclusions</h1>
<p class="meta">Logical Reasoning · <a href="/upsc/course/csat/lesson-logical-reasoning">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Venn circles -->
  <circle cx="130" cy="140" r="70" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="260" cy="140" r="70" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="260" cy="230" r="70" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="390" cy="140" r="70" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <!-- Circle labels -->
  <text x="130" y="55" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="bold">Engineers (E)</text>
  <text x="260" y="55" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="bold">Analysts (A)</text>
  <text x="260" y="315" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="bold">Designers (D)</text>
  <text x="390" y="55" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="bold">Managers (M)</text>
  <!-- Region markers -->
  <text x="130" y="145" text-anchor="middle" font-size="22" fill="#1f2937">∅</text>
  <text x="260" y="185" text-anchor="middle" font-size="22" fill="#1f2937">✕</text>
  <text x="325" y="185" text-anchor="middle" font-size="22" fill="#1f2937">∅</text>
  <!-- Magnifying glass on contradiction region -->
  <circle cx="200" cy="185" r="28" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="222" y1="207" x2="240" y2="225" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <text x="200" y="190" text-anchor="middle" font-size="14" fill="#1f2937">∅ &amp; ✕</text>
  <!-- Premise / Boolean labels -->
  <text x="195" cy="100" text-anchor="middle" font-size="13" fill="#1f2937">All E are A</text>
  <text x="260" cy="100" text-anchor="middle" font-size="13" fill="#1f2937">E ⊆ A</text>
  <text x="260" cy="200" text-anchor="middle" font-size="13" fill="#1f2937">Some A are D</text>
  <text x="260" cy="215" text-anchor="middle" font-size="13" fill="#1f2937">A ∩ D ≠ ∅</text>
  <text x="325" cy="200" text-anchor="middle" font-size="13" fill="#1f2937">No D are M</text>
  <text x="325" cy="215" text-anchor="middle" font-size="13" fill="#1f2937">D ∩ M = ∅</text>
  <!-- Conditional test box -->
  <rect x="420" y="60" width="120" height="100" fill="none" stroke="#1f2937" stroke-width="2" rx="5"/>
  <text x="480" y="85" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="bold">Conditional test</text>
  <text x="480" y="105" text-anchor="middle" font-size="12" fill="#1f2937">Assume M ⊆ E</text>
  <text x="480" y="125" text-anchor="middle" font-size="12" fill="#1f2937">Check consequent</text>
  <text x="480" y="145" text-anchor="middle" font-size="12" fill="#1f2937">Retract antecedent</text>

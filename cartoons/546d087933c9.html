<h1>Paleomagnetism and Plate Reconstruction</h1>
<p class="meta">Geology Optional: Syllabus, Sources &amp;amp; Strategy · <a href="/upsc/course/opt-geology/lesson-overview">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- APWP curve -->
  <path d="M80 260 Q180 200 280 140 Q380 80 480 60" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <!-- Indian plate positions -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <path d="M100 240 Q110 230 120 235 Q115 245 100 240" opacity="0.6"/> <!-- 120 Ma -->
    <path d="M200 180 Q215 170 230 178 Q220 190 200 180"/> <!-- 65 Ma Deccan -->
    <path d="M320 110 Q335 100 350 108 Q340 120 320 110"/> <!-- 55 Ma Rajmahal -->
    <path d="M440 70 Q455 60 470 68 Q460 80 440 70"/> <!-- 50 Ma collision -->
  </g>
  <!-- Age markers on curve -->
  <circle cx="100" cy="240" r="5" fill="#1f2937"/>
  <circle cx="200" cy="180" r="5" fill="#1f2937"/>
  <circle cx="320" cy="110" r="5" fill="#1f2937"/>
  <circle cx="440" cy="70" r="5" fill="#1f2937"/>
  <!-- Arrows for northward drift -->
  <path d="M100 240 L120 220" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M200 180 L220 160" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M320 110 L340 90" stroke="#1f2937" stroke-width="2.5" marker-end="url(#arrow)"/>

    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <!-- Stereographic projection (top-left) -->
  <g transform="translate(50,40)" stroke="#1f2937" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="45"/>
    <line x1="-45" y1="0" x2="45" y2="0"/>
    <line x1="0" y1="-45" x2="0" y2="45"/>

    <circle cx="15" cy="20" r="3" fill="#1f2937"/>

    <circle cx="25" cy="-10" r="3" fill="#1f2937"/>
  </g>
  <!-- Deccan Traps (bottom-left) -->
  <g transform="translate(50,200)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <path d="M0 0 L-30 40 L30 40 Z"/>
    <path d="M-30 40 L-40 80 L40 80 L30 40"/>

  </g>

  <g transform="translate(420,50)" stroke="#1f2937" stroke-width="2.5" fill="none">

    <path d="M-30 40 L-10 10 L10 10 L30 40" stroke-dasharray="4,2"/>

    <line x1="15" y1="30" x2="15" y2="10" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <!-- Shillong rotation arrow (right-middle) -->
  <g transform="translate(480,130)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <path d="M0 0 A20 20 0 0 1 28 12" marker-end="url(#arrow)"/>

  </g>

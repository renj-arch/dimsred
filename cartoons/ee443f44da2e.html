<h1>The Later Mughals (1707-1857)</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background texture lines -->
  <g stroke="#e8dfca" stroke-width="0.5">
    <line x1="0" y1="40" x2="560" y2="40"/>
    <line x1="0" y1="280" x2="560" y2="280"/>
  </g>

  <!-- Central crumbling pyramid: Mansabdari hierarchy -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Level 1: Emperor -->
    <rect x="250" y="30" width="60" height="30" rx="3"/>
    <circle cx="280" cy="20" r="12" stroke-width="2"/>
    <line x1="280" y1="32" x2="280" y2="60"/>
    <!-- Level 2: High Mansabdars (Princes) -->
    <rect x="180" y="70" width="200" height="35" rx="3"/>
    <line x1="280" y1="65" x2="230" y2="70"/>
    <line x1="280" y1="65" x2="330" y2="70"/>
    <!-- Level 3: Mid Mansabdars -->
    <rect x="120" y="115" width="320" height="35" rx="3"/>
    <line x1="230" y1="105" x2="180" y2="115"/>
    <line x1="330" y1="105" x2="380" y2="115"/>
    <!-- Level 4: Low Mansabdars (cracking) -->
    <rect x="70" y="160" width="420" height="35" rx="3">
      <animate attributeName="width" from="420" to="380" dur="2s" repeatCount="indefinite"/> <!-- not allowed, remove -->
    </rect>
    <!-- Cracks in level 4 -->
    <line x1="150" y1="160" x2="140" y2="195" stroke-dasharray="4,2"/>
    <line x1="280" y1="160" x2="280" y2="195" stroke-dasharray="4,2"/>
    <line x1="410" y1="160" x2="420" y2="195" stroke-dasharray="4,2"/>
    <!-- Level 5: Jagirs (shrinking land blocks) -->
    <rect x="50" y="205" width="100" height="30" rx="2" fill="#fbf7ec"/>
    <rect x="170" y="205" width="80" height="30" rx="2" fill="#fbf7ec"/>
    <rect x="280" y="205" width="60" height="30" rx="2" fill="#fbf7ec"/>
    <rect x="370" y="205" width="40" height="30" rx="2" fill="#fbf7ec"/>
    <rect x="440" y="205" width="30" height="30" rx="2" fill="#fbf7ec"/>
    <!-- Arrows down from level 4 to jagirs -->
    <line x1="150" y1="195" x2="100" y2="205" marker-end="url(#arrow)"/>
    <line x1="280" y1="195" x2="280" y2="205" marker-end="url(#arrow)"/>
    <line x1="410" y1="195" x2="400" y2="205" marker-end="url(#arrow)"/>
  </g>

  <!-- Peasants crushed at bottom -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <path d="M80 250 Q75 260 80 270" stroke-linecap="round"/>
    <path d="M120 250 Q115 260 120 270" stroke-linecap="round"/>
    <path d="M200 250 Q195 260 200 270" stroke-linecap="round"/>
    <path d="M300 250 Q295 260 300 270" stroke-linecap="round"/>
    <path d="M400 250 Q395 260 400 270" stroke-linecap="round"/>
    <path d="M480 250 Q475 260 480 270" stroke-linecap="round"/>
  </g>

  <!-- Coins spilling from top right -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <circle cx="500" cy="50" r="10"/>
    <text x="500" y="54" font-size="8" text-anchor="middle" fill="#1f2937">₹</text>
    <circle cx="520" cy="70" r="8"/>
    <text x="520" y="74" font-size="7" text-anchor="middle" fill="#1f2937">₹</text>
    <circle cx="490" cy="80" r="6"/>
    <text x="490" y="83" font-size="6" text-anchor="middle" fill="#1f2937">₹</text>
  </g>

  <!-- Textile bolt left side -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <rect x="20" y="100" width="30" height="80" rx="2"/>
    <line x1="25" y1="110" x2="45" y2="110"/>
    <line x1="25" y1="130" x2="45" y2="130"/>
    <line x1="25" y1="150" x2="45" y2="150"/>
    <line x1="25" y1="170" x2="45" y2="170"/>
  </g>

  <!-- Labels -->
  <g font-family="Georgia, serif" font-size="13" fill="#1f2937" text-anchor="middle">
    <text x="280" y="25">EMPEROR</text>
    <text x="280" y="92">HIGH MANSABDARS</text>
    <text x="280" y="137">MID MANSABDARS</text>
    <text x="280" y="182">LOW MANSABDARS</text>
    <text x="280" y="225">JAGIRS</text>
    <text x="35" y="145" text-anchor="start">TEXTILES</text>
    <text x="505" y="45" text-anchor="end">COINAGE</text>
    <text x="280" y="275">PEASANTS</text>
  </g>

  <!-- Caption strip -->
  <rect x="0" y="285" width="560" height="35" fill="#1f2937"/>
  <text x="280" y="307" font-family="Georgia, serif" font-size="14" fill="#fbf7ec" text-anchor="middle" font-weight="bold">
    12. Mughal Empire (1526-1707)
  </text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L7,3.5 Z" fill="#1f2937"/>
    </marker>
  </defs>
</svg></div>

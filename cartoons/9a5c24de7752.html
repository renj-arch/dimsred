<h1>The Bhakti Movement in South India</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  
  <!-- Ground line -->
  <line x1="40" y1="260" x2="520" y2="260" stroke="#1f2937" stroke-width="3"/>
  
  <!-- Pushkarini (tank) foreground -->
  <ellipse cx="280" cy="270" rx="180" ry="25" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="280" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f2937">PUSHKARINI</text>
  
  <!-- Phase 1: Pallava (left) -->
  <g transform="translate(60, 260)">
    <!-- Base platform -->
    <rect x="-35" y="-20" width="70" height="20" fill="none" stroke="#1f2937" stroke-width="2"/>
    <!-- Mandapa -->
    <rect x="-45" y="-55" width="90" height="35" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="0" y1="-55" x2="0" y2="-20" stroke="#1f2937" stroke-width="1" stroke-dasharray="4,2"/>
    <!-- Vimana - simple pyramidal -->
    <polygon points="-30,-20 30,-20 20,-100 10,-130 -10,-130 -20,-100" fill="none" stroke="#1f2937" stroke-width="2.5"/>
    <!-- Talas (storeys) -->
    <line x1="-25" y1="-50" x2="25" y2="-50" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="-18" y1="-80" x2="18" y2="-80" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="-12" y1="-105" x2="12" y2="-105" stroke="#1f2937" stroke-width="1.5"/>
    <!-- Shikhara + Kalasha -->
    <ellipse cx="0" cy="-138" rx="8" ry="6" fill="none" stroke="#1f2937" stroke-width="2"/>
    <circle cx="0" cy="-146" r="4" fill="#1f2937"/>
    <!-- Gopuram (smaller) -->
    <polygon points="-60,-20 -40,-20 -35,-80 -65,-80" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="0" y="-170" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1f2937">PALLAVA</text>
    <text x="0" y="-155" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">ROCK-CUT → STRUCTURAL</text>
  </g>
  
  <!-- Phase 2: Chola (center-left) -->
  <g transform="translate(190, 260)">
    <!-- Base -->
    <rect x="-40" y="-20" width="80" height="20" fill="none" stroke="#1f2937" stroke-width="2"/>
    <!-- Maha Mandapa -->
    <rect x="-55" y="-70" width="110" height="50" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="0" y1="-70" x2="0" y2="-20" stroke="#1f2937" stroke-width="1" stroke-dasharray="4,2"/>
    <!-- Tall Vimana -->
    <polygon points="-35,-20 35,-20 25,-160 15,-200 -15,-200 -25,-160" fill="none" stroke="#1f2937" stroke-width="3"/>
    <!-- Talas -->
    <line x1="-30" y1="-55" x2="30" y2="-55" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="-24" y1="-90" x2="24" y2="-90" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="-18" y1="-125" x2="18" y2="-125" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="-12" y1="-155" x2="12" y2="-155" stroke="#1f2937" stroke-width="1.5"/>
    <!-- Shikhara + Kalasha -->
    <ellipse cx="0" cy="-208" rx="10" ry="7" fill="none" stroke="#1f2937" stroke-width="2"/>
    <circle cx="0" cy="-218" r="5" fill="#1f2937"/>
    <!-- Gopuram -->
    <polygon points="-70,-20 -45,-20 -40,-110 -75,-110" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="0" y="-240" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1f2937">CHOLA</text>
    <text x="0" y="-225" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">GRAND VIMANA</text>
  </g>
  
  <!-- Phase 3: Western Chalukya (center-right) -->
  <g transform="translate(350, 260)">
    <!-- Star-shaped platform -->
    <polygon points="0,-25 8,-10 25,-10 12,0 15,15 0,8 -15,15 -12,0 -25,-10 -8,-10" fill="none" stroke="#1f2937" stroke-width="2"/>
    <!-- Mandapa with lathe pillars -->
    <rect x="-45" y="-60" width="90" height="40" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="-20" y1="-60" x2="-20" y2="-20" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="20" y1="-60" x2="20" y2="-20" stroke="#1f2937" stroke-width="1.5"/>
    <!-- Vimana (stepped) -->
    <polygon points="-28,-20 28,-20 20,-120 10,-145 -10,-145 -20,-120" fill="none" stroke="#1f2937" stroke-width="2.5"/>
    <line x1="-22" y1="-50" x2="22" y2="-50" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="-16" y1="-80" x2="16" y2="-80" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="-8" y1="-110" x2="8" y2="-110" stroke="#1f2937" stroke-width="1.5"/>
    <!-- Shikhara + Kalasha -->
    <ellipse cx="0" cy="-152" rx="7" ry="5" fill="none" stroke="#1f2937" stroke-width="2"/>
    <circle cx="0" cy="-159" r="3" fill="#1f2937"/>
    <!-- Gopuram -->
    <polygon points="-60,-20 -40,-20 -35,-90 -65,-90" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="0" y="-180" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1f2937">CHALUKYA</text>
    <text x="0" y="-165" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">STAR-PLATFORM, SOAPSTONE</text>
  </g>
  
  <!-- Phase 4: Hoysala (right) -->
  <g transform="translate(480, 260)">
    <!-- Star platform -->
    <polygon points="0,-25 7,-12 22,-12 10,-2 13,12 0,6 -13,12 -10,-2 -22,-12 -7,-12" fill="none" stroke="#1f2937" stroke-width="2"/>
    <!-- Mandapa with many pillars -->
    <rect x="-40" y="-55" width="80" height="35" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="-25" y1="-55" x2="-25" y2="-20" stroke="#1f2937" stroke-width="1"/>
    <line x1="0" y1="-55" x2="0" y2="-20" stroke="#1f2937" stroke-width="1"/>
    <line x1="25" y1="-55" x2="25" y2="-20" stroke="#1f2937" stroke-width="1"/>
    <!-- Vimana - intricate, multi-shrine -->
    <polygon points="-25,-20 25,-20 18,-95 8,-115 -8,-115 -18,-95" fill="none" stroke="#1f2937" stroke-width="2.5"/>
    <!-- Miniature towers (kutas) on sides -->
    <polygon points="-35,-20 -25,-20 -28,-65 -38,-65" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <polygon points="25,-20 35,-20 38,-65 28,-65" fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <!-- Talas -->
    <line x1="-20" y1="-45" x2="20" y2="-45" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="-14" y1="-70" x2="14" y2="-70" stroke="#1f2937" stroke-width="1.5"/>
    <!-- Shikhara + Kalasha -->
    <ellipse cx="0" cy="-122" rx="6" ry="4" fill="none" stroke="#1f2937" stroke-width="2"/>
    <circle cx="0" cy="-128" r="3" fill="#1f2937"/>
    <!-- Gopuram -->
    <polygon points="-55,-20 -35,-20 -32,-85 -58,-85" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="0" y="-150" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1f2937">HOYSALA</text>
    <text x="0" y="-135" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">INTRICATE, MULTI-SHRINE</text>
  </g>
  
  <!-- Connecting arrows between phases -->
  <line x1="155" y1="140" x2="175" y2="140" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="140" x2="335" y2="140" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="140" x2="495" y2="140" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1f2937"/>
    </marker>
  </defs>
  
  <!-- Key terms labels -->
  <text x="80" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f2937">VIMANA</text>
  <text x="190" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f2937">SHIKHARA</text>
  <text x="190" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1f2937">KALASHA</text>
  <text x="60" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">MANDAPA</text>
  <text x="190" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">GOPURAM</text>
  <text x="350" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">STAR-PLATFORM</text>
  <text x="480" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">LATHE PILLARS</text>
  
  <!-- Caption strip -->
  <rect x="0" y="295" width="560" height="25" fill="#1f2937"/>
  <text x="280" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fbf7ec">10. South Indian Kingdoms (750–1300 CE) — Dravida Temple Evolution</text>
</svg></div>

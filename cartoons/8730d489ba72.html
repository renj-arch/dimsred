<h1>The Doctrine of Legitimate Expectation and Its Constitutional Anchoring in Article 14</h1>
<p class="meta">Fundamental Rights, DPSP and Fundamental Duties · <a href="/upsc/course/mains-gs2/lesson-fundamental-rights">Read the lesson →</a></p>
<div class="hero"><svg viewBox='0 0 560 320'>
  <rect x='0' y='0' width='560' height='320' fill='#fbf7ec'/>

  <g stroke='#1f2937' stroke-width='2' fill='none'>
    <!-- Human figure representing "marginalized groups" at the bottom, struggling -->
    <path d='M100 240 L100 210 L110 200 L120 210 L120 240 M90 220 L130 220 M100 240 L80 260 M120 240 L140 260' stroke-linecap='round'/>
    <circle cx='110' cy='195' r='8' fill='#1f2937'/>
    <path d='M110 240 L110 260 M100 250 L120 250' stroke-linecap='round' stroke-dasharray='4 2'/> <!-- Represents illness/struggle -->
    <text x='80' y='280' font-family='sans-serif' font-size='14' fill='#1f2937'>Marginalised Groups</text>

    <!-- Ladder representing "Judicial Evolution" from DPSP to Fundamental Right -->
    <line x1='280' y1='260' x2='280' y2='60'/>
    <line x1='320' y1='260' x2='320' y2='60'/>
    <line x1='280' y1='240' x2='320' y2='240'/>
    <line x1='280' y1='200' x2='320' y2='200'/>
    <line x1='280' y1='160' x2='320' y2='160'/>
    <line x1='280' y1='120' x2='320' y2='120'/>
    <line x1='280' y1='80' x2='320' y2='80'/>

    <!-- Arrow pointing up the ladder -->
    <path d='M260 250 L275 240 L260 230 M260 250 L260 70 M260 70 L275 80 L260 90' stroke-width='3' stroke-linecap='round'/>
    <text x='210' y='160' font-family='sans-serif' font-size='14' fill='#1f2937' transform='rotate(-90 210 160)'>Judicial Evolution</text>

    <!-- Top of the ladder: "Fundamental Right" (Article 21) -->
    <rect x='270' y='30' width='80' height='30' stroke='#1f2937' fill='#e0f2fe'/>
    <text x='280' y='50' font-family='sans-serif' font-size='14' fill='#1f2937'>Art. 21</text>
    <text x='270' y='25' font-family='sans-serif' font-size='12' fill='#1f2937'>Fundamental Right</text>

    <!-- Bottom of the ladder: "Directive Principle" (Article 47) -->
    <rect x='270' y='260' width='80' height='30' stroke='#1f2937' fill='#ffe0b2'/>
    <text x='280' y='280' font-family='sans-serif' font-size='14' fill='#1f2937'>Art. 47</text>
    <text x='270' y='295' font-family='sans-serif' font-size='12' fill='#1f2937'>Directive Principle</text>

    <!-- "Right to Health" as the central concept, moving up -->
    <path d='M300 270 L300 40 M290 50 L300 40 L310 50' stroke='#1f2937' stroke-width='4' stroke-linecap='round'/>
    <text x='330' y='150' font-family='sans-serif' font-size='16' fill='#1f2937' transform='rotate(-90 330 150)'>Right to Health</text>

    <!-- Policy Impact: a factory/building representing legislative action -->
    <rect x='420' y='180' width='100' height='80' fill='#cfd8dc' stroke='#1f2937'/>
    <rect x='440' y='150' width='60' height='30' fill='#cfd8dc' stroke='#1f2937'/>
    <path d='M440 150 L440 130 L450 120 L490 120 L500 130 L500 150' fill='#cfd8dc' stroke='#1f2937'/>
    <line x1='430' y1='200' x2='510' y2='200' stroke='#1f2937'/>
    <line x1='430' y1='220' x2='510' y2='220' stroke='#1f2937'/>
    <line x1='430' y1='240' x2='510' y2='240' stroke='#1f2937'/>
    <circle cx='470' cy='135' r='5' fill='#1f2937'/>
    <text x='430' y='280' font-family='sans-serif' font-size='14' fill='#1f2937'>Policy Impact</text>

    <!-- Arrow from ladder (judiciary) to policy building -->
    <path d='M330 100 L410 100 M400 90 L410 100 L400 110' stroke='#1f2937' stroke-width='3' stroke-linecap='round'/>
    <text x='350' y='90' font-family='sans-serif' font-size='12' fill='#1f2937'>Judicial Enforcement</text>

    <!-- Gap/tension between policy and marginalized groups -->
    <path d='M140 250 L410 250' stroke='#1f2937' stroke-dasharray='5 5' stroke-width='2'/>
    <text x='250' y='240' font-family='sans-serif' font-size='12' fill='#1f2937'>Aspirational Gap</text>

<h1>The Three Major Himalayan River Systems</h1>
<p class="meta">Indian Geography · <a href="/upsc/course/gs/lesson-indian-geography">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Satpura Range -->
  <line x1="80" y1="60" x2="480" y2="60" stroke="#1f2937" stroke-width="3"/>
  <text x="280" y="50" text-anchor="middle" font-size="14" fill="#1f2937">Satpura Range</text>
  <!-- Western Ghats (Water Divide) -->
  <path d="M100,60 C100,120 90,180 100,240 C110,280 120,300 130,300" stroke="#1f2937" stroke-width="3" fill="none"/>
  <text x="99" y="180" text-anchor="end" font-size="13" fill="#1f2937" transform="rotate(-90,70,180)">Western Ghats</text>
  <text x="91.8" y="200" text-anchor="end" font-size="13" fill="#1f2937" transform="rotate(-90,70,200)">Water Divide</text>
  <!-- Eastern Ghats -->
  <path d="M460,60 C460,120 470,180 460,240 C450,280 440,300 430,300" stroke="#1f2937" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <text x="468.2" y="180" text-anchor="start" font-size="12" fill="#1f2937" transform="rotate(90,490,180)">Eastern Ghats</text>
  <!-- Eastward Tilt Arrow -->
  <path d="M150,150 L410,150" stroke="#1f2937" stroke-width="4" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937"/>
    </marker>
  </defs>
  <text x="280" y="148.9" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="bold">Eastward Tilt</text>
  <!-- East-Flowing Rivers (to Bay of Bengal) -->
  <!-- Godavari -->
  <path d="M100,90 Q200,100 280,100 Q360,100 440,100" stroke="#1f2937" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#1f2937">Godavari (Dakshin Ganga)</text>
  <!-- Godavari Delta -->
  <path d="M440,100 L460,90 M440,100 L460,100 M440,100 L460,110" stroke="#1f2937" stroke-width="1.5"/>
  <text x="463.3" y="100" text-anchor="start" font-size="11" fill="#1f2937">Konaseema Delta</text>
  <!-- Mahanadi -->
  <path d="M100,130 Q200,135 280,135 Q360,135 440,135" stroke="#1f2937" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="280" y="130.1" text-anchor="middle" font-size="12" fill="#1f2937">Mahanadi</text>
  <!-- Hirakud Dam -->
  <line x1="280" y1="125" x2="280" y2="145" stroke="#1f2937" stroke-width="4"/>
  <text x="280" y="115" text-anchor="middle" font-size="10" fill="#1f2937">Hirakud Dam</text>
  <!-- Krishna -->
  <path d="M100,170 Q200,175 280,175 Q360,175 440,175" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#1f2937">Krishna</text>
  <!-- Kaveri -->
  <path d="M100,210 Q200,215 280,215 Q360,215 440,215" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#1f2937">Kaveri</text>
  <!-- Pennar -->
  <path d="M100,250 Q200,255 280,255 Q360,255 440,255" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#1f2937">Pennar</text>
  <!-- Bay of Bengal Label -->
  <text x="453.9" y="160" text-anchor="start" font-size="14" fill="#1f2937" transform="rotate(90,500,160)">Bay of Bengal</text>
  <!-- West-Flowing Rivers (to Arabian Sea) -->
  <!-- Narmada -->
  <path d="M100,90 Q60,80 20,80" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="60" y="70" text-anchor="middle" font-size="11" fill="#1f2937">Narmada</text>
  <!-- Tapti -->
  <path d="M100,130 Q60,140 20,140" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="60" y="150" text-anchor="middle" font-size="11" fill="#1f2937">Tapti</text>
  <!-- Mahi -->
  <path d="M100,170 Q60,180 20,180" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="60" y="190" text-anchor="middle" font-size="10" fill="#1f2937">Mahi</text>
  <!-- Rift Valley Label -->
  <text x="42.3" y="220" text-anchor="middle" font-size="11" fill="#1f2937">Rift Valleys</text>
  <!-- Arabian Sea Label -->
  <text x="20" y="280" text-anchor="start" font-size="14" fill="#1f2937" transform="rotate(-90,20,280)">Arabian Sea</text>
  <!-- Caption Strip -->
  <rect x="0" y="290" width="560" height="30" fill="#fbf7ec" stroke="#1f2937" stroke-width="1" stroke-dasharray="none"/>
  <text x="280" y="283.5" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="bold">2. Drainage System (2)</text>
</svg></div>

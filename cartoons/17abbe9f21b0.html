<h1>Decolonisation, the Cold War and the Post‑1991 Order</h1>
<p class="meta">World History II: World Wars to the Cold War · <a href="/upsc/course/mains-gs1/lesson-world-history-modern">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background globe suggestion -->
  <circle cx="280" cy="160" r="140" stroke="#1f2937" stroke-width="2" fill="none" opacity="0.1"/>
  
  <!-- Colonial powers fading left -->
  <g opacity="0.4">
    <rect x="30" y="80" width="60" height="100" stroke="#1f2937" stroke-width="2" fill="none"/>

    <line x1="60" y1="180" x2="150" y2="160" stroke="#1f2937" stroke-width="3" stroke-dasharray="5,5"/>

  </g>
  
  <!-- Broken chains from colonial powers -->
  <g stroke="#1f2937" stroke-width="3">
    <path d="M120,150 Q140,140 160,150" fill="none" stroke-dasharray="10,5"/>
    <path d="M120,170 Q140,180 160,170" fill="none" stroke-dasharray="10,5"/>
    <path d="M120,190 Q140,180 160,190" fill="none" stroke-dasharray="10,5"/>
  </g>

    <rect x="195" y="80" width="20" height="15" stroke="#1f2937" stroke-width="1" fill="none"/>
    <text x="205" y="75">India</text>
    
    <!-- Ghana -->
    <circle cx="280" cy="80" r="15" stroke="#1f2937" stroke-width="2" fill="none"/>

    <text x="365" y="85">Vietnam</text>

    <line x1="420" y1="155" x2="420" y2="180" stroke="#1f2937" stroke-width="2"/>

    <text x="425" y="115">Indonesia</text>
    
    <!-- Algeria -->

    <line x1="220" y1="215" x2="220" y2="240" stroke="#1f2937" stroke-width="2"/>

    <text x="225" y="175">Algeria</text>

  <!-- Cold War puppet strings from above -->
  <g stroke="#1f2937" stroke-width="2" stroke-dasharray="4,4">

    <path d="M150,30 Q180,50 200,100" fill="none"/>
    <path d="M180,30 Q200,50 220,100" fill="none"/>

    <path d="M380,30 Q360,50 340,100" fill="none"/>
    <text x="400" y="25" font-size="14" fill="#1f2937">USSR</text>
  </g>
  
  <!-- Proxy war labels on strings -->
  <text x="200" y="60" text-anchor="middle" font-size="11" fill="#1f2937">Korea</text>
  <text x="360" y="60" text-anchor="middle" font-size="11" fill="#1f2937">Vietnam</text>

  <text x="280" y="21.6" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="bold">COLD WAR</text>

    <path d="M-40,0 L40,0" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
    <path d="M0,-30 L0,30" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>

    <text x="33.2" y="85.3" text-anchor="middle" font-size="11" fill="#1f2937">Gorbachev</text>
  </g>
  
  <!-- Falling Berlin Wall -->
  <g stroke="#1f2937" stroke-width="3">
    <rect x="180" y="280" width="30" height="30" fill="none"/>
    <rect x="220" y="285" width="30" height="25" fill="none"/>
    <rect x="260" y="275" width="30" height="35" fill="none"/>
    <rect x="300" y="282" width="30" height="28" fill="none"/>
    <rect x="340" y="278" width="30" height="32" fill="none"/>
  </g>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#1f2937">Berlin Wall falls</text>
  
  <!-- Unipolar moment arrow -->
  <path d="M450,250 Q480,200 500,150" stroke="#1f2937" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <text x="480" y="140" text-anchor="middle" font-size="12" fill="#1f2937">Unipolar</text>
  <text x="480" y="155" text-anchor="middle" font-size="12" fill="#1f2937">Moment</text>
  
  <!-- Caption strip -->
  
  
  
  <!-- Key term labels -->

  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="bold">DECOLONISATION</text>
  <text x="500" y="260" text-anchor="middle" font-size="11" fill="#1f2937">Proxy conflicts</text>
  <text x="280" y="36.4" text-anchor="middle" font-size="11" fill="#1f2937">Superpower rivalry</text>
</svg></div>

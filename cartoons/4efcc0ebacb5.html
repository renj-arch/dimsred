<h1>3. Union Executive and Legislature</h1>
<p class="meta">Polity &amp;amp; Constitution · <a href="/upsc/course/gs/lesson-polity-prelims">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Central metaphor: President as ceremonial figurehead on pedestal, PM driving the engine of governance -->
  <!-- Pedestal for President -->
  <rect x="220" y="40" width="120" height="20" fill="none" stroke="#1f2937" stroke-width="3"/>
  <rect x="210" y="60" width="140" height="10" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- President figure (ceremonial) -->
  <circle cx="280" cy="30" r="18" fill="none" stroke="#1f2937" stroke-width="3"/>
  <rect x="265" y="48" width="30" height="35" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="265" y1="60" x2="250" y2="80" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <line x1="295" y1="60" x2="310" y2="80" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="83" x2="270" y2="105" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <line x1="280" y1="83" x2="290" y2="105" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <!-- Sash "Ceremonial Head" -->
  <path d="M250 55 Q280 45 310 55" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- Engine of governance (PM + Council of Ministers) -->
  <rect x="80" y="140" width="400" height="100" rx="15" fill="none" stroke="#1f2937" stroke-width="4"/>
  <!-- Wheels -->
  <circle cx="130" cy="245" r="20" fill="none" stroke="#1f2937" stroke-width="4"/>
  <circle cx="430" cy="245" r="20" fill="none" stroke="#1f2937" stroke-width="4"/>
  <circle cx="130" cy="245" r="8" fill="#1f2937"/>
  <circle cx="430" cy="245" r="8" fill="#1f2937"/>
  <!-- PM at controls -->
  <circle cx="160" cy="180" r="16" fill="none" stroke="#1f2937" stroke-width="3"/>
  <rect x="150" y="196" width="20" height="30" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="150" y1="205" x2="130" y2="220" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="205" x2="190" y2="220" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="226" x2="155" y2="245" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="226" x2="165" y2="245" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <!-- Steering wheel -->
  <circle cx="160" cy="190" r="12" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="160" y1="178" x2="160" y2="190" stroke="#1f2937" stroke-width="2"/>
  <line x1="148" y1="190" x2="172" y2="190" stroke="#1f2937" stroke-width="2"/>
  <!-- Council of Ministers behind PM -->
  <circle cx="200" cy="185" r="14" fill="none" stroke="#1f2937" stroke-width="2" opacity="0.7"/>
  <circle cx="230" cy="185" r="14" fill="none" stroke="#1f2937" stroke-width="2" opacity="0.7"/>
  <circle cx="260" cy="185" r="14" fill="none" stroke="#1f2937" stroke-width="2" opacity="0.7"/>
  <text x="275" y="192" font-size="11" fill="#1f2937" font-family="sans-serif">...</text>
  
  <!-- Parliament: Two Houses as two chambers feeding the engine -->
  <!-- Rajya Sabha (States) - upper left -->
  <rect x="30" y="30" width="100" height="80" rx="8" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="30" y1="50" x2="130" y2="50" stroke="#1f2937" stroke-width="2"/>
  <text x="80" y="45" font-size="10" fill="#1f2937" font-family="sans-serif" text-anchor="middle" font-weight="bold">RAJYA SABHA</text>
  <text x="80" y="65" font-size="8" fill="#1f2937" font-family="sans-serif" text-anchor="middle">States</text>
  <text x="80" y="78" font-size="8" fill="#1f2937" font-family="sans-serif" text-anchor="middle">UTs</text>
  <!-- Arrow from Rajya Sabha to engine -->
  <path d="M130 70 Q180 100 200 160" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Lok Sabha (People) - upper right -->
  <rect x="430" y="30" width="100" height="80" rx="8" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="430" y1="50" x2="530" y2="50" stroke="#1f2937" stroke-width="2"/>
  <text x="480" y="45" font-size="10" fill="#1f2937" font-family="sans-serif" text-anchor="middle" font-weight="bold">LOK SABHA</text>
  <text x="480" y="65" font-size="8" fill="#1f2937" font-family="sans-serif" text-anchor="middle">People</text>
  <text x="480" y="78" font-size="8" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Direct</text>
  <!-- Arrow from Lok Sabha to engine -->
  <path d="M430 70 Q380 100 300 160" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Money Bill only from Lok Sabha - special arrow -->
  <path d="M480 110 Q400 130 250 180" fill="none" stroke="#1f2937" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="380" y="125" font-size="9" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Money Bill</text>
  
  <!-- President's veto powers as symbols near President -->
  <rect x="350" y="20" width="25" height="25" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="362" y="38" font-size="14" fill="#1f2937" font-family="sans-serif" text-anchor="middle">✕</text>
  <text x="362" y="55" font-size="7" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Veto</text>
  
  <rect x="385" y="20" width="25" height="25" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="397" y="38" font-size="14" fill="#1f2937" font-family="sans-serif" text-anchor="middle">⏸</text>
  <text x="397" y="55" font-size="7" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Suspensive</text>
  
  <rect x="420" y="20" width="25" height="25" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="432" y="38" font-size="14" fill="#1f2937" font-family="sans-serif" text-anchor="middle">👁</text>
  <text x="432" y="55" font-size="7" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Pocket</text>
  
  <!-- Article 74 aid & advice arrow from PM to President -->
  <path d="M180 180 Q230 100 270 60" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="220" y="110" font-size="9" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Art. 74</text>
  
  <!-- Accountability arrow from engine to Lok Sabha -->
  <path d="M300 240 Q350 200 430 110" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="360" y="190" font-size="9" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Responsible</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>
  
  <!-- Labels (key terms from passage) -->
  <text x="280" y="125" font-size="14" fill="#1f2937" font-family="sans-serif" text-anchor="middle" font-weight="bold">PRESIDENT</text>
  <text x="280" y="138" font-size="11" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Ceremonial Head</text>
  
  <text x="240" y="255" font-size="12" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Council of Ministers</text>
  <text x="80" y="120" font-size="11" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Rajya Sabha</text>
  <text x="80" y="132" font-size="10" fill="#1f2937" font-family="sans-serif" text-anchor="middle">States Council</text>
  <text x="480" y="120" font-size="11" fill="#1f2937" font-family="sans-serif" text-anchor="middle">Lok Sabha</text>
  <text x="480" y="132" font-size="10" fill="#1f2937" font-family="sans-serif" text-anchor="middle">House of People</text>
  
  <!-- Caption strip at bottom -->
  <rect x="0" y="285" width="560" height="35" fill="#1f2937"/>
  <text x="280" y="278.5" font-size="14" fill="#fbf7ec" font-family="sans-serif" text-anchor="middle" font-weight="bold">3. Union Executive and Legislature</text>
</svg></div>

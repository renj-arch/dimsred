<h1>The Vaishnava Revolution and the Shift from Sanskrit to Odia</h1>
<p class="meta">Odia Literature Paper II: Texts &amp;amp; Criticism · <a href="/upsc/course/opt-odia/lesson-paper2">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="560" height="320" fill="#fbf7ec"/>
  
  <!-- Central metaphor: Transforming manuscript -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Manuscript base -->
    <path d="M180 80 L380 80 L380 240 L180 240 Z" stroke-width="3"/>
    <line x1="280" y1="80" x2="280" y2="240" stroke-dasharray="8,4"/>
    
    <!-- Sanskrit side (left) - devanagari-like lines -->
    <g transform="translate(200, 120)">
      <line x1="-40" y1="-30" x2="40" y2="-30"/>
      <line x1="-30" y1="-15" x2="30" y2="-15"/>
      <line x1="-35" y1="0" x2="35" y2="0"/>
      <line x1="-25" y1="15" x2="25" y2="15"/>
      <line x1="-30" y1="30" x2="30" y2="30"/>
      <!-- Brahmin scholar -->
      <circle cx="-60" cy="60" r="18" stroke-width="2.5"/>
      <path d="M-70 78 Q-60 95 -50 78" stroke-width="2.5"/>
      <line x1="-60" y1="78" x2="-60" y2="110" stroke-width="2.5"/>
      <line x1="-75" y1="90" x2="-45" y2="90" stroke-width="2.5"/>
      <path d="M-75 110 Q-60 130 -45 110" stroke-width="2.5"/>
    </g>
    
    <!-- Odia side (right) - Odia-like curves + rural symbols -->
    <g transform="translate(360, 120)">
      <path d="M-30 -30 Q0 -20 30 -30" stroke-width="2.5"/>
      <path d="M-25 -10 Q5 0 25 -10" stroke-width="2.5"/>
      <path d="M-20 10 Q10 20 20 10" stroke-width="2.5"/>
      <path d="M-15 30 Q15 40 15 30" stroke-width="2.5"/>
      <!-- Common devotee -->
      <circle cx="55" cy="60" r="18" stroke-width="2.5"/>
      <path d="M45 78 Q55 95 65 78" stroke-width="2.5"/>
      <line x1="55" y1="78" x2="55" y2="110" stroke-width="2.5"/>
      <line x1="40" y1="90" x2="70" y2="90" stroke-width="2.5"/>
      <path d="M40 110 Q55 130 70 110" stroke-width="2.5"/>
      <!-- Rural symbols emerging from text -->
      <g transform="translate(80, 20)" stroke-width="2">
        <!-- Plow -->
        <path d="M0 0 L-20 -15 M-20 -15 L-30 -5 M-20 -15 L-10 -5"/>
        <!-- Fish -->
        <path d="M30 10 Q50 5 60 10 Q50 15 30 10"/>
        <!-- Cow head -->
        <path d="M10 35 Q25 25 40 35 Q35 45 25 50 Q15 45 10 35"/>
      </g>
    </g>
    
    <!-- Bhakti thread connecting figures -->
    <path d="M140 180 Q280 140 420 180" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
    <circle cx="280" cy="150" r="8" fill="#1f2937" opacity="0.3"/>
  </g>
  
  <!-- Supporting images (4 corners) -->
  <!-- Top-left: Jayadeva/Gita-Govinda -->
  <g transform="translate(60, 40)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <rect x="0" y="0" width="80" height="50" rx="3"/>
    <line x1="10" y1="15" x2="70" y2="15"/>
    <line x1="10" y1="25" x2="60" y2="25"/>
    <line x1="10" y1="35" x2="65" y2="35"/>
    <text x="42.3" y="79.6" font-size="11" text-anchor="middle" fill="#1f2937">GITA-GOVINDA</text>
  </g>
  
  <!-- Top-right: Chaitanya Mahaprabhu -->
  <g transform="translate(420, 40)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <circle cx="40" cy="25" r="20"/>
    <path d="M25 25 Q40 10 55 25" stroke-width="2"/>
    <line x1="40" y1="45" x2="40" y2="75"/>
    <line x1="25" y1="55" x2="55" y2="55"/>
    <text x="40" y="92" font-size="11" text-anchor="middle" fill="#1f2937">CHAITANYA</text>
  </g>
  
  <!-- Bottom-left: Hybrid manuscript -->
  <g transform="translate(60, 230)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <rect x="0" y="0" width="80" height="50" rx="3"/>
    <line x1="10" y1="12" x2="70" y2="12"/>
    <path d="M10 24 Q40 20 70 24" stroke-width="2"/>
    <line x1="10" y1="36" x2="70" y2="36"/>
    <text x="42.3" y="65" font-size="11" text-anchor="middle" fill="#1f2937">HYBRID STYLE</text>
  </g>
  
  <!-- Bottom-right: Rural life feeding literature -->
  <g transform="translate(420, 230)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <!-- Farmer -->
    <circle cx="40" cy="20" r="12"/>
    <line x1="40" y1="32" x2="40" y2="55"/>
    <line x1="30" y1="40" x2="50" y2="40"/>
    <line x1="35" y1="55" x2="30" y2="65"/>
    <line x1="45" y1="55" x2="50" y2="65"/>
    <!-- Plow in hand -->
    <path d="M50 40 L65 30 L70 35" stroke-width="2"/>
    <text x="51.4" y="106.6" font-size="11" text-anchor="middle" fill="#1f2937">RURAL METAPHORS</text>
  </g>
  
  <!-- Labels for central image -->
  <text x="140" y="70" font-size="13" text-anchor="middle" fill="#1f2937">SANSKRITABHASHA</text>
  <text x="420" y="70" font-size="13" text-anchor="middle" fill="#1f2937">KANDA-BHASHA</text>
  <text x="280" y="140" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">BHAKTI</text>
  <text x="280" y="260" font-size="12" text-anchor="middle" fill="#1f2937">BHAKTI-KAVYA GENRE</text>
  
  <!-- Bottom caption strip -->
  <rect x="14" y="290" width="532" height="26" fill="#1f2937" rx="2"/>
  <text x="280" y="283.5" font-size="14" text-anchor="middle" fill="#fbf7ec" font-weight="bold">The Vaishnava Revolution and the Shift from Sanskrit to Odia</text>
</svg></div>

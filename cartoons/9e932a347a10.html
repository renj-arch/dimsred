<h1>The Pandyas (c. 590-1344 CE) &amp;mdash; The Masters of Madurai</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Ground line -->
  <line x1="40" y1="260" x2="520" y2="260" stroke="#1f2937" stroke-width="3"/>
  <!-- Stepping stones: earlier kings -->
  <g font-family="Georgia, serif" font-size="14" fill="#1f2937" text-anchor="middle">
    <!-- Vijayalaya -->
    <circle cx="80" cy="240" r="22" stroke="#1f2937" stroke-width="3" fill="none"/>
    <text x="80" y="245">V</text>
    <text x="80" y="220" font-size="11">VIJAYALAYA</text>
    <text x="80" y="205" font-size="10">850 CE</text>
    <!-- Aditya I -->
    <circle cx="160" cy="210" r="24" stroke="#1f2937" stroke-width="3" fill="none"/>
    <text x="160" y="215">A</text>
    <text x="160" y="188" font-size="11">ADITYA I</text>
    <text x="160" y="175" font-size="10">871-907</text>
    <!-- Parantaka I -->
    <circle cx="240" cy="180" r="26" stroke="#1f2937" stroke-width="3" fill="none"/>
    <text x="240" y="185">P</text>
    <text x="240" y="156" font-size="11">PARANTAKA I</text>
    <text x="240" y="143" font-size="10">907-955</text>
    <!-- Uttaramerur scroll at Parantaka's base -->
    <rect x="210" y="265" width="60" height="18" stroke="#1f2937" stroke-width="2" fill="none"/>
    <line x1="215" y1="270" x2="265" y2="270" stroke="#1f2937" stroke-width="1"/>
    <line x1="215" y1="275" x2="265" y2="275" stroke="#1f2937" stroke-width="1"/>
    <text x="240" y="295" font-size="10">UTTARAMEUR</text>
  </g>
  <!-- Rajaraja I - colossal central figure -->
  <g transform="translate(340, 100)">
    <!-- Body robe -->
    <path d="M0,160 L-60,160 L-40,0 L40,0 L60,160 Z" stroke="#1f2937" stroke-width="4" fill="none"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="30" stroke="#1f2937" stroke-width="4" fill="none"/>
    <!-- Crown -->
    <path d="M-25,-45 L-15,-65 L0,-50 L15,-65 L25,-45 Z" stroke="#1f2937" stroke-width="3" fill="none"/>
    <!-- Scepter -->
    <line x1="50" y1="0" x2="90" y2="-40" stroke="#1f2937" stroke-width="4"/>
    <circle cx="90" cy="-45" r="8" stroke="#1f2937" stroke-width="3" fill="none"/>
    <!-- Label -->
    <text x="0" y="190" font-family="Georgia, serif" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold">RAJARAJA I</text>
    <text x="0" y="210" font-family="Georgia, serif" font-size="12" fill="#1f2937" text-anchor="middle">985-1014 CE</text>
  </g>
  <!-- Brihadeeswarar temple behind Rajaraja -->
  <path d="M280,260 L260,80 L300,40 L340,80 L320,260 Z" stroke="#1f2937" stroke-width="3" fill="none"/>
  <path d="M290,80 L310,80" stroke="#1f2937" stroke-width="2"/>
  <path d="M285,120 L315,120" stroke="#1f2937" stroke-width="1.5"/>
  <path d="M280,160 L320,160" stroke="#1f2937" stroke-width="1"/>
  <text x="300" y="60" font-family="Georgia, serif" font-size="11" fill="#1f2937" text-anchor="middle">THANJAVUR</text>
  <!-- Chola tiger emblem on flag -->
  <g transform="translate(380, 60)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#1f2937" stroke-width="3"/>
    <path d="M0,0 L30,15 L0,30 Z" stroke="#1f2937" stroke-width="2" fill="none"/>
    <circle cx="8" cy="12" r="3" stroke="#1f2937" stroke-width="1.5" fill="none"/>
    <path d="M5,12 L11,12 M8,9 L8,15" stroke="#1f2937" stroke-width="1"/>
  </g>
  <text x="395" y="55" font-family="Georgia, serif" font-size="10" fill="#1f2937">CHOLA TIGER</text>
  <!-- Naval expansion to right -->
  <g transform="translate(420, 180)">
    <!-- Ship 1 -->
    <path d="M0,0 L-40,20 L-40,40 L0,60 L40,40 L40,20 Z" stroke="#1f2937" stroke-width="3" fill="none"/>
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#1f2937" stroke-width="2"/>
    <path d="M-10,-10 L10,-10 L5,-25 L-5,-25 Z" stroke="#1f2937" stroke-width="2" fill="none"/>
    <!-- Ship 2 -->
    <path d="M60,10 L20,30 L20,50 L60,70 L100,50 L100,30 Z" stroke="#1f2937" stroke-width="2.5" fill="none"/>
    <line x1="60" y1="10" x2="60" y2="-20" stroke="#1f2937" stroke-width="1.5"/>
    <path d="M50,0 L70,0 L65,-15 L55,-15 Z" stroke="#1f2937" stroke-width="1.5" fill="none"/>
    <!-- Arrow -->
    <line x1="110" y1="40" x2="160" y2="40" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 Z" fill="#1f2937"/>
      </marker>
    </defs>
  </g>
  <!-- Sri Lanka / Polonnaruwa -->
  <ellipse cx="500" cy="240" rx="45" ry="25" stroke="#1f2937" stroke-width="2" fill="none" fill-opacity="0"/>
  <text x="500" y="230" font-family="Georgia, serif" font-size="11" fill="#1f2937" text-anchor="middle">POLONNARUWA</text>
  <text x="500" y="245" font-family="Georgia, serif" font-size="10" fill="#1f2937" text-anchor="middle">MUMMUDI CHOLA</text>
  <text x="500" y="260" font-family="Georgia, serif" font-size="10" fill="#1f2937" text-anchor="middle">MANDALAM</text>
  <!-- Kandalur Salai label -->
  <text x="420" y="160" font-family="Georgia, serif" font-size="10" fill="#1f2937" text-anchor="middle">KANDALUR SALAI</text>
  <text x="420" y="172" font-family="Georgia, serif" font-size="10" fill="#1f2937" text-anchor="middle">CHERA NAVY</text>
  <text x="420" y="184" font-family="Georgia, serif" font-size="10" fill="#1f2937" text-anchor="middle">DESTROYED</text>
  <!-- Maldives hint -->
  <circle cx="480" cy="290" r="5" stroke="#1f2937" stroke-width="1.5" fill="none"/>
  <circle cx="495" cy="295" r="4" stroke="#1f2937" stroke-width="1.5" fill="none"/>
  <circle cx="510" cy="288" r="3" stroke="#1f2937" stroke-width="1" fill="none"/>
  <text x="500" y="310" font-family="Georgia, serif" font-size="9" fill="#1f2937" text-anchor="middle">MALDIVES</text>
  <!-- Raichur Doab / Western Chalukyas -->
  <text x="180" y="100" font-family="Georgia, serif" font-size="10" fill="#1f2937" text-anchor="middle">RAICHUR DOAB</text>
  <text x="180" y="112" font-family="Georgia, serif" font-size="10" fill="#1f2937" text-anchor="middle">W. CHALUKYAS</text>
  <text x="180" y="124" font-family="Georgia, serif" font-size="10" fill="#1f2937" text-anchor="middle">DEFEATED</text>
  <!-- Caption strip -->
  <rect x="0" y="290" width="560" height="30" fill="#1f2937"/>
  <text x="280" y="310" font-family="Georgia, serif" font-size="13" fill="#fbf7ec" text-anchor="middle">10. South Indian Kingdoms (750-1300 CE)</text>
</svg></div>

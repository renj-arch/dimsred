<h1>4. Drainage Systems and River Regimes</h1>
<p class="meta">Indian Geography: Physiography, Drainage and Mapping · <a href="/upsc/course/mains-gs1/lesson-geography-india-mapping">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Himalaya mountain -->
  <path d="M100,250 L280,30 L460,250 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Glacier on left slope -->
  <path d="M140,180 L160,160 L180,175 L200,155 L220,170" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glacial melt arrows -->
  <path d="M180,170 L190,190 L200,180" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M200,165 L210,185 L220,175" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Monsoon cloud -->
  <circle cx="480" cy="60" r="25" fill="none" stroke="#1f2937" stroke-width="2"/>
  <circle cx="510" cy="55" r="20" fill="none" stroke="#1f2937" stroke-width="2"/>
  <circle cx="500" cy="80" r="18" fill="none" stroke="#1f2937" stroke-width="2"/>
  <!-- Rain arrows -->
  <path d="M480,90 L480,120" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500,95 L500,125" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520,90 L520,120" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Three rivers -->
  <!-- Indus (left) -->
  <path d="M200,250 Q180,200 150,150 Q130,120 120,80" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Ganga (middle) -->
  <path d="M280,250 Q280,200 280,150 Q280,120 280,80" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Brahmaputra (right) -->
  <path d="M360,250 Q380,200 410,150 Q430,120 440,80" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Sediment dots (increasing downstream) -->
  <g fill="#1f2937">
    <!-- Upper reaches sparse -->
    <circle cx="130" cy="100" r="1.5"/><circle cx="140" cy="110" r="1.5"/>
    <circle cx="280" cy="100" r="1.5"/><circle cx="280" cy="110" r="1.5"/>
    <circle cx="420" cy="100" r="1.5"/><circle cx="430" cy="110" r="1.5"/>
    <!-- Mid reaches denser -->
    <circle cx="160" cy="160" r="1.5"/><circle cx="170" cy="170" r="1.5"/><circle cx="180" cy="180" r="1.5"/>
    <circle cx="270" cy="160" r="1.5"/><circle cx="280" cy="170" r="1.5"/><circle cx="290" cy="180" r="1.5"/>
    <circle cx="390" cy="160" r="1.5"/><circle cx="400" cy="170" r="1.5"/><circle cx="410" cy="180" r="1.5"/>
    <!-- Lower reaches very dense -->
    <circle cx="180" cy="220" r="1.5"/><circle cx="190" cy="225" r="1.5"/><circle cx="200" cy="230" r="1.5"/><circle cx="210" cy="235" r="1.5"/>
    <circle cx="270" cy="220" r="1.5"/><circle cx="280" cy="225" r="1.5"/><circle cx="290" cy="230" r="1.5"/><circle cx="300" cy="235" r="1.5"/>
    <circle cx="380" cy="220" r="1.5"/><circle cx="390" cy="225" r="1.5"/><circle cx="400" cy="230" r="1.5"/><circle cx="410" cy="235" r="1.5"/>
  </g>
  <!-- Delta fan -->
  <path d="M150,250 L280,300 L410,250" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M180,250 L280,290 L380,250" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M210,250 L280,280 L350,250" fill="none" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Peninsular rivers (seasonal) -->
  <path d="M450,180 Q470,200 480,220" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M480,180 Q500,200 510,220" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M510,180 Q530,200 540,220" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Labels -->
  <text x="120" y="60" font-size="13" fill="#1f2937" text-anchor="middle">Glacial Melt</text>
  <text x="500" y="40" font-size="13" fill="#1f2937" text-anchor="middle">Monsoon Rain</text>
  <text x="100" y="130" font-size="13" fill="#1f2937" text-anchor="middle">Indus</text>
  <text x="280" y="130" font-size="13" fill="#1f2937" text-anchor="middle">Ganga</text>
  <text x="460" y="130" font-size="13" fill="#1f2937" text-anchor="middle">Brahmaputra</text>
  <text x="280" y="200" font-size="13" fill="#1f2937" text-anchor="middle">High Sediment</text>
  <text x="280" y="305" font-size="13" fill="#1f2937" text-anchor="middle">Delta</text>
  <text x="493.2" y="170" font-size="13" fill="#1f2937" text-anchor="middle">Peninsular Rivers</text>

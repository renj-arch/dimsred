<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->

  <!-- Garden boundary (square 240x240 centered at 280,160) -->
  <rect x="160" y="40" width="240" height="240" fill="none" stroke="#1f2937" stroke-width="3"/>
  
  <!-- Water channels (cross) -->
  <line x1="280" y1="40" x2="280" y2="280" stroke="#1f2937" stroke-width="4"/>
  <line x1="160" y1="160" x2="400" y2="160" stroke="#1f2937" stroke-width="4"/>

  <!-- River symbol -->

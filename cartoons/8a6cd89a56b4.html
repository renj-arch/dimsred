<h1>The Anatomy of the Introduction: Hook, Thesis, and Roadmap</h1>
<p class="meta">Essay Structure &amp; Argument · <a href="/upsc/course/mains-essay/lesson-essay-structure">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background grid lines -->
  <g stroke="#1f2937" stroke-width="1" opacity="0.1">
    <line x1="0" y1="80" x2="560" y2="80"/>
    <line x1="0" y1="160" x2="560" y2="160"/>
    <line x1="0" y1="240" x2="560" y2="240"/>
    <line x1="140" y1="0" x2="140" y2="320"/>
    <line x1="280" y1="0" x2="280" y2="320"/>
    <line x1="420" y1="0" x2="420" y2="320"/>
  </g>

  <!-- Central metaphor: Three-stage introduction assembly line -->
  <!-- Stage 1: HOOK - Left -->
  <rect x="20" y="40" width="100" height="100" fill="none" stroke="#1f2937" stroke-width="3" rx="8"/>
  <text x="70" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1f2937">HOOK</text>
  <!-- Hook types as items on conveyor -->
  <circle cx="70" cy="105" r="12" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="70" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#1f2937">ANECDOTE</text>
  <rect x="45" y="125" width="50" height="10" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="70" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">DATA</text>
  <path d="M70 140 L70 155" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">QUOTE</text>
  <path d="M55 170 L85 170 M70 160 L70 180" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">CONTRAST</text>
  <!-- Rejected "Since Time Immemorial" -->
  <text x="70" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#1f2937" style="text-decoration: line-through;">SINCE TIME</text>
  <text x="70" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#1f2937" style="text-decoration: line-through;">IMMEMORIAL</text>
  <path d="M30 215 L110 215" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Arrow to Stage 2 -->
  <path d="M120 90 L160 90 M155 85 L160 90 L155 95" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>

  <!-- Stage 2: THESIS - Center -->
  <rect x="160" y="40" width="120" height="100" fill="none" stroke="#1f2937" stroke-width="3" rx="8"/>
  <text x="220" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1f2937">THESIS</text>
  <!-- Weak thesis crushed -->
  <text x="220" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937" opacity="0.5">EDUCATION IS</text>
  <text x="220" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937" opacity="0.5">IMPORTANT</text>
  <!-- Hammer striking -->
  <path d="M220 120 L220 140" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <rect x="210" y="115" width="20" height="10" fill="#1f2937"/>
  <!-- Strong thesis emerging -->
  <rect x="175" y="145" width="90" height="35" fill="none" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="220" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">CONTESTABLE</text>
  <text x="220" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">QUALIFIED</text>
  <text x="220" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">DIMENSIONAL</text>

  <!-- Arrow to Stage 3 -->
  <path d="M280 90 L320 90 M315 85 L320 90 L315 95" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>

  <!-- Stage 3: ROADMAP - Right -->
  <rect x="320" y="40" width="100" height="100" fill="none" stroke="#1f2937" stroke-width="3" rx="8"/>
  <text x="370" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1f2937">ROADMAP</text>
  <!-- Signposts -->
  <path d="M370 95 L370 180" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <rect x="350" y="100" width="40" height="16" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="370" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">SOCIAL</text>
  <rect x="350" y="122" width="40" height="16" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="370" y="134" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">POLITICAL</text>
  <rect x="350" y="144" width="40" height="16" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="370" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">ECONOMIC</text>
  <rect x="350" y="166" width="40" height="16" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="370" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#1f2937">CULTURAL</text>

  <!-- Examiner figure at bottom center observing -->
  <circle cx="280" cy="260" r="18" fill="none" stroke="#1f2937" stroke-width="3"/>
  <path d="M280 278 L280 300" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
  <path d="M265 290 L280 300 L295 290" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M265 285 L280 295 L295 285" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Magnifying glass -->
  <circle cx="250" cy="250" r="12" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M258 258 L270 270" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Labels (4-8 short labels) -->
  <text x="70" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1f2937">SPECIFICITY</text>
  <text x="220" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1f2937">QUALIFIED</text>
  <text x="370" y="25" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1f2937">DIMENSIONS</text>
  <text x="480" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">~110 WORDS</text>
  <text x="480" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">TOTAL</text>

  <!-- Caption strip at bottom -->
  <rect x="0" y="290" width="560" height="30" fill="#1f2937"/>
  <text x="280" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#fbf7ec">The Anatomy of the Introduction: Hook, Thesis, and Roadmap</text>
</svg></div>

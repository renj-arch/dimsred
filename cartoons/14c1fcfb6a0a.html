<h1>Outcome Budgeting, Gender Budgeting and Performance‑Based Allocation</h1>
<p class="meta">Fiscal Policy, Budget and Public Finance · <a href="/upsc/course/mains-gs3/lesson-fiscal-policy">Read the lesson →</a></p>
<div class="hero"><svg viewBox='0 0 560 320'>
  <rect x='0' y='0' width='560' height='320' fill='#fbf7ec'/>

  <!-- Central metaphor: A person balancing on a tightrope, representing debt management.
       The tightrope is the "path" of debt, with various tools used to keep balance. -->

  <!-- Tightrope Walker (Government/PDMC) -->
  <g fill='none' stroke='#1f2937' stroke-width='3'>
    <!-- Body -->
    <path d='M280 120 L280 160 L270 200 M290 200 L280 160'/>
    <!-- Head -->
    <circle cx='280' cy='105' r='15'/>
    <!-- Balancing Pole (RBI/PDMC) -->
    <line x1='200' y1='135' x2='360' y2='135' stroke-width='4'/>
    <!-- Hands holding pole -->
    <line x1='270' y1='135' x2='275' y2='140'/>
    <line x1='290' y1='135' x2='285' y2='140'/>
  </g>
  <text x="255" y="90" font-family='sans-serif' font-size='16' fill='#1f2937' text-anchor='middle'>Govt / PDMC</text>

  <!-- Tightrope (Sovereign Debt) -->
  <line x1='50' y1='210' x2='510' y2='210' stroke='#1f2937' stroke-width='2'/>
  <text x="280" y="200" font-family='sans-serif' font-size='16' fill='#1f2937' text-anchor='middle'>Sovereign Debt</text>

  <!-- Tools for balance (represented as weights/adjustments on the pole) -->
  <!-- Left side of pole -->
  <g fill='none' stroke='#1f2937' stroke-width='2'>
    <!-- Issuance Calendar -->
    <rect x='170' y='145' width='20' height='15'/>
    <text x="180" y="175" font-family='sans-serif' font-size='14' fill='#1f2937' text-anchor='middle'>Issuance</text>
    <path d='M180 160 L180 135'/>

    <!-- Buybacks -->
    <path d='M140 145 L150 155 L140 165 L150 175'/>
    <text x="145" y="197.7" font-family='sans-serif' font-size='14' fill='#1f2937' text-anchor='middle'>Buybacks</text>
    <path d='M145 175 L145 135'/>

    <!-- OMOs/LAF -->
    <circle cx='110' cy='155' r='10'/>
    <text x="110" y="180" font-family='sans-serif' font-size='14' fill='#1f2937' text-anchor='middle'>OMOs/LAF</text>
    <path d='M110 165 L110 135'/>
  </g>

  <!-- Right side of pole -->
  <g fill='none' stroke='#1f2937' stroke-width='2'>
    <!-- Cash Management Bills (CMBs) -->
    <path d='M390 145 L400 155 L390 165 L400 175'/>
    <text x="395" y="190" font-family='sans-serif' font-size='14' fill='#1f2937' text-anchor='middle'>CMBs</text>
    <path d='M395 175 L395 135'/>

    <!-- Extended Maturity -->
    <rect x='420' y='145' width='20' height='15'/>
    <text x="430" y="175" font-family='sans-serif' font-size='14' fill='#1f2937' text-anchor='middle'>Maturity</text>
    <path d='M430 160 L430 135'/>
  </g>

  <!-- Balancing Act Goals -->
  <text x="50" y="240" font-family='sans-serif' font-size='14' fill='#1f2937'>Min. Cost</text>
  <text x="438.5" y="240" font-family='sans-serif' font-size='14' fill='#1f2937'>Reduce Rollover</text>

  <!-- RBI as the platform/support -->
  <rect x='220' y='210' width='120' height='30' fill='#1f2937'/>
  <text x="280" y="230" font-family='sans-serif' font-size='16' fill='#fbf7ec' text-anchor='middle'>RBI</text>

  <!-- Conflict with MPC/Interest Rates -->
  <path d='M350 70 L380 70 L380 90 L350 90 Z' fill='#1f2937'/>
  <text x="365" y="83" font-family='sans-serif' font-size='14' fill='#fbf7ec' text-anchor='middle'>MPC</text>
  <path d='M380 80 L320 100' stroke='#1f2937' stroke-width='2' marker-end='url(#arrowhead)'/>
  <path d='M320 100 L380 120' stroke='#1f2937' stroke-width='2' marker-end='url(#arrowhead)'/>
  <text x="420" y="100" font-family='sans-serif' font-size='14' fill='#1f2937'>Interest Rates</text>

  <defs>
    <marker id='arrowhead' markerWidth='10' markerHeight='7' refX='0' refY='3.5' orient='auto'>
      <polygon points='0 0, 10 3.5, 0 7' fill='#1f2937'/>
    </marker>
  </defs>

  <!-- Caption strip -->
  <rect x='0' y='285' width='560' height='35' fill='#1f2937'/>

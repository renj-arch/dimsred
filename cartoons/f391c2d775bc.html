<h1>2. Ecosystem Structure and Function</h1>
<p class="meta">Environment &amp;amp; Ecology · <a href="/upsc/course/gs/lesson-environment-prelims">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Central ecosystem circle -->
  <circle cx="280" cy="160" r="110" stroke="#1f2937" stroke-width="3" fill="none"/>
  <!-- Biotic components -->
  <g font-size="12" text-anchor="middle" fill="#1f2937">
    <!-- Producers -->
    <circle cx="280" cy="70" r="35" stroke="#1f2937" stroke-width="2" fill="none"/>
    <path d="M280 55 L280 40 M270 50 L290 50 M275 45 L285 35" stroke="#1f2937" stroke-width="2" fill="none"/>
    <text x="280" y="115">PRODUCERS</text>
    <!-- Consumers -->
    <circle cx="380" cy="220" r="35" stroke="#1f2937" stroke-width="2" fill="none"/>
    <ellipse cx="380" cy="215" rx="12" ry="8" stroke="#1f2937" stroke-width="2" fill="none"/>
    <ellipse cx="372" cy="212" rx="3" ry="3" fill="#1f2937"/>
    <ellipse cx="388" cy="212" rx="3" ry="3" fill="#1f2937"/>
    <path d="M370 220 Q380 225 390 220" stroke="#1f2937" stroke-width="2" fill="none"/>
    <text x="380" y="265">CONSUMERS</text>
    <!-- Decomposers -->
    <circle cx="180" cy="220" r="35" stroke="#1f2937" stroke-width="2" fill="none"/>
    <path d="M170 220 L190 220 M175 210 L175 230 M185 210 L185 230" stroke="#1f2937" stroke-width="2" fill="none"/>
    <ellipse cx="180" cy="205" rx="10" ry="5" stroke="#1f2937" stroke-width="2" fill="none"/>
    <text x="180" y="265">DECOMPOSERS</text>
  </g>
  <!-- Energy flow arrows -->
  <path d="M280 105 L280 135" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M310 180 Q330 190 350 205" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M250 180 Q230 190 190 205" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M280 105 Q250 130 190 205" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
  <path d="M280 105 Q310 130 350 205" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
  <!-- Abiotic factors icons -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- Sun -->
    <circle cx="120" cy="50" r="15"/>
    <g transform="translate(120,50)">
      <line x1="0" y1="-22" x2="0" y2="-16"/>
      <line x1="0" y1="16" x2="0" y2="22"/>
      <line x1="-22" y1="0" x2="-16" y2="0"/>
      <line x1="16" y1="0" x2="22" y2="0"/>
      <line x1="-15" y1="-15" x2="-11" y2="-11"/>
      <line x1="11" y1="11" x2="15" y2="15"/>
      <line x1="-15" y1="15" x2="-11" y2="11"/>
      <line x1="11" y1="-11" x2="15" y2="-15"/>
    </g>
    <text x="120" y="30" font-size="11" text-anchor="middle" fill="#1f2937">SUN</text>
    <!-- Rain -->
    <path d="M440 50 Q440 65 425 75 Q440 65 440 80" stroke="#1f2937" stroke-width="2" fill="none"/>
    <path d="M455 50 Q455 65 440 75 Q455 65 455 80" stroke="#1f2937" stroke-width="2" fill="none"/>
    <path d="M470 50 Q470 65 455 75 Q470 65 470 80" stroke="#1f2937" stroke-width="2" fill="none"/>
    <text x="455" y="30" font-size="11" text-anchor="middle" fill="#1f2937">RAIN</text>
    <!-- Temperature -->
    <rect x="100" y="280" width="12" height="40" rx="6" stroke="#1f2937" stroke-width="2" fill="none"/>
    <rect x="102" y="290" width="8" height="30" fill="#1f2937"/>
    <text x="106" y="312" font-size="10" text-anchor="middle" fill="#1f2937">TEMP</text>
    <!-- pH / minerals -->
    <text x="460" y="295" font-size="11" text-anchor="middle" fill="#1f2937">pH, MINERALS</text>
  </g>
  <!-- Nutrient cycles -->
  <g stroke="#1f2937" stroke-width="2" fill="none" font-size="12" text-anchor="middle">
    <!-- Carbon cycle -->
    <path d="M280 50 Q400 50 420 160 Q400 270 280 270 Q160 270 140 160 Q160 50 280 50" stroke-dasharray="8,4"/>
    <text x="430" y="160" transform="rotate(90 430 160)">CARBON CYCLE</text>
    <!-- Nitrogen cycle -->
    <path d="M280 70 Q380 70 395 160 Q380 250 280 250 Q180 250 165 160 Q180 70 280 70" stroke-dasharray="6,3" opacity="0.8"/>
    <text x="405" y="160" transform="rotate(90 405 160)">NITROGEN CYCLE</text>
    <!-- Phosphorus cycle -->
    <path d="M280 90 Q350 90 360 160 Q350 230 280 230 Q210 230 200 160 Q210 90 280 90" stroke-dasharray="4,2" opacity="0.6"/>
    <text x="370" y="160" transform="rotate(90 370 160)">PHOSPHORUS CYCLE</text>
  </g>
  <!-- Human impact: factory disrupting carbon cycle -->
  <g transform="translate(480,140)" stroke="#1f2937" stroke-width="2" fill="none">
    <rect x="0" y="0" width="50" height="40" rx="2"/>
    <rect x="15" y="-20" width="12" height="25" rx="1"/>
    <path d="M21 -20 Q30 -30 40 -25 Q50 -20 55 -10" stroke="#1f2937" stroke-width="1.5" fill="none"/>
    <text x="25" y="55" font-size="10" text-anchor="middle" fill="#1f2937">FACTORY</text>
    <text x="25" y="65" font-size="10" text-anchor="middle" fill="#1f2937">CO₂ ↑</text>
  </g>
  <!-- Succession stages at bottom -->
  <g font-size="10" text-anchor="middle" fill="#1f2937" stroke="#1f2937" stroke-width="1.5">
    <rect x="40" y="285" width="50" height="25" fill="none"/>
    <path d="M50 300 L55 295 L60 300 L55 290 L50 295" stroke="#1f2937" stroke-width="1.5" fill="none"/>
    <text x="65" y="312">BARE ROCK</text>
    <rect x="150" y="285" width="50" height="25" fill="none"/>
    <path d="M160 305 L165 295 L170 305 L175 290 L180 300" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="175" y="312">PIONEERS</text>
    <rect x="260" y="285" width="50" height="25" fill="none"/>
    <path d="M270 305 L275 290 L280 305 L285 285 L290 305" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="285" y="312">SHRUBS</text>
    <rect x="370" y="285" width="50" height="25" fill="none"/>
    <path d="M380 305 L385 285 L390 305 L395 280 L400 305 L405 275 L410 305" stroke="#1f2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="395" y="312">CLIMAX FOREST</text>
    <path d="M90 297 L140 297 M200 297 L250 297 M310 297 L360 297" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <!-- Caption strip -->
  <rect x="0" y="290" width="560" height="30" fill="#e8e0d0"/>
  <text x="280" y="312" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">2. Ecosystem Structure and Function</text>
</svg></div>

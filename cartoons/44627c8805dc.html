<h1>4. Salient Features of the Constitution</h1>
<p class="meta">Constitutional Framework: Making, Features, Preamble · <a href="/upsc/course/mains-gs2/lesson-constitution-basics">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Massive Constitution Book -->
  <rect x="80" y="40" width="400" height="180" fill="none" stroke="#1f2937" stroke-width="4" rx="8"/>
  <rect x="80" y="40" width="400" height="40" fill="#1f2937"/>

    <line x1="100" y1="180" x2="460" y2="180"/>
    <line x1="100" y1="200" x2="460" y2="200"/>
  </g>
  <!-- Three Locks (Amendment Tiers) -->
  <!-- Tier 1: Simple Majority - Small Lock -->
  <g transform="translate(120, 230)">
    <rect x="0" y="0" width="30" height="25" fill="none" stroke="#1f2937" stroke-width="3" rx="3"/>

  </g>
  <text x="135" y="275" text-anchor="middle" fill="#1f2937" font-size="11" font-family="sans-serif">Simple Majority</text>
  <!-- Tier 2: Special Majority - Medium Lock -->
  <g transform="translate(255, 225)">
    <rect x="0" y="0" width="40" height="32" fill="none" stroke="#1f2937" stroke-width="3.5" rx="4"/>
    <rect x="10" y="-16" width="20" height="20" fill="none" stroke="#1f2937" stroke-width="3.5" rx="7 7 0 0"/>

  </g>
  <text x="275" y="286.3" text-anchor="middle" fill="#1f2937" font-size="11" font-family="sans-serif">Special Majority</text>
  <!-- Tier 3: Special + States - Large Lock -->

    <rect x="0" y="0" width="50" height="40" fill="none" stroke="#1f2937" stroke-width="4" rx="5"/>

    <line x1="18" y1="34" x2="32" y2="34" stroke="#1f2937" stroke-width="3"/>
  </g>
  <text x="425" y="275" text-anchor="middle" fill="#1f2937" font-size="11" font-family="sans-serif">States Ratification</text>
  <!-- Federal Structure: Centre vs States -->
  <!-- Centre Building (Large) -->
  <rect x="220" y="230" width="120" height="70" fill="none" stroke="#1f2937" stroke-width="4"/>
  <rect x="255" y="200" width="50" height="35" fill="none" stroke="#1f2937" stroke-width="4"/>

  <text x="280" y="272" text-anchor="middle" fill="#1f2937" font-size="10" font-family="sans-serif">Residuary Powers</text>
  <!-- State Buildings (Small, multiple) -->
  <g stroke="#1f2937" stroke-width="3">
    <rect x="60" y="260" width="50" height="40" fill="none"/>
    <rect x="70" y="250" width="30" height="15" fill="#1f2937"/>
    <text x="85" y="285" text-anchor="middle" fill="#1f2937" font-size="10" font-family="sans-serif">STATE</text>
    
    <rect x="140" y="260" width="50" height="40" fill="none"/>
    <rect x="150" y="250" width="30" height="15" fill="#1f2937"/>
    <text x="165" y="285" text-anchor="middle" fill="#1f2937" font-size="10" font-family="sans-serif">STATE</text>
    
    <rect x="370" y="260" width="50" height="40" fill="none"/>
    <rect x="380" y="250" width="30" height="15" fill="#1f2937"/>
    <text x="395" y="285" text-anchor="middle" fill="#1f2937" font-size="10" font-family="sans-serif">STATE</text>
    
    <rect x="450" y="260" width="50" height="40" fill="none"/>

    <text x="475" y="285" text-anchor="middle" fill="#1f2937" font-size="10" font-family="sans-serif">STATE</text>
  </g>
  <!-- Strings/Arrows from Centre to States (Unitary Control) -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <path d="M220 250 Q180 240 110 270" marker-end="url(#arrow)"/>
    <path d="M220 270 Q170 270 165 290" marker-end="url(#arrow)"/>
    <path d="M340 250 Q380 240 420 270" marker-end="url(#arrow)"/>
    <path d="M340 270 Q390 270 475 290" marker-end="url(#arrow)"/>
  </g>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>
  <!-- Governor Figure (Centre's Agent) -->
  <g transform="translate(280, 185)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#1f2937" stroke-width="3"/>
    <line x1="0" y1="12" x2="0" y2="28" stroke="#1f2937" stroke-width="3"/>
    <line x1="-10" y1="18" x2="10" y2="18" stroke="#1f2937" stroke-width="3"/>
    <line x1="-8" y1="28" x2="-18" y2="38" stroke="#1f2937" stroke-width="3"/>
    <line x1="8" y1="28" x2="18" y2="38" stroke="#1f2937" stroke-width="3"/>
  </g>
  <text x="280" y="233.8" text-anchor="middle" fill="#1f2937" font-size="10" font-family="sans-serif">Governor</text>

  <text x="80" y="235" fill="#1f2937" font-size="12" font-family="sans-serif">Three-Tier Amendment</text>
  <text x="80" y="250" fill="#1f2937" font-size="12" font-family="sans-serif">Quasi-Federalism</text>

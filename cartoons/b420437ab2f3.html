<h1>Elements of Climatology</h1>
<p class="meta">Physical Geography · <a href="/upsc/course/gs/lesson-geography-physical-prelims">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Sun -->
  <circle cx="80" cy="60" r="35" fill="none" stroke="#1f2937" stroke-width="3"/>
  <g stroke="#1f2937" stroke-width="2.5">
    <line x1="80" y1="15" x2="80" y2="5"/>
    <line x1="80" y1="105" x2="80" y2="115"/>
    <line x1="15" y1="60" x2="5" y2="60"/>
    <line x1="145" y1="60" x2="155" y2="60"/>
    <line x1="30" y1="30" x2="18" y2="18"/>
    <line x1="130" y1="30" x2="142" y2="18"/>
    <line x1="30" y1="90" x2="18" y2="102"/>
    <line x1="130" y1="90" x2="142" y2="102"/>
  </g>
  <text x="80" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1f2937">SUN</text>
  <!-- Incoming shortwave arrows -->
  <g stroke="#1f2937" stroke-width="2.5" fill="#1f2937">
    <path d="M115 45 L200 60" marker-end="url(#arrow)"/>
    <path d="M115 60 L200 80" marker-end="url(#arrow)"/>
    <path d="M115 75 L200 100" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <!-- Earth cross-section circle -->
  <circle cx="280" cy="150" r="115" fill="none" stroke="#1f2937" stroke-width="3"/>
  <!-- Atmosphere top arc -->
  <path d="M165 150 Q280 30 395 150" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Clouds/albedo reflection -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none">
    <ellipse cx="200" cy="80" rx="25" ry="12"/>
    <ellipse cx="280" cy="65" rx="30" ry="10"/>
    <ellipse cx="360" cy="80" rx="25" ry="12"/>
  </g>
  <!-- Reflected arrows (albedo) -->
  <g stroke="#1f2937" stroke-width="2" stroke-dasharray="3,2" fill="#1f2937">
    <path d="M200 95 Q180 50 140 30" marker-end="url(#arrow)"/>
    <path d="M280 75 Q280 40 280 20" marker-end="url(#arrow)"/>
    <path d="M360 95 Q380 50 420 30" marker-end="url(#arrow)"/>
  </g>
  <!-- Surface: land/ocean -->
  <path d="M165 150 Q200 170 230 155 Q260 140 290 155 Q320 170 350 155 Q380 140 395 150" fill="none" stroke="#1f2937" stroke-width="2.5"/>
  <!-- Absorbed radiation wavy lines -->
  <g stroke="#1f2937" stroke-width="1.5">
    <path d="M200 150 Q210 165 200 180"/>
    <path d="M250 150 Q260 165 250 180"/>
    <path d="M300 150 Q310 165 300 180"/>
    <path d="M350 150 Q360 165 350 180"/>
  </g>
  <!-- Longwave up arrows -->
  <g stroke="#1f2937" stroke-width="2" fill="#1f2937">
    <path d="M200 180 L200 130" marker-end="url(#arrow)"/>
    <path d="M250 180 L250 120" marker-end="url(#arrow)"/>
    <path d="M300 180 L300 120" marker-end="url(#arrow)"/>
    <path d="M350 180 L350 130" marker-end="url(#arrow)"/>
  </g>
  <!-- Greenhouse gas layer trapping -->
  <path d="M165 110 Q280 90 395 110" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="6,3"/>
  <g stroke="#1f2937" stroke-width="1.5" fill="#1f2937">
    <path d="M200 120 L200 110" marker-end="url(#arrow)"/>
    <path d="M250 115 L250 105" marker-end="url(#arrow)"/>
    <path d="M300 115 L300 105" marker-end="url(#arrow)"/>
    <path d="M350 120 L350 110" marker-end="url(#arrow)"/>
  </g>
  <!-- Meridional gradient: equator hot, poles cold -->
  <text x="170" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">EQUATOR</text>
  <text x="390" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">POLES</text>
  <path d="M170 155 L390 155" stroke="#1f2937" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="280" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">MERIDIONAL GRADIENT</text>
  <!-- Three circulation cells (Hadley, Ferrel, Polar) -->
  <g stroke="#1f2937" stroke-width="2.5" fill="#1f2937">
    <!-- Hadley cell (equator to 30°) -->
    <path d="M280 150 Q280 100 220 80 Q180 70 165 150" marker-end="url(#arrow)" fill="none"/>
    <path d="M165 150 Q180 180 220 190 Q280 200 280 150" marker-end="url(#arrow)" fill="none"/>
    <!-- Ferrel cell (30° to 60°) -->
    <path d="M280 150 Q330 120 380 100 Q410 90 395 150" marker-end="url(#arrow)" fill="none"/>
    <path d="M395 150 Q370 190 330 210 Q280 220 280 150" marker-end="url(#arrow)" fill="none"/>
    <!-- Polar cell (60° to pole) -->
    <path d="M395 150 Q430 130 470 110 Q490 95 490 150" marker-end="url(#arrow)" fill="none"/>
    <path d="M490 150 Q460 190 420 210 Q395 220 395 150" marker-end="url(#arrow)" fill="none"/>
    <!-- Southern hemisphere mirror -->
    <path d="M280 150 Q280 200 220 220 Q180 230 165 150" marker-end="url(#arrow)" fill="none"/>
    <path d="M165 150 Q180 120 220 110 Q280 100 280 150" marker-end="url(#arrow)" fill="none"/>
    <path d="M280 150 Q330 180 380 200 Q410 210 395 150" marker-end="url(#arrow)" fill="none"/>
    <path d="M395 150 Q370 110 330 90 Q280 80 280 150" marker-end="url(#arrow)" fill="none"/>
    <path d="M395 150 Q430 170 470 190 Q490 205 490 150" marker-end="url(#arrow)" fill="none"/>
    <path d="M490 150 Q460 110 420 90 Q395 80 395 150" marker-end="url(#arrow)" fill="none"/>
  </g>
  <!-- Coriolis deflection curved arrows at mid-latitudes -->
  <g stroke="#1f2937" stroke-width="2" stroke-dasharray="4,2" fill="#1f2937">
    <path d="M350 100 Q370 80 390 70" marker-end="url(#arrow)"/>
    <path d="M350 200 Q370 220 390 230" marker-end="url(#arrow)"/>
    <path d="M210 100 Q190 80 170 70" marker-end="url(#arrow)"/>
    <path d="M210 200 Q190 220 170 230" marker-end="url(#arrow)"/>
  </g>
  <!-- Pressure belt labels around circumference -->
  <text x="280" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">EQUATORIAL LOW</text>
  <text x="165" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">SUBTROPICAL HIGH</text>
  <text x="395" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">SUBTROPICAL HIGH</text>
  <text x="165" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">SUBPOLAR LOW</text>
  <text x="395" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">SUBPOLAR LOW</text>
  <text x="280" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1f2937">POLAR HIGH</text>
  <!-- Key term labels -->
  <text x="110" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">SOLAR CONSTANT</text>
  <text x="280" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">PLANETARY ALBEDO</text>
  <text x="280" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">GREENHOUSE EFFECT</text>
  <text x="480" y="108.5" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">CORIOLIS DEFLECTION</text>
  <text x="480" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">PRESSURE BELTS</text>
  <text x="80" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">HADLEY CELL</text>
  <text x="80" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">FERREL CELL</text>
  <text x="80" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1f2937">POLAR CELL</text>
  <!-- Caption strip -->
  
  
</svg></div>

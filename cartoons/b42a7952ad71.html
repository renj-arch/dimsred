<h1>Kinship Terminology Systems and Alliance Theory Applications</h1>
<p class="meta">Anthropology Paper I: Core Topics · <a href="/upsc/course/opt-anthropology/lesson-paper1">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- Central: Dravidian Iroquois cross-cousin marriage loop -->
  <g stroke="#1f2937" fill="none">
    <line x1="280" y1="100" x2="230" y2="140" stroke-width="3"/>
    <line x1="280" y1="100" x2="330" y2="140" stroke-width="3"/>

    <line x1="180" y1="140" x2="180" y2="220" stroke-width="3"/>
    <line x1="380" y1="140" x2="380" y2="220" stroke-width="3"/>
    <circle cx="180" cy="220" r="10" stroke-width="2.5"/>
    <circle cx="380" cy="220" r="10" stroke-width="2.5"/>
    <line x1="190" y1="220" x2="370" y2="220" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  </g>

  <!-- Top-left: Morganian Typology (six systems as three paired boxes) -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <rect x="40" y="40" width="30" height="30"/>
    <rect x="80" y="40" width="30" height="30"/>
    <rect x="120" y="40" width="30" height="30"/>

    <line x1="135" y1="70" x2="135" y2="85" stroke-width="1.5"/>
  </g>

  <!-- Top-right: Alliance Theory (two moieties with exchange arrow) -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <circle cx="440" cy="70" r="25"/>
    <circle cx="500" cy="70" r="25"/>
    <line x1="465" y1="70" x2="475" y2="70" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  </g>

  <!-- Bottom-left: Indian Cases (Nair matrilineal, Rajput patrilineal) -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <circle cx="60" cy="230" r="18"/> <!-- Nair -->

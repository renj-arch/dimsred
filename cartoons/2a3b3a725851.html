<h1>The Sangam Age (c. 300 BCE-300 CE): Cheras, Cholas, and Pandyas</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Khyber Pass mountains -->
  <polyline points="0,320 30,200 60,280 90,180 120,260 150,160 180,240 210,140 240,320" fill="none" stroke="#1f2937" stroke-width="3"/>
  <text x="40" y="170" font-size="14" fill="#1f2937" font-weight="bold">KHYBER PASS</text>
  <!-- Huna horsemen entering -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <path d="M50,220 Q70,190 90,210"/> <!-- horse 1 -->
    <path d="M55,210 Q65,180 75,200"/> <!-- rider 1 -->
    <path d="M80,240 Q100,210 120,230"/> <!-- horse 2 -->
    <path d="M85,230 Q95,200 105,220"/> <!-- rider 2 -->
  </g>
  <!-- Toramana leading -->
  <circle cx="100" cy="200" r="8" stroke="#1f2937" stroke-width="2" fill="none"/>
  <text x="90" y="185" font-size="12" fill="#1f2937" font-weight="bold">TORAMANA</text>
  <!-- Central: Mihirakula smashing stupa -->
  <g stroke="#1f2937" stroke-width="3">
    <!-- Stupa base -->
    <rect x="190" y="200" width="80" height="60" fill="none"/>
    <!-- Stupa dome -->
    <ellipse cx="230" cy="200" rx="40" ry="30" fill="none"/>
    <!-- Stupa harmika -->
    <rect x="220" y="170" width="20" height="15" fill="none"/>
    <!-- Stupa yasti broken -->
    <line x1="230" y1="170" x2="230" y2="130" stroke-dasharray="5,3"/>
    <!-- Debris -->
    <path d="M210,210 Q200,230 190,250" stroke-width="2"/>
    <path d="M250,210 Q260,230 270,250" stroke-width="2"/>
  </g>
  <!-- Mihirakula on horse, raising mace -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <path d="M260,180 Q280,150 300,170"/> <!-- horse body -->
    <path d="M280,160 Q290,130 300,140"/> <!-- rider torso -->
    <path d="M290,140 L310,100"/> <!-- raised arm -->
    <path d="M310,100 L330,70"/> <!-- mace -->
    <circle cx="330" cy="65" r="8" fill="#1f2937"/> <!-- mace head -->
  </g>
  <text x="270" y="120" font-size="14" fill="#1f2937" font-weight="bold">MIHIRAKULA</text>
  <text x="210" y="280" font-size="13" fill="#1f2937" font-weight="bold">BUDDHIST STUPAS</text>
  <!-- Yashodharman on elephant forcing submission -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <ellipse cx="430" cy="210" rx="50" ry="30"/> <!-- elephant body -->
    <path d="M380,210 Q350,190 340,220"/> <!-- trunk -->
    <path d="M460,180 Q480,150 500,170"/> <!-- rider -->
    <path d="M490,160 L470,190"/> <!-- spear down -->
  </g>
  <text x="410" y="140" font-size="14" fill="#1f2937" font-weight="bold">YASHODHARMAN</text>
  <!-- Gupta pillar (Mandasor) -->
  <rect x="480" y="80" width="12" height="120" stroke="#1f2937" stroke-width="3" fill="none"/>
  <text x="470" y="70" font-size="12" fill="#1f2937" font-weight="bold">MANDASOR PILLAR</text>
  <!-- Sun temple being built (Mihirakula inscription) -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <rect x="350" y="80" width="60" height="80"/>
    <path d="M350,80 L380,50 L410,80"/> <!-- roof -->
    <text x="355" y="170" font-size="11" fill="#1f2937">SUN TEMPLE</text>
  </g>
  <!-- Broken Gupta crown -->
  <path d="M200,270 Q210,250 220,270 Q215,255 210,270 Q205,255 200,270" stroke="#1f2937" stroke-width="2" fill="none"/>
  <text x="190" y="250" font-size="11" fill="#1f2937">GUPTA COLLAPSE</text>
  <!-- Huna chiefdoms surviving -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M400,280 Q410,260 420,280"/>
    <path d="M440,290 Q450,270 460,290"/>
    <text x="410" y="305" font-size="10" fill="#1f2937">HUNA CHIEFDOMS</text>
  </g>
  <!-- Caption strip -->
  <rect x="0" y="290" width="560" height="30" fill="#1f2937"/>
  <text x="280" y="310" font-size="14" fill="#fbf7ec" text-anchor="middle" font-weight="bold">7. Post-Mauryan Period (185 BCE-320 CE)</text>
</svg></div>

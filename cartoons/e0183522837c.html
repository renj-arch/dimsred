<h1>Stylistic Analysis of Narrative Voice and Focalization in Hindi Fiction</h1>
<p class="meta">Hindi Literature Paper II: Texts &amp;amp; Criticism · <a href="/upsc/course/opt-hindi/lesson-paper2">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="560" height="320" fill="#fbf7ec"/>
  <!-- Central open book -->
  <path d="M180 100 L380 100 L380 220 L180 220 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="280" y1="100" x2="280" y2="220" stroke="#1f2937" stroke-width="2"/>

  <path d="M280 100 Q330 90 380 100" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M180 220 Q230 230 280 220" fill="none" stroke="#1f2937" stroke-width="2"/>
  <path d="M280 220 Q330 230 380 220" fill="none" stroke="#1f2937" stroke-width="2"/>
  <!-- Left column: Narrative Voices -->
  <!-- Omniscient narrator -->
  <circle cx="60" cy="80" r="20" fill="none" stroke="#1f2937" stroke-width="3"/>
  <ellipse cx="60" cy="55" rx="24" ry="8" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="60" y1="100" x2="60" y2="140" stroke="#1f2937" stroke-width="3"/>
  <line x1="30" y1="120" x2="90" y2="120" stroke="#1f2937" stroke-width="3"/>
  <path d="M60 140 L40 180 M60 140 L80 180" stroke="#1f2937" stroke-width="3"/>
  <text x="60" y="40" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#1f2937">OMNISCIENT VOICE</text>
  <!-- First-person narrator -->
  <circle cx="60" cy="160" r="20" fill="none" stroke="#1f2937" stroke-width="3"/>
  <text x="60" y="165" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#1f2937" font-weight="bold">I</text>
  <line x1="60" y1="180" x2="60" y2="220" stroke="#1f2937" stroke-width="3"/>
  <path d="M60 220 L40 260 M60 220 L80 260" stroke="#1f2937" stroke-width="3"/>
  <text x="60" y="275" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#1f2937">FIRST-PERSON VOICE</text>
  <!-- Limited narrator -->
  <circle cx="60" cy="240" r="20" fill="none" stroke="#1f2937" stroke-width="3"/>
  <rect x="45" y="230" width="30" height="20" fill="none" stroke="#1f2937" stroke-width="2"/>
  <line x1="60" y1="260" x2="60" y2="300" stroke="#1f2937" stroke-width="3"/>
  <path d="M60 300 L40 340 M60 300 L80 340" stroke="#1f2937" stroke-width="3"/>
  <text x="60" y="315" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#1f2937">LIMITED VOICE</text>
  <!-- Right column: Focalization -->
  <!-- Internal focalization -->
  <ellipse cx="500" cy="80" rx="28" ry="20" fill="none" stroke="#1f2937" stroke-width="3"/>
  <circle cx="500" cy="80" r="10" fill="#1f2937"/>
  <circle cx="495" cy="75" r="3" fill="#fbf7ec"/>
  <path d="M485 95 Q500 105 515 95" stroke="#1f2937" stroke-width="2" fill="none"/>
  <text x="500" y="40" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#1f2937">INTERNAL FOCUS</text>
  <!-- External focalization -->
  <ellipse cx="500" cy="160" rx="28" ry="20" fill="none" stroke="#1f2937" stroke-width="3"/>
  <circle cx="500" cy="160" r="12" fill="none" stroke="#1f2937" stroke-width="3"/>
  <circle cx="500" cy="160" r="6" fill="#1f2937"/>
  <rect x="488" y="148" width="24" height="4" fill="#1f2937"/>
  <text x="500" y="120" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#1f2937">EXTERNAL FOCUS</text>
  <!-- Zero focalization -->

  <circle cx="500" cy="240" r="14" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="490" cy="230" r="2" fill="#1f2937"/>

  <path d="M90 240 Q135 230 180 220" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>

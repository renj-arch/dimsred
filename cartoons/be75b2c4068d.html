<h1>Oral Traditions and Their Literary Manifestations in Marathi</h1>
<p class="meta">Marathi Literature Optional: Syllabus, Sources &amp;amp; Strategy · <a href="/upsc/course/opt-marathi/lesson-overview">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  
  <!-- Central metaphor: Two intertwined tree trunks forming one canopy -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Oral trunk (left) - roots as sound waves -->
    <path d="M180 280 Q140 220 160 140 Q175 100 200 80 Q225 60 240 80" stroke-width="4"/>
    <path d="M160 280 Q130 230 140 160 Q150 120 170 100" stroke-width="2.5" opacity="0.7"/>
    <path d="M140 280 Q110 240 120 190" stroke-width="2" opacity="0.6"/>
    <!-- Sound waves from oral trunk -->
    <path d="M140 180 Q110 170 100 180" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M130 150 Q90 140 80 150" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M150 120 Q110 110 100 120" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Written trunk (right) - branches as pages -->
    <path d="M380 280 Q420 220 400 140 Q385 100 360 80 Q335 60 320 80" stroke-width="4"/>
    <path d="M400 280 Q430 230 420 160 Q410 120 390 100" stroke-width="2.5" opacity="0.7"/>
    <path d="M420 280 Q450 240 440 190" stroke-width="2" opacity="0.6"/>
    <!-- Pages/leaves on written trunk -->
    <rect x="340" y="90" width="25" height="18" stroke-width="2" rx="2"/>
    <rect x="370" y="75" width="22" height="16" stroke-width="2" rx="2" transform="rotate(-15 370 75)"/>
    <rect x="320" y="110" width="20" height="14" stroke-width="2" rx="2" transform="rotate(10 320 110)"/>
    <rect x="390" y="120" width="18" height="12" stroke-width="1.5" rx="1"/>
    
    <!-- Intertwining at canopy -->
    <path d="M200 80 Q240 50 280 70 Q300 85 320 80" stroke-width="3.5"/>
    <path d="M240 80 Q280 40 320 80" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Canopy leaves (unified) -->
  <g fill="#1f2937" opacity="0.3">
    <ellipse cx="260" cy="60" rx="80" ry="35"/>
    <ellipse cx="240" cy="45" rx="60" ry="25"/>
    <ellipse cx="280" cy="45" rx="60" ry="25"/>
  </g>
  
  <!-- Supporting image 1: Saint singing (top-left) -->
  <g transform="translate(60, 40)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <circle cx="50" cy="40" r="18"/> <!-- head -->
    <path d="M50 58 L50 100"/> <!-- body -->
    <path d="M30 70 L50 65 L70 70"/> <!-- arms up singing -->
    <path d="M40 100 L30 130"/> <!-- leg -->
    <path d="M60 100 L70 130"/> <!-- leg -->
    <!-- cymbals -->
    <circle cx="25" cy="65" r="8" stroke-width="2"/>
    <circle cx="75" cy="65" r="8" stroke-width="2"/>
    <!-- sound notes -->
    <path d="M20 55 Q15 50 10 55" stroke-width="1.5"/>
    <path d="M80 55 Q85 50 90 55" stroke-width="1.5"/>
  </g>
  
  <!-- Supporting image 2: Scribe writing (top-right) -->
  <g transform="translate(430, 40)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <circle cx="50" cy="40" r="18"/> <!-- head -->
    <path d="M50 58 L50 100"/> <!-- body -->
    <path d="M50 65 L30 80"/> <!-- left arm -->
    <path d="M50 65 L75 70"/> <!-- right arm writing -->
    <path d="M40 100 L30 130"/> <!-- leg -->
    <path d="M60 100 L70 130"/> <!-- leg -->
    <!-- manuscript -->
    <rect x="65" y="55" width="30" height="40" stroke-width="2" rx="2"/>
    <line x1="68" y1="65" x2="92" y2="65" stroke-width="1"/>
    <line x1="68" y1="72" x2="92" y2="72" stroke-width="1"/>
    <line x1="68" y1="79" x2="92" y2="79" stroke-width="1"/>
    <!-- quill -->
    <path d="M75 70 Q85 60 95 55" stroke-width="1.5"/>
  </g>
  
  <!-- Supporting image 3: Shahir performer (bottom-left) -->
  <g transform="translate(50, 180)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <circle cx="50" cy="30" r="16"/> <!-- head -->
    <path d="M50 46 L50 85"/> <!-- body -->
    <path d="M50 55 L30 70"/> <!-- left arm gesturing -->
    <path d="M50 55 L70 60"/> <!-- right arm holding veena -->
    <path d="M40 85 L30 110"/> <!-- leg -->
    <path d="M60 85 L70 110"/> <!-- leg -->
    <!-- veena -->
    <path d="M70 60 L85 50 L85 90 L70 80 Z" stroke-width="2"/>
    <line x1="75" y1="55" x2="82" y2="55" stroke-width="1"/>
    <line x1="75" y1="62" x2="82" y2="62" stroke-width="1"/>
    <line x1="75" y1="69" x2="82" y2="69" stroke-width="1"/>
    <!-- audience heads -->
    <circle cx="20" cy="95" r="6"/>
    <circle cx="10" cy="100" r="5"/>
    <circle cx="90" cy="95" r="6"/>
    <circle cx="100" cy="100" r="5"/>
  </g>
  
  <!-- Supporting image 4: Modern writer (bottom-right) -->
  <g transform="translate(420, 180)" stroke="#1f2937" stroke-width="2.5" fill="none">
    <circle cx="50" cy="30" r="16"/> <!-- head -->
    <path d="M50 46 L50 85"/> <!-- body -->
    <path d="M50 55 L35 65"/> <!-- left arm -->
    <path d="M50 55 L65 65"/> <!-- right arm typing -->
    <path d="M40 85 L30 110"/> <!-- leg -->
    <path d="M60 85 L70 110"/> <!-- leg -->
    <!-- desk/typewriter -->
    <rect x="20" y="70" width="60" height="10" stroke-width="2"/>
    <rect x="40" y="55" width="25" height="18" stroke-width="2" rx="2"/>
    <line x1="43" y1="60" x2="62" y2="60" stroke-width="1"/>
    <line x1="43" y1="65" x2="62" y2="65" stroke-width="1"/>
    <!-- bookshelf behind -->
    <rect x="75" y="20" width="15" height="70" stroke-width="1.5"/>
    <rect x="92" y="20" width="12" height="70" stroke-width="1.5"/>
    <line x1="75" y1="40" x2="104" y2="40" stroke-width="1"/>
    <line x1="75" y1="60" x2="104" y2="60" stroke-width="1"/>
  </g>
  
  <!-- Labels -->
  <text x="160" y="30" font-family="Georgia, serif" font-size="13" fill="#1f2937" text-anchor="middle">ORAL TRADITION</text>
  <text x="400" y="30" font-family="Georgia, serif" font-size="13" fill="#1f2937" text-anchor="middle">WRITTEN TRADITION</text>
  <text x="110" y="165" font-family="Georgia, serif" font-size="12" fill="#1f2937" text-anchor="middle">OVI METER</text>
  <text x="110" y="295" font-family="Georgia, serif" font-size="12" fill="#1f2937" text-anchor="middle">POVADA / LAVANI</text>
  <text x="450" y="165" font-family="Georgia, serif" font-size="12" fill="#1f2937" text-anchor="middle">ABHANGA / BHAKTI</text>
  <text x="450" y="295" font-family="Georgia, serif" font-size="12" fill="#1f2937" text-anchor="middle">MODERN ADAPTATION</text>

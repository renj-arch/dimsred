<h1>Rajput Palace Architecture: Fort‑Palace Complexes of Rajasthan</h1>
<p class="meta">Indian Architecture &amp;amp; Built Heritage · <a href="/upsc/course/mains-gs1/lesson-architecture-heritage">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Hill Fort (Gad) -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Basalt plateau -->
    <path d="M80,250 L160,130 L400,130 L480,250" stroke-width="4"/>
    <!-- Outer curtain wall (Tatbandi) double line -->
    <path d="M90,240 L165,135 L395,135 L470,240" stroke-width="2"/>
    <path d="M100,235 L170,140 L390,140 L460,235" stroke-width="2"/>
    <!-- Bastions (Buruj) -->
    <g stroke-width="2">
      <path d="M130,135 A20,20 0 0 1 170,135"/> <!-- left -->
      <path d="M230,135 A20,20 0 0 1 270,135"/>
      <path d="M330,135 A20,20 0 0 1 370,135"/>
      <path d="M140,235 A15,15 0 0 0 170,235"/> <!-- base left -->
      <path d="M390,235 A15,15 0 0 1 420,235"/> <!-- base right -->
    </g>
    <!-- Moat (Khandak) -->
    <path d="M70,255 L490,255" stroke-dasharray="8,4" stroke-width="2"/>
    <!-- Staggered Gateway (Mahadarwaza) -->
    <polyline points="110,235 120,210 110,185 130,160 120,140" stroke-width="2"/>
    <!-- Intermediate enclosure (Balekilla) -->
    <rect x="200" y="145" width="160" height="60" stroke-width="2"/>
    <!-- Inner keep (Rajwada) -->
    <rect x="250" y="100" width="60" height="50" stroke-width="2"/>
    <path d="M250,100 L280,80 L310,100" stroke-width="2"/> <!-- roof -->
    <!-- Rock-cut cistern (Tanka) -->
    <circle cx="340" cy="175" r="15" stroke-width="2"/>
    <!-- Water channels (Nala) -->
    <path d="M340,190 L340,220" stroke-dasharray="4,2" stroke-width="1.5"/>
  </g>
  <!-- Coastal Fort (Sindhudurg) -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Island base -->
    <path d="M480,220 L520,180 L560,180 L560,280 L480,280 Z" stroke-width="4"/>
    <!-- Seaward bastions with embrasures -->
    <g stroke-width="2">
      <path d="M520,180 A25,25 0 0 1 570,180"/>
      <path d="M520,220 A20,20 0 0 1 560,220"/>
      <path d="M520,260 A25,25 0 0 0 570,260"/>
    </g>
    <!-- Laterite block texture (Chira) -->
    <g stroke-width="1">
      <line x1="490" y1="200" x2="550" y2="200"/>
      <line x1="490" y1="220" x2="550" y2="220"/>
      <line x1="490" y1="240" x2="550" y2="240"/>
      <line x1="490" y1="260" x2="550" y2="260"/>
    </g>
    <!-- Merlon-crenel parapet (Kangura) -->
    <path d="M480,180 L490,170 L500,180 L510,170 L520,180 L530,170 L540,180 L550,170 L560,180" stroke-width="2"/>
    <!-- Concealed dock & tunnel (Surang) -->
    <path d="M480,250 L460,270" stroke-width="2" stroke-dasharray="6,3"/>
    <circle cx="460" cy="270" r="8" stroke-width="2"/>
  </g>
  <!-- Labels -->
  <g font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="120" y="120">Gad</text>
    <text x="150" y="115">Tatbandi</text>
    <text x="250" y="125">Buruj</text>
    <text x="80" y="260">Khandak</text>
    <text x="115" y="155">Mahadarwaza</text>
    <text x="280" y="140">Balekilla</text>
    <text x="280" y="95">Rajwada</text>
    <text x="340" y="205">Tanka</text>
    <text x="520" y="165">Kangura</text>
    <text x="460" y="290">Surang</text>
  </g>

    Colonial Architecture and the Making of Modern Urban Form (21)
  </text>
</svg></div>

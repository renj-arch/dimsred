<h1>Spread and Course of the Revolt</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- British General on horseback -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <path d="M280 180 L260 240 L300 240 Z"/> <!-- horse body -->
    <path d="M280 180 L280 120"/> <!-- rider torso -->
    <path d="M260 130 L300 130"/> <!-- shoulders -->
    <path d="M260 130 L240 100"/> <!-- left arm -->
    <path d="M300 130 L330 90"/> <!-- right arm raised sword -->
    <path d="M330 90 L350 60" stroke-width="4"/> <!-- sword -->
    <circle cx="280" cy="105" r="15"/> <!-- head -->
    <path d="M270 100 L290 100"/> <!-- hat brim -->
  </g>
  <!-- Converging British columns as arrows -->
  <g stroke="#1f2937" stroke-width="4" fill="#1f2937">
    <!-- Punjab column from top-left -->
    <path d="M50 50 L200 150" marker-end="url(#arrow)"/>
    <text x="40" y="40" font-size="14" font-family="sans-serif" fill="#1f2937">Punjab Column</text>
    <!-- Bengal column from top-right -->
    <path d="M510 50 L360 150" marker-end="url(#arrow)"/>
    <text x="453.9" y="40" font-size="14" font-family="sans-serif" fill="#1f2937">Bengal Column</text>
    <!-- Central India column from bottom -->
    <path d="M280 270 L280 200" marker-end="url(#arrow)"/>
    <text x="290" y="285" font-size="14" font-family="sans-serif" fill="#1f2937">Central India Column</text>
  </g>
  <!-- Defined arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>

  </defs>

  <g stroke="#1f2937" stroke-width="2" fill="none">
    <path d="M100 250 Q150 230 200 250 Q250 270 300 250 Q350 230 400 250 Q450 270 500 250"/>

  </g>
  <text x="280" y="300" font-size="16" font-family="sans-serif" fill="#1f2937" text-anchor="middle">Broken India</text>

    <path d="M480 200 L500 230"/>

    <path d="M280 80 L300 110"/>

  </g>
  <!-- Cannons blowing rebels -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <rect x="30" y="120" width="60" height="20"/>
    <rect x="30" y="125" width="20" height="10"/>

  </g>

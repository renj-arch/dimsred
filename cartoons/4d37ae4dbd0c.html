<h1>Natural Vegetation and Climate</h1>

<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">

  <text x="140" y="155" font-size="13" font-family="sans-serif" text-anchor="middle">Moist Deciduous</text>

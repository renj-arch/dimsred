<h1>10. Rise of Fascism &amp; Nazism (1919-1939)</h1>
<p class="meta">World History · <a href="/upsc/course/gs/lesson-world-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Background done -->
  <!-- Central metaphor: Fasces morphing into Swastika -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Fasces bundle -->
    <path d="M280 200 L280 120" stroke-width="5"/> <!-- central rod -->
    <path d="M260 200 L260 130"/> <!-- rod -->
    <path d="M300 200 L300 130"/> <!-- rod -->
    <path d="M250 200 L250 140"/> <!-- rod -->
    <path d="M310 200 L310 140"/> <!-- rod -->
    <!-- Axe head on fasces -->
    <path d="M260 120 L280 100 L300 120 L280 110 Z" fill="#1f2937"/>
    <!-- Morphing arrows to swastika -->
    <path d="M280 120 L280 80" stroke-dasharray="5,5"/>
    <path d="M280 80 L240 80 L240 120" stroke-dasharray="5,5"/>
    <path d="M280 80 L320 80 L320 120" stroke-dasharray="5,5"/>
    <path d="M280 80 L280 40" stroke-dasharray="5,5"/>
    <!-- Swastika arms (simplified) -->
    <path d="M260 60 L300 60" stroke-width="4"/>
    <path d="M280 40 L280 80" stroke-width="4"/>
    <path d="M260 60 L260 100" stroke-width="4"/>
    <path d="M300 60 L300 100" stroke-width="4"/>
  </g>
  <!-- Leader figure atop -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <circle cx="280" cy="40" r="18"/> <!-- head -->
    <path d="M280 58 L280 90"/> <!-- body -->
    <path d="M260 70 L300 70"/> <!-- arms -->
    <path d="M280 90 L260 110"/> <!-- leg -->
    <path d="M280 90 L300 110"/> <!-- leg -->
    <!-- Salute arm -->
    <path d="M300 70 L330 50" stroke-width="4"/>
  </g>
  <!-- Crushed parliament building -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <rect x="120" y="180" width="120" height="80" rx="5"/>
    <rect x="130" y="190" width="20" height="30"/> <!-- window -->
    <rect x="160" y="190" width="20" height="30"/>
    <rect x="190" y="190" width="20" height="30"/>
    <path d="M120 180 L180 150 L240 180"/> <!-- roof -->
    <path d="M180 150 L180 100" stroke-dasharray="4,4"/> <!-- broken dome -->
    <circle cx="180" cy="100" r="10" stroke-dasharray="4,4"/>
  </g>
  <!-- Arrows from origins -->
  <g stroke="#1f2937" stroke-width="3" fill="#1f2937">
    <!-- Italy arrow -->
    <path d="M60 220 L110 200" marker-end="url(#arrow)"/>
    <!-- Germany arrow -->
    <path d="M500 220 L450 200" marker-end="url(#arrow)"/>
    <!-- Depression arrow -->
    <path d="M280 280 L280 220" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>
  <!-- Labels -->
  <text x="280" y="30" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#1f2937">Fascism</text>
  <text x="280" y="110" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#1f2937">Nazism</text>
  <text x="420" y="60" text-anchor="start" font-size="12" font-family="sans-serif" fill="#1f2937">Ultranationalism</text>
  <text x="420" y="80" text-anchor="start" font-size="12" font-family="sans-serif" fill="#1f2937">Cult of Leader</text>
  <text x="420" y="100" text-anchor="start" font-size="12" font-family="sans-serif" fill="#1f2937">Totalitarian State</text>
  <text x="20" y="60" text-anchor="start" font-size="12" font-family="sans-serif" fill="#1f2937">Racial Ideology</text>
  <text x="20" y="220" text-anchor="start" font-size="12" font-family="sans-serif" fill="#1f2937">Mutilated Victory</text>
  <text x="420" y="220" text-anchor="end" font-size="12" font-family="sans-serif" fill="#1f2937">Stab in Back</text>

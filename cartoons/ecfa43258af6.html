<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>

  <path d="M80,160 Q280,80 480,160" stroke="#1f2937" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
  <path d="M80,160 Q280,160 480,160" stroke="#1f2937" stroke-width="3" fill="none"/>
  <path d="M80,160 Q280,240 480,160" stroke="#1f2937" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
  <!-- Top-left: Euler–Lagrange (balance scale) -->
  <g transform="translate(100,60)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#1f2937" stroke-width="3"/>
    <line x1="0" y1="-20" x2="0" y2="0" stroke="#1f2937" stroke-width="3"/>
    <circle cx="-25" cy="0" r="5" stroke="#1f2937" stroke-width="3" fill="none"/>
    <circle cx="25" cy="0" r="5" stroke="#1f2937" stroke-width="3" fill="none"/>
  </g>
  <!-- Top-right: Hamiltonian / Legendre transform (triangle) -->
  <g transform="translate(460,60)">
    <path d="M-30,20 L0,-20 L30,20 Z" stroke="#1f2937" stroke-width="3" fill="none"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#1f2937" stroke-width="2" stroke-dasharray="4,2"/>
  </g>
  <!-- Bottom-left: Poisson bracket (curly braces) -->

  </g>
  <!-- Bottom-right: Normal modes (coupled masses and spring) -->
  <g transform="translate(460,250)">
    <circle cx="-30" cy="0" r="15" stroke="#1f2937" stroke-width="3" fill="none"/>
    <circle cx="30" cy="0" r="15" stroke="#1f2937" stroke-width="3" fill="none"/>

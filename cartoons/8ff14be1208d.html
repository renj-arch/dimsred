<h1>Vijayanagara's Overseas Connections: Trade and Cultural Exchange with Southeast Asia</h1>

<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="560" height="320" fill="#fbf7ec"/>

  <!-- City 1: Mehrauli -->
  <g transform="translate(30, 50)">

    <line x1="0" y1="150" x2="120" y2="150" stroke="#1f2937" stroke-width="2"/>

    <path d="M10 110 L15 100 L20 110 L25 100 L30 110 L35 100 L40 110 L45 100 L50 110 L55 100 L60 110" fill="none" stroke="#1f2937" stroke-width="2"/>

    <path d="M40 110 L35 30 L45 30 L50 110 Z" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="38" y1="50" x2="48" y2="50" stroke="#1f2937" stroke-width="1"/>
    <line x1="37" y1="70" x2="49" y2="70" stroke="#1f2937" stroke-width="1"/>
    <line x1="36" y1="90" x2="50" y2="90" stroke="#1f2937" stroke-width="1"/>
    <!-- Mosque -->
    <rect x="70" y="70" width="30" height="30" fill="none" stroke="#1f2937" stroke-width="2"/>
    <circle cx="85" cy="60" r="10" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="85" y1="50" x2="85" y2="40" stroke="#1f2937" stroke-width="2"/>
    <!-- Market arch -->
    <path d="M30 150 Q45 130 60 150" fill="none" stroke="#1f2937" stroke-width="2"/>
    <path d="M60 150 Q75 130 90 150" fill="none" stroke="#1f2937" stroke-width="2"/>

    <text x="69.5" y="210" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#1f2937">Citadel-Mosque-Market</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M150 125 L180 125" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937"/>
    </marker>
  </defs>

  <!-- City 2: Siri -->
  <g transform="translate(180, 50)">
    <!-- Rectangular wall -->
    <rect x="0" y="60" width="100" height="90" fill="none" stroke="#1f2937" stroke-width="2"/>

    <rect x="45" y="55" width="10" height="10" fill="none" stroke="#1f2937" stroke-width="2"/>
    <rect x="45" y="150" width="10" height="10" fill="none" stroke="#1f2937" stroke-width="2"/>

    <rect x="10" y="10" width="40" height="40" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="12" y1="20" x2="48" y2="20" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="12" y1="40" x2="48" y2="40" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Market superintendent figure -->
    <circle cx="70" cy="120" r="5" fill="none" stroke="#1f2937" stroke-width="2"/>
    <line x1="70" y1="125" x2="70" y2="140" stroke="#1f2937" stroke-width="2"/>
    <line x1="60" y1="130" x2="80" y2="130" stroke="#1f2937" stroke-width="2"/>

    <!-- Labels -->

    <text x="70" y="183.5" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#1f2937">Shahna-i-Mandi</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M300 125 L330 125" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- City 3: Daulatabad -->
  <g transform="translate(330, 50)">
    <!-- Grid plan -->
    <g stroke="#1f2937" stroke-width="1" stroke-dasharray="3,3">
      <line x1="10" y1="70" x2="90" y2="70"/>
      <line x1="10" y1="100" x2="90" y2="100"/>
      <line x1="10" y1="130" x2="90" y2="130"/>
      <line x1="20" y1="70" x2="20" y2="130"/>
      <line x1="45" y1="70" x2="45" y2="130"/>
      <line x1="70" y1="70" x2="70" y2="130"/>
    </g>
    <!-- Fort on hill -->
    <path d="M20 60 L45 20 L70 60 Z" fill="none" stroke="#1f2937" stroke-width="2"/>
    <rect x="35" y="35" width="20" height="25" fill="none" stroke="#1f2937" stroke-width="2"/>
    <path d="M35 35 L40 25 L45 35 L50 25 L55 35" fill="none" stroke="#1f2937" stroke-width="2"/>
    <!-- Forced migration arrow with figures -->
    <path d="M-10 140 L100 140" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <g font-size="8" fill="#1f2937" font-family="sans-serif">
      <text x="12" y="155">→</text>
      <text x="20" y="155">→</text>
      <text x="40" y="155">→</text>
    </g>
    <!-- Labels -->
    <text x="63.8" y="33.5" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#1f2937">Daulatabad Experiment</text>
    <text x="50" y="170" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#1f2937">Grid Plan</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M450 125 L480 125" stroke="#1f2937" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- City 4: Firuzabad -->
  <g transform="translate(480, 50)">
    <!-- Yamuna river -->
    <path d="M0 150 Q10 140 20 150 Q30 160 40 150" fill="none" stroke="#1f2937" stroke-width="2"/>
    <!-- Yamuna-Firuz Canal -->
    <path d="M20 150 Q40 130 80 130 Q100 130 100 150" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="5,3"/>
    <!-- Gardens (trees) -->
    <g stroke="#1f2937" stroke-width="2">
      <line x1="60" y1="150" x2="60" y2="120"/>
      <circle cx="60" cy="115" r="10" fill="none"/>

      <circle cx="90" cy="115" r="10" fill="none"/>

    <line x1="25" y1="50" x2="25" y2="70" stroke="#1f2937" stroke-width="2"/>
    <line x1="15" y1="60" x2="35" y2="60" stroke="#1f2937" stroke-width="2"/>
    <!-- Labels -->
    <text x="55.5" y="20" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#1f2937">Yamuna-Firuz Canal</text>
    <text x="61" y="115" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#1f2937">Welfare Architecture</text>
  </g>

  <!-- Caption strip -->
  <rect x="0" y="290" width="560" height="30" fill="none" stroke="#1f2937" stroke-width="1"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#1f2937">6. Synthesis: Continuities and Transformations from the Sultanate to the Marathas (18)</text>

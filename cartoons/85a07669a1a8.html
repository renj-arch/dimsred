<h1>Neolithic Period (c. 7000 &amp;ndash; 2000 BCE)</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Ground line -->
  <line x1="40" y1="240" x2="520" y2="240" stroke="#1f2937" stroke-width="3"/>
  
  <!-- LEFT: Stone Age simplicity -->
  <g transform="translate(60,180)">
    <!-- Stone tools -->
    <path d="M0,0 L-15,-30 L-5,-30 L-10,-50 L-5,-50 L0,-20 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
    <path d="M10,0 L-5,-25 L5,-25 L0,-45 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
    <circle cx="30" cy="-10" r="12" fill="none" stroke="#1f2937" stroke-width="3"/>
    <!-- Simple hut -->
    <path d="M-40,0 L-60,-40 L-20,-40 Z" fill="none" stroke="#1f2937" stroke-width="2"/>
    <text x="25.3" y="40.9" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">STONE</text>
  </g>
  
  <!-- CENTRAL: Chalcolithic Settlement (Balathal/Gilund) -->
  <g transform="translate(200,80)">
    <!-- Fortification wall -->
    <rect x="0" y="0" width="160" height="140" fill="none" stroke="#1f2937" stroke-width="5"/>
    <rect x="5" y="5" width="150" height="130" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="5,3"/>
    <!-- Gate -->
    <rect x="70" y="120" width="20" height="25" fill="#fbf7ec" stroke="#1f2937" stroke-width="3"/>
    <!-- Granary rooms (Gilund) -->
    <g fill="none" stroke="#1f2937" stroke-width="1.5">
      <rect x="15" y="15" width="130" height="25"/>
      <rect x="15" y="15" width="13" height="25"/>
      <rect x="28" y="15" width="13" height="25"/>
      <rect x="41" y="15" width="13" height="25"/>
      <rect x="54" y="15" width="13" height="25"/>
      <rect x="67" y="15" width="13" height="25"/>
      <rect x="80" y="15" width="13" height="25"/>
      <rect x="93" y="15" width="13" height="25"/>
      <rect x="106" y="15" width="13" height="25"/>
      <rect x="119" y="15" width="13" height="25"/>
      <rect x="132" y="15" width="13" height="25"/>
      <!-- Second row -->
      <rect x="15" y="50" width="130" height="25"/>
      <rect x="15" y="50" width="13" height="25"/>
      <rect x="28" y="50" width="13" height="25"/>
      <rect x="41" y="50" width="13" height="25"/>
      <rect x="54" y="50" width="13" height="25"/>
      <rect x="67" y="50" width="13" height="25"/>
      <rect x="80" y="50" width="13" height="25"/>
      <rect x="93" y="50" width="13" height="25"/>
      <rect x="106" y="50" width="13" height="25"/>
      <rect x="119" y="50" width="13" height="25"/>
      <rect x="132" y="50" width="13" height="25"/>
    </g>
    <!-- Corridor -->
    <line x1="15" y1="40" x2="145" y2="40" stroke="#1f2937" stroke-width="2"/>
    <!-- Smelting furnace (Balathal) -->
    <ellipse cx="130" cy="100" rx="15" ry="10" fill="none" stroke="#1f2937" stroke-width="3"/>
    <path d="M130,90 L130,70" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <path d="M125,95 L135,95" stroke="#1f2937" stroke-width="2"/>
    <!-- Ritual hearth -->
    <circle cx="40" cy="100" r="10" fill="none" stroke="#1f2937" stroke-width="2"/>
    <path d="M35,100 L45,100 M40,95 L40,105" stroke="#1f2937" stroke-width="1.5"/>
    <!-- BRW Pottery -->
    <path d="M20,110 Q20,90 35,90 Q50,90 50,110" fill="none" stroke="#1f2937" stroke-width="3"/>
    <path d="M22,108 Q22,95 35,95 Q48,95 48,108" stroke="#1f2937" stroke-width="1"/>
    <text x="35" y="80" font-family="sans-serif" font-size="11" fill="#1f2937" text-anchor="middle">BRW</text>
    <!-- Copper tools -->
    <path d="M140,110 L155,90" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>
    <path d="M140,105 L152,95" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="148" cy="115" rx="6" ry="3" fill="none" stroke="#1f2937" stroke-width="2"/>
  </g>
  
  <!-- RIGHT: Copper Age complexity -->
  <g transform="translate(420,180)">
    <!-- Copper tools -->
    <path d="M0,0 L15,-30 L5,-30 L10,-50 L5,-50 L0,-20 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
    <path d="M-10,0 L5,-25 L-5,-25 L0,-45 Z" fill="none" stroke="#1f2937" stroke-width="3"/>
    <ellipse cx="-30" cy="-10" rx="10" ry="6" fill="none" stroke="#1f2937" stroke-width="3"/>
    <!-- Trade arrows -->
    <path d="M30,0 L60,-20" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M30,-10 L60,-30" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L0,6 L6,3 Z" fill="#1f2937"/>
      </marker>
    </defs>
    <text x="45" y="23.2" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle">COPPER</text>
  </g>
  
  <!-- Transition arrows -->
  <path d="M160,200 L200,200" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M360,200 L420,200" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Copper deposit symbols -->
  <g fill="#1f2937">
    <circle cx="100" cy="260" r="5"/>
    <circle cx="140" cy="260" r="5"/>
    <circle cx="180" cy="260" r="5"/>
    
  </g>
  
  <!-- Labels -->
  <text x="60" y="270" font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">STONE TOOLS</text>
  <text x="280" y="60" font-family="sans-serif" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">CHALCOLITHIC</text>
  <text x="280" y="235" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">GILUND GRANARY • 54 ROOMS</text>
  <text x="280" y="255" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">BALATHAL FORT • SMELTING • RITUAL</text>
  <text x="440" y="270" font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="middle">COPPER TOOLS</text>
  <text x="280" y="275" font-family="sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">BRW POTTERY • TRADE • STRATIFICATION</text>
  
  <!-- Caption strip -->
  <rect x="0" y="295" width="560" height="25" fill="#1f2937"/>
  <text x="280" y="288.8" font-family="sans-serif" font-size="13" fill="#fbf7ec" text-anchor="middle">1. Prehistoric India (5)</text>
</svg></div>

<h1>Gupta Culture &amp;mdash; The Golden Age</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Central crumbling Gupta temple -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <!-- Temple base -->
    <rect x="200" y="180" width="160" height="80" stroke-width="4"/>
    <!-- Pillars cracking -->
    <line x1="220" y1="180" x2="220" y2="100" stroke-width="4"/>
    <line x1="340" y1="180" x2="340" y2="100" stroke-width="4"/>
    <line x1="280" y1="180" x2="280" y2="80" stroke-width="4"/>
    <!-- Cracks -->
    <path d="M220 180 L200 260" stroke-width="2"/>
    <path d="M340 180 L360 260" stroke-width="2"/>
    <path d="M280 100 L260 60" stroke-width="2"/>
    <path d="M280 100 L300 60" stroke-width="2"/>
    <!-- Roof fragments falling -->
    <polygon points="200,100 280,60 360,100" stroke-width="3" fill="none"/>
    <polygon points="200,100 280,60 240,120" stroke-width="2" opacity="0.6"/>
    <polygon points="360,100 280,60 320,120" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Huna invaders from NW (top-left) -->
  <g stroke="#1f2937" stroke-width="3" fill="none">
    <path d="M50 50 L150 120" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M30 80 L130 150" stroke-width="3"/>
    <circle cx="60" cy="40" r="12" stroke-width="2"/>
    <line x1="60" y1="52" x2="60" y2="80" stroke-width="2"/>
    <line x1="45" y1="65" x2="75" y2="65" stroke-width="2"/>
    <circle cx="100" cy="70" r="10" stroke-width="2"/>
    <line x1="100" y1="80" x2="100" y2="105" stroke-width="2"/>
    <line x1="90" y1="90" x2="110" y2="90" stroke-width="2"/>
    <text x="20" y="30" font-size="14" font-family="sans-serif" fill="#1f2937">HUNA INVASIONS</text>
  </g>
  <!-- Samanta lords breaking away (right side) -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <rect x="380" y="100" width="70" height="50" stroke-dasharray="5,3"/>
    <rect x="460" y="140" width="60" height="45" stroke-dasharray="5,3"/>
    <rect x="390" y="200" width="65" height="40" stroke-dasharray="5,3"/>
    <path d="M360 180 L380 125" stroke-width="1.5"/>
    <path d="M360 180 L460 160" stroke-width="1.5"/>
    <path d="M360 180 L390 220" stroke-width="1.5"/>
    <text x="385" y="95" font-size="11" font-family="sans-serif" fill="#1f2937">SAMANTAS REBEL</text>
    <text x="465" y="135" font-size="10" font-family="sans-serif" fill="#1f2937">PUSHYABHUTIS</text>
    <text x="395" y="195" font-size="10" font-family="sans-serif" fill="#1f2937">MAITRAKAS</text>
  </g>
  <!-- Trade ships blocked at ports (bottom) -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <line x1="100" y1="280" x2="500" y2="280" stroke-width="3"/> <!-- coastline -->
    <!-- Blocked ships -->
    <path d="M150 270 L130 250 L170 250 Z" fill="#1f2937" opacity="0.7"/>
    <line x1="150" y1="250" x2="150" y2="230" stroke-width="2"/>
    <rect x="145" y2="230" width="10" height="15" fill="none" stroke-width="1.5"/>
    <line x1="140" y1="270" x2="140" y2="290" stroke-width="4" stroke="#fbf7ec"/> <!-- block -->
    <line x1="160" y1="270" x2="160" y2="290" stroke-width="4" stroke="#fbf7ec"/>
    <path d="M300 270 L280 250 L320 250 Z" fill="#1f2937" opacity="0.7"/>
    <line x1="300" y1="250" x2="300" y2="230" stroke-width="2"/>
    <rect x="295" y="230" width="10" height="15" fill="none" stroke-width="1.5"/>
    <line x1="290" y1="270" x2="290" y2="290" stroke-width="4" stroke="#fbf7ec"/>
    <line x1="310" y1="270" x2="310" y2="290" stroke-width="4" stroke="#fbf7ec"/>
    <text x="120" y="308" font-size="12" font-family="sans-serif" fill="#1f2937">TRADE LOST</text>
    <text x="270" y="308" font-size="12" font-family="sans-serif" fill="#1f2937">PORTS SEIZED</text>
  </g>
  <!-- Weak ruler on crumbling throne (top center) -->
  <g stroke="#1f2937" stroke-width="2.5" fill="none">
    <rect x="260" y="40" width="40" height="30" stroke-width="2"/> <!-- throne -->
    <circle cx="280" cy="35" r="10" stroke-width="2"/> <!-- head -->
    <line x1="280" y1="45" x2="280" y2="70" stroke-width="2"/> <!-- body -->
    <line x1="265" y1="55" x2="295" y2="55" stroke-width="2"/> <!-- arms out helpless -->
    <text x="240" y="30" font-size="12" font-family="sans-serif" fill="#1f2937">WEAK RULERS</text>
  </g>
  <!-- Debased coins falling -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <circle cx="230" cy="140" r="8"/>
    <text x="226" y="144" font-size="8" font-family="sans-serif" fill="#1f2937">60%</text>
    <circle cx="310" cy="150" r="7"/>
    <text x="306" y="154" font-size="8" font-family="sans-serif" fill="#1f2937">55%</text>
    <circle cx="270" cy="165" r="6"/>
    <text x="267" y="169" font-size="7" font-family="sans-serif" fill="#1f2937">50%</text>
    <text x="220" y="130" font-size="11" font-family="sans-serif" fill="#1f2937">DEBASED COINAGE</text>
  </g>
  <!-- Fragmentation label -->
  <text x="250" y="270" font-size="14" font-family="sans-serif" fill="#1f2937" font-weight="bold" text-anchor="middle">FRAGMENTATION</text>
  <!-- Caption strip -->
  
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 Z" fill="#1f2937"/>
    </marker>
  </defs>
</svg></div>

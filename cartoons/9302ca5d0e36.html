<h1>Akbar the Great (1556-1605)</h1>
<p class="meta">Indian History · <a href="/upsc/course/gs/lesson-indian-history">Read the lesson →</a></p>
<div class="hero"><svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="320" fill="#fbf7ec"/>
  <!-- Chain of Justice across top -->
  <path d="M40,50 Q150,30 280,50 Q410,70 520,50" stroke="#1f2937" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Bells on chain -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <circle cx="80" cy="42" r="6"/>
    <circle cx="140" cy="36" r="6"/>
    <circle cx="200" cy="38" r="6"/>
    <circle cx="260" cy="44" r="6"/>
    <circle cx="320" cy="48" r="6"/>
    <circle cx="380" cy="46" r="6"/>
    <circle cx="440" cy="42" r="6"/>
    <circle cx="480" cy="40" r="6"/>
  </g>
  <!-- Agra Fort tower left -->
  <rect x="20" y="50" width="30" height="80" stroke="#1f2937" stroke-width="3" fill="none"/>
  <path d="M20,50 L35,30 L50,50" stroke="#1f2937" stroke-width="3" fill="none"/>
  <!-- Yamuna pillar right -->
  <rect x="510" y="50" width="30" height="80" stroke="#1f2937" stroke-width="3" fill="none"/>
  <ellipse cx="525" cy="50" rx="15" ry="8" stroke="#1f2937" stroke-width="3" fill="none"/>
  <!-- Hanging cords and symbols -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <!-- 1. Jahangir: wine & opium -->
    <line x1="100" y1="50" x2="100" y2="130"/>
    <g transform="translate(100,130)">
      <ellipse cx="0" cy="0" rx="25" ry="30" stroke="#1f2937" stroke-width="3"/>
      <path d="M-15,-10 Q0,-25 15,-10" stroke="#1f2937" stroke-width="2"/> <!-- wine cup -->
      <path d="M-5,10 L-5,25" stroke="#1f2937" stroke-width="2"/> <!-- opium pipe -->
      <circle cx="0" cy="-5" r="3" stroke="#1f2937" stroke-width="2"/> <!-- eye -->
    </g>
    <text x="100" y="175" text-anchor="middle" font-size="12" font-family="serif" fill="#1f2937">Jahangir</text>
    <text x="100" y="190" text-anchor="middle" font-size="11" font-family="serif" fill="#1f2937">Wine &amp; Opium</text>

    <!-- 2. Nur Jahan: coin & power -->
    <line x1="200" y1="50" x2="200" y2="130"/>
    <g transform="translate(200,130)">
      <circle cx="0" cy="0" r="28" stroke="#1f2937" stroke-width="3"/>
      <text x="0" y="4" text-anchor="middle" font-size="10" font-family="serif" fill="#1f2937">Nur Jahan</text>
      <path d="M-20,-30 L-20,-40" stroke="#1f2937" stroke-width="2"/> <!-- khutba scroll -->
      <rect x="-10" y="-35" width="20" height="10" stroke="#1f2937" stroke-width="1"/> <!-- coin -->
      <circle cx="0" cy="30" r="8" stroke="#1f2937" stroke-width="1" fill="none"/> <!-- female guard -->
      <circle cx="20" cy="30" r="8" stroke="#1f2937" stroke-width="1" fill="none"/>
      <circle cx="-20" cy="30" r="8" stroke="#1f2937" stroke-width="1" fill="none"/>
    </g>
    <text x="200" y="175" text-anchor="middle" font-size="12" font-family="serif" fill="#1f2937">Nur Jahan</text>
    <text x="200" y="190" text-anchor="middle" font-size="11" font-family="serif" fill="#1f2937">Coins &amp; Khutba</text>

    <!-- 3. Miniature painting -->
    <line x1="300" y1="50" x2="300" y2="130"/>
    <g transform="translate(300,130)">
      <rect x="-25" y="-30" width="50" height="40" stroke="#1f2937" stroke-width="3"/>
      <path d="M-15,-10 Q0,-20 15,-10" stroke="#1f2937" stroke-width="2"/> <!-- painted eye -->
      <circle cx="0" cy="-15" r="4" stroke="#1f2937" stroke-width="2" fill="#1f2937"/>
      <line x1="-25" y1="10" x2="25" y2="10" stroke="#1f2937" stroke-width="2"/> <!-- brush -->
      <line x1="0" y1="10" x2="0" y2="25" stroke="#1f2937" stroke-width="2"/>
    </g>
    <text x="300" y="175" text-anchor="middle" font-size="12" font-family="serif" fill="#1f2937">Miniature Art</text>
    <text x="300" y="190" text-anchor="middle" font-size="11" font-family="serif" fill="#1f2937">Ustad Mansur</text>

    <!-- 4. EIC Trade / Sir Thomas Roe -->
    <line x1="400" y1="50" x2="400" y2="130"/>
    <g transform="translate(400,130)">
      <circle cx="0" cy="0" r="25" stroke="#1f2937" stroke-width="3"/>
      <path d="M-10,-5 L10,-5 M-5,-10 L-5,0" stroke="#1f2937" stroke-width="2"/> <!-- hat -->
      <rect x="-15" y="15" width="30" height="15" stroke="#1f2937" stroke-width="2"/> <!-- journal -->
      <line x1="-20" y1="30" x2="20" y2="30" stroke="#1f2937" stroke-width="1"/>
      <line x1="-20" y1="35" x2="20" y2="35" stroke="#1f2937" stroke-width="1"/>
      <path d="M0,30 Q15,40 0,50 Q-15,40 0,30" stroke="#1f2937" stroke-width="2" fill="none"/> <!-- ship -->
    </g>
    <text x="400" y="175" text-anchor="middle" font-size="12" font-family="serif" fill="#1f2937">EIC Trade</text>
    <text x="400" y="190" text-anchor="middle" font-size="11" font-family="serif" fill="#1f2937">Sir Thomas Roe</text>

    <!-- 5. Guru Arjan Dev / Sikh conflict -->
    <line x1="150" y1="50" x2="150" y2="220"/>
    <g transform="translate(150,220)">
      <circle cx="0" cy="0" r="22" stroke="#1f2937" stroke-width="3"/>
      <path d="M0,-22 L0,-35" stroke="#1f2937" stroke-width="2"/> <!-- halo -->
      <ellipse cx="0" cy="-10" rx="15" ry="8" stroke="#1f2937" stroke-width="2" fill="none"/> <!-- turban -->
      <line x1="-15" y1="10" x2="15" y2="10" stroke="#1f2937" stroke-width="2"/> <!-- sword base -->
      <path d="M-5,10 L-5,25 M5,10 L5,25" stroke="#1f2937" stroke-width="2"/> <!-- kirpan -->
    </g>
    <text x="150" y="260" text-anchor="middle" font-size="11" font-family="serif" fill="#1f2937">Guru Arjan Dev</text>
    <text x="150" y="273" text-anchor="middle" font-size="10" font-family="serif" fill="#1f2937">Executed 1606</text>

    <!-- 6. Prince Khurram rebellion -->
    <line x1="350" y1="50" x2="350" y2="220"/>
    <g transform="translate(350,220)">
      <circle cx="0" cy="0" r="22" stroke="#1f2937" stroke-width="3"/>
      <path d="M-15,-22 Q0,-35 15,-22" stroke="#1f2937" stroke-width="3"/> <!-- crown -->
      <line x1="-10" y1="15" x2="10" y2="15" stroke="#1f2937" stroke-width="2"/> <!-- sword -->
      <line x1="0" y1="15" x2="0" y2="30" stroke="#1f2937" stroke-width="2"/>
      <path d="M-15,0 Q-25,-10 -15,-20" stroke="#1f2937" stroke-width="2"/> <!-- rebellion arrow -->
    </g>
    <text x="350" y="260" text-anchor="middle" font-size="11" font-family="serif" fill="#1f2937">Prince Khurram</text>
    <text x="350" y="273" text-anchor="middle" font-size="10" font-family="serif" fill="#1f2937">Rebellion 1622</text>

    <!-- 7. Itimad-ud-Daula / Irani clique -->
    <line x1="250" y1="50" x2="250" y2="220"/>
    <g transform="translate(250,220)">
      <rect x="-20" y="-20" width="40" height="40" stroke="#1f2937" stroke-width="2" fill="none"/> <!-- seal -->
      <text x="0" y="5" text-anchor="middle" font-size="9" font-family="serif" fill="#1f2937">Wazir</text>
      <path d="M-15,15 L15,15 M-10,20 L10,20 M-5,25 L5,25" stroke="#1f2937" stroke-width="1"/> <!-- document lines -->
    </g>
    <text x="250" y="260" text-anchor="middle" font-size="11" font-family="serif" fill="#1f2937">Irani Clique</text>
    <text x="250" y="273" text-anchor="middle" font-size="10" font-family="serif" fill="#1f2937">Itimad-ud-Daula</text>
  </g>
  <!-- Caption strip -->
  <rect x="0" y="290" width="560" height="30" fill="#1f2937"/>
  <text x="280" y="310" text-anchor="middle" font-size="14" font-family="serif" fill="#fbf7ec" font-weight="bold">12. Mughal Empire (1526-1707) (4)</text>
</svg></div>
<p class="meta">12. Mughal Empire (1526-1707) (4)</p></div></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Calendar — DIMSRED</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--accent:#3b82f6;--accent2:#8b5cf6;--text:#e2e8f0;--muted:#64748b;--green:#10b981;--red:#ef4444;--yellow:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:900px;margin:0 auto;padding:20px}
.page-header{margin-bottom:24px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px}
.cal-day-header{background:var(--card);padding:10px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal-day{min-height:100px;padding:8px;background:var(--card);cursor:pointer;position:relative}
.cal-day.today{background:rgba(59,130,246,.15);border:2px solid var(--accent)}
.cal-day.empty{background:transparent}
.cal-date{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
.cal-event{font-size:11px;background:rgba(59,130,246,.2);color:var(--accent);padding:2px 6px;border-radius:6px;margin:1px 0;display:block}
.cal-event.exam{background:rgba(139,92,246,.2);color:var(--accent2)}
.cal-event.result{background:rgba(16,185,129,.2);color:var(--green)}
.sidebar{margin-bottom:24px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
a.back-link{color:var(--accent);text-decoration:none;font-weight:600}
a.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>📅 Exam Calendar</h1>
    <p>Upcoming exam dates, result dates, and registration deadlines across all exams.</p>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span>Notification / Registration</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--accent2)"></span>Exam Date</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>Result / Answer Key</div>
  </div>

  <div class="calendar-grid" id="calGrid"></div>

  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">📭</div>
    <div class="empty-text">No upcoming events.</div>
  </div>

  <div style="margin-top:24px;text-align:center">
    <a href="papers.html" class="btn-link">← Browse Papers</a>
  </div>
</div>

<script>
(function(){
  // Exam calendar data — in production this is scraped from official exam calendars
  var today = new Date();
  today.setHours(0,0,0,0);

  var events = [
    { date: '2026-12-05', title: 'SSC CGL Tier 1 Notification', type: 'notification', exam: 'SSC CGL' },
    { date: '2026-12-15', title: 'IBPS PO Prelims 2026', type: 'exam', exam: 'IBPS PO' },
    { date: '2026-12-20', title: 'SBI Clerk Prelims 2026', type: 'exam', exam: 'SBI Clerk' },
    { date: '2027-01-10', title: 'CTET Paper 1 & 2 2027', type: 'exam', exam: 'CTET' },
    { date: '2027-01-15', title: 'SSC CGL Tier 1 Exam 2026', type: 'exam', exam: 'SSC CGL' },
    { date: '2027-02-01', title: 'UPSC Prelims 2027 Notification', type: 'notification', exam: 'UPSC' },
    { date: '2027-02-15', title: 'NDA 1 2027 Exam', type: 'exam', exam: 'NDA' },
    { date: '2027-03-01', title: 'CDS 1 2027 Exam', type: 'exam', exam: 'CDS' },
    { date: '2027-03-15', title: 'CLAT 2027 Exam', type: 'exam', exam: 'CLAT' },
    { date: '2027-04-05', title: 'UPSC Prelims 2027 Exam', type: 'exam', exam: 'UPSC' },
    { date: '2027-04-15', title: 'NEET UG 2027 Exam', type: 'exam', exam: 'NEET' },
    { date: '2027-05-01', title: 'JEE Main 2027 Session 1', type: 'exam', exam: 'JEE' },
    { date: '2027-05-15', title: 'SSC GD Constable 2027', type: 'exam', exam: 'SSC GD' },
    { date: '2027-06-01', title: 'RBI Grade B Phase 1 2027', type: 'exam', exam: 'RBI' },
    { date: '2027-06-15', title: 'Agniveer Rally 2027 Registration', type: 'notification', exam: 'Agniveer' }
  ];

  // Group events by date
  var byDate = {};
  events.forEach(function(e){
    if(!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  // Build calendar for current month + next 2 months
  var calGrid = document.getElementById('calGrid');
  var emptyState = document.getElementById('emptyState');
  
  // Day headers
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  days.forEach(function(d){
    calGrid.innerHTML += '<div class="cal-day-header">'+d+'</div>';
  });

  // Generate calendar cells for next 90 days
  var start = new Date(today);
  start.setDate(1);
  var end = new Date(today);
  end.setMonth(end.getMonth() + 3);
  end.setDate(0);

  var hasEvents = false;
  var d = new Date(start);
  while(d <= end){
    var dateStr = d.toISOString().slice(0,10);
    var cell = document.createElement('div');
    cell.className = 'cal-day';
    var dayNum = d.getDate();
    
    if(d < today){
      cell.className += ' empty';
    } else if(d.getTime() === today.getTime()){
      cell.className += ' today';
    }
    
    cell.innerHTML = '<span class="cal-date">'+dayNum+'</span>';
    
    var evts = byDate[dateStr];
    if(evts && evts.length){
      hasEvents = true;
      evts.forEach(function(e){
        var ev = document.createElement('div');
        ev.className = 'cal-event ' + e.type;
        ev.textContent = e.title + (e.exam ? ' ('+e.exam+')' : '');
        cell.appendChild(ev);
      });
      cell.style.cursor = 'pointer';
      cell.title = evts.map(function(e){ return e.title + ' — ' + e.exam; }).join('\n');
    }
    
    calGrid.appendChild(cell);
    d.setDate(d.getDate() + 1);
  }

  if(!hasEvents){
    emptyState.style.display = 'block';
  }
})();
</script>
<!-- vlymbooq-watermark --><style>#vlymbooq-mark{position:fixed;right:12px;bottom:10px;z-index:60;font:600 11px/1 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(242,230,208,.34);text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;user-select:none}</style><div id="vlymbooq-mark" aria-hidden="true">vlymbooq</div></body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Dashboard - StudyPro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',-apple-system,sans-serif;background:#09090b;color:#fafafa;min-height:100vh}
        a{color:#a78bfa;text-decoration:none}
        .nav{position:sticky;top:0;z-index:50;padding:16px 24px;background:rgba(9,9,11,.8);border-bottom:1px solid rgba(255,255,255,.04)}
        .nav-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
        .site-title{font-size:1.1em;font-weight:800;color:#fafafa}
        .site-title span{background:linear-gradient(135deg,#a78bfa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .container{max-width:700px;margin:0 auto;padding:32px 24px}
        h1{font-size:1.5em;font-weight:800;margin-bottom:4px}
        .sub{color:#71717a;font-size:.9em;margin-bottom:24px}
        .card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:20px;margin-bottom:14px}
        .card h3{font-size:.9em;color:#a1a1aa;margin-bottom:8px}
        .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
        .stat-box{text-align:center;padding:16px;background:rgba(255,255,255,.02);border-radius:10px}
        .stat-num{font-size:1.6em;font-weight:800}
        .stat-label{font-size:.75em;color:#71717a;margin-top:2px}
        .empty{text-align:center;padding:60px;color:#52525b}
        .pc-btn{background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff;border:none;padding:8px 16px;border-radius:100px;font-size:.8em;font-weight:600;cursor:pointer;text-decoration:none}
        .badge-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
        .badge-item{text-align:center;padding:8px 12px;background:rgba(255,255,255,.02);border-radius:8px;font-size:.78em}
        .badge-item .bi-icon{font-size:1.5em;display:block;margin-bottom:2px}
        .badge-item .bi-name{color:#71717a;font-size:.82em}
        .streak-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.12);border-radius:10px;margin-bottom:14px}
        .streak-num{font-size:1.8em;font-weight:900;color:#fbbf24}
        .streak-label{font-size:.8em;color:#a1a1aa}
        .goal-bar{height:8px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden;margin-top:4px}
        .goal-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#34d399);border-radius:100px;transition:width .5s}
        .history-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.82em}
        .history-item:last-child{border:none}
        .history-pct{font-weight:700}
        .history-pct.good{color:#34d399}.history-pct.ok{color:#fbbf24}.history-pct.bad{color:#ef4444}
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7363013795551054" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="site-title"><span>Study</span>Pro</a>
            <div style="display:flex;gap:8px;align-items:center">
                <a href="index.html" class="pc-btn">Home</a>
<a class="auth-btn" href="#" 
style="background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff;border:none;padding:6px 
14px;border-radius:100px;font-size:.78em;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none">Login</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div id="dashboard">
            <h1>📊 My Dashboard</h1>
            <p class="sub">Your practice stats — saved locally in this browser</p>

            <div class="streak-bar" id="streakBar" style="display:none">
                <span style="font-size:2em">🔥</span>
                <div><div class="streak-num" id="streakNum">0</div><div class="streak-label">Day Streak</div></div>
                <div style="margin-left:auto;text-align:right">
                    <div class="streak-num" id="longestStreak" style="font-size:1.2em;color:#a1a1aa">0</div>
                    <div class="streak-label">Longest</div>
                </div>
            </div>

            <div class="stat-row" id="overview"></div>

            <div class="card" id="badgesCard" style="display:none">
                <h3>🏅 Badges & Achievements</h3>
                <div class="badge-grid" id="badgeGrid"></div>
            </div>

            <div class="card" id="goalCard" style="display:none">
                <h3>🎯 Weekly Goal</h3>
                <div id="goalContent"></div>
            </div>

            <div class="card" id="historyCard">
                <h3>📈 Practice History</h3>
                <div id="historyList"></div>
            </div>

            <div class="card" id="weaknessCard" style="display:none">
                <h3>⚠ Topics to Improve</h3>
                <div id="weaknessList"></div>
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
                <a href="leaderboard.html" class="pc-btn">🏆 Leaderboard</a>
                <a href="mistakes.html" class="pc-btn">❌ Review Mistakes</a>
            </div>
        </div>
    </div>
    <script>
    function renderDashboard(data) {
      var results = (data && data.results) || JSON.parse(localStorage.getItem('studypro_results') || '[]');
      var streak = (data && data.profile) ? { current: data.profile.streak_current||0, longest: data.profile.streak_longest||0, lastDate: data.profile.streak_last_date } : JSON.parse(localStorage.getItem('studypro_streak') || '{"current":0,"longest":0,"lastDate":null}');
      var badges = (data && data.profile && data.profile.badges) || JSON.parse(localStorage.getItem('studypro_badges') || '[]');
      var goals = (data && data.profile && data.profile.goals) || JSON.parse(localStorage.getItem('studypro_goals') || '{}');
      var bookmarks = (data && data.bookmarks) || JSON.parse(localStorage.getItem('studypro_bookmarks') || '[]');

      if (streak.current > 0) {
        document.getElementById('streakBar').style.display = 'flex';
        document.getElementById('streakNum').textContent = streak.current;
        document.getElementById('longestStreak').textContent = streak.longest;
      }

      if (badges.length > 0) {
        document.getElementById('badgesCard').style.display = 'block';
        document.getElementById('badgeGrid').innerHTML = badges.map(function(b){
          return '<div class="badge-item"><span class="bi-icon">' + b.icon + '</span><span class="bi-name">' + b.name + '</span></div>';
        }).join('');
      }

      if (goals.papersPerWeek) {
        document.getElementById('goalCard').style.display = 'block';
        var pct = Math.min(100, Math.round((goals.completed || 0) / goals.papersPerWeek * 100));
        document.getElementById('goalContent').innerHTML =
          '<div style="display:flex;justify-content:space-between;font-size:.85em;color:#a1a1aa">' +
          '<span>Completed: ' + (goals.completed || 0) + '/' + goals.papersPerWeek + ' papers</span>' +
          '<span>' + pct + '%</span></div>' +
          '<div class="goal-bar"><div class="goal-fill" style="width:' + pct + '%"></div></div>';
      }

      var totalCorrect = 0, totalAnswered = 0;
      if (results.length > 0) {
        var hl = results.slice(0, 10).map(function(r){
          totalCorrect += r.correct || 0;
          totalAnswered += r.answered || 0;
          var cls = r.pct >= 70 ? 'good' : r.pct >= 40 ? 'ok' : 'bad';
          return '<div class="history-item"><span>' + (r.date ? r.date.slice(0,10) : '?') + ' — ' + (r.exam || 'Paper') + '</span><span class="history-pct ' + cls + '">' + (r.correct||0) + '/' + (r.total||0) + ' (' + (r.pct||0) + '%)</span></div>';
        }).join('');
        document.getElementById('historyList').innerHTML = hl;

        document.getElementById('overview').innerHTML =
          '<div class="stat-box"><div class="stat-num" style="color:#a78bfa">' + totalAnswered + '</div><div class="stat-label">Answered</div></div>' +
          '<div class="stat-box"><div class="stat-num" style="color:' + (totalAnswered > 0 && Math.round(totalCorrect/totalAnswered*100) >= 60 ? '#34d399' : '#ef4444') + '">' + (totalAnswered > 0 ? Math.round(totalCorrect/totalAnswered*100) : 0) + '%</div><div class="stat-label">Accuracy</div></div>' +
          '<div class="stat-box"><div class="stat-num" style="color:#34d399">' + totalCorrect + '</div><div class="stat-label">Correct</div></div>' +
          '<div class="stat-box"><div class="stat-num" style="color:#ef4444">' + (totalAnswered - totalCorrect) + '</div><div class="stat-label">Wrong</div></div>';

        var lowScores = results.filter(function(r){ return r.pct < 60 && r.answered >= 5; });
        if (lowScores.length > 0) {
          document.getElementById('weaknessCard').style.display = 'block';
          document.getElementById('weaknessList').innerHTML = lowScores.slice(0, 5).map(function(r){
            return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:.82em"><span>' + (r.exam || 'Paper') + ' (' + r.date.slice(0,10) + ')</span><span style="color:#ef4444;font-weight:700">' + r.pct + '%</span></div>';
          }).join('');
        }
      } else {
        document.getElementById('overview').innerHTML = '';
        document.getElementById('historyList').innerHTML = '<div style="color:#52525b;padding:20px;text-align:center">Complete a paper to see your stats here</div>';
      }

      if (bookmarks.length > 0) {
        var bc = document.createElement('div');
        bc.style.cssText = 'font-size:.82em;color:#a1a1aa;margin-top:8px';
        bc.textContent = '🔖 ' + bookmarks.length + ' bookmarked question' + (bookmarks.length > 1 ? 's' : '');
        document.getElementById('historyCard').querySelector('h3').after(bc);
      }
    }
    </script>
<script src="js/supabase.js?v=20260529"></script>
    <script>
    // Try loading from Supabase if logged in, else fallback to localStorage
    if (typeof window.loadUserData === 'function') {
      window.loadUserData(function(data) {
        renderDashboard(data);
      });
    } else {
      renderDashboard(null);
    }
    </script>
</body>
</html>

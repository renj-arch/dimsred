<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vlymbooq — history, cut from paper</title>
<meta name="description" content="Short, sourced cinematic histories from vlymbooq: the Salt March, Jallianwala Bagh, Bhopal, Emergency, Vatican Archives — each with an open argument map." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#070707; --panel:#0f0d0a; --panel2:#16110c; --bone:#f2e6d0;
  --muted:rgba(242,230,208,.62); --faint:rgba(242,230,208,.38);
  --gold:#d6a14a; --rust:#b14a2f; --card:#0f0d0a; --line:rgba(242,230,208,.14);
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--bone); font-family:'DM Sans',system-ui,sans-serif; line-height:1.5; min-height:100vh; display:flex; flex-direction:column; }
a { color:var(--gold); text-decoration:none; }
a:hover { color:var(--bone); }
.skip-link { position:absolute; top:-100%; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--bg); padding:.5rem 1rem; border-radius:4px; z-index:100; }
.skip-link:focus { top:1rem; }
header { position:sticky; top:0; z-index:50; background:rgba(7,7,7,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
.header-inner { max-width:1100px; margin:0 auto; padding:.75rem 1rem; display:flex; align-items:center; gap:1rem; }
.logo { font-family:'Cormorant Garamond',serif; font-weight:700; font-size:1.4rem; color:var(--bone); letter-spacing:.02em; }
nav { margin-left:auto; display:flex; gap:1.5rem; font-size:.85rem; font-weight:500; }
nav a { color:var(--muted); }
nav a:hover { color:var(--gold); }
main { flex:1; max-width:1100px; margin:0 auto; padding:4rem 1rem; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.hero { max-width:70ch; }
.hero h1 { font-family:'Cormorant Garamond',serif; font-size:clamp(2.5rem,5vw,4rem); font-weight:700; margin:0 0 1rem; letter-spacing:.01em; }
.hero .tagline { font-size:clamp(1.1rem,2vw,1.4rem); color:var(--muted); margin:0 0 2.5rem; font-weight:400; }
.cta { display:flex; flex-wrap:wrap; justify-content:center; gap:1rem; margin-top:2rem; }
.btn { display:inline-flex; align-items:center; gap:.5rem; padding:.875rem 1.75rem; border-radius:4px; font-weight:600; font-size:.95rem; transition:all .15s; border:2px solid transparent; }
.btn-primary { background:var(--gold); color:var(--bg); border-color:var(--gold); }
.btn-primary:hover { background:var(--bone); color:var(--bg); }
.btn-secondary { background:transparent; color:var(--gold); border-color:var(--gold); }
.btn-secondary:hover { background:var(--gold); color:var(--bg); }
.films-preview { margin-top:4rem; width:100%; max-width:1100px; }
.films-preview h2 { font-family:'Cormorant Garamond',serif; font-size:1.75rem; font-weight:600; margin:0 0 1.5rem; color:var(--gold); text-align:left; }
.preview-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1.25rem; }
.preview-card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .2s; }
.preview-card:hover { border-color:var(--gold); }
.preview-thumb { aspect-ratio:16/9; background:#000; overflow:hidden; }
.preview-thumb img { width:100%; height:100%; object-fit:cover; transition:transform .3s; }
.preview-card:hover .preview-thumb img { transform:scale(1.03); }
.preview-body { padding:1rem 1.25rem; flex:1; display:flex; flex-direction:column; }
.preview-title { font-family:'Cormorant Garamond',serif; font-size:1.1rem; font-weight:600; margin:0 0 .25rem; }
.preview-sub { color:var(--muted); font-size:.85rem; margin:0 0 .75rem; line-height:1.4; }
.preview-meta { display:flex; gap:1rem; font-size:.75rem; color:var(--faint); margin-top:auto; padding-top:.75rem; border-top:1px solid var(--line); }
footer { border-top:1px solid var(--line); padding:2rem 1rem; text-align:center; color:var(--faint); font-size:.8rem; }
@media (max-width: 640px) {
  .header-inner { flex-wrap:wrap; }
  nav { width:100%; justify-content:center; margin-top:.5rem; }
  .hero h1 { font-size:2.2rem; }
}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">vlymbooq</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="films.html">Films</a>
      <a href="https://github.com/renj-arch/dimsred" target="_blank" rel="noopener">Source</a>
    </nav>
  </div>
</header>
<main id="main">
  <div class="hero">
    <h1>vlymbooq</h1>
    <p class="tagline">History, cut from paper.</p>
    <p class="tagline" style="font-size:clamp(.9rem,1.5vw,1.1rem); color:var(--faint);">Short, sourced cinematic arguments. Each film is a single claim — open the map, test the evidence.</p>
    <div class="cta">
      <a class="btn btn-primary" href="films.html">Watch films</a>
      <a class="btn btn-secondary" href="https://github.com/renj-arch/dimsred" target="_blank" rel="noopener">View source</a>
    </div>
  </div>
  <section class="films-preview" aria-label="Published films">
    <h2>Published</h2>
    <div class="preview-grid" id="previewGrid"></div>
  </section>
</main>
<footer>
  vlymbooq · history, cut from paper · <a href="https://github.com/renj-arch/dimsred">source</a>
</footer>
<script>
const PREVIEW = [
  {id:"jallianwala-bagh",title:"Jallianwala Bagh",subtitle:"The garden as a trap of architecture, orders and silence",year:1919,duration:"19m 34s",poster:"media/films/jallianwala-bagh/poster.jpg"},
  {id:"bhopal-gas-tragedy",title:"Bhopal: The Night the City Woke",subtitle:"A city poisoned at midnight; the fight over numbers, liability and memory",year:1984,duration:"22m 11s",poster:"media/films/bhopal-gas-tragedy/poster.jpg"},
  {id:"emergency-1975",title:"The Emergency: A Newspaper With a Blank Column",subtitle:"Censorship as an object: the blank space where the news should be",year:1975,duration:"20m 45s",poster:"media/films/emergency-1975/poster.jpg"},
  {id:"the-vatican-archives",title:"The Vatican Archive That Opens One File at a Time",subtitle:"A sovereign's private papers, and the rules that decide who reads them",year:2020,duration:"18m 22s",poster:"media/films/the-vatican-archives/poster.jpg"},
  {id:"salt-march",title:"Salt: The Empire's Smallest Fear",subtitle:"The salt law as a physical object: the crystal, the tax, the march, the clenched fist at Dharasana",year:1930,duration:"19m 58s",poster:"media/films/salt-march/poster.jpg"}
];
const grid = document.getElementById('previewGrid');
PREVIEW.forEach(f => {
  const card = document.createElement('article');
  card.className = 'preview-card';
  const poster = f.poster || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 9"%3E%3Crect fill="%230f0d0a" width="16" height="9"/%3E%3C/svg%3E';
  card.innerHTML = `
    <a href="watch.html?film=${f.id}" style="text-decoration:none;color:inherit;">
      <div class="preview-thumb"><img src="${poster}" alt="${f.title}" loading="lazy" /></div>
      <div class="preview-body">
        <h3 class="preview-title">${f.title}</h3>
        <p class="preview-sub">${f.subtitle}</p>
        <div class="preview-meta">
          <span>${f.year}</span>
          <span>${f.duration}</span>
        </div>
      </div>
    </a>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>

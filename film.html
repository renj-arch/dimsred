<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vlymbooq film</title>
<style>
  :root {
    --ink:#070707;
    --bone:#f2e6d0;
    --gold:#d6a14a;
    --teal:#0d3037;
    --rust:#a8432a;
    --serif:Georgia,"Liberation Serif","Times New Roman",serif;
    --sans:"Liberation Sans",Arial,Helvetica,sans-serif;
  }
  * { box-sizing:border-box; animation:none !important; transition:none !important; }
  html,body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
  body { font-family:var(--sans); color:var(--bone); }
  #stage { position:relative; width:100vw; height:100vh; overflow:hidden; background:#000; isolation:isolate; }
  #media, #mapLayer, #titleLayer { position:absolute; inset:0; }
  #media { z-index:0; overflow:hidden; }
  #ghost { position:absolute; inset:0; z-index:2; overflow:hidden; background:#000 center/cover no-repeat;

  #dip { position:absolute; inset:0; z-index:5; background:#000; opacity:0; pointer-events:none; }
  #mapLayer { z-index:1; }
  #titleLayer { z-index:1; }
  #grade { z-index:4; }
  #plateImg { position:absolute; inset:-4%; width:108%; height:108%; object-fit:cover;
    transform-origin:50% 50%; will-change:transform; }
  #media.html .html-plate { position:absolute; inset:0; }
  #media.hidden, #mapLayer.hidden, #titleLayer.hidden { display:none; }
  #mapLayer { background:radial-gradient(70% 70% at 54% 46%, #0e2b31 0%, #071417 62%, #040809 100%); }
  .route-map-svg { position:absolute; left:54%; top:50%; width:min(76vh,64vw); height:min(76vh,64vw);
    transform:translate(-50%,-50%); overflow:visible; }
  .map-label { fill:rgba(242,230,208,.82); font-family:var(--sans); font-size:21px;
    letter-spacing:4px; text-transform:uppercase; }
  .map-label.muted { fill:rgba(242,230,208,.30); font-size:17px; letter-spacing:7px; }
  .map-caption { fill:rgba(214,161,74,.65); font-family:var(--sans); font-size:18px;
    letter-spacing:5px; text-transform:uppercase; }
  .poster-overlay { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end;
    padding:0 7vw 9vh; background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72) 100%); z-index:10; }
  .poster-kicker { font-size:.72vw; letter-spacing:.38em; text-transform:uppercase; color:var(--gold); }
  .poster-title { font-family:var(--serif); font-weight:900; font-size:15vw; line-height:.78;

  .poster-sub { font-size:1.05vw; letter-spacing:.28em; text-transform:uppercase; color:rgba(242,230,208,.8); }
  .poster-meta { margin-top:2vh; font-size:.65vw; letter-spacing:.25em; text-transform:uppercase; color:rgba(242,230,208,.46); }
  #grade { position:absolute; inset:0; pointer-events:none;

    mix-blend-mode:multiply; z-index:4; }
  #atmos, #motes { position:absolute; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
  #atmos { mix-blend-mode:screen; }
  #atmos .shaft { position:absolute; left:50%; top:-25%; width:26vw; height:125vh; opacity:0;
    transform-origin:50% 0; filter:blur(22px);
    background:linear-gradient(180deg,rgba(255,192,104,.23),rgba(255,150,58,.08) 42%,transparent 78%);
    clip-path:polygon(38% 0,62% 0,100% 100%,0 100%); }
  #atmos .glow { position:absolute; left:50%; top:50%; width:62vw; height:62vw;
    transform:translate(-50%,-50%); opacity:0; filter:blur(38px);
    background:radial-gradient(circle,rgba(255,148,52,.20),rgba(255,100,18,.05) 45%,transparent 68%); }
  .mote { position:absolute; display:block; width:2px; height:2px; border-radius:50%;

    will-change:transform,opacity; }
  #grain { position:absolute; inset:0; pointer-events:none; opacity:.16; mix-blend-mode:overlay; z-index:6;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E"); }
  #fade { position:absolute; inset:0; background:#000; pointer-events:none; opacity:0; z-index:30; }
  #flash { position:absolute; inset:0; background:#fff8e8; pointer-events:none; opacity:0; mix-blend-mode:screen; z-index:29; }

  #type { position:absolute; inset:0; pointer-events:none; z-index:10; }
  #filmNav { position:absolute; top:4.2vh; right:5.2vw; z-index:40; display:flex; gap:8px; align-items:center; }
  #filmNav a { text-decoration:none; color:rgba(242,230,208,.7); font-size:.62vw; letter-spacing:.2em;

    background:rgba(0,0,0,.28); backdrop-filter:blur(8px); }
  #filmNav a:hover { color:#f2e6d0; border-color:var(--gold); }
  #filmNav a.strong { color:#17110a; background:var(--gold); border-color:var(--gold); font-weight:800; }
  body.capture #filmNav, body.poster #filmNav { display:none; }
  .chapter { position:absolute; left:5.2vw; top:6.4vh; display:flex; align-items:center; gap:14px;
    font-size:.72vw; letter-spacing:.28em; text-transform:uppercase; color:rgba(242,230,208,.55); }
  .chapter b { font-weight:800; color:var(--gold); letter-spacing:.18em; }
  .chapter i { display:block; width:5.2vw; height:1px; background:linear-gradient(90deg,var(--gold),transparent); }
  .statement { position:absolute; left:5.2vw; bottom:8.5vh; max-width:58vw;

  .statement.small { font-family:var(--sans); font-size:.9vw; line-height:1.5; letter-spacing:.13em;
    text-transform:uppercase; max-width:44vw; color:rgba(242,230,208,.82); }
  .statement.impact { left:0; right:0; bottom:auto; top:50%; max-width:100vw; text-align:center;

  .statement.impact .impact-value { display:block; font-family:var(--serif); font-weight:900;

  .statement.impact.wide .impact-value { font-size:7.4vw; letter-spacing:-.045em; }
  .statement.impact .impact-label { display:block; margin-top:2.2vh; font-family:var(--sans);

  .watermark { position:absolute; right:5.2vw; bottom:4.4vh; font-size:.62vw; letter-spacing:.24em;
    text-transform:uppercase; color:rgba(242,230,208,.42); }
  .meta { position:absolute; right:5.2vw; top:6.4vh; text-align:right; font-size:.62vw;
    letter-spacing:.2em; text-transform:uppercase; color:rgba(242,230,208,.42); line-height:1.9; }

  /* Big opening / closing title */
  #titleLayer { display:grid; place-items:center; background:
      radial-gradient(70% 60% at 50% 44%, rgba(214,161,74,.10), transparent 70%),
      #050505; }
  .title-card { text-align:center; padding:0 8vw; }
  .title-kicker { font-size:.72vw; letter-spacing:.42em; text-transform:uppercase; color:var(--gold); }
  .title-main { margin:.08em 0 0; font-family:var(--serif); font-weight:900; letter-spacing:-.07em;
    font-size:13vw; line-height:.82; color:var(--bone); text-shadow:0 10px 70px rgba(214,161,74,.18); }
  .title-sub { margin-top:2.2vh; font-size:1.0vw; letter-spacing:.28em; text-transform:uppercase;
    color:rgba(242,230,208,.62); }
  .title-rule { width:9vw; height:1px; margin:2.4vh auto 0; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .coming-card { max-width:1100px; }
  .coming-note { margin:3.2vh auto 0; max-width:620px; color:rgba(242,230,208,.62);
    font-size:clamp(14px,1vw,18px); line-height:1.6; letter-spacing:.02em; }
  .coming-links { display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin-top:3.4vh; }
  .coming-links a { color:var(--bone); text-decoration:none; border:1px solid rgba(242,230,208,.22);
    border-radius:999px; padding:12px 18px; font-size:clamp(11px,.7vw,14px); letter-spacing:.2em;
    text-transform:uppercase; background:rgba(0,0,0,.25); }
  .coming-links a:hover { border-color:var(--gold); }
  .coming-links a.strong { color:#17110a; background:var(--gold); border-color:var(--gold); font-weight:800; }
  @media (max-width:760px) {
    .title-main { font-size:28vw; }
    .title-sub { font-size:3.6vw; letter-spacing:.18em; }
    .title-kicker { font-size:2.6vw; }
    #filmNav { top:18px; right:18px; }
    #filmNav a { font-size:10px; padding:7px 10px; }
  }

  /* ---------- HTML plates ---------- */
  .html-plate { overflow:hidden; background:#080808; }
  .plate-vignette { position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 40%,transparent 30%,rgba(0,0,0,.5) 100%); }

  .type-card { display:flex; flex-direction:column; justify-content:center; padding:8vh 9vw;
    background:
      radial-gradient(60% 55% at 50% 44%, rgba(214,161,74,.11), transparent 70%),

  .type-card .tc-rule { width:12vw; height:1px; margin:0 0 3.2vh;

  .type-card .tc-rule.bottom { margin:3.4vh 0 0; background:linear-gradient(90deg,rgba(214,161,74,0),var(--gold)); }

  .type-card .tc-main { font-family:var(--serif); font-weight:900; font-size:9vw; line-height:.82;

    text-shadow:0 8vh 8vw rgba(0,0,0,.55); }
  .type-card.long .tc-main { font-size:5.7vw; line-height:.92; letter-spacing:-.045em; }
  .type-card .tc-sub { margin-top:3.2vh; font-family:var(--sans); font-size:.9vw;
    letter-spacing:.26em; text-transform:uppercase; color:rgba(242,230,208,.6); }

  .ledger .desk { position:absolute; inset:0; opacity:.55;

  .ledger .paper { position:absolute; left:19%; top:17%; width:42%; height:58%;

    padding:4.2vh 3.4vw; color:#2a1c10; }
  .ledger .paper h3 { margin:0; font-family:var(--serif); font-size:2.1vw; letter-spacing:-.03em; }
  .ledger .paper p { margin:1.1vh 0; font-size:.72vw; letter-spacing:.16em; text-transform:uppercase; opacity:.8; }
  .ledger .rule { height:1px; background:rgba(42,28,16,.25); margin:1.2vh 0; }
  .ledger .stamp { position:absolute; right:5%; bottom:10%; transform:rotate(-11deg);

    font-size:.8vw; font-weight:800; letter-spacing:.18em; text-transform:uppercase; opacity:.85; }
  .ledger .scale { position:absolute; right:13%; top:24%; width:15vw; height:15vw; }
  .ledger .beam { position:absolute; left:6%; right:6%; top:31%; height:2px; background:linear-gradient(90deg,transparent,#d6a14a,transparent); }
  .ledger .pan { position:absolute; top:34%; width:4.2vw; height:2.4vw; border-radius:0 0 50% 50%;
    background:linear-gradient(180deg,#b98a38,#6e4a17); box-shadow:inset 0 2px 6px rgba(255,255,255,.25); }
  .ledger .pan.l { left:1%; } .ledger .pan.r { right:1%; }
  .ledger .pile { position:absolute; right:19%; bottom:16%; width:13vw; height:4.6vw;
    background:radial-gradient(ellipse at 50% 25%, #fffdf2, #d8cfb8 45%, #8e8268 100%);
    border-radius:50% 50% 12% 12%; filter:drop-shadow(0 2vh 2vh rgba(0,0,0,.4)); }

  .kitchen { background:
      radial-gradient(55% 60% at 28% 46%, rgba(214,98,45,.24), transparent 66%),
      radial-gradient(80% 70% at 70% 70%, rgba(214,161,74,.08), transparent 70%),
      linear-gradient(155deg,#160f0b,#070504 70%); }
  .kitchen .table { position:absolute; left:0; right:0; bottom:0; height:32%;
    background:linear-gradient(180deg,#2a1a10,#0c0806); box-shadow:0 -2vh 6vh rgba(0,0,0,.55); }
  .kitchen .bowl { position:absolute; left:18%; bottom:28%; width:24vw; height:10vw;
    background:radial-gradient(ellipse at 50% 30%, #5b3a22, #1f120b 60%, #0b0705 100%);
    border-radius:0 0 50% 50%; box-shadow:0 2vh 4vh rgba(0,0,0,.5); }
  .kitchen .bread { position:absolute; left:45%; bottom:31%; width:14vw; height:5.6vw;
    background:radial-gradient(ellipse at 40% 30%, #c79b5d, #6f4a24 70%); border-radius:50%; transform:rotate(-8deg); }
  .kitchen .saltdish { position:absolute; right:19%; bottom:31%; width:8vw; height:3.2vw;
    background:radial-gradient(ellipse at 50% 30%, #fffdf4, #cfc2a5 55%, #80745e 100%);
    border-radius:0 0 50% 50%; box-shadow:0 1.2vh 2.4vh rgba(0,0,0,.45); }
  .kitchen .fire { position:absolute; left:4%; bottom:18%; width:9vw; height:9vw; border-radius:50%;
    background:radial-gradient(circle,#ffb15c 0%,#a8432a 30%,transparent 68%); filter:blur(1.2vw); opacity:.8; }
  .kitchen .steam { position:absolute; left:26%; bottom:44%; width:10vw; height:20vh;
    background:radial-gradient(ellipse at 50% 80%,rgba(255,255,255,.10),transparent 70%); filter:blur(1vw); }

  .letter { background:
      radial-gradient(70% 70% at 44% 42%, rgba(214,161,74,.18), transparent 70%),
      linear-gradient(150deg,#2a1b10,#0a0705 70%); }
  .letter .sheet { position:absolute; left:14%; top:10%; width:58%; height:80%;
    background:linear-gradient(155deg,#ead9b9,#d4bd94); transform:rotate(2.4deg);
    padding:6vh 5vw; color:#2a1c10; box-shadow:0 4vh 10vh rgba(0,0,0,.6); }
  .letter .sheet h2 { margin:0 0 2vh; font-family:var(--serif); font-size:3.4vw; letter-spacing:-.04em; }
  .letter .line { height:1px; background:rgba(42,28,16,.25); margin:1.4vh 0; }

  .letter .seal { position:absolute; right:10%; bottom:9%; width:6vw; height:6vw; border-radius:50%;

  .letter .wheel { position:absolute; right:4%; top:14%; width:20vw; height:20vw; border-radius:50%;

  .letter .wheel::after { inset:32%; }

  .viceroy { background:

  .viceroy .col.l { left:0; } .viceroy .col.r { right:0; }

  .viceroy .desk { position:absolute; left:22%; right:18%; bottom:16%; height:16%;

  .headlines { background:

  .headlines .rule { height:2px; background:#21180f; margin:1.1vh 0; }

  .headlines .paper:nth-child(2) h4 { color:#8e2f1d; }
</style>
</head>
<body>
<div id="stage">
  <div id="media" class="hidden"></div>
  <div id="ghost"></div>
  <div id="mapLayer" class="hidden"></div>
  <div id="titleLayer" class="hidden"></div>
  <div id="atmos"><span class="shaft"></span><span class="glow"></span></div>
  <div id="motes"></div>
  <div id="grade"></div>
  <div id="grain"></div>
  <div id="dip"></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="type">
    <div class="chapter" id="chapter"><b id="chapterNum">01</b><i></i><span id="chapterTitle"></span></div>
    <div class="meta" id="meta"></div>
    <div class="statement" id="statement"></div>
    <div class="watermark">vlymbooq · a film in the making</div>
  </div>
  <nav id="filmNav" aria-label="Film extras">
    <a href="debates.html#context">Context</a>

  </nav>
</div>
<script src="js/film.js"></script>
</body>

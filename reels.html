<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reels — vlymbooq</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--bg:#09090b;--card:#111113;--border:rgba(255,255,255,.06);--accent:#a78bfa;--text:#fafafa;--muted:#a1a1aa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:900px;margin:0 auto;padding:24px 16px}
.page-header{margin-bottom:24px}
.page-header h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.page-header p{font-size:.9rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.reel{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:9/16;cursor:pointer;border:1px solid var(--border)}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.reel:hover::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.06)}
.reel .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;background:rgba(0,0,0,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.reel:hover .play{opacity:1}
.reel .play::before{content:"";display:block;width:0;height:0;border-left:20px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:4px}
.reel .meta{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,#000);font-size:.78rem}
.reel .title{font-weight:700;display:block}
.reel .film-id{font-size:.7rem;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
a.back-link{color:var(--accent);text-decoration:none;font-weight:700}
a.back-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>🎬 Reels</h1>
    <p>Vertical dispatches cut from existing film renders — no new footage, no paid tools.</p>
  </div>

  <div id="reelGrid" class="grid"></div>

  <div id="emptyState" class="empty" style="display:none">
    <div style="font-size:2rem;margin-bottom:12px">📭</div>
    <div>No reels yet. Run the <code>reel-cut.yml</code> workflow to generate them.</div>
  </div>

  <div style="margin-top:32px;text-align:center">
    <a href="index.html" class="back-link">← Home</a>
  </div>
</div>

<script>
// Reel data is generated by scripts/reel-cut.js and committed to data/reels.json.
// On GitHub Pages the JSON is fetched live; locally it may not exist yet.
fetch('data/reels.json')
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(data){
    const grid = document.getElementById('reelGrid');
    const empty = document.getElementById('emptyState');
    if(!data || data.total === 0){ empty.style.display='block'; return; }
    empty.style.display='none';
    data.reels.forEach(function(r){
      const el = document.createElement('div');
      el.className = 'reel';
      el.title = r.id;
      el.innerHTML =
        '<video playsinline muted><source src="' + r.file + '" type="video/mp4"></video>' +
        '<div class="play"></div>' +
        '<div class="meta"><span class="title">' + escapeHtml(r.id) + '</span><span class="film-id">' + Math.round(r.duration) + 's &middot; film dispatch</span></div>';
      el.onclick = function(){ location.href = 'media/reels/' + r.id + '.mp4'; };
      grid.appendChild(el);
    });
  })
  .catch(function(){ document.getElementById('emptyState').style.display='block'; });

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>

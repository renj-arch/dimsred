<!DOCTYPE html>
<html lang="en">
<head>
    <link rel='stylesheet' href='css/style.css'>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Arena — NEET Prep — vlymbooq</title>
    <meta name="description" content="NEET preparation: Physics, Chemistry, Biology — real exam problems with solutions.">
    <link rel="canonical" href="https://vlymbooq.qzz.io/arena.html">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#09090b;--bg-card:#111113;--border:rgba(255,255,255,.06);--text:#fafafa;--text-sec:#a1a1aa;--text-muted:#52525b;--purple:#a78bfa;--emerald:#34d399;--red:#ef4444;--amber:#f59e0b;--blue:#60a5fa;--pink:#f472b6;--radius:12px}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
        a{color:var(--text);text-decoration:none}
        .nav{position:sticky;top:0;z-index:100;padding:14px 24px;background:rgba(9,9,11,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
        .nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
        .brand{display:flex;align-items:center;gap:8px}
        .brand-icon{width:28px;height:28px;border-radius:6px;flex-shrink:0}
        .brand-text{font-weight:800;font-size:1.05em;background:linear-gradient(135deg,var(--purple),var(--emerald));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .nav-links{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
        .nav-links a{padding:7px 14px;border-radius:100px;font-size:.82em;font-weight:500;color:var(--text-sec);transition:all .2s;white-space:nowrap}
        .nav-links a:hover{color:var(--text);background:rgba(255,255,255,.04)}
        .nav-links a.active{color:var(--text);background:rgba(255,255,255,.06)}
        .container{max-width:700px;margin:0 auto;padding:24px;position:relative}
        @media(max-width:480px){.container{padding:16px}}

        .subj-strip{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
        .subj-strip::-webkit-scrollbar{display:none}
        .subj-pill{padding:8px 20px;border-radius:100px;border:1px solid var(--border);font-size:.82em;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;background:var(--bg-card);color:var(--text-sec);flex-shrink:0}
        .subj-pill:hover{border-color:rgba(255,255,255,.15)}
        .subj-pill.active{background:rgba(167,139,250,.15);border-color:var(--purple);color:var(--purple)}
        .subj-pill[data-subj="Physics"].active{background:rgba(96,165,250,.15);border-color:var(--blue);color:var(--blue)}
        .subj-pill[data-subj="Chemistry"].active{background:rgba(52,211,153,.15);border-color:var(--emerald);color:var(--emerald)}
        .subj-pill[data-subj="Biology"].active{background:rgba(244,114,182,.15);border-color:var(--pink);color:var(--pink)}

        .arena-view{display:none}
        .arena-view.active{display:block}

        .problem-card{padding:32px 24px 24px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);margin-bottom:16px}
        .problem-card .p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .problem-card .p-num{font-size:.72em;color:var(--text-muted)}
        .problem-card .p-counter{font-size:.72em;color:var(--text-muted)}
        .problem-card .p-tags{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
        .problem-card .p-tags .tag{padding:3px 10px;border-radius:100px;font-size:.65em;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
        .problem-card .p-tags .tag.subject{background:rgba(96,165,250,.15);color:var(--blue)}
        .problem-card .p-tags .tag.qid{background:rgba(167,139,250,.1);color:var(--purple)}
        .problem-card .p-text{font-size:clamp(1rem,2.2vw,1.25rem);font-weight:500;line-height:1.7;margin-bottom:20px;padding:16px;background:rgba(255,255,255,.02);border-radius:8px;border:1px solid var(--border)}
        .problem-card .p-answer{font-size:.9em;margin-bottom:12px;display:none}
        .problem-card .p-answer .a-label{color:var(--text-muted);font-size:.78em;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
        .problem-card .p-answer .a-value{font-weight:700;color:var(--emerald)}
        .problem-card .p-solution{font-size:.82em;color:var(--text-sec);line-height:1.7;padding:16px;border-radius:10px;background:rgba(52,211,153,.05);border:1px solid rgba(52,211,153,.1);display:none}
        .problem-card .p-solution .sol-label{font-weight:700;color:var(--emerald);margin-bottom:4px;font-size:.85em}

        .nav-buttons{display:flex;gap:8px;margin-top:12px}
        .nav-btn{padding:12px 24px;border-radius:100px;border:none;font-weight:700;font-size:.9em;cursor:pointer;transition:all .2s;text-align:center;font-family:'Inter',sans-serif;flex:1}
        .nav-btn.prev{background:rgba(255,255,255,.06);color:var(--text)}
        .nav-btn.prev:hover{background:rgba(255,255,255,.1)}
        .nav-btn.next{background:linear-gradient(135deg,var(--purple),var(--emerald));color:#fff}
        .nav-btn.next:hover{opacity:.9;transform:translateY(-1px)}
        .nav-btn:disabled{opacity:.3;cursor:not-allowed;transform:none!important}

        .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:500px;margin:0 0 16px}
        @media(max-width:400px){.opt-grid{grid-template-columns:1fr}}
        .opt-item{padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.02);font-size:.85em;font-weight:500;text-align:left;font-family:'JetBrains Mono',monospace;line-height:1.4}
        .opt-item .opt-label{font-weight:700;color:var(--text-muted);margin-right:6px}
        .opt-item.correct{border-color:var(--emerald);background:rgba(52,211,153,.08)}
        .opt-item.correct .opt-label{color:var(--emerald)}

        .start-view{text-align:center;padding:40px 0}
        .start-view .icon{font-size:4em;margin-bottom:12px}
        .start-view h1{font-size:1.8em;font-weight:900;margin-bottom:6px;background:linear-gradient(135deg,var(--purple),var(--emerald));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .start-view p{color:var(--text-sec);margin-bottom:4px;font-size:.9em}
        .start-view .sub{color:var(--text-muted);font-size:.78em;margin-bottom:20px}
        .start-btn{padding:14px 40px;border-radius:100px;border:none;background:linear-gradient(135deg,var(--purple),var(--emerald));color:#fff;font-weight:700;font-size:1em;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
        .start-btn:hover{opacity:.9;transform:translateY(-1px)}
        .count-grid{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:20px}
        .count-card{text-align:center;padding:16px 24px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-card);min-width:130px}
        .count-card .c-label{font-size:.72em;color:var(--text-muted)}
        .count-card .c-num{font-size:1.7em;font-weight:900}
        .count-card .c-name{font-size:.7em;color:var(--text-sec)}
        .loading{text-align:center;padding:60px 0;color:var(--text-muted);font-size:.9em}
        .hidden{display:none!important}
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="brand"><img src="logo.png" alt="" class="brand-icon"><span class="brand-text">vlymbooq</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="micro-test.html">Drill</a>
                <a href="current-affairs.html">📰 GK</a>
                <a href="mental.html">Mental</a>
                <a href="arena.html" class="active" style="color:var(--text);background:rgba(255,255,255,.06)">Arena</a>
            </div>
        </div>
    </nav>

    <div class="container" id="app">
        <div id="subjectStrip" class="subj-strip"></div>

        <div id="startView" class="arena-view active">
            <div class="start-view">
                <div class="icon">🏟️</div>
                <h1>Arena</h1>
                <p>NEET — Real Exam Problems</p>
                <p class="sub" id="bankSub">Loading question bank...</p>
                <div class="count-grid" id="countGrid"></div>
                <button class="start-btn" id="startBtn" onclick="startBrowse()" style="display:none">Start Solving →</button>
            </div>
        </div>

        <div id="browseView" class="arena-view">
            <div class="problem-card" id="problemCard">
                <div class="p-head">
                    <div class="p-num" id="pNum">Problem 1</div>
                    <div class="p-counter" id="pCounter">1 / 0</div>
                </div>
                <div class="p-tags" id="pTags"></div>
                <div class="p-text" id="pText">Loading...</div>
                <div class="opt-grid" id="optGrid"></div>
                <div class="p-answer" id="pAnswer">
                    <div class="a-label">Answer</div>
                    <div class="a-value" id="pAnswerValue">—</div>
                </div>
                <div class="p-solution" id="pSolution">
                    <div class="sol-label">Solution</div>
                    <div id="pSolutionText">—</div>
                </div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn prev" id="prevBtn" onclick="prevProblem()">← Previous</button>
                <button class="nav-btn next" id="nextBtn" onclick="nextProblem()">Next →</button>
            </div>
        </div>
    </div>

    <script>
        var state = { subject: null, allQuestions: [], filtered: [], idx: 0 };
        var LABELS = ['A','B','C','D'];
        var SUBJECTS = ['Physics','Chemistry','Biology'];
        var SUBJ_ICON = { Physics:'⚡', Chemistry:'🧪', Biology:'🧬' };
        var SUBJ_COLOR = { Physics:'var(--blue)', Chemistry:'var(--emerald)', Biology:'var(--pink)' };

        function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t}return arr}

        function init() {
            renderSubjects();
            loadBank();
        }

        function renderSubjects() {
            var strip = document.getElementById('subjectStrip');
            strip.innerHTML = '';
            SUBJECTS.forEach(function(s){
                var pill = document.createElement('div');
                pill.className = 'subj-pill';
                pill.setAttribute('data-subj', s);
                pill.textContent = SUBJ_ICON[s] + ' ' + s;
                pill.onclick = function(){ selectSubject(s); };
                strip.appendChild(pill);
            });
        }

        function selectSubject(subj) {
            state.subject = subj;
            document.querySelectorAll('.subj-pill').forEach(function(p){
                p.classList.toggle('active', p.getAttribute('data-subj') === subj);
            });
            document.getElementById('browseView').classList.remove('active');
            document.getElementById('startView').classList.add('active');
            updateStartView();
        }

        function loadBank() {
            fetch('question-bank/neet.json')
                .then(function(r){ return r.json(); })
                .then(function(data){
                    state.allQuestions = data.questions || [];
                    document.getElementById('bankSub').textContent = state.allQuestions.length + ' real exam problems. Select a subject.';
                    updateStartView();
                    document.getElementById('startBtn').style.display = 'inline-block';
                })
                .catch(function(){
                    document.getElementById('bankSub').textContent = 'Failed to load question bank.';
                });
        }

        function updateStartView() {
            var grid = document.getElementById('countGrid');
            grid.innerHTML = '';
            if (!state.allQuestions.length) return;
            SUBJECTS.forEach(function(s){
                var count = state.allQuestions.filter(function(q){ return q.section === s; }).length;
                var card = document.createElement('div');
                card.className = 'count-card';
                card.innerHTML = '<div class="c-label">Problems</div><div class="c-num" style="color:' + SUBJ_COLOR[s] + '">' + count + '</div><div class="c-name">' + s + '</div>';
                grid.appendChild(card);
            });
        }

        function startBrowse() {
            if (!state.subject || !state.allQuestions.length) return;
            state.filtered = state.allQuestions.filter(function(q){ return q.section === state.subject; });
            shuffle(state.filtered);
            if (state.filtered.length > 50) state.filtered = state.filtered.slice(0, 50);
            state.idx = 0;
            document.getElementById('startView').classList.remove('active');
            document.getElementById('browseView').classList.add('active');
            showProblem();
        }

        function showProblem() {
            var qs = state.filtered;
            if (!qs.length) {
                document.getElementById('pText').innerHTML = 'No problems available for this subject.';
                return;
            }
            var q = qs[state.idx];
            document.getElementById('pNum').textContent = 'Problem ' + (state.idx + 1);
            document.getElementById('pCounter').textContent = (state.idx + 1) + ' / ' + qs.length;
            document.getElementById('pTags').innerHTML = '<span class="tag subject">' + (q.section || '') + '</span><span class="tag qid">#' + (q.id || '') + '</span>';
            document.getElementById('pText').innerHTML = q.text || q.question || '';

            var answer = '';
            var solution = q.solution || '';
            var correctIdx = -1;
            var grid = document.getElementById('optGrid');
            grid.innerHTML = '';
            if (q.options && q.options.length) {
                q.options.forEach(function(o, i){
                    var item = document.createElement('div');
                    item.className = 'opt-item';
                    item.id = 'opt' + i;
                    var label = o.label || LABELS[i];
                    var text = o.text || o;
                    item.innerHTML = '<span class="opt-label">' + label + '.</span> ' + text;
                    grid.appendChild(item);
                    if (o.correct) { correctIdx = i; answer = label + '. ' + text; }
                });
            }
            if (correctIdx >= 0) document.getElementById('opt' + correctIdx).classList.add('correct');

            document.getElementById('pAnswerValue').textContent = answer || '—';
            document.getElementById('pAnswer').style.display = answer ? 'block' : 'none';
            var solEl = document.getElementById('pSolution');
            if (solution) {
                solEl.style.display = 'block';
                document.getElementById('pSolutionText').innerHTML = solution;
            } else {
                solEl.style.display = 'none';
            }

            document.getElementById('prevBtn').disabled = state.idx === 0;
            document.getElementById('nextBtn').disabled = state.idx >= qs.length - 1;
        }

        function nextProblem() {
            if (state.idx < state.filtered.length - 1) {
                state.idx++;
                showProblem();
            }
        }

        function prevProblem() {
            if (state.idx > 0) {
                state.idx--;
                showProblem();
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

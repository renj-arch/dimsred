    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#09090b;--bg-elevated:#0c0c0f;--bg-card:#111113;--bg-hover:#18181b;
            --border:rgba(255,255,255,.06);--border-hover:rgba(255,255,255,.1);
            --text:#fafafa;--text-secondary:#a1a1aa;--text-muted:#52525b;
            --purple:#a78bfa;--purple-dark:#8b5cf6;--emerald:#34d399;
            --radius:12px;--radius-lg:16px;--radius-full:100px;
        }
        html{scroll-behavior:smooth}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
        a{color:var(--text);text-decoration:none}
        ::selection{background:rgba(139,92,246,.3);color:#fff}

        .bg-grid{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
                linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
            background-size:60px 60px;
        }
        .bg-glow{
            position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;
        }
        .bg-glow.purple{width:500px;height:500px;background:rgba(139,92,246,.08);top:-200px;right:-150px}
        .bg-glow.emerald{width:400px;height:400px;background:rgba(16,185,129,.05);bottom:-180px;left:-120px}

        .nav{
            position:sticky;top:0;z-index:100;padding:14px 24px;
            background:rgba(9,9,11,.85);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
            border-bottom:1px solid var(--border);
        }
        .nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
        .brand{display:flex;align-items:center;gap:8px;text-decoration:none}
        .brand-icon{width:28px;height:28px;flex-shrink:0}
        .brand-text{font-weight:800;font-size:1.05em;background:linear-gradient(135deg,var(--purple),var(--emerald));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.02em}
        .nav-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .nav-links a{
            padding:7px 14px;border-radius:var(--radius-full);font-size:.82em;font-weight:500;
            color:var(--text-secondary);transition:all .2s;white-space:nowrap;
        }
        .nav-links a:hover{color:var(--text);background:rgba(255,255,255,.04)}
        .nav-links a.active{color:var(--text);background:rgba(255,255,255,.06)}
        .auth-btn{
            background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.1);
            padding:6px 14px;border-radius:100px;font-size:.78em;font-weight:500;
            cursor:pointer;white-space:nowrap;text-decoration:none;transition:all .2s;
        }
        .auth-btn:hover{background:rgba(255,255,255,.1)}

        .container{max-width:800px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

        /* Hero section */
        .page-hero{
            text-align:center;padding:56px 0 40px;
        }
        .page-hero h1{
            font-size:clamp(1.8rem,4vw,2.5rem);font-weight:900;
            letter-spacing:-.03em;margin-bottom:8px;
        }
        .page-hero h1 span{background:linear-gradient(135deg,var(--purple),var(--emerald));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .page-hero p{color:var(--text-secondary);font-size:.95em;max-width:480px;margin:0 auto}

        /* Stats row */
        .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px}
        .stat-pill{
            text-align:center;padding:20px 12px;border-radius:var(--radius);
            border:1px solid var(--border);background:var(--bg-elevated);
            transition:all .3s;
        }
        .stat-pill:hover{transform:translateY(-2px);border-color:var(--border-hover)}
        .stat-pill .num{font-size:1.6em;font-weight:900;background:linear-gradient(135deg,var(--purple),var(--emerald));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
        .stat-pill .label{font-size:.75em;color:var(--text-muted);margin-top:4px}

        /* Filters */
        .filter-bar{
            display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;justify-content:center;
        }
        .filter-btn{
            padding:8px 18px;border-radius:var(--radius-full);font-size:.82em;font-weight:500;
            border:1px solid var(--border);background:transparent;color:var(--text-secondary);
            cursor:pointer;transition:all .25s;
        }
        .filter-btn:hover{border-color:var(--border-hover);color:var(--text)}
        .filter-btn.active{
            background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;
            border-color:transparent;box-shadow:0 4px 16px rgba(139,92,246,.2);
        }

        /* Podium */
        .podium{
            display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;align-items:end;
            margin-bottom:32px;padding:0 8px;
        }
        .podium-card{
            text-align:center;padding:24px 16px 20px;border-radius:var(--radius-lg) var(--radius-lg) 12px 12px;
            border:1px solid var(--border);background:var(--bg-card);position:relative;
            transition:all .3s;
        }
        .podium-card:hover{transform:translateY(-4px);border-color:var(--border-hover)}
        .podium-card.gold{border-color:rgba(251,191,36,.2);background:linear-gradient(180deg,rgba(251,191,36,.04),transparent);padding-bottom:32px}
        .podium-card.silver{border-color:rgba(148,163,184,.15);background:linear-gradient(180deg,rgba(148,163,184,.03),transparent)}
        .podium-card.bronze{border-color:rgba(217,119,6,.15);background:linear-gradient(180deg,rgba(217,119,6,.03),transparent)}
        .podium-medal{font-size:2.2em;margin-bottom:6px;display:block}
        .podium-name{font-weight:700;font-size:.9em;color:var(--text);margin-bottom:2px}
        .podium-score{font-size:1.1em;font-weight:800;color:var(--emerald)}
        .podium-label{font-size:.7em;color:var(--text-muted);margin-top:2px}
        .podium-rank{font-size:.7em;color:var(--text-muted);position:absolute;top:8px;right:10px}
        .podium-empty{padding:32px 16px;text-align:center;color:var(--text-muted);font-size:.85em}
        .podium-card.gold .podium-empty{color:rgba(251,191,36,.3)}
        .podium-card.silver .podium-empty{color:rgba(148,163,184,.3)}
        .podium-card.bronze .podium-empty{color:rgba(217,119,6,.3)}

        /* Rank list */
        .rank-list{animation:slideUp .4s ease}
        @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .rank-item{
            display:flex;align-items:center;gap:14px;
            padding:16px 20px;margin-bottom:6px;
            border-radius:var(--radius);background:var(--bg-card);
            border:1px solid var(--border);
            transition:all .25s;cursor:pointer;
        }
        .rank-item:hover{background:var(--bg-hover);border-color:var(--border-hover);transform:translateX(4px)}
        .rank-num{
            font-size:1em;font-weight:800;color:var(--text-muted);min-width:36px;text-align:center;
        }
        .rank-num.gold{color:#fbbf24}.rank-num.silver{color:#94a3b8}.rank-num.bronze{color:#d97706}
        .rank-info{flex:1;min-width:0}
        .rank-name{font-weight:600;font-size:.9em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .rank-date{font-size:.72em;color:var(--text-muted);margin-top:1px}
        .rank-stats{text-align:right;flex-shrink:0}
        .rank-pct{font-size:1.15em;font-weight:800;color:var(--emerald);line-height:1}
        .rank-detail{font-size:.72em;color:var(--text-muted);margin-top:1px}
        .rank-bar{
            width:80px;height:4px;border-radius:4px;background:rgba(255,255,255,.05);margin-top:6px;margin-left:auto;
        }
        .rank-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--purple),var(--emerald));transition:width .6s ease}

        .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
        .empty-state .icon{font-size:3em;margin-bottom:12px;display:block}
        .empty-state p{font-size:.9em;margin-bottom:16px}
        .empty-state .btn{
            display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius-full);
            font-size:.85em;font-weight:600;border:none;cursor:pointer;text-decoration:none;
            background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;
            box-shadow:0 4px 24px rgba(139,92,246,.25);transition:all .25s;
        }
        .empty-state .btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(139,92,246,.35)}

        @media(max-width:640px){
            .stats-row{grid-template-columns:1fr;gap:8px}
            .podium{grid-template-columns:1fr 1fr 1fr;gap:4px}
            .podium-card{padding:16px 8px 12px;font-size:.85em}
            .podium-card.gold{padding-bottom:20px}
            .rank-item{padding:12px 14px;gap:10px}
            .rank-bar{width:50px}
            .page-hero{padding:36px 0 24px}
            .filter-bar{gap:4px}
            .filter-btn{padding:6px 12px;font-size:.75em}
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow purple"></div>
    <div class="bg-glow emerald"></div>

    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">
                <img src="logo.png" alt="vlymbooq" style="height:28px;width:28px;border-radius:6px;flex-shrink:0">
                <span class="brand-text">vlymbooq</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="micro-test.html">Lab</a>
                <a href="leaderboard.html" class="active">🏆 Leaderboard</a>
                <a class="auth-btn" href="#">🔑 Sign In</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="page-hero">
            <h1>🏆 <span>Leaderboard</span></h1>
            <p>Your personal best scores ranked across every practice paper</p>
        </section>

        <div class="stats-row" id="summary"></div>

        <div class="filter-bar" id="filters">
            <button class="filter-btn active" data-exam="all">All Exams</button>
            <button class="filter-btn" data-exam="SSC CGL">SSC CGL</button>
            <button class="filter-btn" data-exam="RBI">RBI Grade B</button>
            <button class="filter-btn" data-exam="JEE">JEE</button>
            <button class="filter-btn" data-exam="NEET">NEET</button>
            <button class="filter-btn" data-exam="GATE">GATE</button>
            <button class="filter-btn" data-exam="Agniveer">Agniveer</button>
        </div>

        <div id="list"></div>
    </div>

    <script>
    var currentFilter = 'all';
    var results = JSON.parse(localStorage.getItem('studypro_results') || '[]');

    function getBestByExam(exam) {
      return results.filter(function(r){ return exam === 'all' || (r.exam && r.exam.indexOf(exam) >= 0); });
    }

    function loadBoard(supabaseList) {
      var listEl = document.getElementById('list');
      var data = supabaseList || getBestByExam(currentFilter);

      var isLocal = !supabaseList;
      if (isLocal) {
        data = data.slice().sort(function(a,b){ return b.pct - a.pct; });
      }

      var total = data.length;
      var best = data.length > 0 ? data.reduce(function(a,b){ return a.pct > b.pct ? a : b; }) : null;
      var avg = data.length > 0 ? Math.round(data.reduce(function(s,r){ return s + r.pct; }, 0) / data.length) : 0;

      document.getElementById('summary').innerHTML =
        '<div class="stat-pill"><div class="num">' + total + '</div><div class="label">Entries</div></div>' +
        '<div class="stat-pill"><div class="num">' + avg + '%</div><div class="label">Avg Accuracy</div></div>' +
        (best ? '<div class="stat-pill"><div class="num" style="-webkit-text-fill-color:#fbbf24;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text">' + best.pct + '%</div><div class="label">Best Score</div></div>' : '<div class="stat-pill"><div class="num">—</div><div class="label">Best Score</div></div>');

      if (data.length === 0) {
        listEl.innerHTML = '<div class="empty-state"><span class="icon">🏆</span><p>No scores yet. Complete a practice paper to appear here!</p><a href="index.html#papers" class="btn">Browse Papers</a></div>';
        return;
      }

      var top3 = data.slice(0, 3);
      var rest = data.slice(3);
      var html = '';

      // Podium
      var podiumOrder = [1, 0, 2]; // silver, gold, bronze
      html += '<div class="podium">';
      podiumOrder.forEach(function(idx) {
        if (idx < top3.length) {
          var item = top3[idx];
          var medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉';
          var cls = idx === 0 ? 'gold' : idx === 1 ? 'silver' : 'bronze';
          var name = isLocal ? (item.exam || 'Paper') : (item.name || 'Anonymous');
          html += '<div class="podium-card ' + cls + '">';
          html += '<span class="podium-medal">' + medal + '</span>';
          html += '<div class="podium-name">' + name + '</div>';
          html += '<div class="podium-score">' + item.pct + '%</div>';
          html += '<div class="podium-label">' + item.correct + '/' + item.total + '</div>';
          html += '<div class="podium-rank">#' + (idx+1) + '</div>';
          html += '</div>';
        } else {
          var cls = idx === 0 ? 'gold' : idx === 1 ? 'silver' : 'bronze';
          html += '<div class="podium-card ' + cls + '"><div class="podium-empty">Empty</div></div>';
        }
      });
      html += '</div>';

      // Rest of the list
      if (rest.length > 0) {
        html += '<div class="rank-list">';
        rest.forEach(function(item, i) {
          var rank = i + 4;
          var cls = '';
          var medal = '';
          var name = isLocal ? (item.exam || 'Paper') : (item.name || 'Anonymous');
          var pct = item.pct || 0;
          var barW = Math.max(10, pct) + '%';
          html += '<div class="rank-item" style="animation-delay:' + (i * 0.04) + 's">';
          html += '<div class="rank-num ' + cls + '">#' + rank + '</div>';
          html += '<div class="rank-info">';
          html += '<div class="rank-name">' + name + '</div>';
          html += '<div class="rank-date">' + (item.date ? item.date.slice(0,10) : '') + (item.exam && isLocal ? ' · ' + item.exam : '') + '</div>';
          html += '</div>';
          html += '<div class="rank-stats">';
          html += '<div class="rank-pct">' + pct + '%</div>';
          html += '<div class="rank-detail">' + item.correct + '/' + item.total + '</div>';
          html += '<div class="rank-bar"><div class="rank-bar-fill" style="width:' + barW + '"></div></div>';
          html += '</div>';
          html += '</div>';
        });
        html += '</div>';
      }

      listEl.innerHTML = html;
    }

    document.querySelectorAll('.filter-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
        this.classList.add('active');
        currentFilter = this.getAttribute('data-exam');
        if (typeof window.getLeaderboard === 'function') {
          window.getLeaderboard(currentFilter === 'all' ? null : currentFilter, function(data){
            if (data && data.length > 0) { loadBoard(data); }
            else { loadBoard(); }
          });
        } else {
          loadBoard();
        }
      });
    });
    </script>
    <script>
    if (typeof window.getLeaderboard === 'function') {
      window.getLeaderboard(null, function(data){
        if (data && data.length > 0) { loadBoard(data); }
        else { loadBoard(); }
      });
    } else {
      loadBoard();
    }
    </script>
<script src="js/bundles/core.js"></script>
    <script>if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}</script>
</body>
</html>

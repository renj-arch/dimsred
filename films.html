<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Films — history told as an argument | vlymbooq</title>
<meta name="description" content="Short, sourced cinematic histories from vlymbooq: the Salt March, Jallianwala Bagh, Bhopal, Emergency, Vatican Archives — each with an open argument map." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#070707; --panel:#0f0d0a; --panel2:#16110c; --bone:#f2e6d0;
  --muted:rgba(242,230,208,.62); --faint:rgba(242,230,208,.38);
  --gold:#d6a14a; --rust:#b14a2f; --card:#0f0d0a; --line:rgba(242,230,208,.14);
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--bone); font-family:'DM Sans',system-ui,sans-serif; line-height:1.5; }
a { color:var(--gold); text-decoration:none; }
a:hover { color:var(--bone); }
.skip-link { position:absolute; top:-100%; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--bg); padding:.5rem 1rem; border-radius:4px; z-index:100; }
.skip-link:focus { top:1rem; }
header { position:sticky; top:0; z-index:50; background:rgba(7,7,7,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
.header-inner { max-width:1100px; margin:0 auto; padding:.75rem 1rem; display:flex; align-items:center; gap:1rem; }
.logo { font-family:'Cormorant Garamond',serif; font-weight:700; font-size:1.4rem; color:var(--bone); letter-spacing:.02em; }
nav { margin-left:auto; display:flex; gap:1.5rem; font-size:.85rem; font-weight:500; }
nav a { color:var(--muted); }
nav a:hover { color:var(--gold); }
main { max-width:1100px; margin:0 auto; padding:2rem 1rem 4rem; }
.page-hero { text-align:center; margin-bottom:3rem; }
.page-hero h1 { font-family:'Cormorant Garamond',serif; font-size:clamp(2rem,4vw,3rem); font-weight:700; margin:0 0 .75rem; }
.page-hero p { color:var(--muted); max-width:60ch; margin:0 auto; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.5rem; }
.card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .2s, box-shadow .2s; }
.card:hover { border-color:var(--gold); box-shadow:0 8px 32px rgba(0,0,0,.4); }
.card-link { display:block; text-decoration:none; color:inherit; }
.card-thumb { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; }
.card-thumb img { width:100%; height:100%; object-fit:cover; transition:transform .3s; }
.card:hover .card-thumb img { transform:scale(1.05); }
.card-play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.4); opacity:0; transition:opacity .2s; }
.card:hover .card-play { opacity:1; }
.card-play svg { width:64px; height:64px; fill:var(--bone); filter:drop-shadow(0 4px 16px rgba(0,0,0,.6)); }
.card-body { padding:1rem 1.25rem 1.25rem; flex:1; display:flex; flex-direction:column; }
.card-title { font-family:'Cormorant Garamond',serif; font-size:1.25rem; font-weight:600; margin:0 0 .25rem; }
.card-subtitle { color:var(--muted); font-size:.9rem; margin:0 0 .75rem; line-height:1.4; }
.card-meta { display:flex; flex-wrap:wrap; gap:.75rem; font-size:.75rem; color:var(--faint); margin-top:auto; padding-top:.75rem; border-top:1px solid var(--line); }
.card-meta span { display:flex; align-items:center; gap:.25rem; }
.card-meta svg { width:14px; height:14px; opacity:.7; }
footer { border-top:1px solid var(--line); padding:2rem 1rem; text-align:center; color:var(--faint); font-size:.8rem; }
@media (max-width: 640px) {
  .header-inner { flex-wrap:wrap; }
  nav { width:100%; justify-content:center; margin-top:.5rem; }
}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to films</a>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">vlymbooq</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="films.html">Archive</a>
      <a href="https://github.com/renj-arch/dimsred" target="_blank" rel="noopener">Source</a>
    </nav>
  </div>
</header>
<main id="main">
  <div class="page-hero">
    <h1>Films</h1>
    <p>Short, sourced cinematic histories. Each film is a single argument — open the map, test the evidence.</p>
  </div>
  <div class="grid" id="filmGrid">
    <!-- Film cards injected here -->
  </div>
</main>
<footer>
  vlymbooq · history, cut from paper · <a href="https://github.com/renj-arch/dimsred">source</a>
</footer>
<script>
const FILMS = [
  {
    id: "jallianwala-bagh",
    title: "Jallianwala Bagh",
    subtitle: "The garden as a trap of architecture, orders and silence",
    year: 1919,
    duration: "19m 34s",
    scenes: 40,
    poster: "media/films/jallianwala-bagh/poster.jpg",
    tags: ["colonial india", "punjab", "1919"]
  },
  {
    id: "bhopal-gas-tragedy",
    title: "Bhopal: The Night the City Woke",
    subtitle: "A city poisoned at midnight; the fight over numbers, liability and memory",
    year: 1984,
    duration: "22m 11s",
    scenes: 40,
    poster: "media/films/bhopal-gas-tragedy/poster.jpg",
    tags: ["industrial disaster", "union carbide", "1984"]
  },
  {
    id: "emergency-1975",
    title: "The Emergency: A Newspaper With a Blank Column",
    subtitle: "Censorship as an object: the blank space where the news should be",
    year: 1975,
    duration: "20m 45s",
    scenes: 40,
    poster: "media/films/emergency-1975/poster.jpg",
    tags: ["indira gandhi", "constitution", "1975"]
  },
  {
    id: "the-vatican-archives",
    title: "The Vatican Archive That Opens One File at a Time",
    subtitle: "A sovereign's private papers, and the rules that decide who reads them",
    year: 2020,
    duration: "18m 22s",
    scenes: 40,
    poster: "media/films/the-vatican-archives/poster.jpg",
    tags: ["vatican", "pope pius xii", "holocaust"]
  },
  {
    id: "salt-march",
    title: "Salt: The Empire's Smallest Fear",
    subtitle: "The salt law as a physical object: the crystal, the tax, the march, the clenched fist at Dharasana",
    year: 1930,
    duration: "19m 58s",
    scenes: 40,
    poster: "media/films/salt-march/poster.jpg",
    tags: ["gandhi", "dandi", "1930"]
  }
];

const grid = document.getElementById('filmGrid');
FILMS.forEach(f => {
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.film = f.id;
  const poster = f.poster || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 9"%3E%3Crect fill="%230f0d0a" width="16" height="9"/%3E%3C/svg%3E';
  card.innerHTML = `
    <a class="card-link" href="watch.html?film=${f.id}" aria-label="Watch ${f.title}">
      <div class="card-thumb">
        <img src="${poster}" alt="${f.title} poster" loading="lazy" />
        <div class="card-play" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="card-body">
        <h2 class="card-title">${f.title}</h2>
        <p class="card-subtitle">${f.subtitle}</p>
        <div class="card-meta">
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ${f.year}</span>
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${f.duration}</span>
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> ${f.scenes} scenes</span>
        </div>
      </div>
    </a>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>

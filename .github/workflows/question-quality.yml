name: Question Quality

# Runs the question-quality/generation agent against data/questions ONLY.
# Separated from site-agent because data/questions is ~9GB: checking it out
# alongside the full site caused 33-min "early EOF" failures and OOM'd the
# 27B model. Here the checkout is questions-only and generation runs on a
# clean machine — same proven 27B path as llm-autofix.

on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:

concurrency:
  group: question-quality
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data/questions
          sparse-checkout-cone: false
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create swap (24GB — 27B needs it)
        run: |
          sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=24576 status=progress
          sudo chmod 600 /tmp/swapfile
          sudo mkswap /tmp/swapfile
          sudo swapon /tmp/swapfile
          sudo sysctl vm.swappiness=90
          free -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        run: |
          export OLLAMA_MAX_LOADED_MODELS=1
          export OLLAMA_KEEP_ALIVE=60m
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_FLASH_ATTENTION=1
          export OLLAMA_KV_CACHE_TYPE=q8_0
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434/api/tags > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags > /dev/null && echo "Ollama ready" || echo "Ollama FAILED"

      - name: Pull qwen3.8:27b
        run: |
          ollama pull qwen3.8:27b
          echo "MODEL=qwen3.8:27b" >> $GITHUB_ENV
          free -h
          df -h

      - name: Free memory
        run: |
          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true
          free -h

      - name: Run question-quality agent
        env:
          OLLAMA_MODEL: qwen3.8:27b
          NODE_OPTIONS: '--max-old-space-size=2048'
          # Signals site-agent.js to run ONLY the Questions+Content agents
          AGENT_ONLY: questions
        run: node scripts/site-agent.js

      - name: Publish question fixes
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git reset HEAD -- . 2>/dev/null || true
          git add data/questions/ data/agent-log.json data/questions-report.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No question fixes to publish"
          else
            git commit -m "question-quality: qwen3.8:27b improved questions (run #${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase 2>/dev/null && git push 2>/dev/null && { echo "Pushed"; break; } || echo "push attempt $i failed..."
              sleep 5
            done || echo "::warning::push failed"
          fi

name: Layman Intro

# Adds a "Start here — in plain words" block (what it is, an everyday picture,
# why it matters, the one thing to remember) at the top of hard lessons, with
# an independent model checking it is accurate and genuinely beginner-level.

on:
  schedule:
    - cron: '43 */3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Lessons to add an intro to this run'
        required: false
        default: '8'

concurrency:
  group: layman-intro
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write plain-language intros
        env:
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS: '1'
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '8' }}
        run: node scripts/add-layman-intro.js --limit "$LIMIT"

      - name: Publish the intros
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add 'lesson-*.html' 2>/dev/null || true
          git add upsc/course 2>/dev/null || true
          git add -f data/layman-intro-state.json 2>/dev/null || true
          bash scripts/ci-push.sh "layman-intro: start-here blocks on hard lessons"
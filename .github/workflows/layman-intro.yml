name: Layman Intro

# Adds a "Start here — in plain words" block (what it is, an everyday picture,
# why it matters, the one thing to remember) at the top of hard lessons, with
# an independent model checking it is accurate and genuinely beginner-level.

on:
  schedule:
    - cron: '43 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Lessons to add an intro to this run'
        required: false
        default: '20'

concurrency:
  group: layman-intro
  cancel-in-progress: false

permissions:
  contents: write
  # Self-chaining: the lane dispatches its own next run while work remains.
  actions: write

jobs:
  intro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write plain-language intros
        env:
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS: '1'
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '20' }}
        run: |
          set -o pipefail
          node scripts/add-layman-intro.js --limit "$LIMIT" 2>&1 | tee /tmp/lane.log

      - name: Publish the intros
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add 'lesson-*.html' 2>/dev/null || true
          git add upsc/course 2>/dev/null || true
          git add -f data/layman-intro-state.json 2>/dev/null || true
          bash scripts/ci-push.sh "layman-intro: start-here blocks on hard lessons"

      # Self-chain: run again immediately while lessons still lack an intro. The
      # 2-hour cron is only a restart net. If this run made no progress (model
      # or quota failure) we stop instead of spinning; the cron retries later.
      - name: Queue the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAIN=$(node scripts/add-layman-intro.js --remaining | grep -o 'LANE_REMAINING=[0-9]*' | tail -1 | cut -d= -f2)
          DONE=$(grep -o 'LANE_DONE=[0-9]*' /tmp/lane.log 2>/dev/null | tail -1 | cut -d= -f2)
          echo "remaining=${REMAIN:-?} done=${DONE:-0}"
          if [ -z "$REMAIN" ] || [ "$REMAIN" -le 0 ]; then
            echo "::notice::Layman Intro lane complete — no lesson is waiting."; exit 0
          fi
          if [ "${DONE:-0}" -le 0 ]; then
            echo "::warning::no progress this run; not chaining — the cron will retry."; exit 0
          fi
          for i in 1 2 3; do
            if gh workflow run layman-intro.yml --ref main -f limit="${{ github.event.inputs.limit || '20' }}"; then
              echo "Queued the next Layman Intro run."; exit 0
            fi
            echo "Dispatch attempt $i failed; retrying..."; sleep 10
          done
          echo "::warning::could not dispatch the next run"
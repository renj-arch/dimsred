name: Film pipeline

# Every frame is generated on a GitHub-hosted CPU runner. Nothing is rendered
# on the owner's machine. The free runner has no GPU, so the film is built from
# high-quality Blender stills plus frame-accurate motion graphics on a Skia canvas;
# ffmpeg then encodes the master and Piper supplies the narration.
#
# Manual runs only: a full master is expensive, and a broken storyboard should
# never start a render automatically.

on:
  workflow_dispatch:
    inputs:
      film:
        description: Film storyboard id
        required: true
        default: salt-march
        type: string
      quality:
        description: Draft is 720p/24fps; final is 1080p/24fps
        required: true
        default: draft
        type: choice
        options:
          - draft
          - final
      release:
        description: Publish the MP4, SRT and thumbnail as a GitHub release
        required: true
        default: false
        type: boolean
      publish:
        description: Put the 720p preview, captions and poster on the site (final only)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: film-${{ github.ref }}-${{ inputs.film }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      FILM: ${{ inputs.film }}
      QUALITY: ${{ inputs.quality }}
      BLENDER: /opt/blender-4.2.3-linux-x64/blender
      PYTHON: python3

    steps:
      - name: Checkout (skip the giant question bank)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install ffmpeg, fonts and Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-liberation libxi6 libxxf86vm1 libxfixes3 \
            libxkbcommon0 libsm6 libice6 libgl1 libegl1 libgomp1 \
            libx11-6 libxext6 libxrender1

      - name: Install Blender 4.2.3 LTS
        run: |
          curl -fL --retry 3 -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /opt
          "$BLENDER" --version | head -n 3

      - name: Install Node dependencies
        run: npm ci

      - name: Install Piper
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install piper-tts==1.8.0

      - name: Cache the Piper voice
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en_US-lessac-medium-v1

      - name: Resolve quality settings
        run: |
          set -euo pipefail
          case "$QUALITY" in
            draft)
              echo "WIDTH=1280" >> "$GITHUB_ENV"
              echo "HEIGHT=720" >> "$GITHUB_ENV"
              echo "SAMPLES=16" >> "$GITHUB_ENV"
              echo "CAPTURE_FPS=24" >> "$GITHUB_ENV"
              echo "CRF=20" >> "$GITHUB_ENV"
              echo "VIDEO_BITRATE=3500k" >> "$GITHUB_ENV"
              echo "PRESET=medium" >> "$GITHUB_ENV"
              echo "OUT_NAME=${FILM}-draft.mp4" >> "$GITHUB_ENV"
              ;;
            final)
              echo "WIDTH=1920" >> "$GITHUB_ENV"
              echo "HEIGHT=1080" >> "$GITHUB_ENV"
              echo "SAMPLES=32" >> "$GITHUB_ENV"
              echo "CAPTURE_FPS=24" >> "$GITHUB_ENV"
              echo "CRF=16" >> "$GITHUB_ENV"
              echo "VIDEO_BITRATE=12000k" >> "$GITHUB_ENV"
              echo "PRESET=slow" >> "$GITHUB_ENV"
              echo "OUT_NAME=${FILM}-master.mp4" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown quality: $QUALITY" >&2
              exit 2
              ;;
          esac

      - name: Validate storyboard
        run: node scripts/film/validate-film.js "data/films/${FILM}.json"

      - name: Validate political argument map
        run: node scripts/film/validate-debates.js "data/films/${FILM}-debates.json"

      - name: Render 3D plates with Blender
        run: |
          node scripts/film/render-plates.js \
            --film "$FILM" \
            --out-dir "out/film/$FILM/plates" \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --samples "$SAMPLES"

      - name: Build film (map, Piper, Skia frames, ffmpeg)
        run: |
          node scripts/film/build-film.js \
            --film "$FILM" \
            --work "out/film/$FILM" \
            --out "out/film/$FILM/$OUT_NAME" \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --fps 24 \
            --capture-fps "$CAPTURE_FPS" \
            --crf "$CRF" \
            --video-bitrate "$VIDEO_BITRATE" \
            --preset "$PRESET" \
            --samples "$SAMPLES" \
            --skip-plates \
            --tts piper \
            --voice en_US-lessac-medium

      - name: Refuse a starved master
        if: inputs.quality == 'final'
        run: |
          set -euo pipefail
          FILE="out/film/$FILM/$OUT_NAME"
          RATE=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=bit_rate -of csv=p=0 "$FILE")
          SIZE=$(stat -c%s "$FILE")
          echo "master ${SIZE} bytes, video ${RATE} bps"
          # A 1080p film of grainy plates cannot honestly encode below this.
          # 40324105535 came in at 738 kbps with 14 KB frames behind it.
          if [ "${RATE:-0}" -lt 2500000 ]; then
            echo "::error::master video bitrate ${RATE} bps is below the 2.5 Mbps floor; the frames are probably degraded again"
            exit 1
          fi

      - name: Independent QC
        run: |
          set -euo pipefail
          FLOOR=1200000
          if [ "$QUALITY" = "final" ]; then FLOOR=2500000; fi
          node scripts/film/qc-film.js \
            --film "$FILM" \
            --file "out/film/$FILM/$OUT_NAME" \
            --work "out/film/$FILM" \
            --expect-width "$WIDTH" \
            --expect-height "$HEIGHT" \
            --min-bitrate "$FLOOR" \
            --max-true-peak -1.0 \
            --srt "out/film/$FILM/$FILM.srt" \
            --poster "out/film/$FILM/$FILM-thumb.jpg" \
            --out-dir "out/film/$FILM/qc"

      - name: Upload film artefact
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ inputs.film }}-${{ inputs.quality }}
          if-no-files-found: error
          retention-days: 14
          path: |
            out/film/${{ inputs.film }}/*.mp4
            out/film/${{ inputs.film }}/*.srt
            out/film/${{ inputs.film }}/*-thumb.jpg
            out/film/${{ inputs.film }}/metadata.json
            out/film/${{ inputs.film }}/youtube.md
            out/film/${{ inputs.film }}/script.md
            out/film/${{ inputs.film }}/timeline.json
            out/film/${{ inputs.film }}/edit-manifest.json
            out/film/${{ inputs.film }}/edit-qc.json
            out/film/${{ inputs.film }}/map.json
            out/film/${{ inputs.film }}/qc/qc.json
            out/film/${{ inputs.film }}/qc/*.png
            out/film/${{ inputs.film }}/plates/*.png

      - name: Publish film release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: film-${{ inputs.film }}-${{ inputs.quality }}-${{ github.run_number }}
          name: ${{ inputs.film }} · ${{ inputs.quality }} · run ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Generated on a GitHub-hosted CPU runner by the Film pipeline.

            - Blender 4.2.3 LTS (Cycles CPU)
            - Piper local narration
            - Skia canvas compositor
            - ffmpeg H.264/AAC master with burned captions

            Download the MP4, SRT and thumbnail below. YouTube upload remains a
            deliberate owner action.
          files: |
            out/film/${{ inputs.film }}/*.mp4
            out/film/${{ inputs.film }}/*.srt
            out/film/${{ inputs.film }}/*-thumb.jpg
            out/film/${{ inputs.film }}/metadata.json
            out/film/${{ inputs.film }}/youtube.md
            out/film/${{ inputs.film }}/script.md
            out/film/${{ inputs.film }}/timeline.json
            out/film/${{ inputs.film }}/edit-manifest.json
            out/film/${{ inputs.film }}/edit-qc.json
            out/film/${{ inputs.film }}/map.json
            out/film/${{ inputs.film }}/qc/qc.json
            out/film/${{ inputs.film }}/qc/*.png
            out/film/${{ inputs.film }}/plates/*.png

      # The only step that touches the public site. It runs after QC and after
      # the release, so a film that failed either one never reaches a viewer.
      # It commits one 720p preview (under the 25 MiB Pages ceiling), the
      # poster, WebVTT captions and the index entry; the mirror workflow then
      # deploys main.
      - name: Publish to the site
        if: ${{ inputs.release == true && inputs.quality == 'final' && inputs.publish == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          FILM: ${{ inputs.film }}
        run: |
          set -euo pipefail
          STAGE="out/site-stage"
          node scripts/film/publish-film.js \
            --film "$FILM" \
            --work "out/film/$FILM" \
            --stage "$STAGE" \
            --master-url "https://github.com/${{ github.repository }}/releases/tag/film-${FILM}-final-${{ github.run_number }}" \
            --status "Final - 1080p master on release" \
            --making "production.html?film=$FILM"
          node scripts/film/site-publish.js \
            --film "$FILM" \
            --stage "$STAGE" \
            --message "film: publish $FILM (run ${{ github.run_number }})"
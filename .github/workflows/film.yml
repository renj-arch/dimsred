name: Film pipeline

# Every frame is generated on a GitHub-hosted CPU runner. Nothing is rendered
# on the owner's machine. The free runner has no GPU, so the film is built from
# high-quality Blender stills plus frame-accurate motion graphics on a Skia canvas;
# ffmpeg then encodes the master and Edge TTS supplies the Indian-English narration.
#
# A full master is expensive, so the autopilot starts with a draft gate: the
# independent QC step must pass before this workflow dispatches the final
# render. Manual runs keep the same gate and can opt out of promotion.

on:
  workflow_dispatch:
    inputs:
      film:
        description: Film storyboard id
        required: true
        default: salt-march
        type: string
      quality:
        description: Draft 720p, final 1080p, ultra 4K
        required: true
        default: draft
        type: choice
        options:
          - draft
          - final
          - ultra
      release:
        description: Publish the MP4, SRT and thumbnail as a GitHub release
        required: true
        default: false
        type: boolean
      publish:
        description: Put the 720p preview, captions and poster on the site (final only)
        required: true
        default: false
        type: boolean
      promote:
        description: After a passing draft, dispatch the final render automatically
        required: true
        default: false
        type: boolean
      autopilot:
        description: This run belongs to the autopilot promotion chain
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: film-${{ github.ref }}-${{ inputs.film }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      FILM: ${{ inputs.film }}
      QUALITY: ${{ inputs.quality }}
      BLENDER: /opt/blender-4.2.3-linux-x64/blender
      PYTHON: python3

    steps:
      - name: Checkout (skip the giant question bank)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install ffmpeg, fonts and Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-liberation libxi6 libxxf86vm1 libxfixes3 \
            libxkbcommon0 libsm6 libice6 libgl1 libegl1 libgomp1 \
            libx11-6 libxext6 libxrender1

      - name: Install Blender 4.2.3 LTS
        run: |
          curl -fL --retry 3 -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /opt
          "$BLENDER" --version | head -n 3

      - name: Install Node dependencies
        run: npm ci

      - name: Install Piper and Edge TTS
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install piper-tts==1.8.0 edge-tts==7.3.1

      - name: Cache the Piper voice
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en_US-lessac-medium-v1

      - name: Compose the original channel theme
        run: node scripts/film/theme.js out/brand/vlymbooq-theme.wav

      - name: Resolve quality settings
        run: |
          set -euo pipefail
          case "$QUALITY" in
            draft)
              echo "WIDTH=1280" >> "$GITHUB_ENV"
              echo "HEIGHT=720" >> "$GITHUB_ENV"
              echo "PLATE_WIDTH=1280" >> "$GITHUB_ENV"
              echo "PLATE_HEIGHT=720" >> "$GITHUB_ENV"
              echo "SAMPLES=16" >> "$GITHUB_ENV"
              echo "CAPTURE_FPS=24" >> "$GITHUB_ENV"
              echo "CRF=20" >> "$GITHUB_ENV"
              echo "VIDEO_BITRATE=3500k" >> "$GITHUB_ENV"
              echo "PRESET=medium" >> "$GITHUB_ENV"
              echo "OUT_NAME=${FILM}-draft.mp4" >> "$GITHUB_ENV"
              ;;
            final)
              echo "WIDTH=1920" >> "$GITHUB_ENV"
              echo "HEIGHT=1080" >> "$GITHUB_ENV"
              echo "PLATE_WIDTH=1920" >> "$GITHUB_ENV"
              echo "PLATE_HEIGHT=1080" >> "$GITHUB_ENV"
              echo "SAMPLES=32" >> "$GITHUB_ENV"
              echo "CAPTURE_FPS=24" >> "$GITHUB_ENV"
              echo "CRF=16" >> "$GITHUB_ENV"
              echo "VIDEO_BITRATE=12000k" >> "$GITHUB_ENV"
              echo "PRESET=slow" >> "$GITHUB_ENV"
              echo "OUT_NAME=${FILM}-master.mp4" >> "$GITHUB_ENV"
              ;;
            ultra)
              echo "WIDTH=3840" >> "$GITHUB_ENV"
              echo "HEIGHT=2160" >> "$GITHUB_ENV"
              echo "PLATE_WIDTH=2560" >> "$GITHUB_ENV"
              echo "PLATE_HEIGHT=1440" >> "$GITHUB_ENV"
              echo "SAMPLES=20" >> "$GITHUB_ENV"
              echo "CAPTURE_FPS=24" >> "$GITHUB_ENV"
              echo "CRF=15" >> "$GITHUB_ENV"
              echo "VIDEO_BITRATE=22000k" >> "$GITHUB_ENV"
              echo "PRESET=slow" >> "$GITHUB_ENV"
              echo "OUT_NAME=${FILM}-4k.mp4" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown quality: $QUALITY" >&2
              exit 2
              ;;
          esac

      - name: Validate storyboard
        run: node scripts/film/validate-film.js "data/films/${FILM}.json"

      - name: Validate political argument map
        run: node scripts/film/validate-debates.js "data/films/${FILM}-debates.json"

      - name: Director gate (Evidence Room grammar)
        run: node scripts/film/validate-director.js "data/films/${FILM}.json"

      - name: Render 3D plates with Blender
        run: |
          node scripts/film/render-plates.js \
            --film "$FILM" \
            --out-dir "out/film/$FILM/plates" \
            --width "$PLATE_WIDTH" \
            --height "$PLATE_HEIGHT" \
            --samples "$SAMPLES"

      # A Cycles segfault writes its reason to /tmp/blender.crash.txt, which the
      # job workspace (and the log) does not include. Keep it for diagnosis.
      - name: Preserve the Blender crash report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-crash
          path: /tmp/blender.crash.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build film (map, Edge TTS, Skia frames, ffmpeg)
        run: |
          node scripts/film/build-film.js \
            --film "$FILM" \
            --work "out/film/$FILM" \
            --out "out/film/$FILM/$OUT_NAME" \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --fps 24 \
            --capture-fps "$CAPTURE_FPS" \
            --crf "$CRF" \
            --video-bitrate "$VIDEO_BITRATE" \
            --preset "$PRESET" \
            --samples "$SAMPLES" \
            --skip-plates \
            --tts edge \
            --voice en-IN-PrabhatNeural

      - name: Refuse a starved master
        if: inputs.quality == 'final' || inputs.quality == 'ultra'
        run: |
          set -euo pipefail
          FILE="out/film/$FILM/$OUT_NAME"
          RATE=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=bit_rate -of csv=p=0 "$FILE")
          SIZE=$(stat -c%s "$FILE")
          FLOOR=2500000
          if [ "$QUALITY" = "ultra" ]; then FLOOR=6000000; fi
          echo "master ${SIZE} bytes, video ${RATE} bps, floor ${FLOOR}"
          # A grainy 1080p/4K film cannot honestly encode below this.
          # 40324105535 came in at 738 kbps with 14 KB frames behind it.
          if [ "${RATE:-0}" -lt "$FLOOR" ]; then
            echo "::error::master video bitrate ${RATE} bps is below the ${FLOOR} bps floor; the frames are probably degraded again"
            exit 1
          fi

      - name: Independent QC
        run: |
          set -euo pipefail
          FLOOR=1200000
          if [ "$QUALITY" = "final" ]; then FLOOR=2500000; fi
          if [ "$QUALITY" = "ultra" ]; then FLOOR=6000000; fi
          node scripts/film/qc-film.js \
            --film "$FILM" \
            --file "out/film/$FILM/$OUT_NAME" \
            --work "out/film/$FILM" \
            --expect-width "$WIDTH" \
            --expect-height "$HEIGHT" \
            --min-bitrate "$FLOOR" \
            --max-true-peak -1.0 \
            --srt "out/film/$FILM/$FILM.srt" \
            --poster "out/film/$FILM/$FILM-thumb.jpg" \
            --out-dir "out/film/$FILM/qc"

      - name: Upload film artefact
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ inputs.film }}-${{ inputs.quality }}
          if-no-files-found: error
          retention-days: 14
          path: |
            out/film/${{ inputs.film }}/*.mp4
            out/film/${{ inputs.film }}/*.srt
            out/film/${{ inputs.film }}/*-thumb.jpg
            out/film/${{ inputs.film }}/metadata.json
            out/film/${{ inputs.film }}/youtube.md
            out/film/${{ inputs.film }}/script.md
            out/film/${{ inputs.film }}/timeline.json
            out/film/${{ inputs.film }}/edit-manifest.json
            out/film/${{ inputs.film }}/edit-qc.json
            out/film/${{ inputs.film }}/map.json
            out/film/${{ inputs.film }}/qc/qc.json
            out/film/${{ inputs.film }}/qc/*.png
            out/film/${{ inputs.film }}/plates/*.png

      # The draft is a gate, not a deliverable. Only a draft that passed the
      # independent QC step above is allowed to spend a final render.
      - name: Promote a passing draft to final
        if: ${{ success() && inputs.quality == 'draft' && inputs.promote == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOPILOT: ${{ inputs.autopilot }}
        run: |
          set -euo pipefail
          gh workflow run film.yml \
            --ref film-ci \
            -f film="$FILM" \
            -f quality=final \
            -f release=true \
            -f publish=true \
            -f promote=false \
            -f autopilot="$AUTOPILOT"

      - name: Publish film release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: film-${{ inputs.film }}-${{ inputs.quality }}-${{ github.run_number }}
          name: ${{ inputs.film }} · ${{ inputs.quality }} · run ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Generated on a GitHub-hosted CPU runner by the Film pipeline.

            - Blender 4.2.3 LTS (Cycles CPU)
            - Edge TTS Indian English narration
            - Original vlymbooq theme (procedural, channel-owned)
            - Skia canvas compositor
            - ffmpeg H.264/AAC master with burned ASS captions

            Download the MP4, SRT and thumbnail below. YouTube upload remains a
            deliberate owner action.
          files: |
            out/film/${{ inputs.film }}/*.mp4
            out/film/${{ inputs.film }}/*.srt
            out/film/${{ inputs.film }}/*-thumb.jpg
            out/film/${{ inputs.film }}/metadata.json
            out/film/${{ inputs.film }}/youtube.md
            out/film/${{ inputs.film }}/script.md
            out/film/${{ inputs.film }}/timeline.json
            out/film/${{ inputs.film }}/edit-manifest.json
            out/film/${{ inputs.film }}/edit-qc.json
            out/film/${{ inputs.film }}/map.json
            out/film/${{ inputs.film }}/qc/qc.json
            out/film/${{ inputs.film }}/qc/*.png
            out/film/${{ inputs.film }}/plates/*.png

      # The only step that touches the public site. It runs after QC and after
      # the release, so a film that failed either one never reaches a viewer.
      # It commits one 720p preview (under the 25 MiB Pages ceiling), the
      # poster, WebVTT captions and the index entry; the mirror workflow then
      # deploys main.
      - name: Publish to the site
        if: ${{ inputs.release == true && inputs.quality == 'final' && inputs.publish == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          FILM: ${{ inputs.film }}
        run: |
          set -euo pipefail
          STAGE="out/site-stage"
          node scripts/film/publish-film.js \
            --film "$FILM" \
            --work "out/film/$FILM" \
            --stage "$STAGE" \
            --master-url "https://github.com/${{ github.repository }}/releases/tag/film-${FILM}-final-${{ github.run_number }}" \
            --status "Final - 1080p master on release" \
            --making "production.html?film=$FILM"
          node scripts/film/site-publish.js \
            --film "$FILM" \
            --stage "$STAGE" \
            --message "film: publish $FILM (run ${{ github.run_number }})"

      # A commit on main is not a film a viewer can open. The mirror turns main
      # into the live branch and Cloudflare builds it; until the index is served
      # from the live domain this step stays red, because "it is on the branch"
      # is exactly the state that looked finished while a viewer saw nothing.
      - name: Confirm the film is live
        if: ${{ inputs.release == true && inputs.quality == 'final' && inputs.publish == true }}
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          FILM: ${{ inputs.film }}
        run: |
          set -euo pipefail
          gh workflow run slim-live.yml --ref main || true
          for i in $(seq 1 24); do
            if curl -fsS "https://vlymbooq.qzz.io/data/film-watch.json?t=$(date +%s)" | grep -q "\"$FILM\""; then
              echo "live: https://vlymbooq.qzz.io/watch?film=$FILM"
              exit 0
            fi
            sleep 30
          done
          echo "::error title=Film not live::The film is committed to main, but data/film-watch.json has not reached the live domain in 12 minutes."
          exit 1

      # The slate is the autopilot's memory. A film that is live but still says
      # storyboard would be authored and rendered again next week.
      - name: Mark the film published in the slate
        if: ${{ inputs.release == true && inputs.quality == 'final' && inputs.publish == true }}
        env:
          FILM: ${{ inputs.film }}
        run: |
          set -euo pipefail
          node scripts/film/slate-publish.js \
            --film "$FILM" --release "film-${FILM}-final-${{ github.run_number }}"
          git config user.name "vlymbooq"
          git config user.email "vlymbooq@users.noreply.github.com"
          git add data/film-slate.json
          if git diff --cached --quiet; then
            echo "slate already marks $FILM published"
            exit 0
          fi
          git commit -m "slate: $FILM is published"
          git push

      # Start the next film immediately. The autopilot has a concurrency lock
      # and a daily cap, so this cannot run away: it either picks the next
      # brief or stops at the cap.
      - name: Start the next film
        if: ${{ success() && inputs.release == true && inputs.quality == 'final' && inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=film-finished

      # Fail closed, but do not fail silently. The first autopilot failure
      # returns the topic to the queue and asks for one retry; the second blocks
      # it with the reason on the slate. Manual runs are not counted.
      - name: Record a failed autopilot promotion
        if: ${{ failure() && inputs.autopilot == true }}
        env:
          FILM: ${{ inputs.film }}
          QUALITY: ${{ inputs.quality }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/film/slate-fail.js \
            --film "$FILM" \
            --stage "$QUALITY" \
            --reason "the $QUALITY stage failed"
          git config user.name "vlymbooq"
          git config user.email "vlymbooq@users.noreply.github.com"
          git add data/film-slate.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "slate: record failed $QUALITY render for $FILM"
          PUSHED=0
          for i in 1 2 3; do
            if git push origin "HEAD:film-ci"; then PUSHED=1; break; fi
            git fetch origin film-ci
            git rebase --autostash origin/film-ci
          done
          test "$PUSHED" = "1"
          if node -e "process.exit(require('./out/film/slate-failure.json').retry ? 0 : 1)"; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
              -f event_type=film-finished
          fi
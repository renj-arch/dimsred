name: WebLLM Upgrade

# Keeps the browser writing model current with zero hands. Each run mirrors the
# newest official @mlc-ai/web-llm release into scripts/vendor byte-for-byte
# (restoring it if a hand-edit ever mangled it), validates every model record
# the tiers would use, regenerates data/webllm-models.json + the offline
# defaults inside ask-llm.js, and publishes. Nothing changed -> ci-push exits 0.

on:
  schedule:
    - cron: '23 5 * * 1'   # weekly, Monday
  workflow_dispatch:

concurrency:
  group: webllm-upgrade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync + validate WebLLM models
        run: node scripts/update-webllm-models.js

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add data/webllm-models.json scripts/vendor/webllm/index.min.js scripts/lib/ask-llm.js
          bash scripts/ci-push.sh "webllm-upgrade: library + model tiers synced with the newest release (run #${{ github.run_number }})"

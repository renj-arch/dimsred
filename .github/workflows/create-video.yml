name: Create Video from Topic

# Model-agent video creation: the agent reads a topic (from topic-bank or
# dispatch inputs), writes a film storyboard with the local model, validates
# it, renders with Blender + Chromium + Piper + ffmpeg, and publishes as a
# GitHub release.
#
# Manual dispatch only: inputs.topic is the topic-bank id. If the topic is not
# in topic-bank.json, inputs.title/angle/why/category/sources are used to add
# it.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic-bank id or new topic slug (e.g. green-revolution)
        required: true
        type: string
      title:
        description: Topic title (for new topics or to override)
        required: false
        type: string
      angle:
        description: Topic angle / approach (for new topics)
        required: false
        type: string
      why:
        description: Why it matters (for new topics)
        required: false
        type: string
      category:
        description: Topic category (for new topics)
        required: false
        type: string
      sources:
        description: JSON array of sources (for new topics; auto-generated if empty)
        required: false
        type: string
      quality:
        description: Draft is 720p/12fps; final is 1080p/24fps
        required: true
        default: draft
        type: choice
        options:
          - draft
          - final
      release:
        description: Publish MP4/SRT/thumbnail as a GitHub release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: create-video-${{ inputs.topic }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TOPIC: ${{ inputs.topic }}
      QUALITY: ${{ inputs.quality }}
      BLENDER: /opt/blender-4.2.3-linux-x64/blender
      PYTHON: python3

    steps:
      - name: Checkout (skip the giant question bank)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install ffmpeg, fonts and Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-liberation libxi6 libxxf86vm1 libxfixes3 \
            libxkbcommon0 libsm6 libice6 libgl1 libegl1 libgomp1 \
            libx11-6 libxext6 libxrender1

      - name: Install Blender 4.2.3 LTS
        run: |
          curl -fL --retry 3 -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf /tmp/blender.tar.xz -C /opt
          "$BLENDER" --version | head -n 3

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for frame capture
        run: npx playwright install --with-deps chromium

      - name: Install Piper
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install piper-tts==1.8.0

      - name: Cache the Piper voice
        uses: actions/cache@v4
        with:
          path: .cache/piper
          key: piper-en_US-lessac-medium-v1

      - name: Ensure topic exists in topic-bank (add if new)
        id: topic
        run: |
          node -e "
            const fs = require('fs');
            // GitHub step outputs, written from Node. These five lines used to
            // be shell syntax ('echo ... >> $GITHUB_OUTPUT') sitting inside the
            // JavaScript passed to `node -e`, which is not valid JS: the step
            // died with "SyntaxError: Unexpected string" before it could create
            // the topic, so create-video never ran at all (run 42756012482).
            // Newlines are collapsed because GITHUB_OUTPUT needs the heredoc
            // form for multi-line values and these are all single-line.
            const setOut = function (name, value) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT,
                name + '=' + String(value == null ? '' : value).replace(/[\r\n]+/g, ' ') + '\n');
            };
            const bankPath = 'data/films/topic-bank.json';
            // topic-bank.json is gitignored (data/*) and only ever force-added
            // on film-ci — on main it simply does not exist (runs 43159393601,
            // 42756012482). Start an empty bank instead of crashing on ENOENT.
            const bank = fs.existsSync(bankPath)
              ? JSON.parse(fs.readFileSync(bankPath, 'utf8'))
              : { topics: [] };
            if (!Array.isArray(bank.topics)) bank.topics = [];
            const existing = bank.topics.find(x => x.id === process.env.TOPIC);
            if (existing) {
              console.log('topic already exists: ' + process.env.TOPIC);
              console.log('title=' + existing.title);
              console.log('angle=' + existing.angle);
              console.log('why=' + existing.why);
              console.log('category=' + existing.category);
              console.log('sources=' + JSON.stringify(existing.sources));
              // The outputs have to be emitted on this path too: the step used to
              // exit(0) here, so re-running an existing topic gave every downstream
              // step an empty title/angle/why/category.
              setOut('title', existing.title);
              setOut('angle', existing.angle);
              setOut('why', existing.why);
              setOut('category', existing.category);
              setOut('sources', JSON.stringify(existing.sources || []));
              process.exit(0);
            }
            // Topic not found — create it from dispatch inputs (agent-created topic)
            const title = process.env.TITLE || process.env.TOPIC.replace(/-/g, ' ');
            const angle = process.env.ANGLE || '';
            const why = process.env.WHY || '';
            const category = process.env.CATEGORY || 'history';
            const sourcesRaw = process.env.SOURCES || '[]';
            let sources = [];
            try { sources = JSON.parse(sourcesRaw); } catch (e) { sources = []; }
            // Auto-generate Wikipedia sources if none provided (agent-created topic)
            if (!sources.length) {
              const wikiTitle = title.replace(/ /g, '_');
              sources = [
                { id: slugify(title) + '-wiki', title: title, publisher: 'Wikipedia', url: 'https://en.wikipedia.org/wiki/' + wikiTitle, accessed: new Date().toISOString().slice(0,10) }
              ];
            }
            const newTopic = {
              id: process.env.TOPIC,
              title: title,
              category: category,
              priority: 99,
              why: why,
              angle: angle,
              sources: sources
            };
            function slugify(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,''); }
            bank.topics.push(newTopic);
            fs.writeFileSync(bankPath, JSON.stringify(bank, null, 2) + '\n');
            console.log('created new topic: ' + process.env.TOPIC);
            console.log('title=' + title);
            console.log('angle=' + angle);
            console.log('why=' + why);
            console.log('category=' + category);
            console.log('sources=' + JSON.stringify(newTopic.sources));
            setOut('title', title);
            setOut('angle', angle);
            setOut('why', why);
            setOut('category', category);
            setOut('sources', JSON.stringify(newTopic.sources));
          "
        env:
          TITLE: ${{ inputs.title }}
          ANGLE: ${{ inputs.angle }}
          WHY: ${{ inputs.why }}
          CATEGORY: ${{ inputs.category }}
          SOURCES: ${{ inputs.sources }}

      - name: Resolve quality settings
        run: |
          set -euo pipefail
          case "$QUALITY" in
            draft)
              echo "WIDTH=1280" >> "$GITHUB_ENV"
              echo "HEIGHT=720" >> "$GITHUB_ENV"
              echo "SAMPLES=16" >> "$GITHUB_ENV"
              echo "CAPTURE_FPS=12" >> "$GITHUB_ENV"
              echo "CRF=22" >> "$GITHUB_ENV"
              echo "OUT_NAME=${TOPIC}-draft.mp4" >> "$GITHUB_ENV"
              ;;
            final)
              echo "WIDTH=1920" >> "$GITHUB_ENV"
              echo "HEIGHT=1080" >> "$GITHUB_ENV"
              echo "SAMPLES=32" >> "$GITHUB_ENV"
              echo "CAPTURE_FPS=24" >> "$GITHUB_ENV"
              echo "CRF=18" >> "$GITHUB_ENV"
              echo "OUT_NAME=${TOPIC}-master.mp4" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown quality: $QUALITY" >&2
              exit 2
              ;;
          esac

      - name: Write film storyboard from topic (model agent)
        id: storyboard
        timeout-minutes: 120
        env:
          TOPIC_TITLE: ${{ steps.topic.outputs.title }}
          TOPIC_ANGLE: ${{ steps.topic.outputs.angle }}
          TOPIC_WHY: ${{ steps.topic.outputs.why }}
          TOPIC_CATEGORY: ${{ steps.topic.outputs.category }}
          TOPIC_ID: ${{ inputs.topic }}
          OLLAMA_MODEL: qwen3.5:9b
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          # Install Ollama
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p ~/.ollama/models
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          printf '[Service]\nUser=runner\nGroup=runner\nEnvironment=HOME=/home/runner\nEnvironment=OLLAMA_MODELS=/home/runner/.ollama/models\nEnvironment=OLLAMA_KEEP_ALIVE=60m\n' | sudo tee /etc/systemd/system/ollama.service.d/runner-home.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart ollama
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
            sleep 1
          done
          ollama pull qwen3.5:9b
          # Generate the storyboard JSON using the local model
          node scripts/film/topic-to-film.js \
            --topic "$TOPIC_ID" \
            --title "$TOPIC_TITLE" \
            --angle "$TOPIC_ANGLE" \
            --why "$TOPIC_WHY" \
            --category "$TOPIC_CATEGORY" \
            --out "data/films/${TOPIC_ID}.json"

      - name: Validate storyboard
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/film/validate-film.js "data/films/${TOPIC_ID}.json"

      - name: Commit topic bank and storyboard
        run: |
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          # -f: data/* is gitignored; film JSONs and the topic bank are only
          # ever tracked via force-add (same reason build-figures documents).
          git add -f data/films/topic-bank.json data/films/${TOPIC_ID}.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "create-video: topic ${{ inputs.topic }} storyboard"
            git push
          fi

      - name: Validate political argument map
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/film/validate-debates.js "data/films/${TOPIC_ID}-debates.json"

      - name: Render 3D plates with Blender
        run: |
          node scripts/film/render-plates.js \
            --film "$TOPIC_ID" \
            --out-dir "out/film/$TOPIC_ID/plates" \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --samples "$SAMPLES"

      - name: Build film (map, Piper, Chromium frames, ffmpeg)
        run: |
          node scripts/film/build-film.js \
            --film "$TOPIC_ID" \
            --work "out/film/$TOPIC_ID" \
            --out "out/film/$TOPIC_ID/$OUT_NAME" \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --fps 24 \
            --capture-fps "$CAPTURE_FPS" \
            --crf "$CRF" \
            --samples "$SAMPLES" \
            --skip-plates \
            --tts piper \
            --voice en_US-lessac-medium

      - name: Upload film artefact
        uses: actions/upload-artifact@v4
        with:
          name: film-${{ inputs.topic }}-${{ inputs.quality }}
          if-no-files-found: error
          retention-days: 14
          path: |
            out/film/${{ inputs.topic }}/*.mp4
            out/film/${{ inputs.topic }}/*.srt
            out/film/${{ inputs.topic }}/*-thumb.jpg
            out/film/${{ inputs.topic }}/metadata.json
            out/film/${{ inputs.topic }}/youtube.md
            out/film/${{ inputs.topic }}/script.md

      - name: Publish film release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: film-${{ inputs.topic }}-${{ inputs.quality }}-${{ github.run_number }}
          name: ${{ steps.topic.outputs.title }} · ${{ inputs.quality }} · run ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Generated on a GitHub-hosted CPU runner by the Create Video workflow.

            - Topic: ${{ steps.topic.outputs.title }}
            - Blender 4.2.3 LTS (Cycles CPU)
            - Piper local narration
            - Chromium frame capture
            - ffmpeg H.264/AAC master

            Download the MP4, SRT and thumbnail below. YouTube upload remains a deliberate owner action.
          files: |
            out/film/${{ inputs.topic }}/*.mp4
            out/film/${{ inputs.topic }}/*.srt
            out/film/${{ inputs.topic }}/*-thumb.jpg
            out/film/${{ inputs.topic }}/metadata.json
            out/film/${{ inputs.topic }}/youtube.md
            out/film/${{ inputs.topic }}/script.md

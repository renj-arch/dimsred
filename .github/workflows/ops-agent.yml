name: Ops Agent

# Cloud-side operations agent. It runs with the laptop off:
#   - every 15 minutes it looks for recent failed Actions runs;
#   - it reads the failed logs and the workflow/script named in them;
#   - a hosted free-tier model diagnoses the failure;
#   - transient failures are rerun once;
#   - a small allowlisted code fix is opened as a PR (never pushed to main);
#   - everything else becomes an issue with the diagnosis and next action.
#
# It also accepts /ops commands in issue comments, which is the GitHub-native
# replacement for the Telegram control plane:
#   /ops status
#   /ops diagnose <run-id>
#   /ops rerun <run-id>
#   /ops fix <run-id>
#
# It never edits reader-facing content (upsc/, languages/, data/, *.html) and
# never merges a PR. A human still owns editorial judgement.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id to diagnose (empty = poll recent failures)'
        required: false
        default: ''
  issue_comment:
    types: [created]

concurrency:
  group: ops-agent
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  models: read

jobs:
  ops:
    # Comments must be /ops from a non-bot user, and not on a pull request.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
       github.event.comment.user.type != 'Bot' &&
       startsWith(github.event.comment.body, '/ops'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            .github/workflows
            docs
            package.json
            package-lock.json
            .gitignore
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose failed runs or answer /ops
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          OPS_MODE: ${{ github.event_name == 'issue_comment' && 'command' || (github.event.inputs.run_id && 'diagnose' || 'poll') }}
          OPS_RUN_ID: ${{ github.event.inputs.run_id || '' }}
          OPS_INSTRUCTION: ${{ github.event.comment.body || '' }}
          OPS_ISSUE: ${{ github.event.issue.number || '' }}
          OPS_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS: '1'
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: node scripts/ops-agent.js
name: LLM Auto-fix

# The model fixes its own weak content: reads the fault board, asks
# Llama 4 Maverick (Groq free tier) to generate questions for thin
# categories, draw SVG figures for missing syllabus topics, and rewrite
# broken captions. Results land in data/autofix-log.json and show on
# improve.html as "what the model fixed".
#
# Free-tier friendly: max 8 fixes per run, ~15 min between runs.

on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:

concurrency:
  group: llm-autofix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            scripts
            data/faults.json
            data/figure-gaps.json
            data/autofix-log.json
            figures
          sparse-checkout-cone: false
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run auto-fixer (Llama 4 Maverick via Groq)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/llm-autofix.js

      - name: Publish fixes
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git reset HEAD -- . 2>/dev/null || true
          git add data/autofix-log.json figures/ data/questions/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No fixes to publish"
          else
            git commit -m "auto-fix: Llama 4 Maverick fixed weak content (run #${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase 2>/dev/null && git push 2>/dev/null && { echo "Fixes pushed"; break; } || echo "push attempt $i failed, retrying..."
              sleep 5
            done || echo "::warning::push failed after 3 attempts"
          fi

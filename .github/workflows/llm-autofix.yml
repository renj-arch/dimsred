name: LLM Auto-fix

# The model fixes its own weak content: reads the fault board, asks a
# local Qwen3.5-9B (Ollama on the runner's CPU + swap) to generate
# questions for thin categories, draw SVG figures for missing syllabus
# topics, and rewrite broken captions. Results land in data/autofix-log.json
# and show on improve.html as "what the model fixed".
#
# Fully free forever: Ollama runs the model locally on GitHub's runner.
# No API keys, no rate limits, no paid services. 8GB swap is created so
# the 9B model (~6GB) fits in the 7GB RAM runner without OOM.

on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:

concurrency:
  group: llm-autofix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            scripts
            data/faults.json
            data/figure-gaps.json
            data/autofix-log.json
            figures
          sparse-checkout-cone: false
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Create 8GB swap so the 9B model (~6GB) fits without OOM.
      # The runner has 14GB free disk; 8GB swap leaves plenty of headroom.
      # dd instead of fallocate: some runners reject fallocate with
      # "Text file busy" on /swapfile.
      - name: Create swap (8GB)
        run: |
          sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /tmp/swapfile
          sudo mkswap /tmp/swapfile
          sudo swapon /tmp/swapfile
          free -h

      # Install Ollama — free, open-source, runs models on CPU.
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      # Pull the strongest coding model that fits with swap.
      # Nemotron Nano 9B v2 scores 71.1% on LiveCodeBench v6 — best 9B
      # coding model. Falls back through smaller options if pull fails.
      - name: Pull best coding model
        run: |
          if ollama pull nvidia/nemotron-nano-9b-v2; then
            echo "MODEL=nvidia/nemotron-nano-9b-v2" >> $GITHUB_ENV
            echo "Using Nemotron Nano 9B v2 (71.1% LiveCodeBench)"
          elif ollama pull qwen3.5:9b; then
            echo "MODEL=qwen3.5:9b" >> $GITHUB_ENV
            echo "Using Qwen3.5-9B"
          else
            echo "9B models failed, using 4B"
            ollama pull qwen3.5:4b
            echo "MODEL=qwen3.5:4b" >> $GITHUB_ENV
          fi
          ollama list

      - name: Run auto-fixer (Qwen3.5 local, zero API keys)
        env:
          OLLAMA_MODEL: ${{ env.MODEL }}
        run: node scripts/llm-autofix.js

      - name: Publish fixes
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git reset HEAD -- . 2>/dev/null || true
          git add data/autofix-log.json figures/ data/questions/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No fixes to publish"
          else
            git commit -m "auto-fix: ${{ env.MODEL }} fixed weak content (run #${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase 2>/dev/null && git push 2>/dev/null && { echo "Fixes pushed"; break; } || echo "push attempt $i failed, retrying..."
              sleep 5
            done || echo "::warning::push failed after 3 attempts"
          fi

name: LLM Auto-fix

# The model fixes its own weak content: reads the fault board, asks a
# local Qwen3.5-4B (Ollama on the runner's CPU) to generate questions
# for thin categories, draw SVG figures for missing syllabus topics, and
# rewrite broken captions. Results land in data/autofix-log.json and show
# on improve.html as "what the model fixed".
#
# Fully free forever: Ollama runs the model locally on GitHub's runner.
# No API keys, no rate limits, no paid services. The model is downloaded
# once (~3GB) and cached for the job duration.

on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:

concurrency:
  group: llm-autofix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            scripts
            data/faults.json
            data/figure-gaps.json
            data/autofix-log.json
            figures
          sparse-checkout-cone: false
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install Ollama — free, open-source, runs models on CPU.
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Pull Qwen3.5-4B (latest gen, ~3GB)
        run: |
          ollama pull qwen3.5:4b
          ollama list

      - name: Run auto-fixer (Qwen3.5-4B local, zero API keys)
        env:
          OLLAMA_MODEL: qwen3.5:4b
        run: node scripts/llm-autofix.js

      - name: Publish fixes
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git reset HEAD -- . 2>/dev/null || true
          git add data/autofix-log.json figures/ data/questions/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No fixes to publish"
          else
            git commit -m "auto-fix: Qwen3.5-4B fixed weak content (run #${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase 2>/dev/null && git push 2>/dev/null && { echo "Fixes pushed"; break; } || echo "push attempt $i failed, retrying..."
              sleep 5
            done || echo "::warning::push failed after 3 attempts"
          fi

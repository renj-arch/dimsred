name: Daily Current Affairs Fetcher

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch current affairs from RSS
        run: node scripts/fetch-current-affairs.js

      - name: Commit and push
        run: |
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          git diff --staged --quiet || git commit -m "Update current affairs $(date +'%Y-%m-%d')"
          git push

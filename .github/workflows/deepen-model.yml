name: Deepen (Review PR)

# Model-drafted lesson deepening that never publishes to main on its own. It
# writes content with the strongest model the NVIDIA account can reach (see
# scripts/probe-models.js; the registry in scripts/lib/nvidia-models.js records
# which models actually answered), runs the deterministic citation guard over the
# regenerated pages, then opens a PULL REQUEST for human review.
#
# This is deliberately separate from expand-course.yml, which pushes to main
# directly. Nothing a model writes should reach the published site without a
# review, so this lane can only propose.

on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Lesson keys to deepen, comma-separated (e.g. mains-gs1/ancient-india)'
        required: true
      per_run:
        description: 'Lessons to write this run'
        required: false
        default: '6'
      model:
        description: 'NVIDIA model id or alias'
        required: false
        default: 'mistral-large-4'
      route:
        description: 'Which route writes'
        type: choice
        options: ['nvidia', 'openrouter', 'tokenharbor']
        default: 'nvidia'
      openrouter_model:
        description: 'OpenRouter model id (used when route=openrouter, and as fallback)'
        required: false
        default: 'google/gemma-4-31b-it'
      tokenharbor_model:
        description: 'Token Harbor model id (used when route=tokenharbor)'
        required: false
        default: 'deepseek-v4.1-flash'

concurrency:
  group: deepen-model
  cancel-in-progress: false

permissions:
  models: read
  contents: write
  pull-requests: write

jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            upsc
            data/handwritten-lessons.json
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write lessons with the strongest available model
        env:
          NVAPI: ${{ inputs.route == 'nvidia' && '1' || '' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ inputs.model }}
          OPENROUTER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
          TOKENHARBOR: ${{ inputs.route == 'tokenharbor' && '1' || '' }}
          TOKENHARBOR_API_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
          TOKENHARBOR_URL: ${{ vars.TOKENHARBOR_URL }}
          TOKENHARBOR_MODEL: ${{ inputs.tokenharbor_model }}
          EXPAND_PER_RUN: ${{ inputs.per_run }}
          EXPAND_DEADLINE_MIN: '90'
          EXPAND_DEEPEN: '1'
          EXPAND_DEPTH_TARGET_WORDS: '2500'
          EXPAND_DEPTH_TARGET_WORDS_BUILT: '45000'
          EXPAND_DEPTH_PASS_MAX: '30'
          EXPAND_ONLY_KEYS: ${{ inputs.keys }}
          EXPAND_THIN_THRESHOLD: '6000'
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/expand-course.js

      - name: Clean published addon content
        if: always()
        run: node scripts/clean-course-content.js

      - name: Regenerate exactly the filled lesson pages
        if: always()
        run: |
          [ -f scripts/.course-touched.json ] || { echo "nothing written this run"; exit 0; }
          KEYS=$(node -e "console.log(require('./scripts/.course-touched.json').keys.join(','))")
          [ -n "$KEYS" ] || { echo "nothing written this run"; exit 0; }
          test_exams=$(node -e "console.log((require('./scripts/.course-touched.json').exams||[]).join(','))")
          COURSE_ONLY_KEYS="$KEYS" COURSE_EXAMS="$test_exams" node scripts/gen-course.js
          node -e "const t=require('./scripts/.course-touched.json'); require('fs').writeFileSync('/tmp/course-files.txt', t.files.join('\n') + '\n')"
          node scripts/normalize-course-pages.js $(cat /tmp/course-files.txt)
          node scripts/dedupe-lesson-sections.js $(cat /tmp/course-files.txt)

      - name: Loss guard
        if: always()
        run: |
          [ -f /tmp/course-files.txt ] || exit 0
          RESTORED=0
          while read -r f; do
            [ -f "$f" ] || continue
            DEL=$(git diff --numstat -- "$f" | awk '{print $2}' | head -1)
            if [ -n "$DEL" ] && [ "$DEL" -gt 200 ]; then
              echo "::warning::$f would drop $DEL line(s) -- restoring committed content"
              git checkout -- "$f"
              RESTORED=$((RESTORED + 1))
            fi
          done < /tmp/course-files.txt
          echo "guard: $RESTORED page(s) restored"

      - name: Citation guard (deterministic red flags)
        id: guard
        if: always()
        run: |
          if [ ! -f /tmp/course-files.txt ]; then echo "clean" > /tmp/guard.txt; exit 0; fi
          set +e
          node scripts/citation-guard.js $(cat /tmp/course-files.txt) > /tmp/guard.txt 2>&1
          echo "exit=$?" >> /tmp/guard.txt
          cat /tmp/guard.txt

      - name: Open a review pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          step_summary() { { echo '### Deepen (review PR)'; echo ''; echo '```'; cat /tmp/guard.txt 2>/dev/null || echo 'no guard output'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; }
          if [ ! -f scripts/course-data.json ]; then echo "no worktree"; exit 0; fi
          if git diff --quiet && git diff --cached --quiet; then echo "no changes to propose"; step_summary; exit 0; fi
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          BR="deepen/run-${{ github.run_number }}"
          git checkout -b "$BR"
          git add scripts/course-data.json scripts/course-practice.json scripts/course-versions.json scripts/course-depth.json scripts/course-addons.json 2>/dev/null || true
          if [ -f /tmp/course-files.txt ]; then xargs -a /tmp/course-files.txt git add; fi
          rm -f scripts/.course-touched.json
          git commit -m "deepen: model-drafted content for review (${{ inputs.model }})" || { echo "nothing to commit"; step_summary; exit 0; }
          git push -u origin "$BR"
          GUARD=$(cat /tmp/guard.txt 2>/dev/null || echo 'no guard output')
          gh pr create --head "$BR" --base main --title "deepen: model-drafted content for review (${{ inputs.model }})" --body "Model-drafted deepening for review. Model: ${{ inputs.model }}. Keys: ${{ inputs.keys }}. A human must verify every fact (Articles, cases, dates, scheme figures) before merging. The citation-guard output is in the workflow run summary." || echo "PR create returned non-zero (it may already exist)"
          step_summary

name: Invent Questions (27B quality lane)

# The slow, high-quality lane. Trial evidence (invent run 39136862076,
# 2026-10-18): batiai/qwen3.8-27b:iq3 (~17 GB, iq3 quant) invented and
# published 3 accepted questions in the 110-min deadline — 4 slots attempted,
# 1 rejected as unparseable JSON, each accepted item an exam-grade question
# with a full worked solution (e.g. sequential-discount equivalence, 23.5%).
# The 9b bulk lane (invent-questions.yml, 3x/day) carries volume; this lane
# adds a few premium items per day. Pools union across runs (ci-push unions
# the questions arrays), so neither lane can drop the other's questions.
#
# CPU economics, measured: ~20 min per accepted question plus a ~34-min
# 17 GB pull. The weights do not fit the 10 GB repo cache — re-pulling every
# run is accepted on purpose for a once-a-day lane whose point is quality.
# The shared concurrency group keeps it serialized with the 9b lane.
on:
  schedule:
    - cron: '37 1 * * *'   # once daily, off :00 and off the busy evening block
  workflow_dispatch:

concurrency:
  group: invent-questions   # shared with the 9b lane: never run concurrently
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  invent27b:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - name: Free runner disk space (swap + 17GB model + repo)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data/invented
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create swap (16GB - same as proven llm-autofix)
        run: |
          sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /tmp/swapfile
          sudo mkswap /tmp/swapfile
          sudo swapon /tmp/swapfile
          free -h

      - name: Install Ollama (runner-home service, 27B-tuned env)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          mkdir -p ~/.ollama/models
          # Same runner-home service as the other model workflows (models
          # must live under the runner user), plus OLLAMA_NUM_PARALLEL=1:
          # one slot keeps the whole 17 GB resident and never splits memory
          # into parallel KV allocations on the 4-vCPU runner.
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          printf '[Service]\nUser=runner\nGroup=runner\nEnvironment=HOME=/home/runner\nEnvironment=OLLAMA_MODELS=/home/runner/.ollama/models\nEnvironment=OLLAMA_KEEP_ALIVE=60m\nEnvironment=OLLAMA_NUM_PARALLEL=1\n' | sudo tee /etc/systemd/system/ollama.service.d/runner-home.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart ollama

      # No model cache step on purpose: the iq3 weights (~17 GB) exceed the
      # 10 GB repo cache budget, and a silent cache thrash would cost more
      # runner time than the clean re-pull.

      - name: Start Ollama server
        run: |
          # Keep the kernel from paging model weights out under pressure.
          sudo sysctl -w vm.swappiness=10 || true
          export OLLAMA_KEEP_ALIVE=60m
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null && echo " OK" || echo " FAILED"
          free -h

      - name: Pull model (batiai/qwen3.8-27b:iq3)
        run: |
          MODEL_INPUT=batiai/qwen3.8-27b:iq3
          case "$MODEL_INPUT" in *[!A-Za-z0-9._:/-]*) echo "bad model tag: $MODEL_INPUT"; exit 1;; esac
          ollama pull "$MODEL_INPUT"
          ollama list
          # Warm the model into RAM now so invention calls start warm.
          echo "Warming $MODEL_INPUT..."
          ollama run "$MODEL_INPUT" "Reply with exactly: OK" 2>&1 | tail -3

      - name: Ensure Ollama is up before agent
        run: |
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
            echo "Server down before agent — restarting"
            export OLLAMA_KEEP_ALIVE=60m
            nohup ollama serve >> /tmp/ollama.log 2>&1 &
            echo $! > /tmp/ollama.pid
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
              sleep 1
            done
          fi
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null && echo "Server ready for agent" || echo "WARNING: server still down"

      - name: Invent questions (batiai/qwen3.8-27b:iq3, quality budget)
        # 110-min graceful deadline (env) and a 125-min step cap behind it.
        # num_ctx 4096 halves CPU prompt-eval vs the default 8192 (the briefs
        # fit); num_predict 1200 still covers a full worked solution. KV-cache
        # quantization is deliberately NOT set: at 4k context the f16 cache is
        # small, and q8_0 KV depends on flash-attention support the CPU build
        # is inconsistent about — not worth risking a load failure for ~0.25 GB.
        timeout-minutes: 125
        env:
          OLLAMA_MODEL: batiai/qwen3.8-27b:iq3
          OLLAMA_HOST: http://127.0.0.1:11434
          INVENT_PER_SLOT: '1'
          INVENT_DEADLINE_MIN: '110'
          INVENT_NUM_CTX: '4096'
          INVENT_NUM_PREDICT: '1200'
        run: node scripts/invent-questions.js

      # Incremental saves mean even a timeout keeps every question invented
      # so far — publish whatever landed. Nothing staged -> ci-push exits 0.
      - name: Publish invented questions
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add data/invented/
          bash scripts/ci-push.sh "invent-27b: batiai/qwen3.8-27b:iq3 invented fresh exam questions (run #${{ github.run_number }})"

name: Previous Year Papers — Local Model Agent

# Uses the local Ollama model (qwen3.5:9b or batiai/qwen3.8-27b:iq3) to
# generate previous-year exam questions for UPSC, IBPS, SSC, RBI, etc.,
# writes them to data/papers.json with full solutions, and commits.
# No external API keys needed — runs on the same local models as
# invent-questions.yml and invent-27b.yml.

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      exams:
        description: 'Exams to generate (space-separated, default: all)'
        required: false
        default: ''
      year:
        description: 'Target year (default: last year)'
        required: false
        default: ''
      model:
        description: 'Ollama model tag (default: qwen3.5:9b)'
        required: false
        default: 'qwen3.5:9b'

permissions:
  contents: write

concurrency:
  group: previous-year-papers-local-${{ github.event.inputs.exams || 'all' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create swap (16GB)
        run: |
          sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /tmp/swapfile
          sudo mkswap /tmp/swapfile
          sudo swapon /tmp/swapfile
          free -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          mkdir -p ~/.ollama/models
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          printf '[Service]\nUser=runner\nGroup=runner\nEnvironment=HOME=/home/runner\nEnvironment=OLLAMA_MODELS=/home/runner/.ollama/models\nEnvironment=OLLAMA_KEEP_ALIVE=60m\n' | sudo tee /etc/systemd/system/ollama.service.d/runner-home.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart ollama

      - name: Cache Ollama models
        if: ${{ !contains(inputs.model || 'qwen3.5:9b', '27b') && !contains(inputs.model || 'qwen3.5:9b', '22b') }}
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ runner.os }}-${{ contains(inputs.model || 'qwen3.5:9b', '9b') && 'mid-v1' || 'fast-v2' }}
          restore-keys: |
            ollama-${{ runner.os }}-${{ contains(inputs.model || 'qwen3.5:9b', '9b') && 'mid-' || 'fast-' }}

      - name: Start Ollama server
        run: |
          sudo sysctl -w vm.swappiness=10 || true
          export OLLAMA_KEEP_ALIVE=60m
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null && echo " OK" || echo " FAILED"
          free -h

      - name: Pull model
        env:
          MODEL_INPUT: ${{ inputs.model || 'qwen3.5:9b' }}
        run: |
          case "$MODEL_INPUT" in *[!A-Za-z0-9._:/-]*) echo "bad model tag: $MODEL_INPUT"; exit 1;; esac
          ollama pull "$MODEL_INPUT"
          ollama list
          echo "Warming $MODEL_INPUT..."
          ollama run "$MODEL_INPUT" "Reply with exactly: OK" 2>&1 | tail -3

      - name: Ensure Ollama is up before agent
        run: |
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
            echo "Server down before agent — restarting"
            export OLLAMA_KEEP_ALIVE=60m
            nohup ollama serve >> /tmp/ollama.log 2>&1 &
            echo $! > /tmp/ollama.pid
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
              sleep 1
            done
          fi
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null && echo "Server ready for agent" || echo "WARNING: server still down"

      - name: Determine exams
        id: exams
        run: |
          DEFAULT="upsc ibps-po sbi-clerk ssc-gd rbi nda cds ctet gate"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.exams }}" ]; then
            echo "exams=${{ github.event.inputs.exams }}" >> $GITHUB_OUTPUT
          else
            echo "exams=$DEFAULT" >> $GITHUB_OUTPUT
          fi
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR=$(( $(date +%Y) - 1 ))
          fi
          echo "year=$YEAR" >> $GITHUB_OUTPUT

      - name: Generate previous year papers (local model agent)
        env:
          OLLAMA_MODEL: ${{ inputs.model || 'qwen3.5:9b' }}
          OLLAMA_HOST: http://127.0.0.1:11434
          TARGET_EXAMS: ${{ steps.exams.outputs.exams }}
          TARGET_YEAR: ${{ steps.exams.outputs.year }}
        run: |
          NODE_OPTIONS=--max-old-space-size=4096 node scripts/previous-year-local-agent.js

      - name: Commit and push
        if: always()
        run: |
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add data/papers.json
          git diff --staged --quiet || git commit -m "papers: add ${{ steps.exams.outputs.year }} previous year papers for ${{ steps.exams.outputs.exams }} (${{ inputs.model || 'qwen3.5:9b' }})"
          for i in 1 2 3; do
            git pull --rebase --autostash 2>/dev/null || true
            git push 2>/dev/null && { echo "Pushed"; break; } || echo "push attempt $i failed, retrying..."
            sleep 5
          done
name: Crawl all pages

# Breadth pass over every tracked HTML page. The 20-page Browser Test workflow
# is the deep interaction pass (quiz flows, mobile viewports); this one answers
# "does every page load and run at all?". It reports before it gates: the first
# runs are triage, then CRAWL_STRICT=1 makes regressions fail the job.
on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail the run when any page has a runtime finding
        type: boolean
        default: false

concurrency:
  group: crawl-all
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (CI only)
        run: |
          npx playwright install --with-deps chromium 2>&1 | tail -3

      - name: Serve site locally
        run: |
          nohup python3 -m http.server 8080 --directory . > /tmp/http.log 2>&1 &
          echo $! > /tmp/http.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/index.html > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Crawl every page
        env:
          SITE_URL: http://127.0.0.1:8080
          CRAWL_CONCURRENCY: 6
          CRAWL_STRICT: ${{ inputs.strict && '1' || '0' }}
        run: node scripts/crawl-all-pages.js

      - name: Stop server
        if: always()
        run: kill $(cat /tmp/http.pid) 2>/dev/null || true

      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-pages-crawl
          path: data/all-pages-crawl.json
          retention-days: 14

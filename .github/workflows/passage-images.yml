name: Passage Images

# NCERT-style related photos: for each passage, find the real places/monuments
# it names, fetch their Wikipedia lead image from Wikimedia Commons, and embed
# it beside the passage with the author and licence.
#
# Only pages with coordinates (places/monuments) are accepted, and the title
# must match the candidate exactly or as a prefix, so a "Mughal monuments"
# section can never get a baseball player's photo.
#
# Runs back-to-back while any passage lacks an image; the 30-minute cron is a
# restart net. Idempotent by passage hash.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Lessons to process this run'
        required: false
        default: '20'
      max:
        description: 'Max images per lesson'
        required: false
        default: '8'
      file:
        description: 'One lesson path (comma-separated), or blank for all'
        required: false
        default: ''

concurrency:
  group: passage-images
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find and embed a related photo per passage
        env:
          LIMIT: ${{ github.event.inputs.limit || '20' }}
          MAX: ${{ github.event.inputs.max || '8' }}
          FILE: ${{ github.event.inputs.file || '' }}
        run: |
          ARGS="--limit $LIMIT --max $MAX"
          if [ -n "$FILE" ]; then ARGS="--file $FILE $ARGS"; else ARGS="--all $ARGS"; fi
          node scripts/passage-images.js $ARGS

      - name: Publish images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add data/passage-images.json css/style.css 2>/dev/null || true
          git add upsc/course 2>/dev/null || true
          bash scripts/ci-push.sh "passage-images: a related photo for each passage (run #${{ github.run_number }})"

      - name: Queue the next image run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit || '20' }}
          MAX: ${{ github.event.inputs.max || '8' }}
        run: |
          set -uo pipefail
          REMAIN=$(node scripts/passage-images.js --remaining | tail -1)
          echo "lessons still missing a passage image: ${REMAIN:-?}"
          if [ "${REMAIN:-0}" = "0" ]; then
            echo "::notice title=Passage images complete::every passage has a related image where one exists"
            exit 0
          fi
          for i in 1 2 3; do
            if gh workflow run passage-images.yml --ref main -f limit="$LIMIT" -f max="$MAX"; then
              echo "Queued the next image run"
              exit 0
            fi
            echo "dispatch attempt $i failed, retrying..."
            sleep $((5 + RANDOM % 10))
          done
          echo "::warning::could not queue the next image run; the 30-minute cron will restart it"
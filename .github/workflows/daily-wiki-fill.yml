name: Daily Wiki Fill

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate questions from Wikipedia
        run: node scripts/wiki-fill-all.cjs

      - name: Rebuild archive
        run: node scripts/build-archive.js

      - name: Commit and push
        run: |
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Daily wiki fill $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new questions to commit"
          fi

name: Wiki Fill

on:
  schedule:
    - cron: '0 0 * * *'  # Daily kickstart fallback
  workflow_dispatch:
    inputs:
      chunk:
        description: 'Chunk to process (1-24, leave empty for all)'
        required: false
        default: ''

concurrency:
  group: wiki-fill

permissions:
  contents: write
  actions: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync with origin (clean slate)
        run: |
          git fetch origin
          git reset --hard origin/main
          git clean -fd

      - name: Read progress state
        run: |
          if [ -f data/wiki-fill-progress.json ]; then
            GROUP=$(jq -r '.group' data/wiki-fill-progress.json)
          else
            GROUP=0
          fi
          echo "WIKI_FILL_GROUP=$GROUP" >> "$GITHUB_ENV"

      - name: Restore quiz.json from per-category files
        run: node scripts/rebuild-quiz-json.js

      - name: Restore quiz.json from runner temp (survives git clean)
        run: |
          if [ -f "$RUNNER_TEMP/quiz.json" ]; then
            cp "$RUNNER_TEMP/quiz.json" data/quiz.json
            echo "Restored quiz.json from runner temp"
          else
            echo "No quiz.json in runner temp"
          fi

      - name: Fetch PIB and other RSS feeds
        run: node scripts/fetch-pib-rss.js

      - name: Update PIB archive from feed (no duplicates)
        run: node scripts/update-pib-archive.js

      - name: Wiki (1/24)
        if: inputs.chunk == '' || inputs.chunk == '1'
        run: |
          node scripts/wiki-fill-all.cjs
          node scripts/cleanup-questions.js
          node scripts/dedup-sentence-flood.js
          node scripts/build-archive-single.js
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          rm -rf .git/rebase-merge .git/rebase-apply 2>/dev/null
          rm -f .git/CHERRY_PICK_HEAD .git/MERGE_HEAD .git/MERGE_MSG .git/MERGE_MODE .git/REVERT_HEAD 2>/dev/null
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git checkout -B main 2>/dev/null || true
          git reset HEAD -- . 2>/dev/null
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Wiki 1/24 $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase || { echo "Rebase conflict, aborting and merging instead."; git rebase --abort; git pull --no-rebase -X theirs; }
            for i in 1 2 3; do git push && { echo "Push succeeded"; break; } || { echo "Push attempt $i failed, retrying..."; sleep 5; git pull --rebase || git pull --no-rebase -X theirs; }; done || true
          fi
        env:
          WIKI_FILL_CHUNK: 1
          WIKI_FILL_CHUNKS: 24
      - name: Wiki (2/24)
        if: inputs.chunk == '' || inputs.chunk == '2'
        run: |
          node scripts/wiki-fill-all.cjs

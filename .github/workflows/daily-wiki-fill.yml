name: Daily Wiki Fill

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Sync with origin (clean slate)
        run: |
          git fetch origin
          git reset --hard origin/main
          git clean -fd

      - name: Generate questions from Wikipedia
        run: node scripts/wiki-fill-all.cjs
        env:
          WIKI_FILL_GROUPS: 3

      - name: Remove garbled questions (table rows, fragments)
        run: node scripts/cleanup-questions.js

      - name: Remove sentence-flood duplicates (same sentence, different blank)
        run: node scripts/dedup-sentence-flood.js

      - name: Fetch current events and update archive.html
        run: node scripts/fetch-current-events.js

      - name: Fetch PIB and other RSS feeds
        run: node scripts/fetch-pib-rss.js

      - name: Update PIB archive from feed (no duplicates)
        run: node scripts/update-pib-archive.js

      - name: Fetch Indian current affairs from Wikipedia
        run: node scripts/fetch-indian-ca.js

      - name: Fetch RBI monetary data (repo rate, GDP)
        run: node scripts/fetch-rbi-data.js

      - name: Fetch state-level news (CM, Governor, budgets)
        run: node scripts/fetch-state-news.js

      - name: Fetch global rankings (India in major indices)
        run: node scripts/fetch-global-rankings.js

      - name: Fetch parliament bills and acts
        run: node scripts/fetch-parliament-bills.js

      - name: Fetch UN/WHO yearly themes (Yoga Day, Environment Day, etc.)
        run: node scripts/fetch-themes.js

      - name: Fetch G20/BRICS/SCO/QUAD summits and conferences
        run: node scripts/fetch-summits.js

      - name: Fetch Environment, Health & Agriculture news
        run: node scripts/fetch-env-health-agri.js

      - name: Fetch Education, Arts & Culture news
        run: node scripts/fetch-education-culture.js

      - name: Fetch Society & Reports news
        run: node scripts/fetch-society-news.js

      - name: Fetch key appointments (COAS, CJI, CEC, RBI Governor, etc.)
        run: node scripts/fetch-appointments.js

      - name: Fetch awards (Bharat Ratna, Nobel, Jnanpith, Dadasaheb Phalke)
        run: node scripts/fetch-awards.js

      - name: Fetch defence exercises and missiles
        run: node scripts/fetch-defence.js

      - name: Fetch Science & Technology (ISRO missions, satellites)
        run: node scripts/fetch-science.js

      - name: Fetch Government Schemes
        run: node scripts/fetch-schemes.js

      - name: Fetch Legal & Constitutional (landmark SC judgements)
        run: node scripts/fetch-judgements.js

      - name: Fetch Obituaries (notable Indian deaths)
        run: node scripts/fetch-obituaries.js

      - name: Fetch International Relations (diplomatic relations)
        run: node scripts/fetch-bilateral.js

      - name: Rebuild single archive + per-category data
        run: node scripts/build-archive-single.js

      - name: Remove quiz.json (too large for Cloudflare Pages)
        run: rm -f data/quiz.json

      - name: Commit and push
        run: |
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Daily wiki fill $(date +'%Y-%m-%d')"
            git pull --rebase
            git push
          else
            echo "No new questions to commit"
          fi

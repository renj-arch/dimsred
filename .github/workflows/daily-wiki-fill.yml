name: Daily Wiki Fill

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore quiz.json from per-category files
        run: node scripts/rebuild-quiz-json.js

      - name: Install dependencies
        run: npm install

      - name: Generate questions from Wikipedia
        run: node scripts/wiki-fill-all.cjs
        env:
          WIKI_FILL_GROUPS: 3

      - name: Remove garbled questions (table rows, fragments)
        run: node scripts/cleanup-questions.js

      - name: Fetch current events and update archive.html
        run: node scripts/fetch-current-events.js

      - name: Fetch PIB and other RSS feeds
        run: node scripts/fetch-pib-rss.js

      - name: Update PIB archive from feed (no duplicates)
        run: node scripts/update-pib-archive.js

      - name: Rebuild single archive + per-category data
        run: node scripts/build-archive-single.js

      - name: Remove quiz.json (too large for Cloudflare Pages)
        run: rm -f data/quiz.json

      - name: Commit and push
        run: |
          git stash --include-untracked
          git pull --rebase
          git stash pop || true
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Daily wiki fill $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new questions to commit"
          fi

name: Daily Paper Generation

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
    - cron: '30 6 * * *'
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '0 8 * * *'
    - cron: '30 8 * * *'
    - cron: '0 9 * * *'
    - cron: '30 9 * * *'
    - cron: '0 10 * * *'
    - cron: '30 10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      exams:
        description: 'Exams to generate (space-separated, default: all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Determine exam for this slot
        id: batch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.exams }}" ]; then
              echo "exams=${{ github.event.inputs.exams }}" >> $GITHUB_OUTPUT
            else
              echo "exams=all" >> $GITHUB_OUTPUT
            fi
          else
            H=$(date +%H)
            M=$(date +%M)
            case "$H:$M" in
              04:0[0-9]|04:1[0-5]) echo "exams=cgl" ;;
              04:3[0-9]|04:4[0-5]) echo "exams=rbi" ;;
              05:0[0-9]|05:1[0-5]) echo "exams=jee" ;;
              05:3[0-9]|05:4[0-5]) echo "exams=neet" ;;
              06:0[0-9]|06:1[0-5]) echo "exams=gate" ;;
              06:3[0-9]|06:4[0-5]) echo "exams=agniveer" ;;
              07:0[0-9]|07:1[0-5]) echo "exams=upsc" ;;
              07:3[0-9]|07:4[0-5]) echo "exams=ibps-po" ;;
              08:0[0-9]|08:1[0-5]) echo "exams=sbi-clerk" ;;
              08:3[0-9]|08:4[0-5]) echo "exams=ssc-gd" ;;
              09:0[0-9]|09:1[0-5]) echo "exams=ctet" ;;
              09:3[0-9]|09:4[0-5]) echo "exams=nda" ;;
              10:0[0-9]|10:1[0-5]) echo "exams=cds" ;;
              10:3[0-9]|10:4[0-5]) echo "exams=clat" ;;
              *) echo "exams=skip" ;;
            esac
          fi >> $GITHUB_OUTPUT

      - name: Generate procedural questions (no AI)
        if: steps.batch.outputs.exams != 'skip'
        run: node scripts/generate-daily-questions.js ${{ steps.batch.outputs.exams }} --count=15

      - name: Build practice paper
        if: steps.batch.outputs.exams != 'skip'
        run: node scripts/generate-papers.js ${{ steps.batch.outputs.exams }}

      - name: Generate calendar data
        if: steps.batch.outputs.exams != 'skip'
        run: node scripts/generate-calendar-data.js ${{ steps.batch.outputs.exams }}

      - name: Update sitemap
        if: steps.batch.outputs.exams != 'skip'
        run: node scripts/generate-sitemap.js

      - name: Build topic index for micro-tests
        if: steps.batch.outputs.exams != 'skip'
        run: node scripts/build-topic-index.js

      - name: Ping search engines
        if: steps.batch.outputs.exams != 'skip'
        run: |
          curl -s -o /dev/null "https://www.google.com/ping?sitemap=https://vlymbooq.qzz.io/sitemap.xml"
          curl -s -o /dev/null "https://www.bing.com/ping?siteMap=https://vlymbooq.qzz.io/sitemap.xml"

      - name: Commit and push
        if: steps.batch.outputs.exams != 'skip'
        run: |
          git stash --include-untracked
          git pull --rebase
          git stash pop || true
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-generate practice papers $(date +'%Y-%m-%d') — ${{ steps.batch.outputs.exams }}"
          git push

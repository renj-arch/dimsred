name: Film autopilot

# The agent maintains data/film-slate.json. This job chooses the next topic,
# validates that its sourced storyboard is complete, and dispatches the normal
# film pipeline. A topic that is still only researched is handed to the
# authoring pass, which writes and validates the storyboard on the same runner
# and dispatches the render itself. If no brief exists it stops with a research
# note instead of inventing a film. That failure mode is deliberate.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  choose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The pipeline lives on film-ci: it carries the current slate, the
          # local writer, QC gate and site publish step. A scheduled workflow
          # can only be defined on the default branch, but it can check out the
          # branch it dispatches, so both halves agree on one tree.
          ref: film-ci

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Choose next film
        id: choose
        run: |
          set -euo pipefail
          mkdir -p out/autopilot
          node scripts/film/autopilot.js --json > out/autopilot/pick.json
          node -e "
            const r = require('./out/autopilot/pick.json');
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'kind=' + r.kind + '\n');
            if (r.topic) fs.appendFileSync(process.env.GITHUB_OUTPUT, 'film=' + r.topic.id + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'title=' + (r.topic ? r.topic.title : '') + '\n');
          "
          cat out/autopilot/pick.json

      - name: Dispatch validated film
        if: steps.choose.outputs.kind == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run film.yml \
            --ref film-ci \
            -f film='${{ steps.choose.outputs.film }}' \
            -f quality=final \
            -f release=true \
            -f publish=true

      - name: Report research queue
        if: steps.choose.outputs.kind != 'ready' && steps.choose.outputs.film == ''
        run: |
          echo "::notice title=No topic in the queue::Add the next sourced brief to data/film-slate.json."
          echo "Nothing was authored and nothing was rendered."

      - name: Dispatch authoring pass
        if: steps.choose.outputs.kind != 'ready' && steps.choose.outputs.film != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice title=Authoring ${{ steps.choose.outputs.film }}::${{ steps.choose.outputs.title }}"
          gh workflow run author.yml \
            --ref film-ci \
            -f film='${{ steps.choose.outputs.film }}' \
            -f render=true \
            -f stub=false

      - name: Upload selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-autopilot-selection
          path: out/autopilot/
          if-no-files-found: warn

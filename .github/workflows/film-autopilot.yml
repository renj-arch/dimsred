name: Film autopilot

# The agent maintains data/film-slate.json. This job picks the next validated
# storyboard for rendering, and when nothing is ready it dispatches the
# authoring pass with film=invent: the local 35B model proposes a brand-new
# topic, appends it to the slate, researches its sources, writes the
# storyboard, and renders. No topic is chosen by hand.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  choose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The pipeline lives on film-ci: it carries the current slate, the
          # local writer, QC gate and site publish step. A scheduled workflow
          # can only be defined on the default branch, but it can check out the
          # branch it dispatches, so both halves agree on one tree.
          ref: film-ci

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Choose next film
        id: choose
        run: |
          set -euo pipefail
          mkdir -p out/autopilot
          node scripts/film/autopilot.js --json > out/autopilot/pick.json
          node -e "
            const r = require('./out/autopilot/pick.json');
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'kind=' + r.kind + '\n');
            if (r.topic) fs.appendFileSync(process.env.GITHUB_OUTPUT, 'film=' + r.topic.id + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'title=' + (r.topic ? r.topic.title : '') + '\n');
          "
          cat out/autopilot/pick.json

      - name: Dispatch validated film
        if: steps.choose.outputs.kind == 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run film.yml \
            --ref film-ci \
            -f film='${{ steps.choose.outputs.film }}' \
            -f quality=final \
            -f release=true \
            -f publish=true

      - name: Dispatch authoring pass (invent a new topic)
        if: steps.choose.outputs.kind != 'ready'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice title=Agent inventing a new topic::No validated film is ready; the model will propose the next one."
          gh workflow run author.yml \
            --ref film-ci \
            -f film='invent' \
            -f render=true \
            -f stub=false

      - name: Upload selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-autopilot-selection
          path: out/autopilot/
          if-no-files-found: warn

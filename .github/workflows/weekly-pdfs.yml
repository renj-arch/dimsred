name: Generate Weekly PDF Digests

# One run builds every exam's digest. The old design scheduled eleven hourly
# runs, one per exam, with `cancel-in-progress: true`; GitHub's scheduler
# bunches delayed runs, so each run cancelled the previous one and only the
# last exam of the night ever produced a PDF. A single run with a sparse
# checkout (the corpus is not needed) finishes well inside the budget.
on:
  schedule:
    - cron: '0 13 * * 1'   # Monday 13:00 UTC
  workflow_dispatch:
    inputs:
      exam:
        description: 'Exam to generate PDF for (default: all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: weekly-pdfs
  cancel-in-progress: false

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          filter: blob:none
          # These scripts read question-bank/ and papers-data/ only. Skipping
          # the multi-GB data/questions corpus turns a ~20-minute checkout
          # into seconds and leaves the whole budget for the PDFs.
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Pull latest changes
        run: git -c rebase.autoStash=true pull --rebase

      - name: Build practice papers (all exams)
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/generate-papers.js

      - name: Generate calendar data (all exams)
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/generate-calendar-data.js

      - name: Build weekly PDF
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.exam }}" ]; then
            NODE_OPTIONS=--max-old-space-size=4096 node scripts/build-weekly-pdf.js "${{ inputs.exam }}"
          else
            NODE_OPTIONS=--max-old-space-size=4096 node scripts/build-weekly-pdf.js
          fi

      - name: Clean up PDFs older than 4 weeks
        run: find pdfs -name "weekly-*.pdf" -mtime +27 -delete

      - name: Commit and push
        run: |
          set -uo pipefail
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          if git diff --staged --quiet; then
            echo "No new PDFs to publish"
            exit 0
          fi
          git commit -m "Weekly PDF digest $(date +'%Y-%m-%d')"
          pushed=""
          for i in 1 2 3; do
            git -c rebase.autoStash=true pull --rebase || { git rebase --abort 2>/dev/null || true; git fetch origin main; git rebase origin/main || true; }
            if git push origin HEAD:main; then pushed=1; echo "Pushed"; break; fi
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::error::weekly PDF digest could not be pushed to main"
            exit 1
          fi

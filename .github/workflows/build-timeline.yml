name: Timeline + Mind-tree + Geography Build

on:
  # Weekly safety net. This workflow is the thing that actually runs
  # build-geography-figures.js, and therefore the thing that auto-discovers
  # Commons figures for newly mined geography topics. It used to run ONLY when
  # daily-wiki-fill.yml's finalize dispatched it, and that dispatch sits inside
  # `if [ -f changes-committed ]` -- so if the fill chain stalled, failed, or
  # mined nothing, figure auto-fill silently stopped for as long as the problem
  # lasted. Auto-discovery should not inherit the fill chain's failure modes.
  #
  # Tuesday 06:40 UTC: clear of the nightly fill (00:00) and of the Wednesday
  # resolve-figures (04:37) / figure-link-check (05:11) pair, so nothing competes
  # for the Wikimedia API or for runner minutes.
  schedule:
    - cron: '40 6 * * 2'

  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit + push regenerated data/timeline*.json, topic-layers.json and geography HTML (false = build for log/stats only)'
        required: false
        default: 'true'

concurrency:
  group: timeline-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=12288

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # PAT, not GITHUB_TOKEN: GitHub suppresses workflow triggers for
      # GITHUB_TOKEN pushes, so the rebuild commit would never reach
      # "Slim live mirror" and production would stay stale.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 1
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Full offline rebuild chain (no npm deps, no network):
      #   build-timeline.js          → data/timeline.json + timeline.nodes.*.json
      #   gen-topic-layers.js        → data/topic-layers.json (the "mind-tree"),
      #                                reads timeline.json + node parts
      #   build-geography-diagrams.js → geography-diagrams.html (concept pack)
      #   build-geography-figures.js  → geography-figures.html (figure pack)
      # build-timeline.js requires only node builtins (fs/path/child_process).
      # child_process shells out to `git ls-tree`/`git show` to diff old node
      # parts, so no npm install is needed.
      - name: Rebuild timeline map from question data
        run: node scripts/build-timeline.js

      # Rebuild the Ask engine's retrieval index from the timeline nodes the step
      # above just produced. build-ask-index.js reads data/timeline.nodes.<i>.json
      # and data/timeline.json, so it must run after build-timeline.js and never
      # before it.
      #
      # This step was missing, and that made a timeline rebuild self-defeating: it
      # committed brand-new nodes while data/ask-index.json stayed frozen, so ask.html
      # served an index that could not retrieve anything the rebuild had just added.
      # Content only became findable once an unrelated workflow happened to rerun the
      # builder — daily-wiki-fill's finalize, build-ask-qb, or ask-audit — which could
      # be up to a full nightly cycle later. Now every timeline rebuild ships Ask in
      # step with the map it was built from.
      #
      # Deliberately NOT continue-on-error (unlike the same command in
      # daily-wiki-fill's finalize): there, a failure still lets the harvested
      # questions be committed, and the questions are the irreplaceable part. Here the
      # inputs are already committed, so a silent skip would only re-introduce the
      # stale-index bug this step exists to prevent.
      #
      # This is the TIMELINE index only (data/ask-index.json plus its
      # data/ask-index-nodes.*.json shards, picked up by the `git add -A data/` below).
      # It does NOT build the question-bank tables under data/ask-qb/, which are a
      # separate artifact with their own builder and workflow.
      - name: Rebuild Ask engine index
        run: node scripts/build-ask-index.js

      - name: Rebuild mind-tree (topic-layers.json)
        run: node scripts/gen-topic-layers.js

      # These three packs were one `run: |` block, so a nonzero exit from any of
      # them failed the job and SKIPPED the commit below -- throwing away a
      # timeline and Ask index that had already rebuilt successfully, purely
      # because a figure script hit the network.
      #
      # build-geography-figures.js is the risky one: its auto-fill calls the
      # Wikimedia Commons API (autoFill -> commonsSearch/fileOK). Its requests
      # are individually bounded (12s AbortController) and the whole fill has a
      # FIGURES_MAX_MS wall-clock budget, but a 429 or a socket reset can still
      # surface as a nonzero exit. A figure pack must never be able to block the
      # data commit, so each runs as its own non-fatal step: one pack failing
      # leaves the other two at their last good build instead of reverting
      # everything.
      - name: Rebuild geography diagrams
        continue-on-error: true
        run: node scripts/build-geography-diagrams.js

      - name: Rebuild geography figures (auto-fills new topics)
        continue-on-error: true
        run: node scripts/build-geography-figures.js

      # build-subject-figures.js refuses to write unless FIGURES_ALLOW_UNVERIFIED=1
      # (see main() in that script). Without it this step printed the warning and
      # returned without writing, so subject-figures-index.html and the 24
      # *-figures.html packs in this repo were stale artifacts of a manual run.
      # FIGURE_SOURCE=curated is the default and the safe one: topics come from
      # data/figure-topics-curated.json (UPSC Paper-1 syllabus) rather than the
      # A-Z Wikipedia question shards, which is what previously produced figures
      # like the Democratic Party under Animal Husbandry. Set explicitly so a
      # future default change cannot silently reintroduce the contaminated source.
      - name: Rebuild subject figure packs
        continue-on-error: true
        run: FIGURES_ALLOW_UNVERIFIED=1 FIGURE_SOURCE=curated node scripts/build-subject-figures.js

      - name: Commit + push regenerated timeline
        # `inputs.commit` is only populated for workflow_dispatch. A schedule
        # event has no inputs, so gating on it alone would make every scheduled
        # run build the packs and then throw the result away -- silently killing
        # the weekly figure auto-fill that this schedule exists to guarantee.
        if: inputs.commit == 'true' || github.event_name == 'schedule'
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          rm -rf .git/rebase-merge .git/rebase-apply 2>/dev/null
          rm -f .git/CHERRY_PICK_HEAD .git/MERGE_HEAD .git/MERGE_MSG .git/MERGE_MODE .git/REVERT_HEAD 2>/dev/null
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git reset HEAD -- . 2>/dev/null
          git add -A data/ geography-diagrams.html geography-figures.html subject-figures-index.html *-figures.html
          if git diff --staged --quiet; then
            echo "No timeline changes to commit"
          else
            git commit -m "Timeline + mind-tree + geography rebuild $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase 2>/dev/null || { echo "Rebase conflict — aborting and merging"; git rebase --abort 2>/dev/null; git fetch origin main 2>/dev/null; git merge --no-edit origin/main 2>/dev/null || true; }
            git push && echo "Pushed timeline rebuild" || echo "Push failed"
          fi
name: Proposal Lane

# The improvement scout: once a day the site's own model (Ollama on this
# runner — zero API keys) reads a factual digest of the site (content pools,
# owner-lane results, fault board, browser test, recent agent runs) and
# writes 3-5 concrete improvement proposals to data/agent-proposals.json.
#
# The owner reviews them on improve.html ("Proposal lane" section) and
# approves one by filing it as a GitHub issue. NOTHING is implemented
# automatically — this lane only suggests.
#
# Runs daily at 01:45 UTC (07:15 IST) so the owner wakes up to fresh ideas,
# plus manual dispatch. If a pass fails, the run is red (loud) and the
# failure is recorded in the same file + data/agent-log.json.

on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:

concurrency:
  group: proposal-lane
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data/invented
            data/on-demand
            data/mains-fresh.json
            data/mains-questions.json
            data/mains-updates.json
            data/practice-sets/index.json
            data/agent-log.json
            data/agent-proposals.json
            data/faults.json
            data/browser-test.json
            data/questions/_state/cursor.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same swap as the other model lanes — safety net against the model
      # being paged out under memory pressure.
      - name: Create swap (16GB - same as the other model lanes)
        run: |
          sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /tmp/swapfile
          sudo mkswap /tmp/swapfile
          sudo swapon /tmp/swapfile
          free -h

      - name: Install Ollama
        run: |
          echo "Fetching installer from ollama.com..."
          curl -fsSL --max-time 120 -o /tmp/ollama-install.sh https://ollama.com/install.sh
          sudo sh /tmp/ollama-install.sh
          ollama --version
          mkdir -p ~/.ollama/models
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          printf '[Service]\nUser=runner\nGroup=runner\nEnvironment=HOME=/home/runner\nEnvironment=OLLAMA_MODELS=/home/runner/.ollama/models\nEnvironment=OLLAMA_KEEP_ALIVE=60m\n' | sudo tee /etc/systemd/system/ollama.service.d/runner-home.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart ollama

      # Same "mid-v1" cache as the 9b lanes.
      - name: Cache Ollama models
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ runner.os }}-mid-v1
          restore-keys: |
            ollama-${{ runner.os }}-mid-

      - name: Start Ollama server
        run: |
          sudo sysctl -w vm.swappiness=10 || true
          export OLLAMA_KEEP_ALIVE=60m
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null && echo " OK" || echo " FAILED"

      - name: Pull + warm the model (qwen3.5:9b)
        run: |
          ollama pull qwen3.5:9b
          ollama list
          echo "Warming qwen3.5:9b..."
          ollama run qwen3.5:9b "Reply with exactly: OK" 2>&1 | tail -3

      - name: Ensure Ollama is up before the request
        run: |
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
            echo "Server down before request — restarting"
            export OLLAMA_KEEP_ALIVE=60m
            nohup ollama serve >> /tmp/ollama.log 2>&1 &
            echo $! > /tmp/ollama.pid
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
              sleep 1
            done
          fi
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null && echo "Server ready" || echo "WARNING: server still down"

      # Script exits 1 on a failed pass (loud red run) but still writes the
      # attempt into data/agent-proposals.json + data/agent-log.json, and the
      # publish step below runs anyway so nothing is ever swallowed.
      - name: Propose (30-minute model deadline)
        timeout-minutes: 35
        env:
          OLLAMA_MODEL: qwen3.5:9b
          OLLAMA_HOST: http://127.0.0.1:11434
          PROPOSAL_DEADLINE_MIN: '30'
        run: node scripts/proposal-lane.js

      - name: Publish proposals
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add data/agent-proposals.json data/agent-log.json 2>/dev/null || true
          bash scripts/ci-push.sh "proposals: daily improvement pass"

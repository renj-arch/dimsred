name: Grow Important Question Sets

# The CSAT / General Studies / Current Affairs sets shipped as a hand-written
# sampler: "Average of 10, 20, 30, 40, 50", "Find the next: 2, 6, 18, 54". The
# real paper asks data sufficiency with two statements, passage inference,
# multi-statement and match-the-following, and it does not ask single-step
# arithmetic at all.
#
# This lane keeps the three sets growing in the paper's shapes, the way the
# course lanes keep the lessons growing. It appends, never rewrites, and every
# item has to pass scripts/lib/question-quality.js first: no questions about
# exam technique, no lesson-meta questions ("The lesson states that..."), no
# passages about the exam, and no explanation carrying the model's own
# deliberation.

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Questions to add per set this run'
        required: false
        default: '4'

permissions:
  contents: write

concurrency:
  group: grow-question-sets
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write new items in the paper's shapes
        env:
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_MODELS: '1'
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ github.event.inputs.count || '4' }}
        run: node scripts/build-important-sets.js --all --count "$COUNT"

      - name: Keep the sets honest
        run: |
          node scripts/lib/question-solutions.test.js
          node scripts/remove-filler-questions.js --check

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add upsc/chapters/csat-important-questions.html
          git add upsc/chapters/general-studies-important-questions.html
          git add upsc/chapters/current-affairs-important-questions.html
          bash scripts/ci-push.sh "questions: grow the three important sets in the paper's shapes"
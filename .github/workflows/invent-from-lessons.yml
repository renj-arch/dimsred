name: Invent From Lessons

# Writes NEW questions from the paragraphs a student is actually reading. Each
# item is answerable from its own passage and a second independent call must
# confirm the key, so this is not "according to the lesson" trivia: it is a
# comprehension question anchored in the text.
#
# Published to data/lesson-invented.json, served by current-affairs.html behind
# the "🧠 From lesson text" toggle.

on:
  schedule:
    - cron: '43 */3 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Questions to invent this run'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: invent-from-lessons
  cancel-in-progress: false

jobs:
  invent:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Invent from lesson paragraphs
        env:
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_MODELS: '1'
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LESSON_INVENT_COUNT: ${{ github.event.inputs.count || '6' }}
          LESSON_INVENT_DEADLINE_MIN: '30'
        run: node scripts/invent-from-lessons.js

      - name: Validate the store
        run: node scripts/validate-lesson-invented.js

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -f data/lesson-invented.json
          bash scripts/ci-push.sh "lessons: invent questions from the paragraphs being read"
name: Daily PIB Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch PIB RSS feed
        run: node scripts/fetch-pib-rss.js

      - name: Commit and push
        run: |
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          git diff --staged --quiet || git commit -m "Daily PIB feed update $(date +'%Y-%m-%d')"
          git push

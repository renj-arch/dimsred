name: Daily PIB Feed

on:
  schedule:
    - cron: '0 2,6,10,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent pile-ups: periodic content jobs must not queue behind each
# other — the newest run wins.
concurrency:
  group: pib-feed
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch PIB RSS feed
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/fetch-pib-rss.js

      - name: Generate quiz questions
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/generate-quiz.js

      - name: Generate knowledge base from study notes
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/generate-knowledge-base.js

      - name: Commit and push
        run: |
          git stash --include-untracked
          git pull --rebase
          git stash pop || true
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Daily PIB feed update $(date +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash 2>/dev/null || true
              git push 2>/dev/null && { echo "Pushed"; break; } || echo "push attempt $i failed, retrying..."
              sleep 5
            done
          else
            echo "No new PIB items to commit"
          fi

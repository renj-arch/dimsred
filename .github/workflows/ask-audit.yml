name: Ask Retrieval Audit

# Regression gate for the zero-AI retrieval engine in scripts/lib/ask-core.js.
#
# WHY A SEPARATE WORKFLOW, NOT A STEP IN build-ask-qb.yml:
#   That workflow is a 330-minute, 9.4 GB disk job whose entire job is to
#   regenerate the question-bank tables. The audit needs neither: it reads the
#   node shards that ask-index.json points at and runs in about a second. A
#   regression here is a code defect, and it should not wait hours behind a
#   corpus rebuild to be discovered -- nor should a failing audit be able to
#   stop the rebuild that keeps production honest.
#
# WHAT IT PROTECTS:
#   Every Ask answer is assembled by retrieve() from corpus text, so the failure
#   mode that matters is answering a question the corpus cannot support. That
#   output looks authoritative and the reader cannot tell it was assembled from
#   fragments, which is why the audit fails on an unwanted ANSWER at least as
#   loudly as on an unwanted refusal. A cautious refusal is cheap; a confident
#   wrong answer is not.
#
# The audit also fails when a refusal stops naming the missing term. "No term in
# the question appears anywhere in the index" is true of every absent-term
# refusal and therefore tells the reader nothing about what is missing.

on:
  push:
    paths:
      - scripts/lib/ask-core.js
      - scripts/ask-audit.js
      - scripts/build-ask-index.js
      - scripts/lib/ask-index-load.js
      - data/ask-index.json
      - data/ask-index-nodes.*.json
  workflow_dispatch:

concurrency:
  group: ask-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # Headroom for a cold runner now that checkout is sparse. The audit itself
    # runs in about a second; this only guards against a slow first fetch.
    timeout-minutes: 20
    steps:
      # Sparse checkout is REQUIRED here, not an optimisation.
      #
      # The question-bank tables under data/questions are ~8.6 GB across 1255
      # tracked files, so a full checkout cannot finish inside this job's
      # timeout. The job gets cancelled mid-checkout, leaving an incomplete
      # working tree, and the always() summary step then reports a bogus
      # "Cannot find module scripts/ask-audit.js" -- which reads exactly like a
      # missing script and sends you hunting for a file that is committed and
      # present. That is what happened on run #7.
      #
      # The audit needs only the scripts and the 46 MB of Ask index shards, so
      # fetch exactly those and the checkout finishes in seconds.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            ask.html
            data/ask-index.json
            data/ask-index-nodes.*.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Report index size
        run: |
          node -e "const p=require('./scripts/lib/ask-index-load.js').read('.');console.log('nodes: '+p.nodes.length+' in '+p.meta.nodeShards+' shards')"

      # The audit exits nonzero on any unexpected verdict, so a regression
      # blocks the merge rather than being noticed later in a live answer.
      - name: Retrieval audit
        run: node scripts/ask-audit.js -v

      # The retrieval engine can pass every assertion in ask-audit.js and still
      # leave the page dead on arrival: boot() runs inline in ask.html and a
      # ReferenceError there (the askHay incident) is invisible to a test that
      # only requires the library. This check loads the seven libraries and
      # executes the page's own inline script, which is what actually broke.
      - name: Ask page boot
        run: node scripts/check-ask-page-boot.js

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ask retrieval audit"
            echo ""
            echo '```'
            node scripts/ask-audit.js 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Explain Options

# Writes "why the correct option is right" and "why each distractor is wrong"
# for the question bank, then mock-test.js shows it on reveal/review. Verified
# by an independent model before storage.

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Questions to explain this run'
        required: false
        default: '12'

concurrency:
  group: explain-options
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Explain correct and incorrect options
        env:
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS: '1'
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '12' }}
        run: node scripts/explain-options.js --limit "$LIMIT"

      - name: Publish explanations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -f data/question-explain.json 2>/dev/null || true
          bash scripts/ci-push.sh "explain-options: why the right one is right and the others wrong"
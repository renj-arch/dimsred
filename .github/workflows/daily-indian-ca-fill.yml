name: Daily Indian Current Affairs Fill

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch Indian current events from Wikipedia
        run: node scripts/fetch-indian-ca.js

      - name: Commit and push
        run: |
          git stash --include-untracked
          git pull --rebase
          git stash pop || true
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Daily Indian CA fill $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new Indian current affairs to commit"
          fi

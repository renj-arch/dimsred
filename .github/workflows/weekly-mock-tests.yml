name: Weekly Mock Tests

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# Prevent pile-ups: periodic content jobs must not queue behind each
# other — the newest run wins.
concurrency:
  group: weekly-mock-tests
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Bank cleanup removed 2026-11-08. Its vocabulary heuristics deleted 466
      # CGL questions, including 20 valid model-written items, and 45 JEE
      # questions. Question banks are append-only now: repairs must be explicit
      # and reviewed, never a scheduled bulk delete. scripts/bank-cleanup.js
      # still exists for manual, audited runs.
      - name: Generate weekly mock tests for all exams
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/generate-weekly-mocks.js

      - name: Commit and push
        run: |
          git stash --include-untracked
          git pull --rebase
          git stash pop || true
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Weekly mock tests $(date +'%Y-%m-%d') — all 14 exams"
            for i in 1 2 3; do
              git pull --rebase --autostash 2>/dev/null || true
              git push 2>/dev/null && { echo "Pushed"; break; } || echo "push attempt $i failed, retrying..."
              sleep 5
            done
          else
            echo "No changes to commit"
          fi

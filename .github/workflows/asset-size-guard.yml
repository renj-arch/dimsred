name: Asset size guard

# Cloudflare Pages fails a build when any deployed asset exceeds 25 MiB — and
# that failure is invisible from CI: the lane's push still succeeds, production
# just never moves. That is exactly how the site froze on 2026-10-18, when
# data/questions-cursor.json (47.2 MiB) sat in main's tree and every Cloudflare
# build failed asset validation while users kept seeing the last good build.
# The cursor now lives under data/questions/ (stripped from every deploy path),
# and this guard names any new offender at push time — the failure shows up in
# Actions instead of as a silently stale site.
#
# data/questions/** is exempt by design: the Cloudflare build command removes
# it (rm -rf .deploy/data/questions) and the slim-live mirror excludes it, so
# files there never reach the CDN, whatever their size.
#
# Sizes come from GitHub's trees API, not from a clone. The first version of
# this job fetched bloblessly and then ran `git ls-tree -l` — but on a blobless
# clone that call needs every blob's content to learn its size, so it started
# pulling the ~8.8 GB data/questions corpus and died silently at the job
# timeout (run #1, 2026-10-19: step cancelled at the 10-minute mark, no
# output). One API call answers the same question in seconds.

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Flag deployable tracked files over 24 MiB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LIMIT=$((24 * 1024 * 1024))

          gh api "repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA?recursive=1" > tree.json
          if [ "$(jq -r '.truncated' tree.json)" != "false" ]; then
            echo "::error::tree listing was truncated — the guard cannot see every file, so a pass would be meaningless"
            exit 1
          fi
          jq -r '.tree[] | select(.type == "blob") | "\(.size)\t\(.path)"' tree.json > blobs.tsv
          echo "checked $(wc -l < blobs.tsv) files at $GITHUB_SHA"

          BAD=$(awk -F'\t' -v lim="$LIMIT" \
            '$1 > lim && $2 !~ /^data\/questions\// { printf "%7.1f MiB  %s\n", $1/1048576, $2 }' blobs.tsv)
          if [ -n "$BAD" ]; then
            echo "::error::Deployable files over the 24 MiB guard (Cloudflare Pages limit is 25 MiB):"
            echo "$BAD"
            echo "These would silently freeze the next Cloudflare build. Move internal state under data/questions/ (never deployed) or shrink/split the file."
            exit 1
          fi

          echo "OK: no deployable tracked file over 24 MiB"
          echo "Largest deployable files today:"
          awk -F'\t' '$2 !~ /^data\/questions\// { printf "%9.1f MiB  %s\n", $1/1048576, $2 }' blobs.tsv | sort -rn | head -5

name: Passage Cartoons

# One mini editorial cartoon (The Hindu style) per passage of a UPSC lesson:
# a single-panel ink drawing that conveys the section in a nutshell.
#
# Runs back-to-back all day: each run writes up to LIMIT lessons x MAX cartoons,
# then re-dispatches itself while any un-cartooned passage remains (checked by
# `--remaining`). The 30-minute cron is only a restart net if a chain dies.
# Idempotent: a cartoon is keyed by a hash of its passage, so a re-run never
# doubles one and finished lessons are skipped.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Lessons to process this run'
        required: false
        default: '15'
      max:
        description: 'Max cartoons per lesson'
        required: false
        default: '10'
      granularity:
        description: 'h2 (major sections) or h3 (every subsection)'
        required: false
        default: 'h3'
      file:
        description: 'One lesson path (comma-separated), or blank for all'
        required: false
        default: ''

concurrency:
  group: passage-cartoons
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cartoons:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Draw one cartoon per passage
        env:
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS: '1'
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '15' }}
          MAX: ${{ github.event.inputs.max || '10' }}
          GRAN: ${{ github.event.inputs.granularity || 'h3' }}
          FILE: ${{ github.event.inputs.file || '' }}
        run: |
          ARGS="--limit $LIMIT --max $MAX --granularity $GRAN --workers 4 --deadline 70"
          if [ -n "$FILE" ]; then ARGS="--file $FILE $ARGS"; else ARGS="--all $ARGS"; fi
          node scripts/invent-passage-cartoons.js $ARGS

      - name: Publish cartoons
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add data/passage-cartoons.json css/style.css 2>/dev/null || true
          git add upsc/course 2>/dev/null || true
          node scripts/build-cartoon-pages.js || true
          git add cartoons 2>/dev/null || true
          bash scripts/ci-push.sh "passage-cartoons: a cartoon for each passage (run #${{ github.run_number }})"

      # Keep the lane continuous without relying on the throttled cron: if any
      # lesson still has an un-cartooned passage, queue the next run.
      - name: Queue the next cartoon run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit || '15' }}
          MAX: ${{ github.event.inputs.max || '10' }}
          GRAN: ${{ github.event.inputs.granularity || 'h3' }}
        run: |
          set -uo pipefail
          REMAIN=$(node scripts/invent-passage-cartoons.js --remaining --granularity "$GRAN" | tail -1)
          echo "lessons still missing a cartoon: ${REMAIN:-?}"
          if [ "${REMAIN:-0}" = "0" ]; then
            echo "::notice title=Passage cartoons complete::every UPSC passage has a cartoon"
            exit 0
          fi
          for i in 1 2 3; do
            if gh workflow run passage-cartoons.yml --ref main -f limit="$LIMIT" -f max="$MAX" -f granularity="$GRAN"; then
              echo "Queued the next cartoon run"
              exit 0
            fi
            echo "dispatch attempt $i failed, retrying..."
            sleep $((5 + RANDOM % 10))
          done
          echo "::warning::could not queue the next cartoon run; the 30-minute cron will restart it"
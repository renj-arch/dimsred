name: Feed Fill

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

concurrency:
  group: data-fill

permissions:
  contents: write
  actions: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ── Feed shards: 8 parallel runners, each fetches its own subset ──
  feeds:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        shard: [1,2,3,4,5,6,7,8]
      max-parallel: 8
      fail-fast: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Feed shard ${{ matrix.shard }}
        run: |
          # Each shard calls a subset of the fetch-*.js scripts. The shard feeds
          # run on the checked-out data/ and the feeds-merge step unions the
          # results, so per-shard errors are safe (|| true).
          case "${{ matrix.shard }}" in
            1) LIST="fetch-current-events fetch-indian-ca fetch-parliament-bills fetch-obituaries fetch-themes" ;;
            2) LIST="fetch-rbi-data fetch-state-news fetch-global-rankings fetch-awards fetch-defence fetch-science" ;;
            3) LIST="fetch-env-health-agri fetch-society-news fetch-appointments fetch-judgements fetch-books-authors fetch-bilateral" ;;
            4) LIST="fetch-education-culture fetch-schemes fetch-summits fetch-bilateral-recent fetch-art-culture" ;;
            5) LIST="fetch-banking-ca fetch-economy-ca fetch-infra-ca fetch-health-ca fetch-education-ca fetch-environment-ca" ;;
            6) LIST="fetch-intl-orgs fetch-constitutional-bodies fetch-constitution-articles fetch-census-data fetch-disaster-mgmt fetch-tribes fetch-sports fetch-foreign-artists" ;;
            7) LIST="fetch-persons-places fetch-elections fetch-reports-indexes fetch-agri-energy-security fetch-social-welfare fetch-corporate-digital fetch-global-social-issues" ;;
            8) LIST="fetch-historical-anniversaries fetch-media-press fetch-insurance-irdai fetch-film-world-records fetch-ma-corporate fetch-railway-aviation fetch-committees-commissions fetch-national-parks-wildlife fetch-budget-rbi fetch-unesco-sc-institutions fetch-industry-nuclear-flagships" ;;
          esac
          for s in $LIST; do
            echo "=== $s ==="
            node scripts/$s.js || echo "[shard ${{ matrix.shard }}] $s failed (non-fatal)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: feed-shard-${{ matrix.shard }}
          path: |
            data/questions/
            data/book-summaries.json
            data/pib-feed.json
          retention-days: 1

  # ── Feed merge: union shard outputs, then finalize feeds-only data ──
  feeds-merge:
    needs: feeds
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - uses: actions/download-artifact@v4
        with:
          path: shards/
          pattern: feed-shard-*

      - name: Union-merge shard outputs
        run: node scripts/merge-feed-shards.js shards/

      # Hold monthly CA really lives in current-affairs.json; merge-monthly uses
      # the scratch from fetch-current-events / fetch-indian-ca shards.
      - run: node scripts/merge-monthly-current-affairs.js
      # Post-merge fetchers that must run on the merged corpus.
      - run: node scripts/fetch-agri-tech.js || true
      - run: node scripts/fetch-stats-maths.js || true
      - run: node scripts/fetch-hydrogeology.js || true
      - run: node scripts/fetch-library-science.js || true
      - run: node scripts/fetch-technical-officer.js || true

      - run: node scripts/cleanup-questions.js
      - run: node scripts/dedup-sentence-flood.js
      - run: node scripts/inject-handpicked-gk.js
      - run: node scripts/build-archive-single.js

      - run: |
          cp archive.html data/archive.html
          rm -f data/quiz.json

      - uses: actions/upload-artifact@v4
        with:
          name: final-data
          path: data/
          retention-days: 1

  # ── Finalize: commit feed data, advance progress ──
  finalize:
    needs: [feeds-merge]
    if: always() && needs.feeds-merge.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download feed data (if feeds-merge succeeded)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: final-data
          path: data/

      - run: cp -f data/archive.html archive.html 2>/dev/null || true

      - name: Rebuild timeline map from question data
        continue-on-error: true
        run: |
          node scripts/build-timeline.js || echo "timeline rebuild skipped/failed — questions still committed"

      - run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          rm -rf .git/rebase-merge .git/rebase-apply 2>/dev/null
          rm -f .git/CHERRY_PICK_HEAD .git/MERGE_HEAD .git/MERGE_MSG .git/MERGE_MODE .git/REVERT_HEAD 2>/dev/null
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git checkout -B main 2>/dev/null || true
          git reset HEAD -- . 2>/dev/null
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Feed fill $(date +'%Y-%m-%d %H:%M UTC') — run #${{ github.run_number }}"
            for i in 1 2 3; do
              if git pull --rebase 2>/dev/null; then
                echo "Rebased cleanly"
              else
                echo "Rebase conflict — aborting and union-merging to keep BOTH runs' data."
                git rebase --abort
                git fetch origin main 2>/dev/null
                git merge --no-edit origin/main 2>/dev/null || {
                  node scripts/resolve-data-merge.js
                  git commit --no-edit 2>/dev/null || true
                }
              fi
              git push && { echo "Push succeeded"; break; } || echo "Push attempt $i failed, retrying..."
              sleep 5
            done || true
            touch "$RUNNER_TEMP/changes-committed"
          fi

      - run: |
          if [ -f "$RUNNER_TEMP/changes-committed" ]; then
            echo "Feed data committed; next cron (00:15) will pick it up"
          else
            echo "No feed data changes today"
          fi
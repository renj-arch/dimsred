name: Feed Fill

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  workflow_run:
    # Chained from the Wiki Fill finalize so it runs with the freshest data
    # instead of waiting for the 00:15 cron on a maybe-empty night.
    workflows: ['Wiki Fill']
    types:
      - completed

concurrency:
  # Its OWN group. It used to share `data-fill` with Wiki Fill, which
  # self-dispatches its next run at the end of every finalize; GitHub cancels
  # the previously-pending run in a group when a newer one enters, so the
  # scheduled Feed Fill waited all day behind the running Wiki Fill and was
  # then cancelled by Wiki Fill's self-dispatch — it never ran. Every Feed Fill
  # schedule run since 2026-08-11 shows "cancelled". (Same starvation bug the
  # figures workflow escaped by leaving `data-fill`.)
  group: feed-fill

permissions:
  contents: write
  actions: write

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ── Feed shards: 8 parallel runners, each fetches its own subset ──
  feeds:
    runs-on: ubuntu-latest
    # Only chain off a SUCCESSFUL Wiki Fill; a failed/partial one must not
    # trigger a merge race that then masks the failure.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    continue-on-error: true
    strategy:
      matrix:
        shard: [1,2,3,4,5,6,7,8]
      max-parallel: 8
      fail-fast: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Feed shard ${{ matrix.shard }}
        run: |
          # Each shard calls a subset of the fetch-*.js scripts. The shard feeds
          # run on the checked-out data/ and the feeds-merge step unions the
          # results, so per-shard errors are safe (|| true).
          case "${{ matrix.shard }}" in
            1) LIST="fetch-current-events fetch-indian-ca fetch-parliament-bills fetch-obituaries fetch-themes" ;;
            2) LIST="fetch-rbi-data fetch-state-news fetch-global-rankings fetch-awards fetch-defence fetch-science" ;;
            3) LIST="fetch-env-health-agri fetch-society-news fetch-appointments fetch-judgements fetch-books-authors fetch-bilateral" ;;
            4) LIST="fetch-education-culture fetch-schemes fetch-summits fetch-bilateral-recent fetch-art-culture" ;;
            5) LIST="fetch-banking-ca fetch-economy-ca fetch-infra-ca fetch-health-ca fetch-education-ca fetch-environment-ca" ;;
            6) LIST="fetch-intl-orgs fetch-constitutional-bodies fetch-constitution-articles fetch-census-data fetch-disaster-mgmt fetch-tribes fetch-sports fetch-foreign-artists" ;;
            7) LIST="fetch-persons-places fetch-elections fetch-reports-indexes fetch-agri-energy-security fetch-social-welfare fetch-corporate-digital fetch-global-social-issues" ;;
            8) LIST="fetch-historical-anniversaries fetch-media-press fetch-insurance-irdai fetch-film-world-records fetch-ma-corporate fetch-railway-aviation fetch-committees-commissions fetch-national-parks-wildlife fetch-budget-rbi fetch-unesco-sc-institutions fetch-industry-nuclear-flagships" ;;
          esac
          for s in $LIST; do
            echo "=== $s ==="
            node scripts/$s.js || echo "[shard ${{ matrix.shard }}] $s failed (non-fatal)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: feed-shard-${{ matrix.shard }}
          path: |
            data/questions/
            data/book-summaries.json
            data/pib-feed.json
          retention-days: 1

  # ── Feed merge: union shard outputs, then finalize feeds-only data ──
  feeds-merge:
    needs: feeds
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # build-archive-single.js streams every unique question as NDJSON into
      # /tmp (~6-8GB) on top of the full checkout — Feed Fill #25 died with
      # ENOSPC at flushCat. Drop unused preinstalled SDKs to free ~20GB.
      - name: Free runner disk space (archive build needs ~20GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - uses: actions/download-artifact@v4
        with:
          path: shards/
          pattern: feed-shard-*

      - name: Union-merge shard outputs
        run: node scripts/merge-feed-shards.js shards/

      # Hold monthly CA really lives in current-affairs.json; merge-monthly uses
      # the scratch from fetch-current-events / fetch-indian-ca shards.
      - run: node scripts/merge-monthly-current-affairs.js

      # Free news RSS -> Current Affairs (Google News + Bing News + publisher
      # feeds). Wikipedia is a week behind on Indian current affairs and misses
      # stories with no article at all, so this is the only source for
      # "who won X yesterday" / "which state launched Y" style questions.
      # Runs after the monthly merge so it dedups against everything above.
      - name: Mine free news into Current Affairs
        continue-on-error: true
        env:
          NEWS_CA_DAYS: 21
          NEWS_CA_MAX_NEW: 160
        run: node scripts/fetch-news-ca.js

      # Post-merge fetchers that must run on the merged corpus. Agri/tech
      # exam subjects are now generated by the wiki-fill workflow instead.
      - run: node scripts/fetch-library-science.js || true

      - run: node scripts/cleanup-questions.js
      - run: node scripts/dedup-sentence-flood.js
      - run: node scripts/inject-handpicked-gk.js

      # Auto-route freshly generated sub-topics to their correct category
      # (✓-ticking them). 0 moves when clean.
      - name: Classify new sub-topics into correct categories
        run: node scripts/classify-global.cjs

      - run: node scripts/build-archive-single.js

      # Rebuild the per-file archive index so current-affairs.html's archive
      # progress total stays in sync with archive.html/catalog.json.
      - run: node scripts/build-archive-index.mjs

      - run: |
          cp archive.html data/archive.html
          rm -f data/quiz.json

      - uses: actions/upload-artifact@v4
        with:
          name: final-data
          path: data/
          retention-days: 1

  # ── Finalize: commit feed data, advance progress ──
  finalize:
    needs: [feeds-merge]
    if: always() && needs.feeds-merge.result == 'success'
    runs-on: ubuntu-latest
    # Without a job timeout this hung 7h on the timeline rebuild (run
    # 38974828205) while every newer fill queued behind its data-fill group.
    # Raised 60 -> 120 so a large commit (the JSON tree compresses slowly) has
    # room to finish instead of being killed after the data was already merged.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download feed data (if feeds-merge succeeded)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: final-data
          path: data/

      - run: cp -f data/archive.html archive.html 2>/dev/null || true

      # Timeline is owned by build-timeline.yml (dispatched below). Running a
      # 25-minute rebuild here only ever timed out and then delayed the commit.
      - name: Defer timeline to build-timeline.yml
        run: echo "Timeline rebuild deferred to build-timeline.yml"

      - run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          rm -rf .git/rebase-merge .git/rebase-apply 2>/dev/null
          rm -f .git/CHERRY_PICK_HEAD .git/MERGE_HEAD .git/MERGE_MSG .git/MERGE_MODE .git/REVERT_HEAD 2>/dev/null
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          # Cheap packs: see daily-wiki-fill.yml. The default zlib level and
          # delta window spent the whole timeout on ~9 GB of JSON.
          git config core.compression 1
          git config pack.window 0
          git config pack.depth 0
          git config gc.auto 0
          git checkout -B main 2>/dev/null || true
          git reset HEAD -- . 2>/dev/null
          # Scoped staging. Everything the feed merge produces is under data/
          # plus the root archive.html copy; `git add -A` swept in whatever else
          # happened to be lying around and got slower every run.
          git add -A -- data archive.html
          UNEXPECTED=$(git status --porcelain | grep -v -E '^(.. )?(data/|archive\.html)' | head -20 || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "NOT staged (outside data/ + archive.html):"
            echo "$UNEXPECTED"
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Feed fill $(date +'%Y-%m-%d %H:%M UTC') — run #${{ github.run_number }}"
            for i in 1 2 3; do
              if git pull --rebase 2>/dev/null; then
                echo "Rebased cleanly"
              else
                echo "Rebase conflict — aborting and union-merging to keep BOTH runs' data."
                git rebase --abort
                git fetch origin main 2>/dev/null
                git merge --no-edit origin/main 2>/dev/null || {
                  node scripts/resolve-data-merge.js
                  git commit --no-edit 2>/dev/null || true
                }
              fi
              git push && { echo "Push succeeded"; break; } || echo "Push attempt $i failed, retrying..."
              sleep 5
            done || true
            touch "$RUNNER_TEMP/changes-committed"
          fi

      # Timeline/Ask index are rebuilt on a fresh clock so a slow commit can
      # never starve them (this is why the 25-minute step above was removed).
      - name: Dispatch timeline rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/changes-committed" ]; then
            gh workflow run build-timeline.yml && echo "Dispatched build-timeline.yml" || echo "Timeline dispatch failed"
          else
            echo "No changes — timeline rebuild not needed"
          fi

      - run: |
          if [ -f "$RUNNER_TEMP/changes-committed" ]; then
            echo "Feed data committed; next cron (00:15) will pick it up"
          else
            echo "No feed data changes today"
          fi

      - run: |
          if [ -f "$RUNNER_TEMP/changes-committed" ]; then
            echo "Feed data committed; next cron (00:15) will pick it up"
          else
            echo "No feed data changes today"
          fi
name: Weekly Stale Paper Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a weekly publish half-way through its push: the cleanup was
# already computed locally, so a cancellation silently skips the week.
concurrency:
  group: weekly-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Checkout ~20 min + the publish can take another ~10 min; the old
    # 30-minute cap cancelled every run inside the final commit step
    # (2026-11-01, 2026-10-25).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          # The cleanup reads question-bank/ and papers-data/ only. Skipping
          # the multi-GB data/questions corpus cuts the checkout from ~20 min
          # and keeps the publish well inside the job timeout.
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run stale paper cleanup
        id: cleanup
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/cleanup-stale-papers.js

      - name: Commit and push if changes
        run: |
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          # Scope staging to what the cleanup can touch. A bare `git add -A`
          # walks the entire multi-GB question corpus and was a large part of
          # the 2026-11-01 timeout.
          git add -A -- . ':(exclude)data/questions'
          if git diff --staged --quiet; then
            echo "No stale papers to remove"
            exit 0
          fi
          git commit -m "Weekly stale paper cleanup $(date +'%Y-%m-%d')"
          pushed=""
          for i in 1 2 3; do
            git pull --rebase || { git rebase --abort 2>/dev/null || true; git fetch origin main; git rebase origin/main || true; }
            if git push; then pushed=1; echo "Pushed"; break; fi
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::error::stale-paper cleanup could not be pushed to main"
            exit 1
          fi
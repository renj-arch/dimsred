name: Deep Rewrite (hosted model lane)

# Nightly deepening lane. Each run takes lessons from
# data/deep-rewrite-queue.json, asks a hosted model for new exam-level
# sections, splices them into the lesson HTML before the practice block, and
# publishes through scripts/ci-push.sh.
#
# Model order (scripts/lib/ollama.js): NVIDIA NIM 550B -> Groq -> OpenRouter
# -> GitHub Models. All free-tier, all over plain HTTPS. A missing key skips
# that route and a failed call falls through to the next one.
#
# History: this lane used to pull a 17 GB 27B model onto the runner and take
# 60-120 min per lesson on CPU. The owner asked for the hosted models instead;
# the same work now takes ~90 s per lesson, and the runner no longer needs a
# swap file or 17 GB of disk.
on:
  schedule:
    - cron: '47 4 * * *'   # daily 04:47 UTC, off-peak vs other lanes
  workflow_dispatch:
    inputs:
      batch:
        description: 'How many queued lessons to write in this run'
        required: false
        default: '2'

concurrency:
  group: deep-rewrite
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  deepRewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Sparse checkout: the repository is ~18 GB and a full clone hangs for
      # 13+ minutes. Only scripts, the course tree and two data files matter.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            upsc/course
            data/deep-rewrite-queue.json
            data/handwritten-lessons.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Protected-lesson guard must pass before any writing
        run: node scripts/lib/handwritten.test.js

      - name: Deep-rewrite queued lessons with a hosted model
        env:
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS: '1'
          DEEP_BATCH: ${{ inputs.batch || '2' }}
          DEEP_MAX_SECTIONS: '6'
          DEEP_TARGET_WORDS: '2000-3000'
          DEEP_NUM_PREDICT: '6000'
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: node scripts/deep-rewrite.js

      - name: Publish lessons and queue
        if: always()
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git reset HEAD -- . 2>/dev/null || true
          git add -f data/deep-rewrite-queue.json 2>/dev/null || true
          git add upsc/course 2>/dev/null || true
          bash scripts/ci-push.sh "deep-rewrite: hosted model deepened queued lessons (run #${{ github.run_number }})"

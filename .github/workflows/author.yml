name: Author

# The writer tier, end to end: fetch the slate topic's sources, cut a ledger,
# let the local model write narration inside a fixed scene structure, assemble
# the storyboard, and stop at the gate.
#
# This is the step that used to be a person. The model is allowed to write
# sentences; it is not allowed to invent a fact, a plate or a cut. Every line
# names a ledger row, and every number in the line has to occur in that row.
#
# A green run commits the storyboard and the sets spec back to the branch it
# ran on. It does not render unless `render` is set: a storyboard that has not
# been read once is allowed to sit on the branch without spending an hour of
# Blender on it.

on:
  workflow_dispatch:
    inputs:
      film:
        description: Slate topic id
        required: true
        default: emergency-1975
        type: string
      render:
        description: Dispatch the film render after the gate passes
        required: true
        default: false
        type: boolean
      stub:
        description: Plumbing test only (no model, never shippable)
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: author-${{ github.ref }}-${{ inputs.film }}
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      LLAMA_BUILD: b11890
      HF_REPO: bartowski/Qwen2.5-7B-Instruct-GGUF
      HF_REV: 8911e8a47f92bac19d6f5c64a2e2095bd2f7d031
      LM_SOURCE: bartowski/Qwen2.5-7B-Instruct-GGUF@8911e8a47f92bac19d6f5c64a2e2095bd2f7d031
      LM_BUILD: b11890
      LM_THREADS: '4'
      LM_CTX: '8192'
      FILM: ${{ inputs.film }}

    steps:
      - name: Checkout (skip the giant question bank)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/questions/
          sparse-checkout-cone-mode: false

      - name: Report the runner
        run: |
          nproc
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          free -g

      - name: Reclaim disk for the weights
        if: ${{ !inputs.stub }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean

      - name: Install pinned llama.cpp
        if: ${{ !inputs.stub }}
        run: |
          curl -fL --retry 3 -o /tmp/llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-bin-ubuntu-x64.tar.gz"
          mkdir -p /opt/llama
          tar -xzf /tmp/llama.tar.gz -C /opt/llama
          BIN=$(find /opt/llama -name llama-cli -type f | head -n 1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_LIB=$(dirname "$BIN")" >> "$GITHUB_ENV"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version

      - name: Download pinned weights and verify the digest
        if: ${{ !inputs.stub }}
        timeout-minutes: 90
        run: |
          # 7B Q5_K_M (~5GB) - higher quality for strict audit format
          # Original 35B model (11.44GB) fails at ~84% due to HTTP/2 stream cancellation
          HF_REPO=bartowski/Qwen2.5-7B-Instruct-GGUF
          HF_REV=8911e8a47f92bac19d6f5c64a2e2095bd2f7d031
          MODEL_FILE=Qwen2.5-7B-Instruct-Q5_K_M.gguf
          MODEL="/mnt/lm/${MODEL_FILE}"
          sudo mkdir -p /mnt/lm
          sudo chown "$USER" /mnt/lm
          
          # Download with resume and explicit retry logic (5 attempts, 15s between)
          for attempt in 1 2 3 4 5; do
            echo "Download attempt $attempt/5..."
            if curl -fL --retry 3 --retry-delay 10 --retry-connrefused -C - \
              -o "$MODEL" \
              "https://huggingface.co/${HF_REPO}/resolve/${HF_REV}/${MODEL_FILE}"; then
              echo "Download succeeded on attempt $attempt"
              break
            else
              echo "Attempt $attempt failed, retrying in 15s..."
              sleep 15
            fi
            if [ $attempt -eq 5 ]; then
              echo "All 5 attempts failed"
              exit 1
            fi
          done
          
          ls -lh "$MODEL"
          echo "LM_MODEL=${MODEL}" >> "$GITHUB_ENV"

      - name: Propose a sourced brief
        id: invent
        if: ${{ inputs.film == 'invent' }}
        run: |
          set -euo pipefail
          node scripts/film/topic-propose.js
          ID=$(node -e "
            const slate = require('./data/film-slate.json');
            const topic = [...slate.topics].reverse().find((t) => t.status === 'research');
            process.stdout.write(topic ? topic.id : '');
          ")
          # No researchable topic is a normal no-op, not a failure: the
          # current-events digest may have nothing that clears the source
          # gate, and the model may not return a usable pick. Stop cleanly
          # and let the downstream steps skip instead.
          if [ -z "$ID" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to author::The slate has no researchable topic this run; nothing was published."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "FILM=$ID" >> "$GITHUB_ENV"
          echo "::notice title=Proposed $ID::The model chose a cited event and the source gate accepted it."

      - name: Fetch the sources
        id: fetch
        if: steps.invent.outputs.found != 'false'
        run: |
          node scripts/film/research.js --topic "$FILM" \
            --out "out/research/$FILM"

      - name: Author the storyboard
        if: steps.invent.outputs.found != 'false'
        env:
          STUB: ${{ inputs.stub }}
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${LLAMA_LIB:-}"
          args=(--film "$FILM" --force)
          if [ "$STUB" = "true" ]; then args+=(--stub); fi
          /usr/bin/time -v node scripts/film/author.js "${args[@]}" \
            2> "out/author-$FILM.time.log" || { cat "out/author-$FILM.time.log"; exit 1; }
          grep -E 'Maximum resident set size|Elapsed \(wall clock\)' "out/author-$FILM.time.log" || true

      - name: Show what the film will say
        if: steps.invent.outputs.found != 'false'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const film = JSON.parse(fs.readFileSync(`data/films/${process.env.FILM}.json`, 'utf8'));
          console.log(`${film.title} ΓÇö ${film.subtitle}`);
          console.log(`${film.scenes.length} scenes, ${film.targetDuration}s, grammar ${film.edit.grammar}`);
          for (const scene of film.scenes) {
            console.log(`\n${scene.id} ${scene.title} (${scene.duration}s)`);
            for (const line of scene.narration) console.log(`  [${line.source}] ${line.text}`);
            console.log(`  plates: ${[...new Set(scene.shots.map((s) => s.plate))].join(', ')}`);
          }
          NODE

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-${{ inputs.film }}
          path: |
            data/films/${{ inputs.film }}.json
            data/films/${{ inputs.film }}-ledger.json
            data/films/${{ inputs.film }}-sets.json
            data/films/${{ inputs.film }}-debates.json
            out/author/
            out/research/${{ inputs.film }}/
            out/author-${{ inputs.film }}.time.log
          if-no-files-found: warn
          retention-days: 30

      - name: Clear the authoring strikes
        if: ${{ steps.invent.outputs.found != 'false' && success() && !inputs.stub }}
        run: node scripts/film/author-strike.js --pass "$FILM"

      - name: Record the failed attempt
        if: ${{ failure() && !inputs.stub && steps.fetch.outcome == 'success' }}
        run: |
          node scripts/film/author-strike.js --fail "$FILM" \
            --reason "the sourced storyboard did not pass the gate"

      - name: Commit the strike
        if: ${{ failure() && !inputs.stub && steps.fetch.outcome == 'success' }}
        run: |
          git config user.name "vlymbooq"
          git config user.email "vlymbooq@users.noreply.github.com"
          git add data/film-slate.json
          if git diff --cached --quiet; then
            echo "nothing to record"
            exit 0
          fi
          git commit -m "record $FILM authoring strike"
          # The render lane may publish while this lane is still writing.
          # Rebase onto the new tip instead of losing the strike to a race.
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase --autostash "origin/${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Commit the storyboard to this branch
        if: ${{ steps.invent.outputs.found != 'false' && success() && !inputs.stub }}
        run: |
          git config user.name "vlymbooq"
          git config user.email "vlymbooq@users.noreply.github.com"
          git add "data/films/$FILM.json" "data/films/$FILM-ledger.json" \
                  "data/films/$FILM-sets.json" "data/films/$FILM-debates.json" data/film-slate.json
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "author $FILM from its sourced ledger"
          # Same race as the strike: another lane can advance the branch while
          # the model is still writing. Rebase, then retry the push.
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase --autostash "origin/${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Dispatch the render
        if: ${{ steps.invent.outputs.found != 'false' && success() && !inputs.stub && inputs.render }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run film.yml --ref "$GITHUB_REF_NAME" \
            -f "film=$FILM" \
            -f quality=final \
            -f release=true \
            -f publish=true


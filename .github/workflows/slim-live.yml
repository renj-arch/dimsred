name: Slim live mirror

# Deploys were push-triggered with cancel-in-progress, and that lost a race it
# could not win during busy periods: a run sat 10-22 minutes in the free-runner
# queue, and the next push -- mine or any agent workflow's -- cancelled the
# pending run and restarted the wait. Live then stayed hours stale even though
# the mirror itself needs only ~30 s once a runner appears (observed: 31 s runs
# when it did get one). Deploys landed only when a runner freed in the small
# gap between two pushes; seven consecutive deploy attempts were lost that way
# on 2026-10-18, and the WebLLM loader fix of e952bf087 never reached users.
#
# The mirror now polls on a fixed cadence instead:
#   - It always deploys main AS OF RUN TIME (the fetch below takes main's tip),
#     so a late run publishes the newest state, never a stale snapshot.
#   - The cadence (30 min) is wider than the observed 10-22 min queue wait, so
#     a pending run survives long enough to start instead of being replaced by
#     the next trigger.
#   - An unchanged tree is detected and skipped before the deploy step, so a
#     no-op tick costs one short job and produces NO Cloudflare Pages build
#     (the Pages project's build quota is finite and must not be burnt on
#     polling).
#   - Manual dispatch still forces an immediate attempt.
#
# 2026-10-18 addendum: the scheduler alone proved unreliable. This workflow's
# ticks stopped arriving shortly after 14:00 UTC while the repo was busy, and
# live sat 3+ hours stale — the mock-test repair and the 27B questions only
# moved when a manual dispatch ran. GitHub throttles scheduled workflows on
# busy public repos (site-agent's hourly cron delivered every 3-5 hours, see
# chain.yml). So the mirror now ALSO deploys when a big writer finishes: a
# workflow_run trigger fires once per completed agent run — bounded volume,
# event-driven freshness — and the 30-min tick remains as the dead-man switch
# for anything not listed.
#
# And even a fired deploy was not enough: from 15:34 UTC main carried a
# 49.5 MB data/questions-cursor.json, Cloudflare Pages rejects any asset over
# 25 MiB, so every build after that failed at Cloudflare while the push here
# still said success — the site kept serving its last good build (14:00 UTC)
# with no visible error anywhere. The rebuild step now strips oversized blobs
# (loudly) and the verify step refuses a tree that still contains one.
# 2026-10-19: that cursor moved to data/questions/_state/cursor.json, inside
# the directory already removed below — so main itself (which Cloudflare also
# builds) no longer carries it, whatever its size grows to.
on:
  schedule:
    # Off the top of the hour on purpose: GitHub's scheduler is busiest at :00.
    - cron: '11,41 * * * *'
  workflow_run:
    # Deploy right after each big writer completes. A burst of completions
    # coalesces: the newest trigger supersedes any PENDING mirror run
    # (cancel-in-progress: false never kills a running one), and each run
    # fetches main's tip, so whoever starts last deploys the newest state.
    workflows:
      - Site Agent
      - Question Quality
      - Invent Questions
      - Invent Questions (27B quality lane)
      - Archive Answers (27B quality lane)
      - LLM Auto-fix
      - On-Demand (owner runner)
      - Expand Course Content
    types: [completed]
  workflow_dispatch:

concurrency:
  group: slim-live
  # A running mirror takes ~30 s and deploys the newest main, so cancelling it
  # saves nothing. (New triggers still supersede a PENDING run -- that is what
  # kept resetting the queue position -- but with no push trigger, only the
  # 30-minute tick and manual dispatches can do that now.)
  cancel-in-progress: false

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Replaces actions/checkout on purpose. The action cannot be told to skip a
      # single directory: its sparse-checkout input is applied with --cone, which
      # rejects `/*` and `!dir/` and wants bare directory names instead, so there
      # is no way to say "everything except data/questions" without hardcoding a
      # list of every top-level directory. Such a list goes stale silently the
      # day a new one is added, and the site loses that directory with no failure.
      #
      # Measured cost of doing it the old way: 21m51s, of which 21 minutes was
      # git downloading 8.8 GB of data/questions blobs, only for the next step to
      # delete them again. Fetching trees only and building the slim tree from
      # the index avoids the download entirely.
      - name: Fetch main without downloading blobs
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          AUTH=$(printf 'x-access-token:%s' '${{ secrets.GITHUB_TOKEN }}' | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git fetch -q --depth=1 --filter=blob:none origin main
          # `/*` picks up any directory added later, so a new top-level path is
          # deployed without editing this workflow. data/questions is excluded
          # here: it is tracked in main, needed by other workflows, and reached
          # at runtime through functions/data/questions/[[path]].js instead
          # (proxying straight off main's raw, 1 h cache). The rebuild step
          # removes a few more internal paths — see there.
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/*' '!/data/questions/'
          git checkout -q FETCH_HEAD
          echo "checked out $(git ls-files | wc -l) paths"

      # Cheap contracts that catch the class of bug where a page ships but its
      # data loader cannot read the deployed files. map.html sat broken behind
      # "data/timeline.json not found" because its shard merger referenced an
      # undefined accumulator; these suites execute the real loaders, so the
      # deploy stops here instead of publishing a blank page.
      - name: Page data and UI regression suites
        run: |
          set -euo pipefail
          node scripts/lib/site-data.test.js
          node scripts/lib/site-ui.test.js
          node scripts/lib/quiz-handlers.test.js
          node scripts/lib/question-category-moves.test.js
          node scripts/lib/merge-chunks.test.js
          node scripts/validate-mains.js
          node scripts/lib/mains-plan.test.js
          # User-facing defects on 2026-11-07: a key that its own solution
          # contradicted and leaked model reasoning. This gate fails the deploy
          # on either, so they cannot reach live again.
          #
          # Repair before gating. Generation lanes run every few hours and one
          # bad item used to freeze the whole site: on 2026-11-19 four fresh
          # items ("none of the options match") arrived between a prune and the
          # deploy and failed the publish. Pruning here drops them from the tree
          # that gets built, so a lane's mistake costs its own item, not the
          # deploy. The gate still runs, so a real regression is still caught.
          node scripts/prune-unsupported-solutions.js
          node scripts/lib/question-solutions.test.js
          # A reader reported a lesson as "text so small". It was small on every
          # lesson: body text at .9em and tables at .85em on a 16px base. The
          # sizes are raised now, and this stops a regenerated page putting them
          # back.
          node scripts/legible-lesson-text.js --check
          # Reading quality. Repair first, then verify: a generation lane can
          # rewrite a page with the old inline sizes minutes before the deploy
          # (135 pages did), and that should cost the page a second pass, not the
          # whole publish.
          node scripts/strip-doubled-heading-numbers.js
          node scripts/remove-figure-blur.js
          node scripts/normalise-type-scale.js
          node scripts/strip-doubled-heading-numbers.js --check
          node scripts/remove-figure-blur.js --check
          node scripts/normalise-type-scale.js --check
          # The Drill page's engine: every topic must give four real options and
          # the data-interpretation topics must draw pie, bar and line figures.
          node scripts/lib/mental-engine.test.js
          node scripts/lib/course-versions.test.js
          node scripts/lib/archive-index-guard.test.js
          node scripts/lib/html-repair.test.js
          node scripts/lib/ollama.test.js
          node scripts/lib/ollama-nvapi.test.js
          # 2026-11-15: the OpenCode Zen route only ever tried the CLI form with
          # --standalone --format json. The installed build rejects both, prints
          # its usage and exits non-zero, so every Zen call failed and fell
          # through -- one wasted CLI spawn per model call, on every lane.
          node scripts/lib/opencode-zen.test.js
          node scripts/lib/handwritten.test.js
          # 2026-11-14: the model echoed its anchor id into reader-facing
          # headings ("Deep-1: ..."), and an older prompt produced
          # "Section 1: ..." across ten hand-written Mains lessons. The
          # stripper is what keeps that scaffolding off public pages.
          node scripts/lib/heading-text.test.js
          node scripts/lib/exam-blueprint.test.js
          # 2026-11-10: build-topic-index.js rebuilt data/topic-index.json from a
          # fixed 14-exam map and dropped the six combined drills — ~6,600
          # questions left in the repo but unreachable from the page. The guard
          # fails here instead of publishing the loss silently. The baseline
          # guard covers the same class for lesson bodies and hand-built pages,
          # which expand-course, site-agent and selfcheck-quick all rewrite.
          node scripts/lib/topic-index-guard.test.js
          node scripts/check-generated-state.js
          node scripts/validate-lesson-invented.js
          node scripts/lib/content-baseline-guard.test.js
          # Flowchart relation store: every arrow must be authored or carry an
          # evidence sentence. A missing or malformed store leaves the page with
          # no relationship layer, which is how it shipped for months.
          node scripts/validate-relations.js
          # Cloud ops agent: the path allowlist is a security boundary. A
          # regression here would let an automated patch touch reader-facing
          # content or data.
          node scripts/ops-agent.test.js
          # Repo agent: path/command allowlists are the safety boundary for
          # cloud edits. A regression here could let an automated PR touch data
          # banks, secrets or push to main.
          node scripts/repo-agent.test.js
          # Course versions/depth are generated by parallel expand lanes. The
          # union merge is what stops a push from losing another lane's lessons.
          node scripts/lib/merge-course-state.test.js
          # Language pages are hand-built shells; a wrong insertion point puts
          # model text outside the body. This pins Paper A and CTET insertion.
          node scripts/lib/language-insertion.test.js
          # figures/index.html is the single figure hub, generated from
          # scripts/lib/upsc-svg-figures.js and the forge briefs. The test
          # proves every coverage row resolves, every card is present and
          # figures.html stays a redirect.
          node scripts/lib/figure-library.test.js
          # Figures invented from course content are stored data, not source.
          # The store is the only thing stopping a model-written item from
          # publishing outside the sheet, so its guards run before every deploy.
          node scripts/lib/figure-store.test.js
          # A duplicated, unclosed sidebar heading wraps the whole page and
          # shrinks every word to .7em. Refuse to deploy one.
          node scripts/repair-sidebar-heading.js --check
          # 2026-11-15: all 14 crash-course pages rendered "Content Coming
          # Soon" because the data engine was never included. This guard keeps
          # the include and the STUDY_DATA key honest.
          node scripts/lib/crash-course.test.js
      - name: Rebuild slim live tree (orphan root)
        run: |
          set -euo pipefail
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"

          # One `git rm` per pathspec, each with --ignore-unmatch, because
          # `git rm a b` is atomic: one untracked pathspec fails the whole
          # command and leaves BOTH in the tree. upsc_sorted_topics.csv does not
          # exist, so the old combined call always failed and topics.txt, 9.3 MB
          # of it, was still being deployed on every run.
          #
          # --sparse is required now that the checkout is sparse; without it git
          # refuses to touch skip-worktree entries at all.
          git rm -r -q --cached --sparse --ignore-unmatch data/questions
          git rm -q --cached --sparse --ignore-unmatch upsc_sorted_topics.csv
          git rm -q --cached --sparse --ignore-unmatch topics.txt
          # Question-quality sweep state (cursor + tallies, tens of MB) now
          # lives at data/questions/_state/cursor.json — inside the directory
          # removed above, so there is nothing extra to strip here. It used to
          # sit at data/questions-cursor.json, where it crossed Cloudflare's
          # 25 MiB per-asset limit on 2026-10-18 (~49.5 MB) and froze every
          # deploy while the site kept serving its last good build. Never
          # deploy it.

          # Collapse the duplicated `role="button" tabindex="0"` runs the old
          # A11Y rule stacked on pages (see scripts/clean-dup-attrs.js). The
          # source is cleaned run-by-run by the agent; this keeps the deployed
          # bytes clean immediately for pages the agent has not revisited yet.
          node scripts/clean-dup-attrs.js .
          # Every course lesson gets a client-side "changed since your last
          # visit" watcher. Doing it here, not in the generator, covers the
          # hand-built lessons (Indian Polity) and direct page edits too: the
          # reader's own last-seen headings are the baseline, so a section
          # inserted anywhere in the body is still noticed.
          node scripts/inject-lesson-watch.js .
          # Depth addenda for hand-built lessons (Polity and the other pages
          # the generator must not rewrite). Kept in scripts/course-addons.json
          # and inserted inside .lesson-body on every deploy.
          node scripts/inject-course-addons.js .
          # "Updated 17 Nov 2026 · 1,24,550 words · 19 sections" on every lesson.
          # Nothing rendered this before, and the hand-built flagship lessons
          # had no record at all, which is why the freshness was invisible.
          node scripts/stamp-course-freshness.js .
          # Site name on every page and inside every figure SVG.
          node scripts/inject-watermark.js .
          # A model-written data question arrives as a pipe table; render it as a
          # real table instead of leaving the reader a wall of pipes.
          node scripts/fix-question-tables.js .
          # Verified fact-audit corrections, re-applied on the final tree: the
          # expanders regenerate lesson pages and can drop a fix written only
          # into a page (see data/fact-corrections.json).
          node scripts/apply-fact-corrections.js .
          node scripts/apply-question-fixes.js .
          git add -f data/course-questions.json 2>/dev/null || true
          git add -A -- '*.html' 2>/dev/null || true

          TREE=$(git write-tree)

          # Cloudflare Pages rejects ANY asset over 25 MiB (26214400 bytes) by
          # failing the build — and that failure is invisible from here: the
          # push succeeds, production just never moves. That is exactly how the
          # site froze on 2026-10-18. So instead of trusting the explicit
          # exclusions forever, strip every oversized blob from the tree and
          # say so loudly; the verify step then refuses a tree that still has
          # one. If a served file ever outgrows the limit (data/timeline.json
          # at ~24.7 MB is already close), the deploy still moves and this log
          # names exactly what was dropped.
          stripped=0
          while IFS=$'\t' read -r meta path; do
            size=${meta##* }
            case "$size" in ''|*[!0-9]*) continue;; esac
            if [ "$size" -gt 26214400 ]; then
              echo "STRIPPING oversized asset (>25 MiB, Cloudflare Pages limit): $path ($size bytes)"
              git rm -q --cached --sparse --ignore-unmatch -- "$path" || true
              stripped=1
            fi
          done < <(git ls-tree -r -l "$TREE")
          [ "$stripped" -eq 0 ] || TREE=$(git write-tree)
          ROOT=$(git commit-tree "$TREE" -m "slim live $(date -u +'%Y-%m-%d %H:%M UTC')")
          # Deliberately not pushed yet. The push is force, so a wrong tree
          # replaces a working site rather than merely failing, and nothing after
          # this point can put it back. It happens only once the tree is verified.
          echo "staged live tree -> $ROOT"
          echo "LIVE_TREE=$ROOT" >> "$GITHUB_ENV"

      # Nothing below this line can repair a bad tree, and the live branch is
      # force-pushed, so a missing file here replaces a working site with a broken
      # one. Everything the browser actually fetches is asserted before the push
      # rather than discovered by a user afterwards.
      - name: Verify slim tree before deploying
        run: |
          set -euo pipefail
          fail=0
          for p in index.html ask.html mains.html revision.html CNAME _redirects _headers \
                   robots.txt sitemap.xml sw.js figures/index.html js css upsc/index.html \
                   data/ask-qb/manifest.json data/ask-qb/dir.json data/ask-qb/entities.tsv \
                   data/ask-qb/concepts.json data/ask-qb/bucket/buckets.json; do
            git cat-file -e "$LIVE_TREE:$p" 2>/dev/null || { echo "MISSING required: $p"; fail=1; }
          done
          for p in data/questions topics.txt upsc_sorted_topics.csv; do
            git cat-file -e "$LIVE_TREE:$p" 2>/dev/null && { echo "UNEXPECTED present: $p"; fail=1; }
          done
          # Hard Cloudflare Pages limit: no asset may exceed 25 MiB. The
          # rebuild step strips oversized blobs; this asserts it worked.
          BIG=$(git ls-tree -r -l "$LIVE_TREE" | awk -F'\t' '{ n=split($1,a," "); if (a[n]+0 > 26214400) print $2 }')
          [ -z "$BIG" ] || { echo "oversized assets remain (CF Pages 25 MiB limit):"; echo "$BIG"; fail=1; }
          n=$(git ls-tree -r --name-only "$LIVE_TREE" | wc -l)
          echo "files in slim tree: $n"
          # 2092 as of the last good run. Catches a sparse pattern that silently
          # excluded far more than intended, which no per-file assertion would see.
          [ "$n" -ge 2000 ] || { echo "slim tree looks truncated: $n files"; fail=1; }
          [ "$fail" -eq 0 ] || { echo "REFUSING to deploy an unverified tree"; exit 1; }
          echo "slim tree verified"

      # Frequent polls must not each replace the live branch: every push to it
      # triggers a Cloudflare Pages build, and a no-op tick would burn those on
      # nothing. The slim tree is rebuilt from main's index each run, so an
      # identical tree SHA means live already serves this exact content.
      - name: Skip when live already matches main
        run: |
          set -euo pipefail
          if git fetch -q --depth=1 --filter=blob:none origin live 2>/dev/null; then
            LIVE_OLD=$(git rev-parse 'FETCH_HEAD^{tree}')
            if [ "$LIVE_OLD" = "$LIVE_TREE" ]; then
              echo "live already matches main (tree $LIVE_TREE) -- nothing to deploy"
              echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
            else
              echo "live tree differs: $LIVE_OLD -> $LIVE_TREE"
            fi
          else
            echo "no live branch yet -- first deploy"
          fi

      - name: Publish live branch
        if: env.SKIP_DEPLOY != '1'
        run: |
          set -euo pipefail
          git push --force origin "$LIVE_TREE:refs/heads/live"
          echo "live -> $LIVE_TREE"

      # Only needed by the direct-upload deploy below. When that is skipped
      # (no CF secrets in this repo) staging + the 2 GB corpus overlay are
      # pure waste: Cloudflare Pages deploys the `live` branch (git
      # integration), and live-dist never fed anything else. Same `if` as
      # the deploy step so the moment CF secrets exist this runs again.
      - name: Warn when Cloudflare direct upload is unavailable
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning title=Cloudflare direct upload skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured. This run only pushed the live branch; the Cloudflare Pages project has to build it."

      - name: Stage slim site for direct upload
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          mkdir -p live-dist
          git archive "$LIVE_TREE" | tar -x -C live-dist
          echo "size: $(du -sh live-dist | cut -f1)"
          echo "files: $(find live-dist -type f | wc -l)"

      # Overlay the retrieval corpus built by build-ask-qb.yml onto the deploy
      # tree. buckets.json (the manifest) is committed, but the 512 bucket files
      # and 512 phrase shards it points at are gitignored -- 2 GB of artefact
      # that cannot live in main's history -- so without this step production
      # serves a manifest naming files that 404, and every bucket and phrase
      # lookup falls back. The corpus rides its own force-replaced branch for
      # the same reason `live` does: one commit, never cloned with main.
      #
      # A missing branch must NOT fail the deploy. It means the corpus has not
      # been built yet, and shipping the site without it is the graceful
      # degradation Ask already handles -- the question is answered from the
      # 217k timeline nodes instead of the full corpus, never with an error.
      - name: Overlay retrieval corpus from the corpus branch
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          # bucket + phrase only, ON PURPOSE. The category shards (up to 60 MiB
          # parts) are too large for a Cloudflare Pages direct upload's per-file
          # ceiling; ask-browser.js reads them straight off the corpus branch via
          # the raw.githubusercontent fallback instead. Do not add them here.
          if git fetch --depth=1 origin corpus 2>/dev/null; then
            mkdir -p live-dist/data/ask-qb
            git archive FETCH_HEAD data/ask-qb/bucket data/ask-qb/phrase 2>/dev/null \
              | tar -x -C live-dist || echo "corpus branch lacks bucket/phrase trees"
          else
            echo "no corpus branch yet -- deploying site only (retrieval degrades gracefully)"
          fi
          echo "buckets: $(find live-dist/data/ask-qb/bucket -type f 2>/dev/null | wc -l)"
          echo "phrases: $(find live-dist/data/ask-qb/phrase -type f 2>/dev/null | wc -l)"
          echo "size: $(du -sh live-dist | cut -f1)"

      - name: Deploy slim site to Cloudflare Pages (direct upload)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@3 pages deploy live-dist \
            --project-name=studypro \
            --branch=live \
            --account-id="$CLOUDFLARE_ACCOUNT_ID"
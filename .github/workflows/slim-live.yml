name: Slim live mirror

# Deploys were push-triggered with cancel-in-progress, and that lost a race it
# could not win during busy periods: a run sat 10-22 minutes in the free-runner
# queue, and the next push -- mine or any agent workflow's -- cancelled the
# pending run and restarted the wait. Live then stayed hours stale even though
# the mirror itself needs only ~30 s once a runner appears (observed: 31 s runs
# when it did get one). Deploys landed only when a runner freed in the small
# gap between two pushes; seven consecutive deploy attempts were lost that way
# on 2026-10-18, and the WebLLM loader fix of e952bf087 never reached users.
#
# The mirror now polls on a fixed cadence instead:
#   - It always deploys main AS OF RUN TIME (the fetch below takes main's tip),
#     so a late run publishes the newest state, never a stale snapshot.
#   - The cadence (30 min) is wider than the observed 10-22 min queue wait, so
#     a pending run survives long enough to start instead of being replaced by
#     the next trigger.
#   - An unchanged tree is detected and skipped before the deploy step, so a
#     no-op tick costs one short job and produces NO Cloudflare Pages build
#     (the Pages project's build quota is finite and must not be burnt on
#     polling).
#   - Manual dispatch still forces an immediate attempt.
on:
  schedule:
    # Off the top of the hour on purpose: GitHub's scheduler is busiest at :00.
    - cron: '11,41 * * * *'
  workflow_dispatch:

concurrency:
  group: slim-live
  # A running mirror takes ~30 s and deploys the newest main, so cancelling it
  # saves nothing. (New triggers still supersede a PENDING run -- that is what
  # kept resetting the queue position -- but with no push trigger, only the
  # 30-minute tick and manual dispatches can do that now.)
  cancel-in-progress: false

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Replaces actions/checkout on purpose. The action cannot be told to skip a
      # single directory: its sparse-checkout input is applied with --cone, which
      # rejects `/*` and `!dir/` and wants bare directory names instead, so there
      # is no way to say "everything except data/questions" without hardcoding a
      # list of every top-level directory. Such a list goes stale silently the
      # day a new one is added, and the site loses that directory with no failure.
      #
      # Measured cost of doing it the old way: 21m51s, of which 21 minutes was
      # git downloading 8.8 GB of data/questions blobs, only for the next step to
      # delete them again. Fetching trees only and building the slim tree from
      # the index avoids the download entirely.
      - name: Fetch main without downloading blobs
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          AUTH=$(printf 'x-access-token:%s' '${{ secrets.GITHUB_TOKEN }}' | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          git fetch -q --depth=1 --filter=blob:none origin main
          # `/*` picks up any directory added later, so a new top-level path is
          # deployed without editing this workflow. data/questions is the only
          # exclusion: it is tracked in main, needed by other workflows, and never
          # served here.
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/*' '!/data/questions/'
          git checkout -q FETCH_HEAD
          echo "checked out $(git ls-files | wc -l) paths"

      - name: Rebuild slim live tree (orphan root)
        run: |
          set -euo pipefail
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"

          # One `git rm` per pathspec, each with --ignore-unmatch, because
          # `git rm a b` is atomic: one untracked pathspec fails the whole
          # command and leaves BOTH in the tree. upsc_sorted_topics.csv does not
          # exist, so the old combined call always failed and topics.txt, 9.3 MB
          # of it, was still being deployed on every run.
          #
          # --sparse is required now that the checkout is sparse; without it git
          # refuses to touch skip-worktree entries at all.
          git rm -r -q --cached --sparse --ignore-unmatch data/questions
          git rm -q --cached --sparse --ignore-unmatch upsc_sorted_topics.csv
          git rm -q --cached --sparse --ignore-unmatch topics.txt

          TREE=$(git write-tree)
          ROOT=$(git commit-tree "$TREE" -m "slim live $(date -u +'%Y-%m-%d %H:%M UTC')")
          # Deliberately not pushed yet. The push is force, so a wrong tree
          # replaces a working site rather than merely failing, and nothing after
          # this point can put it back. It happens only once the tree is verified.
          echo "staged live tree -> $ROOT"
          echo "LIVE_TREE=$ROOT" >> "$GITHUB_ENV"

      # Nothing below this line can repair a bad tree, and the live branch is
      # force-pushed, so a missing file here replaces a working site with a broken
      # one. Everything the browser actually fetches is asserted before the push
      # rather than discovered by a user afterwards.
      - name: Verify slim tree before deploying
        run: |
          set -euo pipefail
          fail=0
          for p in index.html ask.html mains.html revision.html CNAME _redirects _headers \
                   robots.txt sitemap.xml sw.js figures/index.html js css upsc/index.html \
                   data/ask-qb/manifest.json data/ask-qb/dir.json data/ask-qb/entities.tsv \
                   data/ask-qb/concepts.json data/ask-qb/bucket/buckets.json; do
            git cat-file -e "$LIVE_TREE:$p" 2>/dev/null || { echo "MISSING required: $p"; fail=1; }
          done
          for p in data/questions topics.txt upsc_sorted_topics.csv; do
            git cat-file -e "$LIVE_TREE:$p" 2>/dev/null && { echo "UNEXPECTED present: $p"; fail=1; }
          done
          n=$(git ls-tree -r --name-only "$LIVE_TREE" | wc -l)
          echo "files in slim tree: $n"
          # 2092 as of the last good run. Catches a sparse pattern that silently
          # excluded far more than intended, which no per-file assertion would see.
          [ "$n" -ge 2000 ] || { echo "slim tree looks truncated: $n files"; fail=1; }
          [ "$fail" -eq 0 ] || { echo "REFUSING to deploy an unverified tree"; exit 1; }
          echo "slim tree verified"

      # Frequent polls must not each replace the live branch: every push to it
      # triggers a Cloudflare Pages build, and a no-op tick would burn those on
      # nothing. The slim tree is rebuilt from main's index each run, so an
      # identical tree SHA means live already serves this exact content.
      - name: Skip when live already matches main
        run: |
          set -euo pipefail
          if git fetch -q --depth=1 --filter=blob:none origin live 2>/dev/null; then
            LIVE_OLD=$(git rev-parse 'FETCH_HEAD^{tree}')
            if [ "$LIVE_OLD" = "$LIVE_TREE" ]; then
              echo "live already matches main (tree $LIVE_TREE) -- nothing to deploy"
              echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
            else
              echo "live tree differs: $LIVE_OLD -> $LIVE_TREE"
            fi
          else
            echo "no live branch yet -- first deploy"
          fi

      - name: Publish live branch
        if: env.SKIP_DEPLOY != '1'
        run: |
          set -euo pipefail
          git push --force origin "$LIVE_TREE:refs/heads/live"
          echo "live -> $LIVE_TREE"

      # Only needed by the direct-upload deploy below. When that is skipped
      # (no CF secrets in this repo) staging + the 2 GB corpus overlay are
      # pure waste: Cloudflare Pages deploys the `live` branch (git
      # integration), and live-dist never fed anything else. Same `if` as
      # the deploy step so the moment CF secrets exist this runs again.
      - name: Stage slim site for direct upload
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          mkdir -p live-dist
          git archive "$LIVE_TREE" | tar -x -C live-dist
          echo "size: $(du -sh live-dist | cut -f1)"
          echo "files: $(find live-dist -type f | wc -l)"

      # Overlay the retrieval corpus built by build-ask-qb.yml onto the deploy
      # tree. buckets.json (the manifest) is committed, but the 512 bucket files
      # and 512 phrase shards it points at are gitignored -- 2 GB of artefact
      # that cannot live in main's history -- so without this step production
      # serves a manifest naming files that 404, and every bucket and phrase
      # lookup falls back. The corpus rides its own force-replaced branch for
      # the same reason `live` does: one commit, never cloned with main.
      #
      # A missing branch must NOT fail the deploy. It means the corpus has not
      # been built yet, and shipping the site without it is the graceful
      # degradation Ask already handles -- the question is answered from the
      # 217k timeline nodes instead of the full corpus, never with an error.
      - name: Overlay retrieval corpus from the corpus branch
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set -euo pipefail
          # bucket + phrase only, ON PURPOSE. The category shards (up to 60 MiB
          # parts) are too large for a Cloudflare Pages direct upload's per-file
          # ceiling; ask-browser.js reads them straight off the corpus branch via
          # the raw.githubusercontent fallback instead. Do not add them here.
          if git fetch --depth=1 origin corpus 2>/dev/null; then
            mkdir -p live-dist/data/ask-qb
            git archive FETCH_HEAD data/ask-qb/bucket data/ask-qb/phrase 2>/dev/null \
              | tar -x -C live-dist || echo "corpus branch lacks bucket/phrase trees"
          else
            echo "no corpus branch yet -- deploying site only (retrieval degrades gracefully)"
          fi
          echo "buckets: $(find live-dist/data/ask-qb/bucket -type f 2>/dev/null | wc -l)"
          echo "phrases: $(find live-dist/data/ask-qb/phrase -type f 2>/dev/null | wc -l)"
          echo "size: $(du -sh live-dist | cut -f1)"

      - name: Deploy slim site to Cloudflare Pages (direct upload)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@3 pages deploy live-dist \
            --project-name=studypro \
            --branch=main \
            --account-id="$CLOUDFLARE_ACCOUNT_ID"
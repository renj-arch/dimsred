name: Site Agent

# Infrastructure is an EXACT clone of llm-autofix.yml — the only workflow
# proven to run qwen3.8:27b successfully on this runner (run #10, #12).
# Do NOT add flash-attn, q8 KV, browser tests, warmups, or self-restarts:
# every one of those "improvements" caused "fetch failed" on generation
# (runs #44–#54: warmup loads, then every real call dies).
#
# Fully free: Ollama on the runner CPU, zero API keys.

on:
  # NO hourly cron: GitHub throttles schedules here to a 3-5h effective
  # cadence, and cancel-in-progress made each late scheduled run KILL an
  # in-progress chained run mid-publish. The Agent Chain workflow now
  # dispatches the next run the moment one completes (back-to-back cycles),
  # with a 6h seed cron as dead-man switch. Manual runs still allowed here.
  workflow_dispatch:
    inputs:
      agent_only:
        description: 'Run only these agents (comma list, e.g. practicesets). Empty = normal rotation.'
        required: false
        default: ''

concurrency:
  group: site-agent
  # false: the chained back-to-back runs above publish at the END (ci-push).
  # A late-arriving trigger must WAIT — pending supersedes pending — not
  # kill the in-progress run mid-publish (the same lesson chain.yml learned).
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    # Monitor-era runs: pull (20 min) + streamed LLM calls that legitimately
    # take minutes each. 120 min cut publish off mid-run; 240 leaves room.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # data/questions (~9GB) is EXCLUDED — it caused 33-min checkouts
          # that died with "early EOF" and OOM'd generation. Question work
          # runs in question-quality.yml which checks out questions only.
          sparse-checkout: |
            scripts
            .github/workflows
            data/faults.json
            data/browser-test.json
            data/agent-log.json
            data/figure-gaps.json
            data/topic-gaps.json
            data/autofix-log.json
            data/ideas.json
            data/pyq-patterns.json
            data/site-audit.json
            data/practice-sets
            data/topic-layers.json
            figures
          sparse-checkout-cone-mode: false
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # EXACT same swap as llm-autofix (16GB works with 27B there).
      # 24GB filled more disk and made paging worse, not better.
      - name: Create swap (16GB — same as proven llm-autofix)
        run: |
          sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /tmp/swapfile
          sudo mkswap /tmp/swapfile
          sudo swapon /tmp/swapfile
          free -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      # EXACT same start as llm-autofix: no env vars, no flash-attn, no q8.
      # KEEP_ALIVE=60m: without it Ollama unloads the 17GB model after 5 min
      # idle, and the NEXT agent pays a full reload (minutes). Public-repo
      # runners are 4 vCPU / 16GB RAM so the model nearly fits in RAM.
      - name: Start Ollama server
        run: |
          export OLLAMA_KEEP_ALIVE=60m
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null && echo " OK" || echo " FAILED"
          free -h

      # llm-autofix has NO proof call here — its script's first callLLM IS
      # the proof. The ollama-run proof we added in #56 succeeded via CLI
      # (IPv4) but the agent's Node fetch failed in the next step. The CLI
      # proof may also OOM the server on exit after loading 17GB. Do what
      # llm-autofix does: just pull, warn if down, and let the script's
      # cold-start ping (via Node fetch) be the real proof.
      - name: Pull qwen3.8:27b
        run: |
          ollama pull qwen3.8:27b
          echo "MODEL=qwen3.8:27b" >> $GITHUB_ENV
          echo "Using Qwen3.8-27B (score 90.3 — BEST free model)"
          ollama list
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null && echo "Server still up" || echo "WARNING: server down after pull"
          # Warm the model into RAM now so the agent's cold-start ping finds
          # it resident instead of paying the 17GB cold load itself.
          echo "Warming 27B into RAM..."
          ollama run qwen3.8:27b "Reply with exactly: OK" 2>&1 | tail -3
          echo "Warmup done"

      # Safety net: re-verify the server accepts a connection on IPv4 right
      # before the agent runs. Restart if the pull left it dead. This uses
      # curl (IPv4) — same path the agent will use after the 127.0.0.1 fix.
      - name: Ensure Ollama is up before agent
        run: |
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
            echo "Server down before agent — restarting"
            nohup ollama serve > /tmp/ollama.log 2>&1 &
            echo $! > /tmp/ollama.pid
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
              sleep 1
            done
          fi
          curl -sf http://127.0.0.1:11434/api/tags > /dev/null && echo "Server ready for agent" || echo "WARNING: server still down"

      # No browser test before the model. Playwright + serve fragment memory
      # and disk right before the 18GB model load; llm-autofix has none and
      # generation works. Browser tests can run in their own workflow.
      - name: Run site agent (single pass — same shape as llm-autofix)
        env:
          OLLAMA_MODEL: qwen3.8:27b
          # Manual dispatches can pin the agent set (e.g. a practice-set run
          # for one exam). Empty on normal runs -> full rotation.
          AGENT_ONLY: ${{ github.event.inputs.agent_only }}
          # 127.0.0.1 NOT localhost: Node fetch on this runner resolves
          # localhost to ::1 (IPv6) and Ollama listens IPv4-only → instant
          # "fetch failed" while curl/ollama-CLI (IPv4) work. Run #56:
          # CLI proof succeeded, Node fetch failed in <1s.
          OLLAMA_HOST: http://127.0.0.1:11434
          # Run the next 4 agents per run. All 14 take too long for one job;
          # rotation + an hourly schedule gives every capability a turn.
          # AGENT_LIMIT=3 still overrides (fixed slice) if ever set.
          AGENT_ROTATE: '4'
          # Single pass, not --loop.
          AGENT_MAX_CYCLES: '1'
          # Wall-clock guard: stop starting LLM work 120 min in so the job's
          # publish step always runs (job cap 240; the pull can eat 80).
          # Skipped agents rotate in on the next run.
          AGENT_DEADLINE_MIN: '120'
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: node scripts/site-agent.js

      - name: Publish agent work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git reset HEAD -- . 2>/dev/null || true
          git add data/agent-log.json data/autofix-log.json data/ideas.json data/browser-test.json data/practice-sets/ data/topic-layers.json 2>/dev/null || true
          git add figures/ 2>/dev/null || true
          git add -- *.html prototype-*.html 2>/dev/null || true
          git status --porcelain | awk '/^\?\? .*\.html$/ {print $2}' | xargs -r git add 2>/dev/null || true
          # Single shared publisher: PAT push, GITHUB_TOKEN fallback on PAT
          # death (no lost work), loud alert. See scripts/ci-push.sh.
          bash scripts/ci-push.sh "site-agent: ${{ env.MODEL }} maintained the site (run #${{ github.run_number }})"

name: Site Agent

# Infrastructure is an EXACT clone of llm-autofix.yml — the only workflow
# proven to run qwen3.8:27b successfully on this runner (run #10, #12).
# Do NOT add flash-attn, q8 KV, browser tests, warmups, or self-restarts:
# every one of those "improvements" caused "fetch failed" on generation
# (runs #44–#54: warmup loads, then every real call dies).
#
# Fully free: Ollama on the runner CPU, zero API keys.

on:
  schedule:
    - cron: '55 */2 * * *'
  # NO push trigger: the agent commits changes which used to re-trigger
  # this workflow, queueing doomed runs behind each other all day.
  workflow_dispatch:

concurrency:
  group: site-agent
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # data/questions (~9GB) is EXCLUDED — it caused 33-min checkouts
          # that died with "early EOF" and OOM'd generation. Question work
          # runs in question-quality.yml which checks out questions only.
          sparse-checkout: |
            scripts
            .github/workflows
            data/faults.json
            data/browser-test.json
            data/agent-log.json
            data/figure-gaps.json
            data/topic-gaps.json
            data/autofix-log.json
            data/ideas.json
            data/pyq-patterns.json
            data/site-audit.json
            figures
          sparse-checkout-cone: false
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # EXACT same swap as llm-autofix (16GB works with 27B there).
      # 24GB filled more disk and made paging worse, not better.
      - name: Create swap (16GB — same as proven llm-autofix)
        run: |
          sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /tmp/swapfile
          sudo mkswap /tmp/swapfile
          sudo swapon /tmp/swapfile
          free -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      # EXACT same start as llm-autofix: no env vars, no flash-attn, no q8.
      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags > /dev/null && echo " OK" || echo " FAILED"

      - name: Pull qwen3.8:27b
        run: |
          ollama pull qwen3.8:27b
          echo "MODEL=qwen3.8:27b" >> $GITHUB_ENV
          echo "Using Qwen3.8-27B (score 90.3 — BEST free model)"
          ollama list
          # Pull can leave the server down. Restart if needed and PROVE
          # generation works before the agent starts — same as llm-autofix
          # which succeeds because it generates immediately on a live server.
          if ! curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "Server down after pull — restarting"
            nohup ollama serve > /tmp/ollama.log 2>&1 &
            for i in $(seq 1 30); do
              curl -sf http://localhost:11434/api/tags > /dev/null 2>&1 && break
              sleep 1
            done
          fi
          echo "Proving generation works (cold start, same as llm-autofix first call)..."
          ollama run qwen3.8:27b "Reply with exactly: OK" --verbose 2>&1 | tail -20
          echo "Generation proof done"

      # No browser test before the model. Playwright + serve fragment memory
      # and disk right before the 18GB model load; llm-autofix has none and
      # generation works. Browser tests can run in their own workflow.
      - name: Run site agent (single pass — same shape as llm-autofix)
        env:
          OLLAMA_MODEL: qwen3.8:27b
          # Single pass, not --loop: llm-autofix runs once and succeeds.
          # The 6-cycle loop burned memory and LLM retry budget on cycle 1.
          AGENT_MAX_CYCLES: '1'
          NODE_OPTIONS: '--max-old-space-size=2048'
        run: node scripts/site-agent.js

      - name: Publish agent work
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git reset HEAD -- . 2>/dev/null || true
          git add data/agent-log.json data/autofix-log.json data/ideas.json data/browser-test.json 2>/dev/null || true
          git add figures/ 2>/dev/null || true
          git add -- *.html prototype-*.html 2>/dev/null || true
          git status --porcelain | awk '/^\?\? .*\.html$/ {print $2}' | xargs -r git add 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No agent work to publish"
          else
            git commit -m "site-agent: ${{ env.MODEL }} maintained the site (run #${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase 2>/dev/null && git push 2>/dev/null && { echo "Pushed"; break; } || echo "push attempt $i failed..."
              sleep 5
            done || echo "::warning::push failed"
          fi

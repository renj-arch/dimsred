name: Site Agent

# The complete autonomous maintainer. Runs every 6 hours, handles:
#   SEO — meta tags, descriptions, viewport, lang attributes
#   A11Y — alt text, ARIA labels, skip links, keyboard nav
#   Code — dead links, deprecated HTML, missing closing tags
#   Content — generates MCQ questions for thin categories
#   Features — creates new study pages from templates
#
# Self-upgrading: picks the best model that fits in RAM.
# Fully free: Ollama runs locally on the runner, zero API keys.

on:
  schedule:
    - cron: '55 */2 * * *'
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'js/**'
      - 'scripts/**'
      - 'data/**'
  workflow_dispatch:

concurrency:
  group: site-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            .github/workflows
            data/faults.json
            data/browser-test.json
            data/agent-log.json
            data/figure-gaps.json
            data/topic-gaps.json
            data/autofix-log.json
            data/ideas.json
            data/pyq-patterns.json
            data/site-audit.json
            data/questions
            figures
          sparse-checkout-cone: false
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser Test (Playwright)
        run: |
          npm install playwright --no-save 2>/dev/null || true
          npx playwright install chromium --with-deps 2>/dev/null || npx playwright install chromium 2>/dev/null || true
          npx playwright install-deps chromium 2>/dev/null || true
          # Start local server
          npx -y serve -l 8080 -s . > /tmp/serve.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 15); do curl -sf http://localhost:8080/index.html > /dev/null 2>&1 && break; sleep 1; done
          # Run browser tests
          SITE_URL=http://localhost:8080 node scripts/browser-test.js 2>&1 || echo "browser-test failed but continuing"
          kill $SERVER_PID 2>/dev/null || true
          echo "Browser test complete"

      - name: Create swap (16GB)
        run: |
          sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /tmp/swapfile
          sudo mkswap /tmp/swapfile
          sudo swapon /tmp/swapfile
          free -h

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags > /dev/null && echo " OK" || echo " FAILED"

      # Try models from best to smallest. Use 16GB swap for large models.
      - name: Pull best model
        run: |
          # Try Nemotron 9B (best practical model, 71.1% LiveCodeBench)
          if ollama pull nvidia/nemotron-nano-9b-v2; then
            echo "MODEL=nvidia/nemotron-nano-9b-v2" >> $GITHUB_ENV
            echo "Using Nemotron Nano 9B v2 (score 71.1)"
          # Try Qwen 9B (score 65)
          elif ollama pull qwen3.5:9b; then
            echo "MODEL=qwen3.5:9b" >> $GITHUB_ENV
            echo "Using Qwen3.5-9B (score 65)"
          # Try Qwen 4B (score 55)
          elif ollama pull qwen3.5:4b; then
            echo "MODEL=qwen3.5:4b" >> $GITHUB_ENV
            echo "Using Qwen3.5-4B (score 55)"
          # Fallback smallest
          else
            ollama pull qwen3.5:2b
            echo "MODEL=qwen3.5:2b" >> $GITHUB_ENV
            echo "Using Qwen3.5-2B (score 45, fallback)"
          fi
          ollama list

      - name: Run site agent (continuous)
        env:
          OLLAMA_MODEL: ${{ env.MODEL }}
          AGENT_MAX_CYCLES: '6'
          AGENT_CYCLE_WAIT: '300'
        run: node scripts/site-agent.js --loop

      - name: Publish agent work
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git reset HEAD -- . 2>/dev/null || true
          git add data/agent-log.json data/autofix-log.json data/ideas.json data/browser-test.json 2>/dev/null || true
          git add figures/ data/questions/ 2>/dev/null || true
          git add -- *.html prototype-*.html 2>/dev/null || true
          # New pages created by the agent (not in sparse-checkout list)
          git status --porcelain | awk '/^\?\? .*\.html$/ {print $2}' | xargs -r git add 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No agent work to publish"
          else
            git commit -m "site-agent: ${{ env.MODEL }} maintained the site (run #${{ github.run_number }})"
            for i in 1 2 3; do
              git pull --rebase 2>/dev/null && git push 2>/dev/null && { echo "Pushed"; break; } || echo "push attempt $i failed..."
              sleep 5
            done || echo "::warning::push failed"
          fi

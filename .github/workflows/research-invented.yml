name: Research Invented Methods

# Fills data/research-invented.json: one original, verified alternative route
# (the "Research Team" method) for every invented and course-lesson question the
# site serves. research-team.yml runs this too, but only every 6 hours; this lane
# runs every 2 hours so the coverage catches up with the pool.

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Methods to write this run'
        required: false
        default: '20'

permissions:
  contents: write

concurrency:
  group: research-invented
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write methods
        env:
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS: '1'
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_INVENT_COUNT: ${{ github.event.inputs.count || '20' }}
          RESEARCH_INVENT_DEADLINE_MIN: '30'
        run: node scripts/research-invented.js

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -f data/research-invented.json
          bash scripts/ci-push.sh "research: fastest-route methods for invented and course questions"
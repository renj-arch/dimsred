name: Daily Exam Notification Fetcher

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch exam notifications from RSS
        id: notify
        run: node scripts/fetch-rss-notifications.js

      - name: Commit and push
        run: |
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          git diff --staged --quiet || git commit -m "Update exam notifications $(date +'%Y-%m-%d')"
          git push

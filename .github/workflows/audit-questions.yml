name: Audit Questions

# The prose fact-audit never read practice questions, so a wrong option like
# "the 44th Amendment limited an ordinance to six weeks" survived. This lane
# checks the served question bank itself: model proposes, an independent
# verifier confirms, and the safe fixes are applied to the deploy tree by
# scripts/apply-question-fixes.js.

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Questions to audit this run'
        required: false
        default: '20'

permissions:
  contents: write

concurrency:
  group: audit-questions
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fact-check the question bank
        env:
          NVAPI: '1'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_MODELS: '1'
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          Q_AUDIT_LIMIT: ${{ github.event.inputs.limit || '20' }}
        run: node scripts/audit-questions.js

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -f data/question-fixes.json data/question-audit-state.json
          bash scripts/ci-push.sh "questions: verified fixes from the question audit"
name: Full-Length Paper (model lane)

# Builds one real full-length paper per run, in the exam's own pattern, inside
# the mock-test section. Questions are written by the quality Ollama lane
# (qwen 9B default, 27B optional) on the runner. If any section is short the
# lane refuses to publish a padded paper; the generated questions are still
# committed so the next run can finish the job.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      exam:
        description: 'Exam key (cgl, rbi, jee, neet, gate, agniveer, upsc, ibps-po, sbi-clerk, ssc-gd, ctet, nda, cds, clat, apfc)'
        required: true
        default: 'cgl'
      paper:
        description: 'Paper id (blank = first paper in the blueprint)'
        required: false
        default: ''
      model:
        description: 'Ollama model tag'
        required: false
        default: 'qwen3.5:9b'
      budget:
        description: 'Maximum questions the model may add in this run'
        required: false
        default: '60'

concurrency:
  # Serialize paper builds: every run rebuilds shared PDF/HTML artifacts, so
  # two runs pushing at once conflict on binaries. Each run is now ~10 min.
  group: full-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    # Checkout + model warm-up + fill + build. The 9 GB data/questions corpus
    # is excluded below; the paper lane never reads it.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/data/questions
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - name: Create swap (16GB)
        run: bash scripts/ci-make-swap.sh

      - name: Install Ollama
        run: |
          curl -fsSL --max-time 120 -o /tmp/ollama-install.sh https://ollama.com/install.sh
          sudo sh /tmp/ollama-install.sh
          ollama --version
          mkdir -p ~/.ollama/models
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          printf '[Service]\nUser=runner\nGroup=runner\nEnvironment=HOME=/home/runner\nEnvironment=OLLAMA_MODELS=/home/runner/.ollama/models\nEnvironment=OLLAMA_KEEP_ALIVE=60m\n' | sudo tee /etc/systemd/system/ollama.service.d/runner-home.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart ollama

      - name: Cache Ollama models
        if: ${{ !contains(inputs.model || 'qwen3.5:9b', '27b') && !contains(inputs.model || 'qwen3.5:9b', '22b') }}
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ runner.os }}-${{ contains(inputs.model || 'qwen3.5:9b', '9b') && 'mid-v1' || 'fast-v2' }}
          restore-keys: |
            ollama-${{ runner.os }}-${{ contains(inputs.model || 'qwen3.5:9b', '9b') && 'mid-' || 'fast-' }}

      - name: Start Ollama server
        run: |
          sudo sysctl -w vm.swappiness=10 || true
          export OLLAMA_KEEP_ALIVE=60m
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && { echo "Ollama ready after ${i}s"; break; }
            sleep 1
          done

      - name: Pull + warm the model
        env:
          MODEL_INPUT: ${{ inputs.model || 'qwen3.5:9b' }}
        run: |
          case "$MODEL_INPUT" in *[!A-Za-z0-9._:/-]*) echo "bad model tag: $MODEL_INPUT"; exit 1;; esac
          ollama pull "$MODEL_INPUT"
          ollama list
          ollama run "$MODEL_INPUT" "Reply with exactly: OK" 2>&1 | tail -3

      - name: Choose today's exam (scheduled runs)
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "exam=${{ inputs.exam }}" >> $GITHUB_OUTPUT
            echo "paper=${{ inputs.paper }}" >> $GITHUB_OUTPUT
          else
            # Rotate over every real MCQ paper, not just the first paper of each
            # exam: UPSC (GS1 + CSAT), NDA (Maths + GAT) and CDS (English +
            # GK + Maths) each have more than one paper. Tier-II, CTET Paper II
            # and JEE Paper 2B are the Paper 2 additions; descriptive/mixed
            # papers (UPSC Mains, RBI Phase II, JEE Paper 2A) stay out.
            PAPERS=(cgl:tier1 cgl:tier2 rbi:phase1 ibps-po:prelims sbi-clerk:prelims ssc-gd:cbt ctet:paper1 ctet:paper2 jee:paper1 jee:paper2b neet:paper1 gate:paper1 agniveer:cee upsc:gs1 upsc:csat nda:maths nda:gat cds:english cds:gk cds:maths clat:paper1 apfc:rt)
            IDX=$(( 10#$(date +%j) % ${#PAPERS[@]} ))
            PAIR=${PAPERS[$IDX]}
            echo "exam=${PAIR%%:*}" >> $GITHUB_OUTPUT
            echo "paper=${PAIR##*:}" >> $GITHUB_OUTPUT
          fi

      # Exit 3 means "short, refused to publish". The job must end red so a
      # short paper is visible; the bank fill and status file are still
      # committed by the always() step below.
      - name: Assemble full paper
        id: lane
        env:
          OLLAMA_MODEL: ${{ inputs.model || 'qwen3.5:9b' }}
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          ARGS="--fill --budget=${{ inputs.budget || '60' }} --date=$(date +%Y-%m-%d)"
          if [ -n "${{ steps.target.outputs.paper }}" ]; then ARGS="$ARGS --paper=${{ steps.target.outputs.paper }}"; fi
          node scripts/full-paper-lane.js "${{ steps.target.outputs.exam }}" $ARGS

      - name: Resolve published paper slug
        id: slug
        if: steps.lane.outcome == 'success'
        run: |
          SLUG=$(node -e "
            const s = require('./data/full-paper-status.json');
            const exam = process.argv[1];
            const date = process.argv[2];
            const p = (s.papers || []).find(function (x) {
              return x.exam === exam && x.date === date && x.status === 'published';
            });
            process.stdout.write(p && p.slug ? p.slug : '');
          " "${{ steps.target.outputs.exam }}" "$(date +%Y-%m-%d)")
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "resolved slug: $SLUG"

      - name: Clean question banks (repair corruption, drop junk)
        if: steps.lane.outcome == 'success'
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/bank-cleanup.js --fix --strict=cgl

      - name: Build mock-test pages and PDF
        if: steps.lane.outcome == 'success'
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          NODE_OPTIONS=--max-old-space-size=4096 node scripts/build-full-papers.js ${SLUG:+--slug="$SLUG"}
          NODE_OPTIONS=--max-old-space-size=4096 node scripts/build-paper-pdf.js ${SLUG:+--slug="$SLUG"}

      - name: Update sitemap
        if: steps.lane.outcome == 'success'
        run: NODE_OPTIONS=--max-old-space-size=4096 node scripts/generate-sitemap.js || true

      - name: Commit generated papers
        if: always()
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          git add -f question-bank/*.json
          git diff --staged --quiet || git commit -m "full-paper: ${{ steps.target.outputs.exam }} ${{ steps.target.outputs.paper }} $(date +'%Y-%m-%d')"
          pushed=""
          for i in 1 2 3; do
            git fetch origin main 2>/dev/null || true
            git merge --no-edit -X ours FETCH_HEAD 2>/dev/null || {
              node scripts/merge-full-paper-status.js
              git add data/full-paper-status.json
              git commit --no-edit 2>/dev/null || true
            }
            if git push; then pushed=1; echo "Pushed"; break; fi
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::error::generated paper could not be pushed to main"
            exit 1
          fi

      - name: Report
        if: always()
        run: |
          echo "exam=${{ steps.target.outputs.exam }} lane=${{ steps.lane.outcome }}"
          cat data/full-paper-status.json 2>/dev/null | head -60 || true

name: Globe Fill

on:
  schedule:
    - cron: '0 0 * * *'  # Daily kickstart fallback
  workflow_dispatch:

concurrency:
  group: globe-fill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull latest before modifying files
        run: |
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git pull --rebase

      - name: Read progress state
        run: |
          if [ -f data/globe-fill-progress.json ]; then
            GROUP=$(jq -r '.group' data/globe-fill-progress.json)
          else
            GROUP=0
          fi
          echo "GLOBE_FILL_GROUP=$GROUP" >> "$GITHUB_ENV"

      - name: Fetch Wikipedia categories
        run: node scripts/wikipedia-fetch.js

      - name: Fetch Wikidata SPARQL
        run: node scripts/wikidata-multi-fetch.js

      - name: Generate static data
        run: node scripts/create-static-data.js

      - name: Rebuild river pts lookup
        run: node scripts/extract-river-lookup.js

      - name: Enrich river entries with flow paths
        run: node scripts/enrich-river-pts.js

      - name: Fill categories — Part 11
        run: node scripts/fill-globe-part11.js

      - name: Fetch contemporaries
        run: node scripts/fetch-contemporaries.js

      - name: Insert contemporaries
        run: node scripts/insert-contemporaries.js

      - name: Escape apostrophes in data strings
        run: node scripts/fix-apostrophes.js

      - name: Deduplicate globe entries
        run: node scripts/dedup-globe.js

      - name: Validate syntax
        run: |
          node -e "
            const fs = require('fs');
            let h = fs.readFileSync('3d-globe.html', 'utf8');
            const ms = h.indexOf('<script type=\"module\">');
            const me = h.indexOf('</script>', ms);
            const js = h.substring(ms + 23, me);
            fs.writeFileSync('/tmp/globe-check.mjs', js);
          "
          node --check /tmp/globe-check.mjs

      - name: Commit final updates and advance progress
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          rm -rf .git/rebase-merge .git/rebase-apply 2>/dev/null
          rm -f .git/CHERRY_PICK_HEAD .git/MERGE_HEAD .git/MERGE_MSG .git/MERGE_MODE .git/REVERT_HEAD 2>/dev/null
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git checkout -B main 2>/dev/null || true
          git reset HEAD -- . 2>/dev/null
          git add -A
          NEXT=$(( (GLOBE_FILL_GROUP + 1) % 10 ))
          echo "{\"group\": $NEXT}" > data/globe-fill-progress.json
          git add data/globe-fill-progress.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Globe fill $(date +'%Y-%m-%d %H:%M UTC') — next group $NEXT"
            for i in 1 2 3; do
              git pull --rebase || { echo "Rebase conflict, aborting and merging instead."; git rebase --abort; git pull --no-rebase -X theirs; }
              git push && { echo "Push succeeded"; break; } || echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Trigger next run
        if: success()
        run: gh workflow run "Globe Fill" --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Daily Globe Fill

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Wikipedia categories
        run: node scripts/wikipedia-fetch.js

      - name: Fetch Wikidata SPARQL
        run: node scripts/wikidata-multi-fetch.js

      - name: Generate static data
        run: node scripts/create-static-data.js

      - name: Fill categories — Part 11
        run: node scripts/fill-globe-part11.js

      - name: Fetch contemporaries
        run: node scripts/fetch-contemporaries.js

      - name: Insert contemporaries
        run: node scripts/insert-contemporaries.js

      - name: Escape apostrophes in data strings
        run: node scripts/fix-apostrophes.js

      - name: Validate syntax
        run: |
          node -e "
            const fs = require('fs');
            let h = fs.readFileSync('3d-globe.html', 'utf8');
            const ms = h.indexOf('<script type=\"module\">');
            const me = h.indexOf('</script>', ms);
            const js = h.substring(ms + 23, me);
            fs.writeFileSync('/tmp/globe-check.mjs', js);
          "
          node --check /tmp/globe-check.mjs

      - name: Commit and push
        run: |
          git stash --include-untracked
          git pull --rebase
          git stash pop || true
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Daily globe fill $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new entries to commit"
          fi

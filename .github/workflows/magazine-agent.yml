name: Magazine Agent

# Offset by seven minutes from the news wire so the two agents do not race for
# the same push. Rebuilds after content workflows and by hand as well.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows:
      - Daily PIB Feed
      - Revision Content Rebuild
      - Search index
      - Daily Paper Generation
      - Paper Solve (agent answers official PYQ)
      - Author
      - Site Agent
      - Agent Chain
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magazine-issue
  # A workflow_run burst used to cancel runs that were already fetching or
  # pushing. Queue them instead; each run is short and the newest still wins
  # because it writes the latest issue.
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Assemble and validate the issue
        run: node scripts/fetch-magazine.js

      - name: Re-check the issue contract
        run: node scripts/check-feed-data.js magazine

      - name: Commit when the issue changed
        run: |
          git config user.name "vlymbooq-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add data/magazine.json
          if git diff --staged --quiet; then
            echo "No change in the issue"
            exit 0
          fi
          git commit -m "magazine: set issue $(date -u +'%Y-%m-%dT%H:%MZ')"
          pushed=""
          for i in 1 2 3; do
            if git pull --rebase --autostash 2>/dev/null; then
              : # clean rebase
            else
              # Conflict: merge instead, keeping our changes (-X ours)
              git rebase --abort 2>/dev/null || true
              git fetch origin main 2>/dev/null || true
              git merge --no-edit -X ours FETCH_HEAD 2>/dev/null || true
              git add -A 2>/dev/null || true
              git commit --no-edit 2>/dev/null || true
            fi
            if git push; then pushed=1; echo "Pushed magazine update"; break; fi
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          if [ -z "$pushed" ]; then
            echo "::error::magazine issue could not be pushed to main"
            exit 1
          fi

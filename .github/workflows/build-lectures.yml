name: Build Lectures

# Recompiles data/lectures.json from the topic graph (topic-layers +
# revision-content + person-bios). The build is deterministic, so a week with
# no upstream change produces no diff and ci-push exits 0. lecture.html reads
# the file directly — a merged commit is all it takes to update the library.

on:
  schedule:
    - cron: '47 6 * * 2'   # weekly, Tuesday
  workflow_dispatch:

concurrency:
  group: build-lectures
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Replaces actions/checkout on purpose. A full checkout downloads the
      # 8.8 GB data/questions blobs this job never touches; on a 15-minute
      # timeout that ate the whole budget (first dispatch: compile OK,
      # publish killed mid-step). Same lean fetch as slim-live.yml, except the
      # remote carries the PAT because ci-push's push must trigger downstream
      # workflows (slim-live, deploy).
      - name: Fetch main without downloading question blobs
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${{ secrets.PAT }}@github.com/$GITHUB_REPOSITORY.git"
          git fetch -q --depth=50 --filter=blob:none origin main
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/*' '!/data/questions/'
          git update-ref refs/remotes/origin/main FETCH_HEAD
          git checkout -q -B main FETCH_HEAD
          git branch -q --set-upstream-to=origin/main
          echo "checked out $(git ls-files | wc -l) paths"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile lectures
        run: node scripts/build-lectures.js

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .git/config.lock .git/index.lock .git/HEAD.lock
          git config user.name "dimsred-bot"
          git config user.email "bot@vlymbooq.qzz.io"
          git add data/lectures.json
          bash scripts/ci-push.sh "lectures: rebuild spoken lecture library (run #${{ github.run_number }})"

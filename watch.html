<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Watch — vlymbooq</title>
<meta name="description" content="Short, sourced cinematic histories from vlymbooq. Each film is a sourced argument with an open debate map." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#070707; --panel:#0f0d0a; --panel2:#16110c; --bone:#f2e6d0;
  --muted:rgba(242,230,208,.62); --faint:rgba(242,230,208,.38);
  --gold:#d6a14a; --rust:#b14a2f; --card:#0f0d0a; --line:rgba(242,230,208,.14);
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--bone); font-family:'DM Sans',system-ui,sans-serif; line-height:1.5; }
a { color:var(--gold); text-decoration:none; }
a:hover { color:var(--bone); }
.skip-link { position:absolute; top:-100%; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--bg); padding:.5rem 1rem; border-radius:4px; z-index:100; }
.skip-link:focus { top:1rem; }
header { position:sticky; top:0; z-index:50; background:rgba(7,7,7,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
.header-inner { max-width:1100px; margin:0 auto; padding:.75rem 1rem; display:flex; align-items:center; gap:1rem; }
.logo { font-family:'Cormorant Garamond',serif; font-weight:700; font-size:1.4rem; color:var(--bone); letter-spacing:.02em; }
nav { margin-left:auto; display:flex; gap:1.5rem; font-size:.85rem; font-weight:500; }
nav a { color:var(--muted); }
nav a:hover { color:var(--gold); }
main { max-width:1100px; margin:0 auto; padding:2rem 1rem 4rem; }
.film-hero { text-align:center; padding:3rem 1rem 2rem; }
.film-hero h1 { font-family:'Cormorant Garamond',serif; font-size:clamp(1.8rem,4vw,2.8rem); font-weight:700; margin:0 0 .5rem; line-height:1.2; }
.film-hero .subtitle { color:var(--muted); font-size:clamp(1rem,2vw,1.2rem); margin:0 0 1rem; max-width:70ch; margin-left:auto; margin-right:auto; }
.film-hero .meta { display:flex; flex-wrap:wrap; justify-content:center; gap:1rem; font-size:.85rem; color:var(--faint); margin-top:1rem; }
.player-wrap { position:relative; width:100%; max-width:960px; margin:0 auto 2rem; aspect-ratio:16/9; background:#000; border-radius:4px; overflow:hidden; border:1px solid var(--line); }
#player { width:100%; height:100%; display:block; }
.poster-mode { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#000; z-index:10; }
.poster-mode img { max-width:100%; max-height:100%; object-fit:contain; }
.play-btn { position:absolute; inset:0; background:transparent; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:20; }
.play-btn svg { width:80px; height:80px; fill:var(--bone); filter:drop-shadow(0 4px 16px rgba(0,0,0,.6)); transition:transform .15s, fill .15s; }
.play-btn:hover svg { transform:scale(1.1); fill:var(--gold); }
.play-btn:focus-visible { outline:2px solid var(--gold); outline-offset:4px; border-radius:50%; }
.video-mode .poster-mode { display:none; }
.video-mode .play-btn { display:none; }
.film-info { max-width:960px; margin:0 auto; padding:0 1rem 3rem; }
.film-info h2 { font-family:'Cormorant Garamond',serif; font-size:1.3rem; font-weight:600; margin:2rem 0 1rem; color:var(--gold); }
.film-info p { color:var(--muted); max-width:70ch; margin:0 0 1rem; }
.meta-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:.75rem; margin:1.5rem 0; font-size:.85rem; }
.meta-item { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:.75rem 1rem; }
.meta-item strong { color:var(--bone); display:block; margin-bottom:.25rem; }
.meta-item span { color:var(--muted); }
.tags { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1rem; }
.tag { background:var(--panel2); border:1px solid var(--line); color:var(--muted); padding:.25rem .75rem; border-radius:999px; font-size:.75rem; transition:all .15s; }
.tag:hover { color:var(--gold); border-color:var(--gold); }
.debate-link { display:inline-flex; align-items:center; gap:.5rem; margin-top:1.5rem; padding:.75rem 1.25rem; background:var(--panel); border:1px solid var(--line); border-radius:4px; color:var(--gold); font-weight:500; }
.debate-link:hover { background:var(--panel2); border-color:var(--gold); }
footer { border-top:1px solid var(--line); padding:2rem 1rem; text-align:center; color:var(--faint); font-size:.8rem; }
@media (max-width: 640px) {
  .header-inner { flex-wrap:wrap; }
  nav { width:100%; justify-content:center; margin-top:.5rem; }
}
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to player</a>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">vlymbooq</a>
    <nav>
      <a href="index.html">Films</a>
      <a href="films.html">Archive</a>
      <a href="https://github.com/renj-arch/dimsred" target="_blank" rel="noopener">Source</a>
    </nav>
  </div>
</header>
<main id="main">
  <div class="film-hero">
    <h1 id="filmTitle">Loading…</h1>
    <p class="subtitle" id="filmSubtitle"></p>
    <div class="meta" id="filmMeta"></div>
  </div>
  <div class="player-wrap" id="playerWrap">
    <div class="poster-mode" id="posterMode">
      <img id="posterImg" alt="" />
      <button class="play-btn" id="playBtn" aria-label="Play film" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <video id="player" controls playsinline preload="metadata" poster="" aria-label="Film player"></video>
  </div>
  <div class="film-info" id="filmInfo"></div>
</main>
<footer>
  vlymbooq · history, cut from paper · <a href="https://github.com/renj-arch/dimsred">source</a>
</footer>
<script>
const FILM_ID = new URLSearchParams(location.search).get('film') || 'salt-march';
let filmData = null;

async function loadIndex() {
  try {
    const res = await fetch('data/film-watch.json?v=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error('Index not found');
    const idx = await res.json();
    filmData = idx.films.find(f => f.id === FILM_ID);
    if (!filmData) {
      document.getElementById('filmTitle').textContent = 'Film not found';
      return;
    }
    renderFilm();
  } catch (e) {
    document.getElementById('filmTitle').textContent = 'Index unavailable';
    console.error(e);
  }
}

function renderFilm() {
  document.title = filmData.title + ' — vlymbooq';
  document.getElementById('filmTitle').textContent = filmData.title;
  document.getElementById('filmSubtitle').textContent = filmData.subtitle;
  const meta = [
    filmData.year,
    filmData.duration,
    filmData.scenes + ' scenes',
    filmData.shots + ' shots'
  ];
  document.getElementById('filmMeta').innerHTML = meta.join(' · ');
  const wrap = document.getElementById('playerWrap');
  const posterMode = document.getElementById('posterMode');
  const posterImg = document.getElementById('posterImg');
  const playBtn = document.getElementById('playBtn');
  const player = document.getElementById('player');
  if (filmData.poster) {
    posterImg.src = filmData.poster;
    posterImg.alt = filmData.title + ' poster';
  }
  if (filmData.preview) {
    player.poster = filmData.poster || '';
    player.src = filmData.preview;
    if (filmData.captions) {
      const track = document.createElement('track');
      track.kind = 'captions';
      track.src = filmData.captions;
      track.srclang = 'en';
      track.label = 'English';
      track.default = true;
      player.appendChild(track);
    }
    wrap.classList.add('video-mode');
  }
  const info = document.getElementById('filmInfo');
  info.innerHTML = `
    <h2>About this film</h2>
    <p>${filmData.subtitle}</p>
    <div class="meta-grid">
      <div class="meta-item"><strong>Year</strong><span>${filmData.year}</span></div>
      <div class="meta-item"><strong>Duration</strong><span>${filmData.duration}</span></div>
      <div class="meta-item"><strong>Scenes</strong><span>${filmData.scenes}</span></div>
      <div class="meta-item"><strong>Shots</strong><span>${filmData.shots}</span></div>
      <div class="meta-item"><strong>Status</strong><span>${filmData.status}</span></div>
      <div class="meta-item"><strong>Master</strong><span><a href="${filmData.masterUrl}" target="_blank" rel="noopener">GitHub release</a></span></div>
    </div>
    <div class="tags">
      ${filmData.tags.map(t => `<span class="tag">${t}</span>`).join('')}
    </div>
    <a class="debate-link" href="watch.html?film=${filmData.id}&debate=1" target="_blank">Open argument map &rarr;</a>
  `;
  playBtn.addEventListener('click', () => {
    player.play().catch(() => {});
  });
}
loadIndex();
</script>
</body>
</html>

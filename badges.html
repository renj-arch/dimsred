.badge-card.recent::after{content:'NEW';position:absolute;top:8px;right:8px;background:var(--emerald);color:#09090b;font-size:.6em;font-weight:800;padding:2px 8px;border-radius:var(--radius-full)}

@media(max-width:640px){.badge-grid{grid-template-columns:repeat(2,1fr)}.stats-bar{gap:12px}}

<script>
(function(){
  var BADGES_KEY = 'studypro_badges';
  var ALL_BADGES = [
    { id:'first_paper', icon:'📝', name:'First Paper', desc:'Complete your first paper' },
    { id:'five_papers', icon:'📚', name:'Practice Machine', desc:'Complete 5 papers' },
    { id:'ten_papers', icon:'🎓', name:'Dedicated Scholar', desc:'Complete 10 papers' },
    { id:'fifty_correct', icon:'✅', name:'Getting There', desc:'Get 50 correct answers' },
    { id:'two_hundred_correct', icon:'🎯', name:'Answer Master', desc:'Get 200 correct answers' },
    { id:'five_hundred_correct', icon:'🏅', name:'Quiz Legend', desc:'Get 500 correct answers' },
    { id:'three_streak', icon:'🔥', name:'3-Day Streak', desc:'Study 3 days in a row' },
    { id:'seven_streak', icon:'⭐', name:'Week Warrior', desc:'Study 7 days in a row' },
    { id:'thirty_streak', icon:'💪', name:'Monthly Master', desc:'Study 30 days in a row' },
    { id:'perfect_score', icon:'🌟', name:'Perfect Score', desc:'Score 100% on any paper' },
    { id:'speed_demon', icon:'⚡', name:'Speed Demon', desc:'Complete a paper in under 30 min' }
  ];
  var earned = JSON.parse(localStorage.getItem(BADGES_KEY) || '[]');
  var earnedIds = earned.map(function(b){ return b.id; });
  var earnedSet = {};
  earnedIds.forEach(function(id){ earnedSet[id] = true; });
  var grid = document.getElementById('badgeGrid');
  var earnedCount = 0;
  ALL_BADGES.forEach(function(badge){
    var isEarned = earnedSet[badge.id];
    if (isEarned) earnedCount++;
    var card = document.createElement('div');
    card.className = 'badge-card' + (isEarned ? '' : ' locked');
    card.innerHTML = '<span class="icon">' + badge.icon + '</span><div class="name">' + badge.name + '</div><div class="desc">' + badge.desc + '</div>';
    grid.appendChild(card);
  });
  document.getElementById('earnedCount').textContent = earnedCount;
  document.getElementById('totalCount').textContent = ALL_BADGES.length;
  document.getElementById('progressPct').textContent = Math.round(earnedCount / ALL_BADGES.length * 100) + '%';
  // Expose for badge sync
  window.renderBadges = function(){
    earned = JSON.parse(localStorage.getItem(BADGES_KEY) || '[]');
    earnedIds = earned.map(function(b){ return b.id; });
    earnedSet = {};
    earnedIds.forEach(function(id){ earnedSet[id] = true; });
    earnedCount = 0;
    grid.innerHTML = '';
    ALL_BADGES.forEach(function(badge){
      var isEarned = earnedSet[badge.id];
      if (isEarned) earnedCount++;
      var card = document.createElement('div');
      card.className = 'badge-card' + (isEarned ? '' : ' locked');
      card.innerHTML = '<span class="icon">' + badge.icon + '</span><div class="name">' + badge.name + '</div><div class="desc">' + badge.desc + '</div>';
      grid.appendChild(card);
    });
    document.getElementById('earnedCount').textContent = earnedCount;
    document.getElementById('progressPct').textContent = Math.round(earnedCount / ALL_BADGES.length) + '%';
  };
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#09090b;color:#fafafa;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:60px 60px}
.bg-glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0}
.bg-glow.purple{width:500px;height:500px;background:rgba(139,92,246,.08);top:-200px;right:-150px}
.bg-glow.emerald{width:400px;height:400px;background:rgba(16,185,129,.05);bottom:-180px;left:-120px}
.card{position:relative;z-index:1;background:#111113;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:48px 40px;max-width:400px;width:90%;text-align:center}
.logo{font-size:2em;font-weight:900;margin-bottom:4px;letter-spacing:-.03em}
.logo span{background:linear-gradient(135deg,#a78bfa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tagline{color:#71717a;font-size:.9em;margin-bottom:32px}
.google-btn{display:inline-flex;align-items:center;gap:12px;padding:14px 32px;border-radius:100px;font-size:.95em;font-weight:600;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fafafa;cursor:pointer;transition:all .2s;text-decoration:none;width:100%;justify-content:center}
.google-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
.google-btn svg{width:20px;height:20px;flex-shrink:0}
.footer-text{color:#52525b;font-size:.78em;margin-top:24px;line-height:1.5}
.footer-text a{color:#a78bfa;text-decoration:none}
.loading{display:none;align-items:center;justify-content:center;gap:8px;color:#a1a1aa;font-size:.85em;margin-top:16px}
.loading.show{display:flex}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.1);border-top-color:#a78bfa;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow purple"></div>
<div class="bg-glow emerald"></div>
<div class="card">
<div class="logo"><span>vlymbooq</span></div>
<div class="tagline">Sign in to start practicing</div>
<button class="google-btn" id="googleLogin">
<svg viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
Sign in with Google
</button>
<div class="loading" id="loading"><div class="spinner"></div>Redirecting...</div>
<div class="footer-text">By signing in, you agree to our<br><a href="/privacy.html">Privacy Policy</a></div>
</div>
<script>
var SUPABASE_URL = 'https://krvlufonfbcabgcjomvs.supabase.co';
var params = new URLSearchParams(window.location.search);
var redirectPath = params.get('redirect') || '/';

document.getElementById('googleLogin').onclick = function() {
  document.getElementById('loading').classList.add('show');
  sessionStorage.setItem('login_redirect', redirectPath);
  var host = 'vlymbooq.qzz.io';
  var returnUrl = 'https://' + host + '/login.html?redirect=' + encodeURIComponent(redirectPath);
  window.location.href = SUPABASE_URL + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(returnUrl);
};

if (localStorage.getItem('sb_access_token')) {
  window.location.replace(redirectPath);
}
</script>
<script src="js/supabase.js?v=20260529b"></script>
<script src="js/theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Guest Access — vlymbooq</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',system-ui,sans-serif;background:#09090b;color:#fafafa;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
        .card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:32px;max-width:400px;width:100%;text-align:center}
        h1{font-size:1.3em;font-weight:800;margin-bottom:4px}
        p{color:#a1a1aa;font-size:.85em;margin-bottom:20px;line-height:1.5}
        input{width:100%;padding:12px 16px;border-radius:100px;background:#18181b;color:#fafafa;border:1px solid rgba(255,255,255,.1);font-size:1em;text-align:center;outline:none;transition:border-color .2s}
        input:focus{border-color:#a78bfa}
        input::placeholder{color:#52525b}
        .error{color:#ef4444;font-size:.85em;margin-top:12px;display:none}
        .success{color:#34d399;font-size:.85em;margin-top:12px;display:none}
        .btn{display:inline-block;padding:12px 32px;border-radius:100px;font-size:.9em;font-weight:600;border:none;cursor:pointer;background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff;margin-top:16px;transition:opacity .2s}
        .btn:disabled{opacity:.4;cursor:not-allowed}
        .hint{color:#52525b;font-size:.78em;margin-top:16px}
    </style>
</head>
<body>
    <div class="card">
        <h1>🔑 Guest Access</h1>
        <p>Enter the access code you received to continue.</p>
        <form id="form" onsubmit="return false;">
            <input type="password" id="code" placeholder="Enter access code" autocomplete="off" autofocus>
            <div id="error" class="error"></div>
            <div id="success" class="success"></div>
            <button type="submit" class="btn" id="submitBtn">Continue →</button>
        </form>
        <div class="hint">Contact the site owner if you don't have a code.</div>
    </div>

    <script>
        var form = document.getElementById('form');
        var codeInput = document.getElementById('code');
        var submitBtn = document.getElementById('submitBtn');
        var errorEl = document.getElementById('error');
        var successEl = document.getElementById('success');

        // Check if already has guest access
        if (localStorage.getItem('sb_guest_token')) {
            successEl.style.display = 'block';
            successEl.textContent = 'You already have access. Redirecting...';
            setTimeout(function(){ window.location.replace('/lab.html'); }, 1000);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var code = codeInput.value.trim();
            if (!code) return;

            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';

            fetch('/api/verify-guest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: code })
            })
            .then(function(r){ return r.json(); })
            .then(function(data){
                if (data.valid) {
                    localStorage.setItem('sb_guest_token', code);
                    successEl.style.display = 'block';
                    successEl.textContent = '✅ Access granted! Redirecting...';
                    submitBtn.textContent = 'Redirecting...';
                    setTimeout(function(){ window.location.replace('/lab.html'); }, 1000);
                } else {
                    errorEl.style.display = 'block';
                    errorEl.textContent = 'Invalid code. Please try again.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Continue →';
                    codeInput.value = '';
                    codeInput.focus();
                }
            })
            .catch(function(){
                errorEl.style.display = 'block';
                errorEl.textContent = 'Network error. Try again later.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Continue →';
            });
        });
    </script>
<script src="js/theme.js"></script>
</body>
</html>
